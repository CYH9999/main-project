[package]
name = "tabarak-gym-desktop"
version = "7.5.0"
description = "نظام إدارة تبارك جيم — غلاف سطح المكتب"
edition = "2021"
rust-version = "1.82"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# غلاف سطح المكتب لا يحمل منطق عمل، فالبناء يُضبط للحجم والثبات لا للسرعة.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
