/* --------------------------- تسجيل قياسات --------------------------- */
Forms.measurement = function(memberId){
  const m = Repos.members.get(memberId);
  if (!m) return UI.toast('المشتركة غير موجودة','err');
  const types = Svc.measure.types();
  const latest = Svc.measure.latest(memberId);
  const h = UI.modal({
    title:`تسجيل قياسات — ${m.name}`, size:'wide',
    body:`<div id="msForm">
      <div class="t-sub" style="margin-bottom:12px">اتركي أي حقل فارغاً إن لم تقيسيه. لا شيء هنا إلزامي،
        والقيم القديمة لا تُمحى — تُضاف قراءة جديدة بتاريخها.</div>
      <div class="form-grid">
        ${UI.field('date','تاريخ القياس', UI.input('date', D.today(), { type:'date' }))}
        <div></div>
        ${types.map(t => UI.field('m_' + t.key, `${t.label} (${t.unit})`,
            UI.input('m_' + t.key, '', { type:'number', attrs:{ step:'0.1', min:'0' },
              placeholder: latest[t.key] ? `آخر قراءة ${latest[t.key].value}` : '' })) ).join('')}
        <div class="full">${UI.field('notes','ملاحظات', UI.textarea('notes',''))}</div>
      </div></div>`,
    footer:`<button class="btn btn-primary" id="msSave">حفظ القياسات</button>
            <button class="btn" data-close>إلغاء</button><div class="sp"></div>`,
    onMount(ov){
      ov.querySelector('#msSave').onclick = async () => {
        const scope = ov.querySelector('#msForm'), raw = UI.read(scope);
        const values = {};
        types.forEach(t => { const v = raw['m_' + t.key]; if (v !== '' && v != null) values[t.key] = v; });
        if (!Object.keys(values).length) return UI.showErrors(scope, { m_weight:'أدخلي قيمة واحدة على الأقل' });
        const res = await guard(scope, () => Svc.measure.addBatch(memberId, raw.date, values, raw.notes));
        if (!res) return;
        UI.toast(`سُجّل ${res.length} قياساً`);
        h.close(); renderRoute();
      };
    }
  });
};

Forms.goal = function(id, memberId){
  const g = id ? Repos.goals.get(id) : null;

    title: g ? 'تعديل هدف' : 'هدف جديد',
    body:`<div class="form-grid" id="goForm">
      ${UI.field('type','نوع الهدف', UI.select('type', g ? g.type : 'weight', types.map(t => ({ v:t.key, t:t.label }))))}
      ${UI.field('title','وصف الهدف', UI.input('title', g ? g.title : '', { placeholder:'مثال: الوصول إلى 65 كغم' }))}
      ${UI.field('targetValue','القيمة المستهدفة', UI.input('targetValue', g ? (g.targetValue == null ? '' : g.targetValue) : '', { type:'number', attrs:{ step:'0.1' } }),
        'اتركيها فارغة للأهداف غير الرقمية')}
      ${UI.field('unit','الوحدة', UI.input('unit', g ? g.unit : ''))}
      ${UI.field('targetDate','تاريخ مستهدف', UI.input('targetDate', g ? g.targetDate : '', { type:'date' }))}
      ${UI.field('coachId','المدربة المتابعة', UI.select('coachId', g ? g.coachId : '',
        [{ v:'', t:'—' }, ...coaches.map(c => ({ v:c.id, t:c.name }))]))}
      <div class="full">${UI.field('notes','ملاحظات', UI.textarea('notes', g ? g.notes : ''))}</div>
    </div>`,
    footer:`<button class="btn btn-primary" id="goSave">${g ? 'حفظ' : 'إضافة الهدف'}</button>
            <button class="btn" data-close>إلغاء</button><div class="sp"></div>`,
    onMount(ov){
      const sel = ov.querySelector('[name="type"]');
      sel.onchange = () => { const t = types.find(x => x.key === sel.value);
        if (t && !ov.querySelector('[name="unit"]').value) ov.querySelector('[name="unit"]').value = t.unit || ''; };
      ov.querySelector('#goSave').onclick = async () => {
        const scope = ov.querySelector('#goForm'), d = UI.read(scope);
        d.memberId = mid;
        const res = await guard(scope, () => Svc.goals.save(id, d));
        if (!res) return;
        UI.toast(g ? 'حُفظ الهدف' : 'أُضيف الهدف'); h.close(); renderRoute();
      };
    }
  });
};

/* ----------------------- تجميد وتمديد الاشتراك ----------------------- */
Forms.freeze = function(subId){
  const sub = Repos.subs.get(subId);
  if (!sub) return UI.toast('الاشتراك غير موجود','err');
  const m = Repos.members.get(sub.memberId);
  const h = UI.modal({
    title:`تجميد اشتراك — ${m ? m.name : ''}`,
    body:`<div id="fzForm">
      <div class="t-sub" style="margin-bottom:12px">التجميد لا يغيّر تاريخ البيع ولا السعر: يُسجَّل حدثاً،
        وتُمدَّد النهاية بعدد أيامه. التراجع عنه يُعيد التاريخ تلقائياً.</div>
      <div class="form-grid">
        ${UI.field('from','من', UI.input('from', D.today(), { type:'date' }))}
        ${UI.field('to','إلى', UI.input('to', D.addDays(D.today(), 6), { type:'date' }))}
        <div class="full">${UI.field('reason','السبب', UI.input('reason','', { placeholder:'سفر، مرض، ظرف عائلي…' }))}</div>
      </div>
      <div class="sens" id="fzPreview"></div></div>`,
    footer:`<button class="btn btn-primary" id="fzSave">تجميد</button>
            <button class="btn" data-close>إلغاء</button><div class="sp"></div>`,
    onMount(ov){
      const preview = () => {
        const d = UI.read(ov.querySelector('#fzForm'));
        const days = D.isISO(d.from) && D.isISO(d.to) && D.cmp(d.to, d.from) >= 0 ? DUR.days(d.from, d.to) : 0;
        ov.querySelector('#fzPreview').innerHTML = days
          ? `<b>${days}</b> يوماً — تنتقل نهاية الاشتراك من <b class="num">${D.fmt(sub.endDate)}</b>
             إلى <b class="num">${D.fmt(D.addDays(sub.endDate, days))}</b>`
          : 'حدّدي فترة صحيحة لعرض الأثر';
      };
      ov.querySelectorAll('[name="from"],[name="to"]').forEach(i => i.oninput = preview);
      preview();
      ov.querySelector('#fzSave').onclick = async () => {
        const scope = ov.querySelector('#fzForm'), d = UI.read(scope);
        const res = await guard(scope, () => Svc.membership.freeze(subId, d));
        if (!res) return;
        UI.toast(`جُمّد الاشتراك — النهاية الآن ${D.fmt(res.sub.endDate)}`); h.close(); renderRoute();
      };
    }
  });
};
Forms.extendSub = function(subId){
  const sub = Repos.subs.get(subId);
  if (!sub) return UI.toast('الاشتراك غير موجود','err');
  const h = UI.modal({
    title:'تمديد اشتراك', size:'narrow',
    body:`<div id="exForm"><div class="t-sub" style="margin-bottom:12px">تمديد مجاني كتعويض أو بادرة حسن نيّة.
      يُسجَّل بسببه ولا يُغيّر المبلغ المستحق.</div>
      ${UI.field('days','عدد الأيام', UI.input('days','7', { type:'number', attrs:{ min:'1', max:'365' } }))}
      ${UI.field('reason','السبب', UI.input('reason','', { placeholder:'إغلاق الصالة، عطل في الأجهزة…' }))}
      <div class="sens" id="exPreview"></div></div>`,
    footer:`<button class="btn btn-primary" id="exSave">تمديد</button>
            <button class="btn" data-close>إلغاء</button><div class="sp"></div>`,
    onMount(ov){
      const preview = () => {
        const n = Math.round(Number(UI.read(ov.querySelector('#exForm')).days) || 0);
        ov.querySelector('#exPreview').innerHTML = n > 0
          ? `تنتقل النهاية من <b class="num">${D.fmt(sub.endDate)}</b> إلى <b class="num">${D.fmt(D.addDays(sub.endDate, n))}</b>` : '';
      };
      ov.querySelector('[name="days"]').oninput = preview; preview();
      ov.querySelector('#exSave').onclick = async () => {
        const scope = ov.querySelector('#exForm'), d = UI.read(scope);
        const res = await guard(scope, () => Svc.membership.extend(subId, d));
        if (!res) return;
        UI.toast(`مُدّد الاشتراك حتى ${D.fmt(res.sub.endDate)}`); h.close(); renderRoute();
      };
    }
  });
};

Forms.cashClose = function(date){

  const h = UI.modal({
    title:`إقفال صندوق ${D.fmt(d0)}`, size:'wide',
    body:`<div id="ccForm">
      <div class="t-sub" style="margin-bottom:12px">هذه ليست شاشة أرباح. تقارن النقد الذي ينبغي أن يكون في الدرج بالنقد الموجود فيه.
        التحويلات والبطاقات لا تدخل الحساب لأنها لم تدخل الدرج.</div>
      <table class="mini-tbl" style="margin-bottom:14px"><tbody>
        <tr><td>الرصيد الافتتاحي</td><td class="num ta-l">${Money.fmt(p.opening)}</td></tr>
        <tr><td>+ مقبوضات نقدية اليوم <span class="t-sub">(${p.movement.counts.payments} دفعة)</span></td><td class="num ta-l">${Money.fmt(p.cashIn)}</td></tr>
        <tr><td>− مصروفات نقدية <span class="t-sub">(${p.movement.counts.expenses} مصروف)</span></td><td class="num ta-l">${Money.fmt(p.cashOut)}</td></tr>
        <tr style="font-weight:700"><td>= المتوقّع في الدرج</td><td class="num ta-l">${Money.fmt(p.expected)}</td></tr>
        ${p.nonCash ? `<tr><td class="t-sub">تحويلات وبطاقات (خارج الدرج)</td><td class="num ta-l t-sub">${Money.fmt(p.nonCash)}</td></tr>` : ''}
      </tbody></table>
      <div class="form-grid">
        ${UI.field('openingCash','الرصيد الافتتاحي', UI.input('openingCash', p.opening, { type:'number' }))}
        ${UI.field('countedCash','النقد المعدود فعلاً', UI.input('countedCash', '', { type:'number', placeholder:'اعدّي الدرج واكتبي الرقم' }))}
        <div class="full">${UI.field('notes','ملاحظات / تفسير الفرق', UI.textarea('notes', p.saved ? p.saved.notes : ''))}</div>
      </div>
      <div class="sens" id="ccDiff">اكتبي المبلغ المعدود ليظهر الفرق</div></div>`,
    footer:`<button class="btn btn-primary" id="ccSave">إقفال اليوم</button>
            <button class="btn" data-close>إلغاء</button><div class="sp"></div>`,
    onMount(ov){
      const diff = () => {
        const d = UI.read(ov.querySelector('#ccForm'));
        const opening = d.openingCash === '' ? p.opening : Money.clean(d.openingCash);
        const expected = U.round2(opening + p.cashIn - p.cashOut);
        const box = ov.querySelector('#ccDiff');
        if (d.countedCash === '' || d.countedCash == null){ box.innerHTML = 'اكتبي المبلغ المعدود ليظهر الفرق'; return; }
        const n = U.round2(Money.clean(d.countedCash) - expected);
        box.innerHTML = Math.abs(n) < 0.01
          ? '<b style="color:var(--green-600)">الصندوق مطابق تماماً</b>'
          : `<b style="color:var(--red-600)">${n > 0 ? 'زيادة' : 'نقص'} ${Money.fmt(Math.abs(n))}</b> — اكتبي سبب الفرق قبل الإقفال`;
      };
      ov.querySelectorAll('[name="countedCash"],[name="openingCash"]').forEach(i => i.oninput = diff);
      ov.querySelector('#ccSave').onclick = async () => {
        const scope = ov.querySelector('#ccForm'), d = UI.read(scope);
        d.date = d0;
        if (p.closed) d.reopen = true;
        const res = await guard(scope, () => Svc.cashbook.close(d));
        if (!res) return;
        UI.toast('أُقفل الصندوق'); h.close(); renderRoute();
      };
    }
  });
};

        const cf = readCustom(scope, 'staff');

        const res = await guard(scope, async () => {
          const val = Validate.staff(d);
          if (!val.ok) throw new AppError('بيانات غير صحيحة','VALIDATION', val.errors);
          if (U.norm(d.email) && !/^[^@\s]+@[^@\s.]+\.[^@\s]+$/.test(U.norm(d.email)))
            throw new AppError('بيانات غير صحيحة','VALIDATION', { email:'البريد الإلكتروني غير صحيح' });
          const uploaded = [];
          const payload = {
            name:U.norm(d.name), role:U.norm(d.role), baseSalary:Money.clean(d.baseSalary),
            hireDate:d.hireDate, phone:U.norm(d.phone), status:d.status, notes:U.norm(d.notes),
            code:U.norm(d.code), contractType:U.norm(d.contractType), specialty:U.norm(d.specialty),
            schedule:U.norm(d.schedule), payMethod:U.norm(d.payMethod), leftDate:d.leftDate || '',
            email:U.norm(d.email), birthDate:d.birthDate || '', address:U.norm(d.address),
            idType:U.norm(d.idType), idNumber:U.norm(d.idNumber), idExpiry:d.idExpiry || '',
            emergency:{ name:U.norm(d.em_name), relation:U.norm(d.em_relation), phone:U.norm(d.em_phone) },
            custom:Object.assign({}, (s && s.custom) || {}, cf.values)
          };
          try {
            if (photo.file) payload.photoMediaId = (uploaded[uploaded.push(await Svc.media.saveFile(photo.file)) - 1]).id;
            else if (photo.remove) payload.photoMediaId = null;
            else if (s) payload.photoMediaId = s.photoMediaId;
            if (idPhoto.file) payload.idMediaId = (uploaded[uploaded.push(await Svc.media.saveFile(idPhoto.file)) - 1]).id;
            else if (idPhoto.remove) payload.idMediaId = null;
            else if (s) payload.idMediaId = s.idMediaId;
            const rec = s ? await Repos.staff.update(s.id, payload) : await Repos.staff.create(payload);
            /* الصور القديمة تُنظَّف بعد نجاح الحفظ لا قبله */
            if (s && s.photoMediaId && s.photoMediaId !== rec.photoMediaId) await Svc.media.removeIfUnused(s.photoMediaId, { store:'staff', id:rec.id });
            if (s && s.idMediaId && s.idMediaId !== rec.idMediaId) await Svc.media.removeIfUnused(s.idMediaId, { store:'staff', id:rec.id });
            await Audit.log('staff', s ? 'update' : 'create', `${s ? 'تعديل' : 'إضافة'} موظفة: ${rec.name}`, rec.id);
            return rec;
          } catch(e){
            for (const u of uploaded) await Svc.media.remove(u.id).catch(() => {});
            throw e;
          }
        });
        if (!res) { ov.querySelectorAll('.sect').forEach(x => { if (x.querySelector('.err:not(:empty)')) x.open = true; }); return; }
        UI.toast('تم حفظ بيانات الموظفة'); h.close(); renderRoute();
      };
    }
  });
};

/* ================================ Screens ================================ */
Object.assign(Screens, {
  memberProfile(id){
    const m = Repos.members.get(id);
    if (!m) return UI.toast('المشتركة غير موجودة','err');
    const subs = U.sortBy(Svc.subs.ofMember(id, true), s=>s.startDate, -1);
    const st = Svc.members.status(id);
    const stats = Calc.memberStats(subs);
    const run = Calc.consecutiveRun(subs, Settings.get('consecutiveGapDays'));
    const offers = Offers.forMember(id);
    /* الصورة المالية الكاملة للمشتركة: المستحق والمقبوض والمتبقي عبر الاشتراكات والفواتير */
    const payIdx = Svc.payments.indexBy('subscription'), saleIdx = Svc.payments.indexBy('sale');
    const liveSubs = subs.filter(x=>!x.archived);
    const owed = U.round2(U.sum(liveSubs, x=>x.finalPrice));
    const collected = U.round2(U.sum(liveSubs, x=>payIdx[x.id]||0));
    const mySales = Repos.sales.list().filter(x => x.memberId === id);

  /* سجل حركة صنف — التدقيق يبدأ من هنا حين يبدو الرصيد غريباً */
  stockHistory(productId){
    const p = Repos.products.get(productId);
    if (!p) return UI.toast('الصنف غير موجود','err');
    const moves = Svc.inventory.movesOf(productId, true);
    const qty = Svc.inventory.onHand(productId);
    let running = qty;
    const rows = moves.map(m => { const at = running; running = U.round2(running - (m.archived?0:m.qty)); return { m, at }; });
    UI.modal({ title:`سجل حركة: ${p.name}`, size:'wide',
      body:`<div class="grid g-3" style="margin-bottom:14px">
          ${kpi('الرصيد الحالي', `${U.round2(qty)} ${p.unit||''}`, `${moves.length} حركة مسجّلة`, qty<=0?'neg':'pos')}
          ${kpi('متوسط التكلفة', Money.fmt(p.cost), 'مرجّح بالمشتريات', 'plum')}
          ${kpi('قيمة الرصيد', Money.fmt(Calc.stockValue(qty, p.cost)), '', 'plum')}
        </div>
        ${rows.length ? `<table class="tbl"><thead><tr><th>التاريخ</th><th>الحركة</th><th>الكمية</th><th>الرصيد بعدها</th><th>تكلفة الوحدة</th><th>ملاحظات</th><th></th></tr></thead><tbody>
          ${rows.map(({m,at})=>`<tr class="${m.archived?'archived-row':''}">
            <td class="num">${D.fmt(m.date)}</td>
            <td>${U.esc(Svc.inventory.MOVE_LABEL[m.type]||m.type)}${m.refType==='sale'?' <span class="chip chip-none">فاتورة</span>':''}</td>
            <td><strong class="num ${m.qty>0?'money-pos':'money-neg'}">${m.qty>0?'+':''}${U.round2(m.qty)}</strong></td>
            <td class="num">${U.round2(at)}</td>
            <td>${m.unitCost?Money.fmt(m.unitCost):'—'}</td>
            <td class="t-sub">${U.esc(m.notes||'')}</td>
            <td class="ta-l">${m.refType==='sale'||m.archived?'':`<button class="btn btn-sm btn-icon btn-danger" data-delmv="${m.id}" title="حذف الحركة">${svg(ICON.trash,14)}</button>`}</td>
          </tr>`).join('')}</tbody></table>` : UI.empty('لا حركات','سجّلي شراءً أو رصيداً افتتاحياً')}`,
      footer:`<button class="btn btn-primary" id="shBuy">تسجيل شراء</button>
              <div class="sp"></div><button class="btn" data-close>إغلاق</button>`,
      onMount(ov, h){
        ov.querySelector('#shBuy').onclick = () => { h.close(); Forms.stockMove(productId, 'purchase'); };
        ov.querySelectorAll('[data-delmv]').forEach(b => b.onclick = async () => {
          const mv = Repos.stockMoves.get(b.dataset.delmv);
          if (!await UI.confirm({ title:'حذف حركة مخزون', danger:true, confirmText:'حذف',
            message:`سيتغيّر الرصيد بمقدار ${U.round2(-mv.qty)}.${mv.expenseId?' وسيُحذف مصروف الشراء المرتبط بها.':''}` })) return;
          await guard(null, () => Svc.inventory.removeMove(b.dataset.delmv), 'تم حذف الحركة');
          h.close(); renderRoute();
        });
      }
    });
  },
  /* إدارة الملتحقات بحصة: بحث، التحاق، إلغاء، وتسجيل حضور الحصة دفعة واحدة */
  enrollment(trainingId){
    const t = Repos.trainings.get(trainingId);
    if (!t) return UI.toast('الحصة غير موجودة','err');
    const render = (ov, h) => {
      const enrolled = Svc.trainings.enrolled(trainingId);
      const left = Svc.trainings.seatsLeft(trainingId);
      const today = D.today();
      ov.querySelector('#enBody').innerHTML = `
        <div class="grid g-3" style="margin-bottom:14px">
          ${kpi('الملتحقات', enrolled.length, t.capacity?`من ${t.capacity} مقعداً`:'بلا حد للسعة', 'plum')}
          ${kpi('المقاعد المتاحة', left == null ? '—' : left, left === 0 ? 'الحصة مكتملة' : '', left === 0 ? 'neg' : 'pos')}
          ${kpi('حضور اليوم', Svc.attendance.ofDay(today, trainingId).length, D.fmt(today), 'pos')}
        </div>
        <div class="field"><label>إضافة مشتركة</label>
          <input class="inp" id="enSearch" autocomplete="off" placeholder="ابحثي بالاسم أو الكود (حرفان على الأقل)" ${left===0?'disabled':''}>
          ${left === 0 ? '<span class="hint">الحصة مكتملة — ألغي التحاق إحداهنّ أو زيدي السعة</span>' : ''}</div>
        <div id="enRes" class="att-res"></div>
        <h4 style="font-size:14px;margin:16px 0 8px">قائمة الملتحقات</h4>
        ${enrolled.length ? `<table class="tbl"><thead><tr><th>المشتركة</th><th>الكود</th><th>حالة الاشتراك</th><th>حضور اليوم</th><th></th></tr></thead><tbody>
          ${enrolled.map(m => { const st = Svc.members.status(m.id), here = Svc.attendance.has(m.id, today, trainingId);
            return `<tr><td class="t-name">${U.esc(m.name)}</td><td class="num">${U.esc(m.code)}</td>
              <td>${UI.chip(st.status)}</td>
              <td>${here ? '<span class="chip chip-active"><span class="dot"></span>حاضرة</span>'
                : `<button class="btn btn-sm" data-in="${m.id}">تسجيل حضور</button>`}</td>
              <td class="ta-l"><button class="btn btn-sm btn-icon btn-danger" data-out="${m.id}" title="إلغاء الالتحاق">${svg(ICON.trash,14)}</button></td></tr>`; }).join('')}
          </tbody></table>` : UI.empty('لا ملتحقات بعد','ابحثي عن مشتركة أعلاه لإضافتها إلى الحصة')}`;

      const res = ov.querySelector('#enRes');
      const search = () => {
        const q = U.normAr(ov.querySelector('#enSearch').value);
        if (q.length < 2){ res.innerHTML = ''; return; }
        const ids = new Set((Repos.trainings.get(trainingId).memberIds)||[]);
        const hits = Repos.members.list().filter(m => !ids.has(m.id) &&
          (U.normAr(m.name).includes(q) || U.normAr(m.code).includes(q) || U.normAr(m.phone).includes(q))).slice(0, 6);
        res.innerHTML = hits.length ? hits.map(m => `<div class="att-row">${UI.avatar(m.name)}
          <div style="flex:1;min-width:0"><div class="t-name">${U.esc(m.name)}</div>
            <div class="t-sub">${U.esc(m.code)} — ${U.esc(m.phone||'بلا رقم')}</div></div>
          ${UI.chip(Svc.members.status(m.id).status)}
          <button class="btn btn-sm btn-primary" data-add="${m.id}">إضافة</button></div>`).join('')
          : '<div class="t-sub" style="padding:8px 2px">لا نتائج غير ملتحقة</div>';
        res.querySelectorAll('[data-add]').forEach(b => b.onclick = async () => {
          try {
            const r = await Svc.trainings.enroll(trainingId, b.dataset.add);
            UI.toast('تمت الإضافة إلى الحصة');
            (r.warnings||[]).forEach(w => UI.toast(w,'warn',5000));
          } catch(e){ UI.toast(e.message, e.code === 'FULL' ? 'warn' : 'err', 5000); }
          render(ov, h);
        });
      };
      const si = ov.querySelector('#enSearch');
      if (si){ si.oninput = U.debounce(search, 200); }
      ov.querySelectorAll('[data-out]').forEach(b => b.onclick = async () => {
        const m = Repos.members.get(b.dataset.out);
        if (!await UI.confirm({ title:'إلغاء الالتحاق', danger:true, confirmText:'إلغاء الالتحاق',
          message:`سيُزال اسم ${U.esc(m?m.name:'')} من هذه الحصة. سجل حضورها السابق يبقى كما هو.` })) return;
        await guard(null, () => Svc.trainings.unenroll(trainingId, b.dataset.out), 'تم إلغاء الالتحاق');
        render(ov, h);
      });
      ov.querySelectorAll('[data-in]').forEach(b => b.onclick = async () => {
        try {
          const r = await Svc.attendance.checkIn({ memberId:b.dataset.in, date:today, trainingId });
          UI.toast('تم تسجيل الحضور');
          (r.warnings||[]).forEach(w => UI.toast(w,'warn',5000));
        } catch(e){ UI.toast(e.message, e.code === 'DUPLICATE' ? 'warn' : 'err', 5000); }
        render(ov, h);
      });
    };
    UI.modal({ title:`الملتحقات — ${t.title} (${t.time})`, size:'wide',
      body:'<div id="enBody"></div>',
      footer:`<div class="sp"></div><button class="btn" data-close>إغلاق</button>`,
      onMount(ov, h){ render(ov, h); },
      onClose(){ renderRoute(); } });
  },
  /* سجل دفعات أي مستند — يُستدعى من الاشتراكات وملف المشتركة */
  paymentLedger(refType, refId){
    const doc = refType === 'sale' ? Repos.sales.get(refId) : Repos.subs.get(refId);
    if (!doc) return UI.toast('المستند غير موجود','err');
    const total = refType === 'sale' ? doc.total : doc.finalPrice;
    const pmts = Svc.payments.forRef(refType, refId, true);
    const st = Calc.payStatus(total, Calc.paidOf(pmts.filter(x=>!x.archived)));
    const member = doc.memberId ? Repos.members.get(doc.memberId) : null;
    UI.modal({ title:'سجل الدفعات',
      body:`<div class="grid g-3" style="margin-bottom:14px">
          ${kpi('المستحق', Money.fmt(st.total), member?member.name:'', 'plum')}
          ${kpi('المقبوض', Money.fmt(st.paid), `${pmts.filter(x=>!x.archived).length} دفعة`, 'pos')}
          ${kpi('المتبقي', Money.fmt(st.due), st.ar, st.due>0?'neg':'pos')}
        </div>
        ${pmts.length ? `<table class="tbl"><thead><tr><th>التاريخ</th><th>المبلغ</th><th>الطريقة</th><th>ملاحظات</th><th></th></tr></thead><tbody>
          ${pmts.map(pm=>`<tr class="${pm.archived?'archived-row':''}"><td class="num">${D.fmt(pm.date)}</td>
            <td><strong>${Money.fmt(pm.amount)}</strong></td><td>${U.esc(pm.method||'')}</td>
            <td class="t-sub">${U.esc(pm.notes||'')}${pm.migrated?' <span class="chip chip-none">مرحّلة</span>':''}</td>
            <td class="ta-l">${pm.archived?'<span class="t-sub">ملغاة</span>':`<button class="btn btn-sm btn-icon btn-danger" data-delpm="${pm.id}">${svg(ICON.trash,14)}</button>`}</td></tr>`).join('')}
          </tbody></table>` : UI.empty('لا دفعات مسجّلة','هذا المستند غير مدفوع بعد')}`,
      footer:`${st.due>0?'<button class="btn btn-primary" id="plAdd">قبض دفعة</button>':''}
              <div class="sp"></div><button class="btn" data-close>إغلاق</button>`,
      onMount(ov, h){
        const add = ov.querySelector('#plAdd');
        if (add) add.onclick = () => { h.close(); Forms.payment(refType, refId); };
        ov.querySelectorAll('[data-delpm]').forEach(b => b.onclick = async () => {
          if (!await UI.confirm({ title:'إلغاء دفعة', danger:true, confirmText:'إلغاء الدفعة',
            message:'سيُحذف سطر الإيراد المقابل لها من المالية ويعود المبلغ مستحقاً.' })) return;
          await guard(null, () => Svc.payments.remove(b.dataset.delpm), 'تم إلغاء الدفعة');
          h.close(); renderRoute();
        });
      }
    });
  },
  notifications(){
    const old = document.querySelector('.notif-panel');
    if (old){ old.remove(); return; }
    const items = Svc.notify.build();
    const colors = { red:'var(--red-600)', gold:'var(--gold-600)', rose:'var(--rose-600)', grey:'var(--muted)' };
    const p = document.createElement('div');
    p.className = 'notif-panel';
    p.innerHTML = `<div class="n-h">التنبيهات</div><div class="notif-list">${
      items.length ? items.map((n,i)=>`<div class="notif" data-n="${i}">
        <span class="n-ic" style="background:${colors[n.level]}"></span>
        <div><div class="n-t">${U.esc(n.title)}</div><div class="n-d">${U.esc(n.desc||'')}</div></div></div>`).join('')
      : '<div class="empty" style="padding:26px">كل شيء على ما يرام — لا تنبيهات حالياً</div>'}</div>`;
    document.getElementById('notifRoot').appendChild(p);
    p.querySelectorAll('[data-n]').forEach(el => el.onclick = () => {
      const n = items[Number(el.dataset.n)];
      p.remove();
      if (n.filter) State.f.members.status = n.filter;
      if (n.tab) State.f.financeTab = n.tab;
      if (n.go) go(n.go);
    });
    setTimeout(() => {
      const off = ev => { if (!p.contains(ev.target) && ev.target.closest('#btnBell') === null){ p.remove(); document.removeEventListener('click', off); } };
      document.addEventListener('click', off);
    }, 10);
  }
});

        </div>
      </div>
      <div class="stat-row">
        <div class="stat"><b>${Money.fmt(st.baseSalary)}</b><span>الراتب الأساسي</span></div>
        <div class="stat pos"><b>${Money.fmt(totalPaid)}</b><span>مجموع ما صُرف — ${paid.length} كشف</span></div>

/* ================================ Actions ================================ */
Object.assign(Actions, {
  async archiveMember(id){
    Auth.require('members.delete');
    const m = Repos.members.get(id);
    if (m.archived){ await Svc.members.archive(id, false); UI.toast('تم استرجاع المشتركة'); return renderRoute(); }
    const n = Svc.members.linkedCount(id);
    const ok = await UI.confirm({ title:'أرشفة مشتركة', danger:true, confirmText:'أرشفة',
      message:`سيتم إخفاء «${U.esc(m.name)}» من القوائم${n?` مع الاحتفاظ بـ ${n} اشتراك وسجلاتها المالية`:''}. يمكن استرجاعها لاحقاً.` });
    if (!ok) return;
    await Svc.members.archive(id, true); UI.toast('تمت أرشفة المشتركة'); renderRoute();
  },
  async archiveSub(id){
    Auth.require('subs.delete');
    const s = Repos.subs.get(id);
    if (s.archived){ await Svc.subs.archive(id, false); UI.toast('تم استرجاع الاشتراك'); return renderRoute(); }
    const ok = await UI.confirm({ title:'أرشفة اشتراك', danger:true, confirmText:'أرشفة',
      message:`سيُؤرشف الاشتراك${s.revenueId?` وسيُسحب الإيراد المرتبط به (${Money.fmt(s.finalPrice)}) من الحسابات`:''}.` });
    if (!ok) return;
    await Svc.subs.archive(id, true); UI.toast('تمت أرشفة الاشتراك'); renderRoute();
  },
  async archiveRevenue(id){
    Auth.require('finance.delete');
    const r = Repos.revenues.get(id);
    if (r.archived){ await Svc.finance.archiveRevenue(id, false); UI.toast('تم الاسترجاع'); return renderRoute(); }
    if (!await UI.confirm({ title:'أرشفة إيراد', danger:true, confirmText:'أرشفة',
      message:`سيُخصم ${Money.fmt(r.amount)} من إجمالي الإيرادات.` })) return;
    await Svc.finance.archiveRevenue(id, true); UI.toast('تمت الأرشفة'); renderRoute();
  },
  async archiveExpense(id){
    Auth.require('finance.delete');
    const e = Repos.expenses.get(id);
    if (e.archived){ await Svc.finance.archiveExpense(id, false); UI.toast('تم الاسترجاع'); return renderRoute(); }
    if (!await UI.confirm({ title:'أرشفة مصروف', danger:true, confirmText:'أرشفة',
      message:`سيُخصم ${Money.fmt(e.amount)} من إجمالي المصروفات.` })) return;
    await guard(null, () => Svc.finance.archiveExpense(id, true), 'تمت الأرشفة');
    renderRoute();
  },
  async payPayroll(id){
    Auth.require('payroll.money');
    const p = Repos.payrolls.get(id), st = Repos.staff.get(p.staffId);
    const cash = Svc.finance.summary().cash;
    const ok = await UI.confirm({ title:'تسجيل دفع الراتب', confirmText:'تسجيل الدفع',
      message:`سيُسجَّل مصروف بمبلغ ${Money.fmt(p.net)} باسم ${U.esc(st?st.name:'')} ضمن تصنيف الرواتب.`,
      extra: p.net > cash ? `<p class="err">تنبيه: المبلغ أكبر من السيولة المتاحة (${Money.fmt(cash)})</p>` : '' });
    if (!ok) return;
    await guard(null, () => Svc.payroll.pay(id, D.today()), 'تم تسجيل الدفع وإضافته للمصروفات');
    renderRoute();
  },
  async unpayPayroll(id){
    if (!await UI.confirm({ title:'إلغاء دفع الراتب', danger:true, confirmText:'إلغاء الدفع',
      message:'سيُحذف المصروف المرتبط ويعود الكشف قابلاً للتعديل.' })) return;
    await guard(null, () => Svc.payroll.unpay(id), 'تم إلغاء الدفع');
    renderRoute();
  },
  async deleteOffer(id){
    const o = Repos.offers.get(id);
    const used = Repos.subs.list(true).filter(s=>s.offerId===id).length;
    if (!await UI.confirm({ title:'حذف العرض', danger:true, confirmText:'حذف',
      message:`${used?`استُعمل هذا العرض في ${used} اشتراك — ستبقى الاشتراكات كما هي. `:''}سيُحذف «${U.esc(o.name)}» من قائمة العروض.` })) return;
    await Repos.offers.hardDelete(id);
    await Audit.log('offer','delete',`حذف عرض: ${o.name}`, id);
    UI.toast('تم حذف العرض'); renderRoute();
  },
  async exportBackup(includeMedia=true){
    try{
      const obj = Backup.build(includeMedia);
      const blob = new Blob([JSON.stringify(obj, null, 1)], { type:'application/json' });
      UI.download(blob, `نسخة-تبارك-جيم-${D.today()}${includeMedia?'':'-بدون-وسائط'}.json`);
      await Backup.markExported();
      await Audit.log('system','backup',`تصدير نسخة احتياطية (${Object.values(obj.counts).reduce((a,b)=>a+b,0)} سجل)`);
      UI.toast('تم تصدير النسخة الاحتياطية');
      if (State.route === 'settings') renderRoute();
    }catch(e){ Log.error('فشل التصدير', e); UI.toast('تعذّر تصدير النسخة: ' + e.message,'err'); }
  },
  async importBackup(file){
    let obj;
    try { obj = JSON.parse(await file.text()); }
    catch(e){ return UI.toast('الملف ليس JSON صالحاً — قد يكون تالفاً','err'); }
    const v = Backup.validate(obj);
    if (!v.ok) return UI.modal({ title:'نسخة غير صالحة', size:'narrow',
      body:`<p>تعذّر استيراد الملف للأسباب التالية:</p><ul>${v.errors.map(e=>`<li>${U.esc(e)}</li>`).join('')}</ul>` });
    const cur = Object.fromEntries(STORE_NAMES.map(s=>[s, DB.count(s)]));
    const table = STORE_NAMES.filter(s => v.counts[s] || cur[s]).map(s =>
      `<tr><td>${U.esc(s)}</td><td class="num">${cur[s]}</td><td class="num">${v.counts[s]||0}</td></tr>`).join('');
    /* تحذير صريح إذا كانت النسخة بلا وسائط وهناك تمارين تعتمد عليها */
    const exWithMedia = Repos.exercises.list(true).filter(x => x.mediaId).length;
    const mediaWarn = (!v.counts.media && exWithMedia)
      ? `<p class="err" style="margin-top:10px">هذه النسخة <strong>بلا وسائط</strong>: ${exWithMedia} تمريناً ستفقد صورته أو فيديوه.</p>` : '';
    const ok = await UI.confirm({ title:'استعادة نسخة احتياطية', danger:true, confirmText:'استبدال البيانات',
      message:`سيتم <strong>حذف كل البيانات الحالية</strong> واستبدالها ببيانات الملف. لا يمكن التراجع.`,
      extra:`<table class="tbl" style="margin-top:12px"><thead><tr><th>الجدول</th><th>الحالي</th><th>في الملف</th></tr></thead><tbody>${table}</tbody></table>
        ${mediaWarn}
        <p class="hint" style="margin-top:10px">نسخة الملف: ${U.esc(String(obj.exportedAt||'').slice(0,10))} — مخطط ${U.esc(String(obj.schema))}${Number(obj.schema) < APP.schema ? ' (ستُرقّى تلقائياً)' : ''}</p>` });
    if (!ok) return;
    try {
      const counts = await Backup.restore(obj);
      UI.toast(`تمت الاستعادة — ${Object.values(counts).reduce((a,b)=>a+b,0)} سجل`);
      $('brandName').textContent = Settings.get('gymName');
      renderRoute();
    } catch(e){ Log.error('فشل الاستعادة', e); UI.toast('فشلت الاستعادة: ' + e.message,'err'); }
  },
  async loadDemo(){
    if (Settings.get('demoLoaded')){
      const again = await UI.confirm({ title:'بيانات تجريبية موجودة', confirmText:'تحميل دفعة ثانية',
        message:'يوجد بيانات تجريبية محمّلة أصلاً. تحميل دفعة أخرى سيضاعف السجلات التجريبية.' });
      if (!again) return;
    } else {
      const ok = await UI.confirm({ title:'تحميل بيانات تجريبية', confirmText:'تحميل',
        message:'ستُضاف 40 مشتركة باشتراكاتهنّ (بعضهنّ عليهنّ مستحقات)، 6 موظفات، أصناف متجر وفواتير بيع وسجل حضور ومصروفات ورأس مال وحصص تدريب — كلها معلّمة «تجريبية» ويمكن حذفها بضغطة.' });
      if (!ok) return;
    }
    const btn = $('demoLoad'); if (btn){ btn.disabled = true; btn.textContent = 'جارٍ التحميل…'; }
    try {
      const sum = await Seed.loadDemo(40);
      UI.toast(`تم التحميل: ${sum.members} مشتركة، ${sum.subscriptions} اشتراك، ${sum.sales} فاتورة، ${sum.attendance} حضور، ${sum.products} صنف`, 'ok', 7000);
    } catch(e){
      UI.toast(e.message, 'err', 9000);
      Log.error('تحميل البيانات التجريبية', e);
    } finally { renderRoute(); }
  },
  async clearDemo(){
    const n = STORE_NAMES.reduce((a,s) => a + DB.all(s).filter(r => r.isDemo).length, 0);
    if (!n){ UI.toast('لا توجد بيانات تجريبية لحذفها','warn'); return; }
    if (!await UI.confirm({ title:'حذف البيانات التجريبية', danger:true, confirmText:`حذف ${n} سجلاً`,
      message:`سيُحذف ${n} سجلاً تجريبياً وما يتبعها (رواتب الموظفات التجريبيات وإيرادات اشتراكاتهنّ)، وتبقى بياناتك الحقيقية كما هي.` })) return;
    try {
      const removed = await Seed.clearDemo();
      UI.toast(`تم حذف ${removed} سجلاً تجريبياً`);
    } catch(e){ UI.toast(e.message,'err', 8000); Log.error('حذف البيانات التجريبية', e); }
    finally { renderRoute(); }
  },
  async restoreDefaults(){
    const have = Repos.plans.list(true).length + Repos.expCats.list(true).length + Repos.offers.list(true).length + Repos.exercises.list(true).length;
    if (!await UI.confirm({ title:'استعادة القوائم الافتراضية', confirmText:'استعادة',
      message:'ستُضاف مدد الاشتراكات وتصنيفات المصروفات والعروض والتمارين الافتراضية <strong>للقوائم الفارغة فقط</strong>. لن يُحذف أو يُعدَّل أي سجل موجود.' })) return;
    try {
      const n = await Seed.restoreDefaults();
      UI.toast(n ? `تمت إضافة ${n} سجلاً افتراضياً` : 'القوائم ممتلئة أصلاً — لم يُضف شيء', n ? 'ok' : 'warn');
    } catch(e){ UI.toast('تعذّرت الاستعادة: ' + e.message,'err'); }
    finally { renderRoute(); }
  },
  async integrityScan(){
    const issues = Integrity.scan();
    const out = $('intOut');
    if (!issues.length){
      if (out) out.innerHTML = '<span class="chip chip-active"><span class="dot"></span>كل الروابط سليمة — لا توجد سجلات يتيمة</span>';
      UI.toast('فحص السلامة: لا توجد مشاكل'); return;
    }
    const g = U.groupBy(issues, i => i.type);
    if (out) out.innerHTML = `<table class="tbl"><thead><tr><th>الملاحظة</th><th>العدد</th></tr></thead><tbody>
      ${Object.keys(g).map(k => `<tr><td>${U.esc(k)}</td><td class="num">${g[k].length}</td></tr>`).join('')}</tbody></table>
      <button class="btn btn-primary btn-sm" id="intFix" style="margin-top:10px">إصلاح ما يمكن إصلاحه (${issues.length})</button>`;
    const fixBtn = $('intFix');
    if (fixBtn) fixBtn.onclick = async () => {
      if (!await UI.confirm({ title:'إصلاح الروابط', confirmText:'إصلاح',
        message:'سيُحذف اليتيم فقط (وسائط بلا تمرين، كشف راتب بلا موظفة) وتُفك الروابط المكسورة. لن تُمس أي بيانات سليمة.' })) return;
      const r = await Integrity.repair();
      UI.toast(`تم إصلاح ${r.fixed} من ${r.found}`, r.fixed ? 'ok' : 'warn');
      renderRoute();
    };
  },
  /* إعادة تهيئة كاملة: تحذير برقم السجلات، تأكيدان، ثم تحقّق فعلي بعد التنفيذ */
  async wipe(){
    Auth.require('settings.danger');
    const counts = Object.fromEntries(STORE_NAMES.map(s => [s, DB.count(s)]));
    const labels = { members:'مشتركة', subscriptions:'اشتراك', revenues:'إيراد', expenses:'مصروف', staff:'موظفة',
      payrolls:'كشف راتب', capital:'حركة رأس مال', partners:'شريك', trainings:'حصة', exercises:'تمرين',
      media:'ملف وسائط', offers:'عرض', plans:'مدة اشتراك', expenseCategories:'تصنيف', audit:'حدث',
      payments:'دفعة', products:'صنف', stockMoves:'حركة مخزون', sales:'فاتورة بيع', attendance:'سجل حضور', roles:'دور' };
    const rows = Object.keys(labels).filter(k => counts[k]).map(k => `<tr><td>${labels[k]}</td><td class="num">${counts[k]}</td></tr>`).join('');
    const total = Object.entries(counts).filter(([k]) => k !== 'meta').reduce((a,[,v]) => a+v, 0);
    if (!total){ UI.toast('البرنامج فارغ أصلاً','warn'); return; }
    const ok1 = await UI.confirm({ title:'إعادة تهيئة كاملة', danger:true, confirmText:'متابعة',
      message:`سيُحذف <strong>${total}</strong> سجلاً نهائياً من هذا الجهاز، ولن يعود أي شيء تلقائياً بعد الحذف.`,
      extra:`${rows?`<table class="tbl" style="margin-top:10px"><thead><tr><th>النوع</th><th>العدد</th></tr></thead><tbody>${rows}</tbody></table>`:''}
        <p class="err" style="margin-top:10px">صدّري نسخة احتياطية أولاً — هذه العملية لا يمكن التراجع عنها.</p>` });
    if (!ok1) return;
    const ok2 = await UI.confirm({ title:'تأكيد أخير', danger:true, confirmText:'نعم، احذفي كل شيء',
      message:'بعد هذه الخطوة يبدأ البرنامج فارغاً تماماً: بلا مشتركات، بلا مالية، وبلا قوائم افتراضية.' });
    if (!ok2) return;
    try {
      await Seed.factoryReset();
      $('brandName').textContent = Settings.get('gymName');
      document.title = `${Settings.get('gymName')} — نظام الإدارة`;
      go('dashboard'); renderRoute();
      UI.toast('تمت إعادة التهيئة. البرنامج فارغ الآن — ابدئي بإنشاء مدد الاشتراكات من الإعدادات.', 'ok', 9000);
    } catch(e){
      Log.error('فشل إعادة التهيئة', e);
      UI.toast('لم تكتمل إعادة التهيئة: ' + e.message, 'err', 9000);
      renderRoute();
    }
  },
  async archiveSale(id){
    Auth.require('pos.delete');
    const sl = Repos.sales.get(id);
    if (sl.archived){
      await guard(null, () => Svc.sales.archive(id, false), 'تم استرجاع الفاتورة');
      return renderRoute();
    }
    const st = Svc.sales.balance(sl);
    const stocked = (sl.lines||[]).filter(l => l.productId).length;
    if (!await UI.confirm({ title:'إلغاء فاتورة', danger:true, confirmText:'إلغاء الفاتورة',
      message:`سيُلغى بيع ${U.esc(sl.code)} بمبلغ ${Money.fmt(sl.total)}.`,
      extra:`<ul style="margin:10px 0 0">${stocked?`<li>سيعود ${stocked} صنف إلى المخزون</li>`:''}
        ${st.paid>0?`<li>سيُسحب ${Money.fmt(st.paid)} من الإيرادات</li>`:''}
        <li>تبقى الفاتورة في السجل ويمكن استرجاعها</li></ul>` })) return;
    await guard(null, () => Svc.sales.archive(id, true), 'تم إلغاء الفاتورة وإرجاع المخزون');
    renderRoute();
  },
  async archiveProduct(id){
    Auth.require('inventory.delete');
    const p = Repos.products.get(id);
    if (p.archived){ await Svc.inventory.archiveProduct(id, false); UI.toast('تم استرجاع الصنف'); return renderRoute(); }
    const qty = Svc.inventory.onHand(id);
    if (!await UI.confirm({ title:'أرشفة صنف', danger:true, confirmText:'أرشفة',
      message:`سيُخفى «${U.esc(p.name)}» من شاشة البيع${qty?` مع بقاء رصيده (${U.round2(qty)} ${U.esc(p.unit||'')}) وحركاته في السجل`:''}. يمكن استرجاعه لاحقاً.` })) return;
    await Svc.inventory.archiveProduct(id, true); UI.toast('تمت أرشفة الصنف'); renderRoute();
  },
  async checkIn(memberId, date, trainingId){
    try {
      const res = await Svc.attendance.checkIn({ memberId, date, trainingId: trainingId || null });
      const m = Repos.members.get(memberId);
      UI.toast(`تم تسجيل حضور ${m?m.name:''}`);
      (res.warnings||[]).forEach(w => UI.toast(w,'warn',6000));
    } catch(e){ UI.toast(e.message, e.code === 'DUPLICATE' ? 'warn' : 'err', 5000); }
    renderRoute();
  },
  async removeAttendance(id){
    Auth.require('attendance.delete');
    const a = Repos.attendance.get(id), m = a ? Repos.members.get(a.memberId) : null;
    if (!await UI.confirm({ title:'حذف سجل حضور', danger:true, confirmText:'حذف',
      message:`سيُحذف حضور ${U.esc(m?m.name:'')} بتاريخ ${D.fmt(a.date)}.` })) return;
    await guard(null, () => Svc.attendance.remove(id), 'تم حذف السجل');
    renderRoute();
  },
  globalSearch(q){
    const box = $('globalSearchRes');
    const s = U.normAr(q);
    if (!s || s.length < 2){ box.classList.add('hidden'); box.innerHTML = ''; return; }
    const res = [];
    Repos.members.list().forEach(m => { if (U.normAr(m.name).includes(s) || U.normAr(m.phone).includes(s) || U.normAr(m.code).includes(s))
      res.push({ t:m.name, g:`مشتركة — ${m.code}`, go:()=>Screens.memberProfile(m.id) }); });
    Repos.staff.list().forEach(x => { if (U.normAr(x.name).includes(s) || U.normAr(x.role).includes(s))
      res.push({ t:x.name, g:`موظفة — ${x.role}`, go:()=>Screens.staffProfile(x.id) }); });
    Repos.exercises.list().forEach(x => { if (U.normAr(x.name).includes(s) || U.normAr(x.muscles).includes(s))
      res.push({ t:x.name, g:`تمرين — ${x.category||''}`, go:()=>Screens.exercise(x.id) }); });
    Repos.trainings.list().forEach(x => { if (U.normAr(x.title).includes(s))
      res.push({ t:x.title, g:`حصة — ${x.time}`, go:()=>go('trainings') }); });
    Repos.products.list().forEach(x => { if (U.normAr(x.name).includes(s) || U.normAr(x.sku).includes(s))
      res.push({ t:x.name, g:`صنف — رصيد ${U.round2(Svc.inventory.onHand(x.id))} ${x.unit||''}`, go:()=>Screens.stockHistory(x.id) }); });
    Repos.sales.list().forEach(x => { if (U.normAr(x.code).includes(s) || U.normAr(x.customerName).includes(s))
      res.push({ t:`فاتورة ${x.code}`, g:`بيع — ${Money.fmt(x.total)} في ${D.fmt(x.date)}`, go:()=>Screens.sale(x.id) }); });
    const top = res.slice(0, 12);
    box.innerHTML = top.length ? top.map((r,i)=>`<button data-i="${i}"><div>${U.esc(r.t)}</div><div class="g-t">${U.esc(r.g)}</div></button>`).join('')
      : '<div class="empty" style="padding:18px">لا نتائج مطابقة</div>';
    box.classList.remove('hidden');
    box.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
      box.classList.add('hidden'); $('globalSearch').value = ''; top[Number(b.dataset.i)].go();
    });
  }
});


/* ===== src/app/flows/13-print.js ===================================================== */
/* ============================ مستندات مطبوعة =============================
   الطباعة ليست لقطة شاشة. كل مستند هنا يُبنى بقالبه الخاص: ترويسة النادي،
   جداول بحدود، إجماليات بارزة، وتذييل. ويُختبر معيار واحد قبل كل شيء:
   هل يبقى مقروءاً مطبوعاً بالأبيض والأسود؟

   الوصل يُطبع من «اللقطة» المحفوظة فيه لا من البيانات الحالية — وإلا تغيّرت
   نسخة قديمة أعيدت طباعتها بعد تعديل سعر أو اسم. */
const Print = {
  /* نافذة طباعة مستقلة تحمل أنماط النظام + قالب الصفحة */
  open(title, html, opts){
    const o = opts || {};
    const w = window.open('', '_blank');
    if (!w){ UI.toast('المتصفح منع فتح نافذة الطباعة — اسمحي بالنوافذ المنبثقة ثم أعيدي المحاولة','warn', 7000); return null; }
    const css = [...document.querySelectorAll('style')].map(s => s.textContent).join('\n');
    const page = o.slip ? '@page{size:80mm auto;margin:4mm}' : `@page{size:${o.landscape ? 'A4 landscape' : 'A4'};margin:14mm 12mm}`;
    w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
      <title>${U.esc(title)}</title><style>${css}
      ${page}
      body{background:#fff;margin:0;padding:0;color:#000}
      .doc{padding:0}
      table{page-break-inside:auto} thead{display:table-header-group}
      tr{page-break-inside:avoid;break-inside:avoid}
      .page-break{page-break-after:always}
      </style></head><body>${html}
      <script>window.onload=function(){setTimeout(function(){window.print();},${o.slip ? 250 : 400});}<\/script>
      </body></html>`);
    w.document.close();
    return w;
  },

  /* -------------------------------- وصل -------------------------------- */
  receiptHtml(receipt, opts){
    const o = opts || {};
    const s = receipt.snapshot || {};
    const g = s.gym || {}, mem = s.member || {}, doc = s.doc || {}, pay = s.payment || {};
    const slip = (o.format || receipt.format) === 'slip';
    const copies = Number(receipt.reprints) || 0;
    const logo = Brand.logoHtml(slip ? 44 : 56, true);
    const contact = [g.phone, g.address, g.instagram ? '@' + String(g.instagram).replace(/^@/, '') : ''].filter(x => U.norm(x)).join(' — ');
    const lines = (doc.lines || []);
    return `<div class="doc ${slip ? 'slip' : ''}">
      <div class="doc-head">
        <div class="doc-head-brand">${logo}
          <div><strong>${U.esc(g.name || Brand.name())}</strong>
            ${g.subtitle ? `<span>${U.esc(g.subtitle)}</span>` : ''}
            ${contact ? `<span>${U.esc(contact)}</span>` : ''}</div></div>
        <div class="doc-head-meta"><strong>وصل قبض</strong>
          <span>رقم <b class="num">${U.esc(receipt.no)}</b></span>
          <span class="num">${U.esc(D.fmt(String(receipt.issuedAt).slice(0, 10)))} — ${U.esc(String(receipt.issuedAt).slice(11, 16))}</span></div>
      </div>

      ${receipt.voided ? '<div class="doc-total" style="border-style:dashed">هذا الوصل مُبطَل — أُلغيت الدفعة المرتبطة به</div>' : ''}

      <dl class="doc-kv">
        <dt>استلمنا من</dt><dd>${U.esc(mem.name || '—')}</dd>
        <dt>الكود</dt><dd class="num">${U.esc(mem.code || '—')}</dd>
        <dt>البيان</dt><dd>${U.esc(doc.title || '—')}</dd>
        <dt>طريقة الدفع</dt><dd>${U.esc(pay.method || 'نقد')}</dd>
      </dl>
      ${doc.detail ? `<div style="margin-bottom:10px">${U.esc(doc.detail)}</div>` : ''}

      ${lines.length ? `<table class="doc-tbl"><thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>المجموع</th></tr></thead>
        <tbody>${lines.map(l => `<tr><td>${U.esc(l.name)}</td><td class="num">${U.round2(l.qty)}</td>
          <td class="num">${Money.fmt(l.unitPrice)}</td><td class="num">${Money.fmt(l.total)}</td></tr>`).join('')}</tbody></table>` : ''}

      <table class="doc-tbl doc-sums"><tbody>
        <tr><td>قيمة ${doc.kind === 'sale' ? 'الفاتورة' : 'الاشتراك'}</td><td class="num ta-l">${Money.fmt(doc.price)}</td></tr>
        ${doc.discount ? `<tr><td>الخصم</td><td class="num ta-l">− ${Money.fmt(doc.discount)}</td></tr>` : ''}
        <tr><td>الإجمالي المستحق</td><td class="num ta-l">${Money.fmt(doc.total)}</td></tr>
        ${pay.paidBefore ? `<tr><td>المدفوع سابقاً</td><td class="num ta-l">${Money.fmt(pay.paidBefore)}</td></tr>` : ''}
      </tbody></table>

      <div class="doc-total"><span>المبلغ المستلم</span><span class="num">${Money.fmt(pay.amount)}</span></div>
      ${Settings.get('receiptShowBalance') && pay.remaining > 0
        ? `<div class="doc-total" style="border-width:1px"><span>المتبقّي بعد هذه الدفعة</span><span class="num">${Money.fmt(pay.remaining)}</span></div>` : ''}

      ${!slip ? `<div class="doc-sign"><div>توقيع المستلمة</div><div>توقيع المشتركة</div></div>` : ''}
      <div class="doc-foot">
        ${U.esc(g.footer || Settings.get('receiptNote') || '')}
        <div>سجّلت الاستلام: ${U.esc(receipt.issuedBy || s.operator || '—')}</div>
        ${copies > 0 ? `<div class="doc-copy">نسخة مُعادة الطباعة رقم ${copies + 1} — ليست مطالبة بمبلغ جديد</div>` : ''}
      </div>
    </div>`;
  },

  /* ---------------------------- كشف حساب مشتركة ---------------------------- */
  statementHtml(memberId){
    const m = Repos.members.get(memberId);
    if (!m) return '';
    const subs = U.sortBy(Svc.subs.ofMember(memberId), s => s.startDate);
    const sales = U.sortBy(Repos.sales.list().filter(x => x.memberId === memberId), s => s.date);
    const pmts = U.sortBy(Svc.payments.ofMember(memberId), p => p.date);
    const payIdx = Svc.payments.indexBy('subscription'), saleIdx = Svc.payments.indexBy('sale');
    const owed = U.round2(U.sum(subs, s => s.finalPrice) + U.sum(sales, s => s.total));
    const paid = U.round2(U.sum(pmts, p => p.amount));
    /* دفتر أستاذ حقيقي: مستحق (مدين) ومقبوض (دائن) ورصيد جارٍ */
    const rows = [
      ...subs.map(s => ({ date:s.startDate, text:`اشتراك ${Svc.subs.durationInfo(s).label} (${D.fmt(s.startDate)} ← ${D.fmt(s.endDate)})`, debit:s.finalPrice, credit:0 })),
      ...sales.map(s => ({ date:s.date, text:`فاتورة ${s.code}`, debit:s.total, credit:0 })),
      ...pmts.map(p => { const r = Svc.receipts.forPayment(p.id);
        return { date:p.date, text:`دفعة ${p.method || ''}${r ? ` — وصل ${r.no}` : ''}`, debit:0, credit:p.amount }; })
    ].sort((a, b) => D.cmp(a.date, b.date) || (b.debit - a.debit));
    let bal = 0;
    return `<div class="doc">
      ${Brand.printHeader('كشف حساب مشتركة', m.name)}
      <dl class="doc-kv">
        <dt>المشتركة</dt><dd>${U.esc(m.name)}</dd>
        <dt>الكود</dt><dd class="num">${U.esc(m.code)}</dd>
        <dt>الهاتف</dt><dd class="num">${U.esc(m.phone || '—')}</dd>
        <dt>تاريخ الانضمام</dt><dd class="num">${D.fmt(m.joinDate)}</dd>
      </dl>
      <table class="doc-tbl"><thead><tr><th>التاريخ</th><th>البيان</th><th>مستحق</th><th>مقبوض</th><th>الرصيد</th></tr></thead>
        <tbody>${rows.map(r => { bal = U.round2(bal + r.debit - r.credit);
          return `<tr><td class="num">${D.fmt(r.date)}</td><td>${U.esc(r.text)}</td>
            <td class="num">${r.debit ? Money.fmt(r.debit) : '—'}</td>
            <td class="num">${r.credit ? Money.fmt(r.credit) : '—'}</td>
            <td class="num">${Money.fmt(bal)}</td></tr>`; }).join('')}</tbody>
        <tfoot><tr><td colspan="2">الإجمالي</td><td class="num">${Money.fmt(owed)}</td>
          <td class="num">${Money.fmt(paid)}</td><td class="num">${Money.fmt(U.round2(owed - paid))}</td></tr></tfoot></table>
      <div class="doc-total"><span>${owed - paid > 0 ? 'المتبقّي على المشتركة' : 'الحساب مسدَّد بالكامل'}</span>
        <span class="num">${Money.fmt(Math.max(0, U.round2(owed - paid)))}</span></div>
      <div class="doc-note">هذا الكشف يبيّن ما استُحقّ وما قُبض فقط، ولا يتضمّن أي معلومات شخصية أخرى.</div>
      <div class="doc-foot">${U.esc(Brand.name())} — طُبع في ${D.fmt(D.today())}</div>
    </div>`;
  },

  /* ------------------------------ تقرير عام ------------------------------ */
  reportHtml(title, sections, opts){
    const o = opts || {};
    return `<div class="doc" style="max-width:${o.landscape ? '270mm' : '190mm'}">
      ${Brand.printHeader(title, o.subtitle || '')}
      ${sections.map(sec => `
        ${sec.title ? `<h3 class="doc-title">${U.esc(sec.title)}</h3>` : ''}
        ${sec.kv ? `<dl class="doc-kv">${sec.kv.map(([k, v]) => `<dt>${U.esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>` : ''}
        ${sec.headers ? `<table class="doc-tbl"><thead><tr>${sec.headers.map(h => `<th>${U.esc(h)}</th>`).join('')}</tr></thead>
          <tbody>${(sec.rows || []).map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
          ${sec.totals ? `<tfoot><tr>${sec.totals.map(c => `<td>${c}</td>`).join('')}</tr></tfoot>` : ''}</table>` : ''}
        ${sec.html || ''}
      `).join('')}
      <div class="doc-foot">${U.esc(Brand.name())} — طُبع في ${D.fmt(D.today())} ${D.dayName(D.today())}</div>
    </div>`;
  }
};

/* ------------------------------- الأفعال ------------------------------- */
Actions.printReceipt = async function(receiptId, format){
  const r = Repos.receipts.get(receiptId);
  if (!r) return UI.toast('الوصل غير موجود','err');
  const w = Print.open(`وصل ${r.no}`, Print.receiptHtml(r, { format }), { slip:(format || r.format) === 'slip' });
  if (!w) return;
  /* العدّاد يزيد بعد فتح نافذة الطباعة فعلاً — لا قبلها */
  await Svc.receipts.markPrinted(receiptId).catch(e => Log.warn('تعذّر تسجيل الطباعة', e));
};
/* الطريق المعتاد من الشاشات: دفعة ⇒ وصل (يُصدَر مرة واحدة) ⇒ طباعة */
Actions.printReceiptForPayment = async function(paymentId){
  const r = await guard(null, () => Svc.receipts.ensure(paymentId));
  if (!r) return;
  const fmt = Settings.get('receiptFormat') || 'a4';
  await Actions.printReceipt(r.id, fmt);
};
Actions.printStatement = function(memberId){
  const m = Repos.members.get(memberId);
  if (!m) return UI.toast('المشتركة غير موجودة','err');
  Print.open(`كشف حساب ${m.name}`, Print.statementHtml(memberId));
};

/* تسجيل حضور سريع من أي مكان، بتنبيه واضح إن كان اشتراكها منتهياً */
Actions.quickCheckIn = async function(memberId, opts){
  const m = Repos.members.get(memberId);
  if (!m) return UI.toast('المشتركة غير موجودة','err');
  const res = await guard(null, () => Svc.attendance.checkIn({ memberId, method:(opts && opts.method) || 'staff' }));
  if (!res) return null;
  (res.warnings || []).forEach(w => UI.toast(w, 'warn', 6000));
  UI.toast(`سُجّل حضور ${m.name}`);
  renderRoute();
  return res.rec;
};

/* المستحقات على مشتركة واحدة، مع القبض والطباعة من المكان نفسه */
Screens.memberDues = function(memberId){
  const m = Repos.members.get(memberId);
  if (!m) return UI.toast('المشتركة غير موجودة','err');
  const dues = Svc.payments.openDues().filter(d => d.member && d.member.id === memberId);
  const h = UI.modal({
    title:`مستحقات ${m.name}`, size:'wide',
    body: dues.length ? `<table class="mini-tbl"><thead><tr><th>المستند</th><th>التاريخ</th><th>المستحق</th><th>المقبوض</th><th>المتبقّي</th><th></th></tr></thead><tbody>
      ${dues.map(d => `<tr><td>${d.kind === 'sale' ? 'فاتورة ' + U.esc(d.doc.code) : 'اشتراك ' + U.esc(d.doc.planName || '')}</td>
        <td class="num">${D.fmt(d.date)}<div class="t-sub">${U.esc(Svc.payments.ageText(d.date).text)}</div></td>
        <td class="num">${Money.fmt(d.st.total)}</td><td class="num">${Money.fmt(d.st.paid)}</td>
        <td class="num money-neg"><strong>${Money.fmt(d.st.due)}</strong></td>
        <td class="ta-l"><button class="btn btn-sm btn-primary" data-pay="${d.kind}:${d.doc.id}">قبض</button></td></tr>`).join('')}
      </tbody></table>` : UI.empty('لا مستحقات','حساب هذه المشتركة مسدَّد بالكامل'),
    onMount(ov){
      ov.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => {
        const [kind, id] = b.dataset.pay.split(':');
        h.close();
        Forms.payment(kind === 'sale' ? 'sale' : 'subscription', id);
      });
    }
  });
};

/* البحث العام: يشمل الآن المهتمّات والوصولات والحصص والمستندات وحقول النادي */
Actions.globalSearch = function(q){ /*v4*/
  const box = $('globalSearchRes');
  const query = U.normAr(q);
  if (!query || query.length < 2){ box.classList.add('hidden'); box.innerHTML = ''; return; }
  const hits = [];
  const add = (kind, icon, title, sub, go) => hits.push({ kind, icon, title, sub, go });

  Svc.members.rows(true).forEach(r => {
    const m = r.m;
    const hay = [m.name, m.phone, m.phone2, m.code, m.email, m.city, Fields.searchText('member', m)].map(U.normAr).join(' ');
    if (hay.includes(query))
      add('مشتركة', ICON.users, m.name, `${m.code} — ${m.phone || 'بلا رقم'} — ${r.st.status.ar}`, () => Screens.memberProfile(m.id));
  });
  Repos.leads.list().forEach(l => {
    if ([l.name, l.phone, l.code, l.source].map(U.normAr).join(' ').includes(query))
      add('مهتمّة', ICON.gift, l.name, `${l.phone || 'بلا رقم'} — ${Svc.leads.stage(l.stage).ar}`, () => go('crm'));
  });
  Repos.staff.list(true).forEach(s => {
    if ([s.name, s.phone, s.role].map(U.normAr).join(' ').includes(query))
      add('من الفريق', ICON.staff, s.name, s.role || '', () => Screens.staffProfile(s.id));
  });
  Repos.receipts.list(true).forEach(r => {
    if (U.normAr(r.no).includes(query))
      add('وصل', ICON.print, `وصل ${r.no}`, `${Money.fmt(r.amount)} — ${(r.snapshot && r.snapshot.member && r.snapshot.member.name) || ''}`,
          () => Actions.printReceipt(r.id));
  });
  Repos.sales.list(true).forEach(s => {
    if (U.normAr(s.code).includes(query))
      add('فاتورة', ICON.coins, `فاتورة ${s.code}`, `${Money.fmt(s.total)} — ${D.fmt(s.date)}`, () => Screens.sale(s.id));
  });
  Repos.products.list(true).forEach(p => {
    if ([p.name, p.sku, p.category].map(U.normAr).join(' ').includes(query))
      add('صنف', ICON.box, p.name, `${p.sku || ''} — الرصيد ${U.round2(Svc.inventory.onHand(p.id))}`, () => go('inventory'));
  });
  Repos.exercises.list(true).forEach(x => {
    if ([x.name, x.category, x.muscles].map(U.normAr).join(' ').includes(query))
      add('تمرين', ICON.dumbbell, x.name, x.category || '', () => Screens.exercise(x.id));
  });
  Svc.classes.between(D.addDays(D.today(), -7), D.addDays(D.today(), 30)).forEach(s => {
    if (U.normAr(s.title).includes(query))
      add('حصة', ICON.clock, s.title, `${D.fmt(s.date)} — ${s.startTime}`, () => go('classes', { date:s.date }));
  });

  if (!hits.length){
    box.innerHTML = `<div class="gs-empty">لا نتائج لـ «${U.esc(q)}»</div>`;
    box.classList.remove('hidden'); return;
  }
  const groups = U.groupBy(hits.slice(0, 40), h => h.kind);
  box.innerHTML = Object.entries(groups).map(([kind, rows]) => `
    <div class="gs-group">${U.esc(kind)}</div>
    ${rows.map((h, i) => `<button class="gs-item" data-hit="${kind}:${i}">
      ${svg(h.icon, 15)}<span class="grow"><b>${U.esc(h.title)}</b><small>${U.esc(h.sub)}</small></span></button>`).join('')}`).join('');
  box.classList.remove('hidden');
  box.querySelectorAll('[data-hit]').forEach(b => b.onclick = () => {
    const [kind, i] = b.dataset.hit.split(':');
    box.classList.add('hidden');
    const el = $('globalSearch'); if (el) el.value = '';
    groups[kind][Number(i)].go();
  });
};


/* ===== src/app/flows/30-boot.js ====================================================== */
/* ============================================================================
   Bootstrap
   ============================================================================ */
/* إشارة الجاهزية: تُحلّ بعد اكتمال الإقلاع كاملاً (ترقية + إعدادات + أول رسم).
   الاختبار الآلي وأي أتمتة لاحقة تنتظرها بدل تخمين وقت الانتهاء. */
let _readyResolve, _readyReject;
const AppReady = new Promise((res, rej) => { _readyResolve = res; _readyReject = rej; });

async function boot(){
  const root = $('viewRoot');
  root.innerHTML = `<div class="card"><div class="card-body">
    <div class="skeleton" style="width:40%;margin-bottom:12px"></div>
    <div class="skeleton" style="width:80%;margin-bottom:8px"></div>
    <div class="skeleton" style="width:60%"></div></div></div>`;
  let adapter;
  try {
    adapter = await new IDBAdapter(APP.db, APP.schema).open();
  } catch(e){
    Log.error('تعذّر فتح IndexedDB — المحاولة على التخزين المحلي', e);
    try { adapter = await new LSAdapter(APP.db).open(); }
    catch(e2){ Log.error('تعذّر التخزين المحلي — التشغيل في الذاكرة', e2); adapter = await new MemAdapter().open(); }
  }
  await DB.init(adapter);
  const mig = await Migrations.run();               // ترقية بيانات الإصدارات الأقدم قبل أي عرض
  await Settings.load();
  /* الافتراضيات تُزرع مرة واحدة عند أول تشغيل فقط — لا بعد إعادة التهيئة */
  if (!Settings.get('initialized')){
    await Seed.ensureDefaults();
    await Settings.set({ initialized:true });
  }
  /* الأدوار تُزرع دائماً إن كان جدولها فارغاً — بنية لا تُنتظر لتفعيل الميزة */
  await Auth.ensureRoles();

  Brand.applyToShell();                              // الشعار والاسم والوصف من الإعدادات
  $('verLabel').textContent = `الإصدار ${APP.version}`;
  buildNav();

  if (adapter.kind === 'memory')
    UI.toast('المتصفح يمنع الحفظ المحلي — البيانات لن تبقى بعد الإغلاق. افتحي الملف من متصفح عادي (غير وضع التصفح الخاص).','err', 12000);
  else if (adapter.kind === 'localstorage')
    UI.toast('النظام يعمل على تخزين احتياطي محدود المساحة — تجنّبي الفيديوهات الكبيرة وخذي نسخة احتياطية بانتظام.','warn', 10000);

  /* زر الإضافة السريعة: أكثر ما يُفتح في الاستقبال، لا مشتركة جديدة فقط */
  $('btnQuickAdd').onclick = async () => {
    const pick = await UI.choice({ title:'إضافة سريعة', message:'ماذا تريدين تسجيله الآن؟',
      options:[{ key:'member', label:'مشتركة جديدة', primary:true }, { key:'sub', label:'اشتراك' },
               { key:'sale', label:'فاتورة بيع' }, { key:'att', label:'تسجيل حضور' }] });
    if (pick === 'member') Forms.member();
    else if (pick === 'sub') Forms.subscription();
    else if (pick === 'sale') Forms.sale();
    else if (pick === 'att') go('attendance');
  };
  $('btnQuickBackup').onclick = () => Actions.exportBackup(true);
  $('btnBell').onclick = e => { e.stopPropagation(); Screens.notifications(); };
  $('globalSearch').oninput = U.debounce(e => Actions.globalSearch(e.target.value), 220);
  $('globalSearch').onkeydown = e => { if (e.key === 'Escape'){ e.target.value=''; $('globalSearchRes').classList.add('hidden'); } };

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && UI.stack.length) UI.stack[UI.stack.length-1].close();
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA'){
      e.preventDefault(); $('globalSearch').focus();
    }
  });
  window.addEventListener('hashchange', renderRoute);
  window.addEventListener('error', ev => { Log.error('خطأ غير متوقع', ev.message); });
  window.addEventListener('unhandledrejection', ev => {
    Log.error('عملية فشلت', ev.reason && ev.reason.message);
    UI.toast((ev.reason && ev.reason.message) || 'فشلت العملية','err');
  });

  renderRoute();
  if (mig.applied.length) UI.toast('تمت ترقية بياناتك إلى الإصدار ' + APP.version + ' بنجاح', 'ok', 6000);
  const alerts = Svc.notify.build().filter(n => n.level === 'red');
  if (alerts.length) setTimeout(() => UI.toast(alerts[0].title, 'warn', 6000), 900);
  Log.info('النظام جاهز', { adapter:adapter.kind, records:STORE_NAMES.reduce((a,s)=>a+DB.count(s),0) });
  return { adapter:adapter.kind, migration:mig };
}

/* الإقلاع لا يُترك بلا شبكة أمان: شاشة الهيكل العظمي إلى الأبد أسوأ من رسالة خطأ. */
async function bootSafely(){
  try { const info = await boot(); _readyResolve(info); }
  catch(e){
    Log.error('فشل إقلاع النظام', e);
    const root = $('viewRoot');
    if (root) root.innerHTML = `<div class="card"><div class="card-body">
      <h3 style="color:var(--red-600);margin-bottom:8px">تعذّر تشغيل النظام</h3>
      <p>${U.esc(e && e.message || 'خطأ غير معروف')}</p>
      <p class="t-sub">جرّبي إغلاق النوافذ الأخرى التي تفتح النظام ثم إعادة تحميل الصفحة.
         إذا تكرّر الخطأ فافتحي الملف من متصفح عادي خارج وضع التصفّح الخاص.</p>
      <button class="btn btn-primary" onclick="location.reload()">إعادة المحاولة</button></div></div>`;
    _readyReject(e);
  }
}

/* واجهة مكشوفة للاختبار الآلي وللصيانة من Console */
window.TG = { APP, U, D, DUR, Money, Calc, Validate, Offers, Svc, Repos, DB, Settings, Backup, Seed, Audit, Migrations, Integrity, Exporter,
              Auth, PERMISSIONS, PERM_KEYS, ROLE_PRESETS,
              Fields, FIELD_TYPES, FIELD_ENTITIES, Brand, Print,
              STATUS, STORE_NAMES, SCHEMA, UI, Views, Reports, Forms, Screens, Actions, IDBAdapter, LSAdapter, MemAdapter, AppError, Log,
              boot, renderRoute, go, State, buildNav, currentRoute, navBadges,
              ready:AppReady };

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootSafely);
else bootSafely();

</script>
