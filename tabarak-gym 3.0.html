/* ============================ Backup & Restore ===========================
   الملف نصي JSON — يُفتح ويُراجع بالعين، ويحمل نسخة المخطط للتحقق. */
const Backup = {
  FORMAT:'tabarak-gym-backup',
  build(includeMedia=true){
    const data = {};
    STORE_NAMES.forEach(s => {
      if (s === 'media' && !includeMedia){ data[s] = []; return; }
      data[s] = DB.all(s);
    });
    return { format:this.FORMAT, schema:APP.schema, app:APP.version, gym:Settings.get('gymName'),
             exportedAt:new Date().toISOString(),
             counts:Object.fromEntries(STORE_NAMES.map(s=>[s, (data[s]||[]).length])), data };
  },
  validate(obj){
    const errs = [];
    /* ملاحظة: النسخ الأقدم مقبولة وتُرقّى تلقائياً، والأحدث فقط تُرفض */
    if (!obj || typeof obj !== 'object') errs.push('الملف ليس نسخة احتياطية صالحة');
    else {
      if (obj.format !== this.FORMAT) errs.push('الملف ليس نسخة من نظام تبارك جيم');
      if (!obj.data || typeof obj.data !== 'object') errs.push('الملف لا يحتوي بيانات');
      if (obj.schema == null) errs.push('لا يوجد رقم إصدار للمخطط');
      else if (Number(obj.schema) > APP.schema) errs.push(`النسخة أحدث من البرنامج (مخطط ${obj.schema}) — حدّثي البرنامج أولاً`);
      if (obj.data){
        const unknown = Object.keys(obj.data).filter(k => !STORE_NAMES.includes(k));
        if (unknown.length) errs.push('يحتوي الملف جداول غير معروفة: ' + unknown.join('، '));
        STORE_NAMES.forEach(s => { if (obj.data[s] != null && !Array.isArray(obj.data[s])) errs.push(`الجدول ${s} تالف`); });
      }
    }
    return { ok:errs.length === 0, errors:errs,
             counts: obj && obj.data ? Object.fromEntries(STORE_NAMES.map(s => [s, (obj.data[s]||[]).length])) : {} };
  },
  /* الاستعادة عملية "كل شيء أو لا شيء": نأخذ لقطة من البيانات الحالية،
     وإذا فشل أي جدول في المنتصف نعيد اللقطة كما كانت بدل ترك النظام نصف ممتلئ. */
  async restore(obj){
    const v = this.validate(obj);
    if (!v.ok) throw new AppError(v.errors[0],'BACKUP_INVALID', v.errors);
    const snapshot = Object.fromEntries(STORE_NAMES.map(s => [s, DB.all(s)]));
    try {
      await DB.clearAll();
      for (const s of STORE_NAMES){
        const rows = (obj.data[s]||[]).filter(r => r && r[SCHEMA[s].key] != null);
        if (rows.length) await DB.putMany(s, rows);
      }
    } catch(e){
      Log.error('فشلت الاستعادة — إرجاع البيانات السابقة', e);
      try {
        await DB.clearAll();
        for (const s of STORE_NAMES) if (snapshot[s].length) await DB.putMany(s, snapshot[s]);
      } catch(e2){
        /* القرص غير قابل للكتابة: على الأقل تبقى البيانات ظاهرة في الجلسة الحالية */
        STORE_NAMES.forEach(s => { DB.cache[s].clear(); snapshot[s].forEach(r => DB.cache[s].set(r[SCHEMA[s].key], r)); });
        Log.error('تعذّر إرجاع اللقطة إلى القرص — أُعيدت إلى الذاكرة فقط', e2);
      }
      await Settings.load();
      throw new AppError('فشلت الاستعادة وأُعيدت بياناتك السابقة كما كانت','RESTORE_FAILED', e);
    }
    /* نسخة من إصدار أقدم؟ تُرقّى بعد الاستعادة مباشرة قبل أن تراها الواجهة */
    try { await Migrations.run(); } catch(e){ Log.error('فشلت ترقية النسخة المستعادة', e); }
    await Settings.load();
    await Audit.log('system','restore',`استعادة نسخة احتياطية من ${String(obj.exportedAt||'').slice(0,10)} (مخطط ${obj.schema})`);
    return v.counts;
  },
  async markExported(){ await Settings.set({ lastBackupAt:new Date().toISOString() }); }
};


/* ===== src/app/data/60-seed.js ======================================================= */
/* ============================== Seed / Demo ==============================
   قاعدة: القوائم الافتراضية تُنشأ مرة واحدة عند أول تشغيل فقط (علم initialized).
   بعد «إعادة التهيئة» لا يعود أي شيء تلقائياً — المستخدمة هي من تطلب استعادتها. */
const Seed = {
  DURATION_PRESETS: [
    { name:'أسبوع',     durationValue:1,  durationUnit:'week'  },
    { name:'أسبوعان',   durationValue:2,  durationUnit:'week'  },
    { name:'نصف شهر',   durationValue:15, durationUnit:'day'   },
    { name:'شهر',       durationValue:1,  durationUnit:'month' },
    { name:'شهران',     durationValue:2,  durationUnit:'month' },
    { name:'3 أشهر',    durationValue:3,  durationUnit:'month' },
    { name:'4 أشهر',    durationValue:4,  durationUnit:'month' },
    { name:'6 أشهر',    durationValue:6,  durationUnit:'month' },
    { name:'سنة',       durationValue:12, durationUnit:'month' }
  ],
  EXPENSE_CATS: [['إيجار',null],['كهرباء ومولّدة',null],['ماء',null],['صيانة',null],['أجهزة ومعدات',null],
                 ['تنظيف',null],['رواتب','salaries'],['تسويق وإعلان',null],['مشتريات','purchases'],['أخرى',null]],
  async ensureDefaults(){
    let n = 0;
    if (!Repos.plans.list(true).length){ for (const p of this.DURATION_PRESETS){ await Repos.plans.create(Object.assign({ active:true }, p)); n++; } }
    if (!Repos.expCats.list(true).length){ for (const [name, system] of this.EXPENSE_CATS){ await Repos.expCats.create({ name, system, active:true }); n++; } }
    if (!Repos.offers.list(true).length){
      await Repos.offers.create({ name:'الرابع مجاناً', description:'ثلاثة اشتراكات متتالية بلا انقطاع تمنح الاشتراك الرابع مجاناً',
        ruleType:'consecutive_subs', ruleValue:3, rewardType:'free', rewardValue:0, maxPerMember:0, autoReset:true, active:true });
      await Repos.offers.create({ name:'خصم الوفاء', description:'خمسة اشتراكات إجمالاً تمنح خصم 20%',
        ruleType:'total_subs', ruleValue:5, rewardType:'percent', rewardValue:20, maxPerMember:1, autoReset:false, active:true });
      await Repos.offers.create({ name:'عرض العودة', description:'المنقطعة 90 يوماً أو أكثر تحصل على خصم 15%',
        ruleType:'lapsed_days', ruleValue:90, rewardType:'percent', rewardValue:15, maxPerMember:0, autoReset:true, active:true });
      n += 3;
    }
    n += await Auth.ensureRoles();
    if (!Repos.exercises.list(true).length){
      const ex = [
        { name:'سكوات بوزن الجسم', category:'أرجل', muscles:'الفخذ الأمامي، الأرداف', level:'مبتدئة',
          description:'الوقوف بعرض الكتفين، النزول بالحوض للخلف مع إبقاء الظهر مستقيماً والركبة خلف أصابع القدم.', sets:3, reps:15, rest:45, duration:0 },
        { name:'بلانك', category:'وسط الجسم', muscles:'البطن، أسفل الظهر', level:'مبتدئة',
          description:'ثبات على الساعدين وأصابع القدمين مع شد البطن وعدم رفع الأرداف.', sets:3, reps:0, rest:40, duration:40 },
        { name:'رفعة ميتة بالدمبل', category:'ظهر', muscles:'أوتار الركبة، أسفل الظهر، الأرداف', level:'متوسطة',
          description:'انحناء من الورك مع ظهر مستقيم ودمبل قريب من الساقين.', sets:4, reps:10, rest:60, duration:0 },
        { name:'ضغط صدر بالدمبل', category:'صدر', muscles:'الصدر، الترايسبس', level:'متوسطة',
          description:'الاستلقاء على البنش ودفع الدمبل للأعلى مع تحكم في النزول.', sets:3, reps:12, rest:60, duration:0 },
        { name:'دراجة ثابتة', category:'كارديو', muscles:'القلب، الأرجل', level:'مبتدئة',
          description:'إحماء 5 دقائق ثم إيقاع متوسط ثابت.', sets:1, reps:0, rest:0, duration:900 }
      ];
      for (const e of ex){ await Repos.exercises.create(e); n++; }
    }
    return n;
  },
  /* استعادة القوائم الافتراضية بطلب صريح من المستخدمة (بعد إعادة التهيئة مثلاً) */
  async restoreDefaults(){
    const n = await this.ensureDefaults();
    await Audit.log('system','defaults',`استعادة ${n} سجلاً من القوائم الافتراضية`);
    return n;
  },

  /* ---------------------------- بيانات تجريبية ----------------------------
     العملية كلٌّ لا يتجزأ: إن فشل أي جزء تُحذف كل السجلات التي أُنشئت في هذه المحاولة. */
  async loadDemo(count=40){
    const before = {};
    STORE_NAMES.forEach(st => before[st] = new Set(DB.all(st).map(r => r.id)));
    const rollback = async () => {
      for (const st of STORE_NAMES)
        for (const r of DB.all(st)) if (r.isDemo && !before[st].has(r.id)) { try { await DB.remove(st, r.id); } catch(e){} }
    };
    let step = 'التهيئة';
    const rnd = (seed => () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648)(20260914);
    const pick = arr => arr[Math.floor(rnd() * arr.length)] ;
    const summary = { members:0, subscriptions:0, staff:0, expenses:0, revenues:0, capital:0, trainings:0,
                      products:0, sales:0, attendance:0, unpaid:0 };
    try {
      step = 'مدد الاشتراكات';
      if (!Repos.plans.list().length) await this.ensureDefaults();
      if (!Repos.expCats.list().length) await this.ensureDefaults();
      const plans = Repos.plans.list(), cats = Repos.expCats.list().filter(c => c.system !== 'salaries');
      const today = D.today();
      const first = ['زهراء','فاطمة','مريم','نور','رقية','هبة','آيات','دعاء','سجى','تبارك','بتول','شهد','ريام','مروة','لينا','سارة','رند','غفران','إيمان','أسماء'];
      const last  = ['الموسوي','الجابري','العبادي','الحسيني','الزبيدي','الساعدي','التميمي','الدليمي'];
      const prices = [20000, 25000, 30000, 35000, 45000, 60000];

      step = 'المشتركات والاشتراكات';
      for (let i = 0; i < count; i++){
        const name = `${first[i % first.length]} ${last[(i*3) % last.length]}`;
        const join = D.addDays(today, -(20 + Math.floor(rnd()*430)));
        const { rec:m } = await Svc.members.create({ name, phone:'0770'+String(1000000 + Math.floor(rnd()*8999999)),
          joinDate:join, isDemo:true });
        summary.members++;
        /* توزيع مقصود يجعل اللوحة والعروض ذات معنى */
        const profile = i % 5 === 0 ? 'expiring' : i % 5 === 1 ? 'expired' : i % 5 === 2 ? 'loyal' : i % 5 === 3 ? 'active' : 'new';
        const chain = profile === 'loyal' ? 4 : profile === 'new' ? 1 : 1 + Math.floor(rnd()*3);
        let end;
        if (profile === 'expiring') end = D.addDays(today, 1 + Math.floor(rnd()*6));
        else if (profile === 'expired') end = D.addDays(today, -(5 + Math.floor(rnd()*70)));
        else if (profile === 'new') end = D.addDays(today, 10 + Math.floor(rnd()*20));
        else end = D.addDays(today, 8 + Math.floor(rnd()*60));
        /* نبني السلسلة رجوعاً من آخر اشتراك حتى تكون المتتالية حقيقية */
        let cursor = end;
        const segs = [];
        for (let k = 0; k < chain; k++){
          const plan = pick(plans);
          const dur = Svc.subs.durationOf(plan);
          const st = DUR.end(cursor, 1, 'day') && cursor;
          const startDate = (() => {
            if (dur.unit === 'month') return D.addDays(D.addMonths(cursor, -dur.value), 1);
            if (dur.unit === 'week') return D.addDays(cursor, -(dur.value*7 - 1));
            return D.addDays(cursor, -(dur.value - 1));
          })();
          segs.unshift({ plan, startDate, endDate:cursor });
          cursor = D.addDays(startDate, -1);
        }
        for (let si = 0; si < segs.length; si++){
          const sg = segs[si];
          if (D.cmp(sg.startDate, m.joinDate) < 0) await Repos.members.update(m.id, { joinDate:sg.startDate });
          const price = pick(prices);
          /* واحدة من كل سبع مشتركات تترك رصيداً على آخر اشتراك — حتى تكون شاشة
             المستحقات والتنبيهات المالية ذات معنى في العرض التجريبي. */
          const last = si === segs.length - 1;
          const owes = last && (i % 7 === 3);
          const paidAmount = owes ? (i % 14 === 3 ? 0 : U.round2(price * 0.4)) : null;
          await Svc.subs.create({ memberId:m.id, planId:sg.plan.id, startDate:sg.startDate, endDate:sg.endDate,
            price, discount:0, paidAmount, paymentMethod: rnd() > .8 ? 'تحويل' : 'نقد', isDemo:true });
          summary.subscriptions++;
          if (owes) summary.unpaid++;
        }
      }

      step = 'الموظفات';
      const roles = ['مدربة لياقة','مدربة يوغا','موظفة استقبال','عاملة تنظيف','مشرفة','مدربة حديد'];
      const salaries = [500000, 400000, 350000, 300000, 600000, 450000];
      for (let i = 0; i < 6; i++){
        await Repos.staff.create({ name:`${first[(i+11) % first.length]} ${last[(i+2) % last.length]}`, role:roles[i],
          baseSalary:salaries[i], hireDate:D.addDays(today, -(150 + i*45)), phone:'0771'+String(1000000 + i*11111),
          status:'active', notes:'', isDemo:true });
        summary.staff++;
      }

      step = 'المصروفات';
      const expNames = ['فاتورة كهرباء','صيانة أجهزة','مواد تنظيف','إيجار الشهر','إعلان انستغرام','مشتريات مياه','صبغ وترميم','قطع غيار'];
      for (let i = 0; i < 30; i++){
        await Svc.finance.addExpense({ date:D.addDays(today, -Math.floor(rnd()*160)),
          amount:[15000,45000,20000,400000,30000,12000,75000,25000][i % 8], categoryId:pick(cats).id,
          description:expNames[i % expNames.length], payee:'', notes:'', isDemo:true });
        summary.expenses++;
      }

      step = 'إيرادات إضافية';
      const extra = [['بيع مكمّلات','product'],['حصة تدريب خاص','session'],['بيع ملابس رياضية','product'],['جلسة تغذية','service']];
      for (let i = 0; i < 10; i++){
        const [desc, src] = extra[i % extra.length];
        await Svc.finance.addRevenue({ date:D.addDays(today, -Math.floor(rnd()*120)), amount:[10000,25000,35000,15000][i%4],
          source:src, description:desc, method:'نقد', notes:'', isDemo:true });
        summary.revenues++;
      }

      step = 'رأس المال';
      await Svc.finance.addCapital({ date:D.addDays(today, -450), amount:15000000, type:'injection',
        description:'رأس مال التأسيس', isDemo:true });
      summary.capital++;

      step = 'جدول التدريبات';
      const coach = Repos.staff.list().filter(x => x.isDemo)[0];
      await Repos.trainings.create({ title:'لياقة صباحية', type:'لياقة', coachId:coach?coach.id:null, time:'09:00',
        days:['الأحد','الثلاثاء','الخميس'], capacity:15, room:'القاعة الرئيسية', active:true, notes:'', isDemo:true });
      await Repos.trainings.create({ title:'يوغا مسائية', type:'يوغا', coachId:null, time:'18:00',
        days:['الاثنين','الأربعاء'], capacity:12, room:'قاعة اليوغا', active:true, notes:'', isDemo:true });
      await Repos.trainings.create({ title:'حديد وقوة', type:'حديد', coachId:null, time:'20:00',
        days:['السبت','الثلاثاء'], capacity:10, room:'قاعة الحديد', active:true, notes:'', isDemo:true });
      summary.trainings += 3;
      /* التحاق تجريبي يجعل شاشة الملتحقات والسعة ذات معنى */
      const demoMembers = Repos.members.list().filter(x => x.isDemo);
      for (const tr of Repos.trainings.list().filter(x => x.isDemo)){
        const seats = Math.min(Number(tr.capacity) || 8, Math.max(0, demoMembers.length - 2));
        const picked = [];
        for (let k = 0; k < seats && picked.length < seats; k++){
          const mm = demoMembers[(k * 3 + seats) % demoMembers.length];
          if (mm && !picked.includes(mm.id)) picked.push(mm.id);
        }
        if (picked.length) await Repos.trainings.update(tr.id, { memberIds:picked });
      }

      step = 'أصناف المتجر';
      const catalogue = [
        { name:'بروتين واي 2 كغم', sku:'WP-01', category:'مكمّلات', unit:'علبة', price:45000, cost:30000, minStock:3,  openingQty:14 },
        { name:'كرياتين 300 غم',   sku:'CR-02', category:'مكمّلات', unit:'علبة', price:28000, cost:18000, minStock:3,  openingQty:9 },
        { name:'تيشيرت رياضي',     sku:'TS-03', category:'ملابس',   unit:'قطعة', price:15000, cost:9000,  minStock:6,  openingQty:5 },
        { name:'ليغنز رياضي',      sku:'LG-04', category:'ملابس',   unit:'قطعة', price:22000, cost:14000, minStock:4,  openingQty:12 },
        { name:'قفازات تمرين',     sku:'GL-05', category:'إكسسوارات', unit:'زوج', price:12000, cost:7000, minStock:4,  openingQty:16 },
        { name:'ماء 0.5 لتر',      sku:'WT-06', category:'مشروبات', unit:'قنينة', price:1000,  cost:500,  minStock:24, openingQty:120 },
        { name:'مشروب طاقة',       sku:'EN-07', category:'مشروبات', unit:'علبة', price:3000,  cost:1800,  minStock:12, openingQty:45 }
      ];
      const prods = [];
      for (const c of catalogue){ const { rec } = await Svc.inventory.saveProduct(null, Object.assign({ isDemo:true }, c)); prods.push(rec); summary.products++; }

      step = 'فواتير المتجر';
      const memberList = Repos.members.list().filter(x => x.isDemo);
      for (let i = 0; i < 26; i++){
        const pr = prods[i % prods.length];
        const qty = 1 + Math.floor(rnd()*2);
        const onHand = Svc.inventory.onHand(pr.id);
        if (onHand < qty) continue;                      /* لا نبيع ما ليس موجوداً حتى في العرض التجريبي */
        const total = U.round2(qty * pr.price);
        const partial = i % 6 === 2;
        await Svc.sales.create({ date:D.addDays(today, -Math.floor(rnd()*50)),
          memberId: rnd() > .25 && memberList.length ? pick(memberList).id : null,
          customerName: '', lines:[{ productId:pr.id, qty, unitPrice:pr.price, discount:0 }],
          discount: i % 5 === 0 ? 1000 : 0,
          paidAmount: partial ? U.round2(total * 0.5) : null,
          paymentMethod: rnd() > .85 ? 'بطاقة' : 'نقد', isDemo:true });
        summary.sales++;
      }

      step = 'سجل الحضور';
      for (let d = 0; d < 21; d++){
        const day = D.addDays(today, -d);
        const visitors = 4 + Math.floor(rnd()*7);
        for (let v = 0; v < visitors && memberList.length; v++){
          const mm = memberList[Math.floor(rnd()*memberList.length)];
          if (Svc.attendance.has(mm.id, day, null)) continue;
          const hh = String(8 + Math.floor(rnd()*13)).padStart(2,'0');
          try {
            await Repos.attendance.create({ memberId:mm.id, date:day, time:`${hh}:${rnd()>.5?'30':'00'}`,
              trainingId:null, notes:'', isDemo:true });
            summary.attendance++;
          } catch(e){ /* حضور واحد يفشل لا يُسقط التحميل كله */ }
        }
      }

      /* ------------------- بيانات الإصدار الرابع ------------------- */
      step = 'قياسات وأهداف';
      const fitMembers = memberList.slice(0, Math.min(14, memberList.length));
      for (let i = 0; i < fitMembers.length; i++){
        const mm = fitMembers[i];
        const w0 = 62 + Math.floor(rnd()*26), h = 155 + Math.floor(rnd()*20);
        const readings = 2 + Math.floor(rnd()*3);
        for (let k = 0; k < readings; k++){
          const when = D.addDays(today, -(readings - k) * 30 - Math.floor(rnd()*6));
          await Svc.measure.addBatch(mm.id, when, {
            weight: U.round2(w0 - k * (rnd()*1.6)), height: h,
            waist: U.round2(84 - k * (rnd()*1.2)), fat: U.round2(31 - k * (rnd()*0.9))
          }, k === 0 ? 'قياس أوّلي عند الاشتراك' : '');
          summary.measurements = (summary.measurements||0) + 4;
        }
        if (i % 2 === 0){
          await Svc.goals.save(null, { memberId:mm.id, type:'weight', title:`الوصول إلى ${Math.round(w0 - 5)} كغم`,
            targetValue:Math.round(w0 - 5), unit:'كغم', targetDate:D.addDays(today, 90), isDemo:true });
          summary.goals = (summary.goals||0) + 1;
        }
        if (i % 3 === 0){
          await Svc.docs.save(null, { memberId:mm.id, type:'إقرار صحي', title:'إقرار صحي موقّع',
            issueDate:mm.joinDate, expiryDate:D.addDays(mm.joinDate, 365), isDemo:true }, null);
          summary.documents = (summary.documents||0) + 1;
        }
      }

      step = 'المهتمّات';
      const leadStages = ['new','contacted','trial','converted','lost'];
      for (let i = 0; i < 12; i++){
        const { rec:ld } = await Svc.leads.save(null, {
          name:`${first[(i+5) % first.length]} ${last[(i+4) % last.length]}`,
          phone:'0772'+String(1000000 + Math.floor(rnd()*8999999)),
          source:pick(Settings.get('leadSources')), interest:pick(['لياقة','يوغا','تدريب خاص','تخسيس']),
          followUpDate:D.addDays(today, -3 + Math.floor(rnd()*10)), isDemo:true });
        summary.leads = (summary.leads||0) + 1;
        const stage = leadStages[i % leadStages.length];
        /* المهتمّة المحوّلة تصير مشتركة حقيقية — تُحسب في العدّاد وإلا كذب الملخّص */
        if (stage === 'converted'){ await Svc.leads.convert(ld.id, { isDemo:true }); summary.members++; }
        else if (stage === 'lost') await Svc.leads.setStage(ld.id, 'lost', { reason:pick(Settings.get('lostReasons')) });
        else if (stage !== 'new') await Svc.leads.setStage(ld.id, stage);
      }

      step = 'الحصص المجدولة';
      for (const tr of Repos.trainings.list().filter(x => x.isDemo)){
        const made = await Svc.classes.generateFrom(tr.id, D.addDays(today, -14), D.addDays(today, 14));
        summary.sessions = (summary.sessions||0) + made.length;
        for (const ses of made){
          const cap = Math.max(1, Number(ses.capacity) || 8);
          const want = Math.min(cap + 1, 2 + Math.floor(rnd()*cap));
          const picked = new Set();
          for (let k = 0; k < want; k++){
            const mm = memberList[(k*5 + want + made.indexOf(ses)) % memberList.length];
            if (!mm || picked.has(mm.id)) continue;
            picked.add(mm.id);
            try {
              const bk = await Svc.classes.book(ses.id, mm.id);
              summary.bookings = (summary.bookings||0) + 1;
              /* الحصص الماضية لها نتيجة: حضرت أو لم تحضر */
              if (D.cmp(ses.date, today) < 0 && !bk.waitlisted)
                await Svc.classes.mark(bk.rec.id, rnd() > 0.18 ? 'attended' : 'no_show');
            } catch(e){ /* حجز واحد يفشل لا يُسقط التحميل */ }
          }
        }
      }

      step = 'أرصدة الحصص';
      for (let i = 0; i < Math.min(6, memberList.length); i++){
        await Svc.credits.grant({ memberId:memberList[i*2 % memberList.length].id, kind: i % 3 === 0 ? 'pt' : 'class',
          qty: i % 3 === 0 ? 4 : 8, date:D.addDays(today, -20),
          expiresAt:D.addDays(today, 40 + i*10), notes:'باقة تجريبية', isDemo:true });
        summary.credits = (summary.credits||0) + 1;
      }

      step = 'تجميد اشتراك';
      const freezable = Repos.subs.list().filter(sb => sb.isDemo && D.cmp(sb.endDate, today) >= 0
        && D.cmp(sb.startDate, today) <= 0).slice(0, 2);
      for (const sb of freezable){
        try {
          await Svc.membership.freeze(sb.id, { from:D.addDays(today, -2), to:D.addDays(today, 5), reason:'سفر' });
          summary.freezes = (summary.freezes||0) + 1;
        } catch(e){ /* تداخل أو تاريخ غير صالح: يُتجاوز */ }
      }

      step = 'الوصولات';
      for (const pm of Repos.payments.list().filter(x => x.isDemo).slice(0, 18)){
        try { await Svc.receipts.issue(pm.id); summary.receipts = (summary.receipts||0) + 1; } catch(e){}
      }

      step = 'الموردون';
      for (const nm of ['شركة المكمّلات الحديثة','مخزن الملابس الرياضية','موزّع المشروبات']){
        await Svc.suppliers.save(null, { name:nm, phone:'0773'+String(1000000 + Math.floor(rnd()*8999999)), isDemo:true });
        summary.suppliers = (summary.suppliers||0) + 1;
      }

      step = 'إقفال الصندوق';
      for (let d = 6; d >= 1; d--){
        const day = D.addDays(today, -d);
        const mv = Svc.cashbook.movement(day);
        if (!mv.cashIn && !mv.cashOut) continue;
        const expected = Svc.cashbook.expected(day).expected;
        /* يوم واحد من كل ثلاثة فيه فرق صغير مع تفسيره — هكذا تبدو الحياة فعلاً */
        const off = d % 3 === 0 ? -(500 + Math.floor(rnd()*1500)) : 0;
        try {
          await Svc.cashbook.close({ date:day, countedCash:U.round2(expected + off),
            notes: off ? 'فرق في الصرافة — عُولج في اليوم التالي' : '', isDemo:true });
          summary.cashDays = (summary.cashDays||0) + 1;
        } catch(e){}
      }

      step = 'المتابعات';
      const suggested = Svc.tasks.suggest().slice(0, 10);
      summary.tasks = await Svc.tasks.createSuggested(suggested.map(t => Object.assign({ isDemo:true }, t)));

      await Settings.set({ demoLoaded:true });
      await Audit.log('system','demo',`تحميل بيانات تجريبية: ${summary.members} مشتركة، ${summary.subscriptions} اشتراك، ${summary.sales} فاتورة، ${summary.attendance} حضور، ${summary.leads||0} مهتمّة، ${summary.sessions||0} حصة`);
      return summary;
    } catch(e){
      Log.error('فشل تحميل البيانات التجريبية عند: ' + step, e);
      await rollback();
      await Settings.set({ demoLoaded:false });
      await Audit.log('system','demo-failed',`فشل تحميل البيانات التجريبية عند «${step}» وتم التراجع`);
      throw new AppError(`فشل تحميل البيانات التجريبية عند «${step}» — تم التراجع عن كل ما أُضيف. السبب: ${e.message}`,'DEMO_FAILED', e);
    }
  },
  /* الحذف مع تتبّع ما تعلّق بالبيانات التجريبية (رواتب موظفات تجريبيات، إيرادات اشتراكاتهنّ…) */
  async clearDemo(){
    const marked = {};
    STORE_NAMES.forEach(st => marked[st] = new Set(DB.all(st).filter(r => r.isDemo).map(r => r.id)));
    Repos.payrolls.list(true).forEach(p => { if (marked.staff.has(p.staffId)) marked.payrolls.add(p.id); });
    Repos.expenses.list(true).forEach(e => { if (e.refType === 'payroll' && marked.payrolls.has(e.refId)) marked.expenses.add(e.id); });
    Repos.revenues.list(true).forEach(r => { if (r.refId && (marked.subscriptions.has(r.refId) || marked.sales.has(r.refId))) marked.revenues.add(r.id); });
    /* الدفعات وإيراداتها تتبع مستنداتها، وحركات المخزون تتبع أصنافها وفواتيرها */
    Repos.payments.list(true).forEach(pm => {
      if (marked.subscriptions.has(pm.refId) || marked.sales.has(pm.refId)){
        marked.payments.add(pm.id);
        if (pm.revenueId) marked.revenues.add(pm.revenueId);
      }
    });
    Repos.stockMoves.list(true).forEach(mv => {
      if (marked.products.has(mv.productId) || (mv.refType === 'sale' && marked.sales.has(mv.refId))){
        marked.stockMoves.add(mv.id);
        if (mv.expenseId) marked.expenses.add(mv.expenseId);
      }
    });
    Repos.attendance.list(true).forEach(a => { if (marked.members.has(a.memberId)) marked.attendance.add(a.id); });
    /* جداول الإصدار الرابع: ما يتبع مشتركة تجريبية تجريبيٌّ مثلها، وإن لم يحمل العلم */
    ['measurements','goals','memberDocs','credits'].forEach(st => {
      DB.all(st).forEach(r => { if (marked.members.has(r.memberId)) marked[st].add(r.id); });
    });
    Repos.subEvents.list(true).forEach(e => { if (marked.subscriptions.has(e.subId)) marked.subEvents.add(e.id); });
    Repos.bookings.list(true).forEach(b => {
      if (marked.classSessions.has(b.sessionId) || marked.members.has(b.memberId)) marked.bookings.add(b.id);
    });
    Repos.receipts.list(true).forEach(r => { if (marked.payments.has(r.paymentId)) marked.receipts.add(r.id); });
    Repos.tasks.list(true).forEach(t => {
      if ((t.memberId && marked.members.has(t.memberId)) || (t.refType === 'lead' && marked.leads.has(t.refId))
          || (t.refType === 'booking' && marked.bookings.has(t.refId))) marked.tasks.add(t.id);
    });
    Repos.leads.list(true).forEach(l => { if (l.convertedMemberId && marked.members.has(l.convertedMemberId)) marked.leads.add(l.id); });
    Repos.exercises.list(true).forEach(x => { if (marked.exercises.has(x.id) && x.mediaId) marked.media.add(x.mediaId); });
    let n = 0; const failed = [];
    for (const st of STORE_NAMES)
      for (const id of marked[st]){
        try { if (DB.get(st, id)){ await DB.remove(st, id); n++; } }
        catch(e){ failed.push(`${st}:${id}`); }
      }
    await Settings.set({ demoLoaded:false });
    await Audit.log('system','demo-clear',`حذف ${n} سجلاً تجريبياً${failed.length?` (فشل ${failed.length})`:''}`);
    if (failed.length) throw new AppError(`حُذف ${n} سجلاً لكن تعذّر حذف ${failed.length} سجلاً — أعيدي المحاولة`,'DEMO_CLEAR_PARTIAL', failed);
    return n;
  },
  /* إعادة تهيئة كاملة: لا يعود أي شيء تلقائياً بعدها.
     التحقق يقرأ القرص لا الذاكرة: الذاكرة فُرّغت للتو، فلو اكتفينا بعدّها لأعلنّا
     نجاحاً كاذباً بينما السجلات ما زالت على القرص وتعود عند أول إعادة فتح. */
  async factoryReset(){
    const before = Object.fromEntries(STORE_NAMES.map(st => [st, DB.count(st)]));
    await DB.clearAll();
    const onDisk = {};
    for (const st of STORE_NAMES){
      if (st === 'meta') continue;
      try { onDisk[st] = (await DB.adapter.getAll(st)).length; }
      catch(e){ throw new AppError('تعذّر التحقق من اكتمال إعادة التهيئة — راجعي البيانات قبل المتابعة','RESET_UNVERIFIED', e); }
    }
    const leftovers = STORE_NAMES.filter(st => st !== 'meta' && onDisk[st] > 0);
    if (leftovers.length)
      throw new AppError('لم تكتمل إعادة التهيئة — بقيت سجلات على القرص في: ' + leftovers.join('، '),'RESET_INCOMPLETE', onDisk);
    await DB.put('meta', { k:'schema', v:APP.schema });
    Settings.data = U.clone(DEFAULT_SETTINGS);
    await Settings.set({ initialized:true, demoLoaded:false, memberSeq:0, saleSeq:0, lastBackupAt:null });
    await Audit.log('system','factory-reset',`إعادة تهيئة كاملة — حُذف ${Object.values(before).reduce((a,b)=>a+b,0)} سجلاً`);
    return before;
  }
};


/* ===== src/app/data/70-migrations.js ================================================= */
/* ============================== Migrations ===============================
   ترقية آمنة للبيانات المحفوظة من إصدار سابق. لا تمس أسعار الاشتراكات القديمة. */
const Migrations = {
  async run(){
    const rec = DB.get('meta','schema');
    const hasData = STORE_NAMES.some(st => st !== 'meta' && DB.count(st) > 0);
    let from = rec ? Number(rec.v) : (hasData ? 1 : APP.schema);
    if (!isFinite(from) || from < 1) from = 1;
    const applied = [];
    if (from < 2){ applied.push(await this.v1_to_v2()); }
    if (from < 3){ applied.push(await this.v2_to_v3()); }
    if (from < 4){ applied.push(await this.v3_to_v4()); }
    if (from !== APP.schema || !rec) await DB.put('meta', { k:'schema', v:APP.schema });
    /* من كان عنده بيانات قبل هذا الإصدار يُعتبر مُهيّأً حتى لا تُزرع افتراضيات فوق بياناته */
    const st = DB.get('meta','settings');
    if (hasData && st && st.v && st.v.initialized !== true){
      st.v.initialized = true; await DB.put('meta', st);
    }
    if (applied.length) Log.info('تمت ترقية البيانات', applied);
    return { from, to:APP.schema, applied };
  },
  /* v1: الخطة كانت تحمل months/days/price ⇒ v2: مدة فقط (قيمة + وحدة) */
  async v1_to_v2(){
    let plans = 0, subs = 0;
    for (const p of DB.all('plans')){
      if (DUR.valid(p.durationValue, p.durationUnit)) continue;
      const patch = Number(p.months) > 0 ? { durationValue:Number(p.months), durationUnit:'month' }
                  : Number(p.days) > 0   ? { durationValue:Number(p.days),   durationUnit:'day' }
                  : { durationValue:1, durationUnit:'month' };
      patch.legacyPrice = Number(p.price) || 0;     /* يُحفظ للاطلاع فقط ولا يُستعمل في التسعير */
      await DB.put('plans', Object.assign({}, p, patch));
      plans++;
    }
    for (const sb of DB.all('subscriptions')){
      if (DUR.valid(sb.durationValue, sb.durationUnit)) continue;
      const days = DUR.days(sb.startDate, sb.endDate);
      const patch = { durationValue:days || 1, durationUnit:'day', durationLabel: sb.planName || DUR.label(days||1,'day') };
      /* السعر التاريخي يبقى كما هو تماماً */
      await DB.put('subscriptions', Object.assign({}, sb, patch));
      subs++;
    }
    return `v1→v2: ${plans} مدة، ${subs} اشتراك`;
  },
  /* v2: الاشتراك كان يحمل revenueId واحداً بكامل المبلغ (أي «مدفوع بالكامل» ضمناً)
     ⇒ v3: يصبح لكل إيراد اشتراكٍ دفعةٌ صريحة تقابله.
     القاعدة الحاكمة: لا يتغيّر أي مبلغ. الإيرادات القديمة تبقى كما هي بالضبط،
     ونضيف فقط سطر الدفعة الذي يفسّرها، حتى تتطابق تقارير ما قبل الترقية وما بعدها.
     اشتراك بلا إيراد مسجَّل يُعتبر غير مدفوع — لأن أحداً لم يسجّل قبض مال عليه. */
  async v2_to_v3(){
    let linked = 0, unpaid = 0;
    const existing = new Set(DB.all('payments').map(x => `${x.refType}:${x.refId}`));
    for (const sb of DB.all('subscriptions')){
      if (existing.has('subscription:' + sb.id)) continue;
      const rev = sb.revenueId ? DB.get('revenues', sb.revenueId) : null;
      if (!rev){ if ((Number(sb.finalPrice)||0) > 0) unpaid++; continue; }
      const now = new Date().toISOString();
      const pmt = {
        id:U.uid('pmt'), createdAt:now, updatedAt:now, archived:!!sb.archived,
        refType:'subscription', refId:sb.id, memberId:sb.memberId,
        date: rev.date || sb.startDate, amount: Number(rev.amount) || 0,
        method: rev.method || sb.paymentMethod || 'نقد', notes:'', revenueId: rev.id,
        isDemo: !!(sb.isDemo || rev.isDemo), migrated:true
      };
      await DB.put('payments', pmt);
      await DB.put('revenues', Object.assign({}, rev, { paymentId:pmt.id }));
      linked++;
    }
    return `v2→v3: ${linked} دفعة مستخرجة من الإيرادات${unpaid?`، ${unpaid} اشتراك بلا قبض مسجَّل`:''}`;
  }
};

/* ============================ v3 → v4 =====================================
   الترقية الصحيحة هي التي لا تحتاج أن تلمس التاريخ. كل ما أضافه الإصدار الرابع
   حقولٌ اختيارية وجداول جديدة، والكود يتحمّل غيابها، فلا سبب لإعادة كتابة آلاف
   السجلات القديمة ولا لمس مبلغ واحد.

   ما تفعله هذه الترقية بالضبط:
     · تُطبّع سجلات الحضور القديمة بإعطائها «طريقة التسجيل» و«الحالة» الافتراضية،
       لأن الشاشات الجديدة تُصنّف الحضور بهما.
     · تُحوّل «حصص» الإصدار السابق إلى قوالب متكرّرة صراحةً (kind:'template')
       مع إبقاء قائمة الملتحقات كما هي — القالب يبقى، والمواعيد المؤرَّخة تُولَّد منه.
     · تُنشئ تعريفات الحقول الإضافية الافتراضية إن لم يعرّف النادي شيئاً بعد.
   ولا تفعل شيئاً آخر: لا أسعار، ولا دفعات، ولا إيرادات.
   ========================================================================== */
Migrations.v3_to_v4 = async function(){
  let att = 0, tpl = 0;
  for (const a of DB.all('attendance')){
    if (a.method && a.status) continue;
    await DB.put('attendance', Object.assign({}, a, {
      method: a.method || 'staff', status: a.status || 'in', checkOut: a.checkOut || null }));
    att++;
  }
  for (const t of DB.all('trainings')){
    if (t.kind) continue;
    await DB.put('trainings', Object.assign({}, t, { kind:'template' }));
    tpl++;
  }
  return `v3→v4: ${att} سجل حضور، ${tpl} قالب حصة`;
};


/* ===== src/app/data/80-integrity.js ================================================== */
/* ============================== Integrity ================================
   فحص العلاقات: سجلات يتيمة أو روابط مكسورة. يُستعمل في الإعدادات وفي الاختبارات. */
const Integrity = {
  scan(){
    const issues = [];
    const has = (st, id) => !!DB.get(st, id);
    /* المؤرشف مستبعَد: أرشفته قرار إداري وليس خللاً */
    DB.all('subscriptions').filter(x => !x.archived).forEach(s => {
      if (!has('members', s.memberId)) issues.push({ type:'اشتراك بلا مشتركة', id:s.id, fix:'archiveSub' });
      if (s.revenueId && !has('revenues', s.revenueId)) issues.push({ type:'اشتراك يشير إلى إيراد محذوف', id:s.id, fix:'clearRevenueLink' });
    });
    DB.all('revenues').filter(x => !x.archived).forEach(r => {
      if (r.source === 'subscription' && r.refId && !has('subscriptions', r.refId)) issues.push({ type:'إيراد اشتراك محذوف', id:r.id, fix:'archiveRevenue' });
    });
    DB.all('payrolls').forEach(p => {
      if (!has('staff', p.staffId)) issues.push({ type:'كشف راتب بلا موظفة', id:p.id, fix:'deletePayroll' });
      if (p.expenseId && !has('expenses', p.expenseId) && p.status === 'paid') issues.push({ type:'راتب مدفوع بلا مصروف', id:p.id, fix:'unpay' });
    });
    DB.all('expenses').forEach(e => {
      if (e.refType === 'payroll' && !has('payrolls', e.refId)) issues.push({ type:'مصروف راتب بلا كشف', id:e.id, fix:'unlinkExpense' });
      if (e.refType === 'stock' && !has('stockMoves', e.refId)) issues.push({ type:'مصروف شراء بلا حركة مخزون', id:e.id, fix:'unlinkExpense' });
    });
    DB.all('exercises').forEach(x => {
      if (x.mediaId && !has('media', x.mediaId)) issues.push({ type:'تمرين يشير إلى وسائط محذوفة', id:x.id, fix:'clearMediaLink' });
    });
    /* المقبوضات: كل دفعة يجب أن تعود إلى مستند حقيقي وإلى سطر إيراد واحد */
    DB.all('payments').forEach(pm => {
      const doc = pm.refType === 'sale' ? has('sales', pm.refId) : has('subscriptions', pm.refId);
      if (!doc) issues.push({ type:'دفعة بلا مستند', id:pm.id, fix:'deletePayment' });
      else if (pm.revenueId && !has('revenues', pm.revenueId)) issues.push({ type:'دفعة بلا سطر إيراد', id:pm.id, fix:'repostPayment' });
      else if (!pm.revenueId) issues.push({ type:'دفعة بلا سطر إيراد', id:pm.id, fix:'repostPayment' });
    });
    DB.all('revenues').forEach(r => {
      if (r.paymentId && !has('payments', r.paymentId)) issues.push({ type:'إيراد لدفعة محذوفة', id:r.id, fix:'deleteRevenue' });
    });
    /* قبض أكبر من المستحق: يضخّم الإيراد بلا سند */
    const payIdx = Svc.payments.indexBy('subscription');
    DB.all('subscriptions').filter(x=>!x.archived).forEach(sb => {
      if (U.round2(payIdx[sb.id] || 0) > U.round2(Number(sb.finalPrice)||0) + 0.001)
        issues.push({ type:'اشتراك مقبوض أكثر من سعره', id:sb.id, fix:'none' });
    });
    /* المخزون: كمية سالبة أو حركة بلا صنف */
    DB.all('stockMoves').forEach(mv => {
      if (!has('products', mv.productId)) issues.push({ type:'حركة مخزون بلا صنف', id:mv.id, fix:'deleteStockMove' });
    });
    DB.all('sales').filter(x=>!x.archived).forEach(sl => {
      if (sl.memberId && !has('members', sl.memberId)) issues.push({ type:'فاتورة بيع بمشتركة محذوفة', id:sl.id, fix:'clearSaleMember' });
    });
    DB.all('attendance').forEach(a => {
      if (!has('members', a.memberId)) issues.push({ type:'حضور بلا مشتركة', id:a.id, fix:'deleteAttendance' });
    });
    DB.all('trainings').forEach(t => {
      if ((t.memberIds||[]).some(id => !has('members', id)))
        issues.push({ type:'حصة تضم مشتركات محذوفات', id:t.id, fix:'pruneEnrollment' });
    });
    /* --- جداول الإصدار الرابع: كل سجل تابع يجب أن يجد صاحبه --- */
    [['measurements','قياس'],['goals','هدف'],['memberDocs','مستند'],['credits','رصيد حصص']].forEach(([store, label]) => {
      DB.all(store).forEach(r => {
        if (!has('members', r.memberId)) issues.push({ type:`${label} بلا مشتركة`, id:r.id, fix:'deleteOrphan', store });
      });
    });
    DB.all('subEvents').forEach(e => {
      if (!has('subscriptions', e.subId)) issues.push({ type:'حدث اشتراك بلا اشتراك', id:e.id, fix:'deleteOrphan', store:'subEvents' });
    });
    DB.all('bookings').forEach(b => {
      if (!has('classSessions', b.sessionId)) issues.push({ type:'حجز بلا حصة', id:b.id, fix:'deleteOrphan', store:'bookings' });
      else if (!has('members', b.memberId)) issues.push({ type:'حجز بلا مشتركة', id:b.id, fix:'deleteOrphan', store:'bookings' });
    });
    /* وصل يشير إلى دفعة مُلغاة: الوصل وثيقة تاريخية تبقى، لكن يجب أن يُعلَم أنه مُبطَل */
    DB.all('receipts').forEach(r => {
      if (r.paymentId && !has('payments', r.paymentId) && !r.voided)
        issues.push({ type:'وصل لدفعة ملغاة', id:r.id, fix:'voidReceipt' });
    });
    /* «غير مستعملة» تعني: لا يشير إليها أي كيان ولا الهوية البصرية. الاكتفاء بفحص
       التمارين وحدها كان سيصنّف شعار النادي ولافتته وصور المشتركات وسائطَ يتيمة
       ثم يحذفها الإصلاح التلقائي. */
    DB.all('media').forEach(m => {
      if (!Svc.media.usedBy(m.id).length) issues.push({ type:'وسائط غير مستعملة', id:m.id, fix:'deleteMedia' });
    });
    DB.all('subscriptions').forEach(s => {
      if (!D.isISO(s.startDate) || !D.isISO(s.endDate) || D.cmp(s.endDate, s.startDate) < 0)
        issues.push({ type:'اشتراك بتواريخ غير منطقية', id:s.id, fix:'none' });
    });
    return issues;
  },
  /* إصلاح آمن: يحذف اليتيم ويفك الروابط المكسورة فقط، ولا يمس بيانات سليمة */
  async repair(){
    const issues = this.scan();
    let fixed = 0;
    for (const it of issues){
      try {
        if (it.fix === 'clearRevenueLink'){ await Repos.subs.update(it.id, { revenueId:null }); fixed++; }
        else if (it.fix === 'clearMediaLink'){ await Repos.exercises.update(it.id, { mediaId:null }); fixed++; }
        else if (it.fix === 'unlinkExpense'){ await Repos.expenses.update(it.id, { refType:null, refId:null }); fixed++; }
        else if (it.fix === 'deleteMedia'){ await DB.remove('media', it.id); fixed++; }
        else if (it.fix === 'deletePayroll'){ await DB.remove('payrolls', it.id); fixed++; }
        else if (it.fix === 'archiveSub'){ await Repos.subs.archive(it.id, true); fixed++; }
        else if (it.fix === 'archiveRevenue'){ await Repos.revenues.archive(it.id, true); fixed++; }
        else if (it.fix === 'unpay'){ await Repos.payrolls.update(it.id, { status:'draft', paidDate:null, expenseId:null }); fixed++; }
        else if (it.fix === 'deletePayment'){ await Svc.payments.remove(it.id); fixed++; }
        else if (it.fix === 'deleteRevenue'){ await DB.remove('revenues', it.id); fixed++; }
        else if (it.fix === 'deleteStockMove'){ await DB.remove('stockMoves', it.id); fixed++; }
        else if (it.fix === 'deleteAttendance'){ await DB.remove('attendance', it.id); fixed++; }
        else if (it.fix === 'clearSaleMember'){ await Repos.sales.update(it.id, { memberId:null }); fixed++; }
        else if (it.fix === 'deleteOrphan'){ await DB.remove(it.store, it.id); fixed++; }
        else if (it.fix === 'voidReceipt'){
          await Repos.receipts.update(it.id, { voided:true, voidedAt:new Date().toISOString(), voidReason:'أُلغيت الدفعة المرتبطة' });
          fixed++;
        }
        else if (it.fix === 'pruneEnrollment'){
          const t = Repos.trainings.get(it.id);
          if (t){ await Repos.trainings.update(it.id, { memberIds:(t.memberIds||[]).filter(id => !!DB.get('members', id)) }); fixed++; }
        }
        /* إعادة ترحيل دفعة فقدت سطر إيرادها — يعيد المبلغ إلى المالية بلا تكرار */
        else if (it.fix === 'repostPayment'){
          const pm = Repos.payments.get(it.id);
          if (pm){
            const m = pm.memberId ? Repos.members.get(pm.memberId) : null;
            const rev = await Repos.revenues.create({ date:pm.date, amount:pm.amount,
              source: pm.refType === 'sale' ? 'product' : 'subscription', refId:pm.refId, paymentId:pm.id,
              description:`${Svc.payments.REF_LABEL[pm.refType]||''}${m?' — '+m.name:''} (إعادة ترحيل)`,
              method:pm.method, notes:'', archived:!!pm.archived });
            await Repos.payments.update(it.id, { revenueId:rev.id });
            fixed++;
          }
        }
      } catch(e){ Log.warn('تعذّر إصلاح سجل', e); }
    }
    if (fixed) await Audit.log('system','repair',`إصلاح ${fixed} رابط/سجل غير متسق`);
    return { found:issues.length, fixed };
  }
};

const svg = (p, sz=18, sw=1.8) =>
  `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

const UI = {
  /* ------------------------------- Toast ------------------------------- */
  toast(msg, kind='ok', ms=3400){
    const root = document.getElementById('toastRoot');
    const el = document.createElement('div');
    el.className = 'toast ' + kind;
    el.innerHTML = `${svg(kind==='err'?ICON.trash:kind==='warn'?ICON.clock:ICON.check,16,2.2)}<span>${U.esc(msg)}</span>`;
    root.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(), 260); }, ms);
  },
  /* ------------------------------- Modal ------------------------------- */
  stack: [],
  modal({ title, body, footer, size='', onMount, onClose }){
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${U.esc(title)}">
      <div class="modal-head"><h3>${U.esc(title)}</h3><div class="sp"></div>
        <button class="btn btn-ghost btn-icon" data-close aria-label="إغلاق">✕</button></div>
      <div class="modal-body">${body||''}</div>
      ${footer===null?'':`<div class="modal-foot">${footer||'<div class="sp"></div><button class="btn" data-close>إغلاق</button>'}</div>`}
    </div>`;
    document.getElementById('modalRoot').appendChild(ov);
    const handle = { el:ov, closed:false,
      close(){ if (this.closed) return; this.closed = true;
        ov.remove(); UI.stack = UI.stack.filter(x=>x!==handle); if(onClose) onClose(); } };
    ov.addEventListener('click', e => { if (e.target === ov) handle.close(); });
    ov.querySelectorAll('[data-close]').forEach(b => b.onclick = () => handle.close());
    UI.stack.push(handle);
    if (onMount) onMount(ov, handle);
    const first = ov.querySelector('input:not([type=hidden]),select,textarea');
    if (first) setTimeout(()=>first.focus(), 40);
    return handle;
  },
  /* القرار يُحسم مرة واحدة فقط: الضغط على «تأكيد» يضبط النتيجة قبل الإغلاق،
     حتى لا يسبقه onClose ويعيد false (كان هذا سبب تعطّل كل العمليات المؤكَّدة). */
  confirm({ title='تأكيد', message='', confirmText='تأكيد', danger=false, extra='' }){
    return new Promise(res => {
      let settled = false;
      const finish = v => { if (!settled){ settled = true; res(v); } };
      const h = UI.modal({ title, size:'narrow',
        body:`<div style="margin:0 0 4px">${message}</div>${extra}`,
        footer:`<button class="btn ${danger?'btn-danger':'btn-primary'}" data-ok>${U.esc(confirmText)}</button>
                <button class="btn" data-close>إلغاء</button><div class="sp"></div>`,
        onMount(ov){ ov.querySelector('[data-ok]').onclick = () => { finish(true); h.close(); }; },
        onClose(){ finish(false); } });
    });
  },
  /* سؤال بخيارين صريحين يرجع مفتاح الخيار المختار أو null */
  choice({ title, message, options, size='narrow' }){
    return new Promise(res => {
      let settled = false;
      const finish = v => { if (!settled){ settled = true; res(v); } };
      const h = UI.modal({ title, size, body:`<div>${message}</div>`,
        footer: options.map((o,i) => `<button class="btn ${o.primary?'btn-primary':''}" data-opt="${i}">${U.esc(o.label)}</button>`).join('') + '<div class="sp"></div>',
        onMount(ov){ ov.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => { finish(options[Number(b.dataset.opt)].key); h.close(); }); },
        onClose(){ finish(null); } });
    });
  },
  /* ------------------------------ Elements ----------------------------- */
  chip(st){ return `<span class="chip ${st.cls}"><span class="dot"></span>${st.ar}</span>`; },
  empty(title, msg, actionHtml=''){
    return `<div class="empty">${svg(ICON.box, 42, 1.2)}<h4>${U.esc(title)}</h4><p>${U.esc(msg)}</p>${actionHtml}</div>`;
  },
  avatar(name, lg=false){
    const t = U.norm(name).split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('');
    return `<div class="avatar${lg?' lg':''}">${U.esc(t||'؟')}</div>`;
  },
  money(v, colorize=false){
    const cls = colorize ? (v>0?'money-pos':v<0?'money-neg':'') : '';
    return `<span class="num ${cls}">${Money.fmt(v)}</span>`;
  },
  /* ------------------------------- Table -------------------------------
     cols: [{h, render(row), sort:key|fn, cls, w}]  state: {page,pageSize,sort:{k,d}} */
  table(container, { cols, rows, state, empty, onSort, onPage, rowCls }){
    if (!rows.length){ container.innerHTML = empty || UI.empty('لا توجد بيانات', 'ابدئي بإضافة سجل جديد'); return; }
    const ps = state.pageSize || 25;
    const pages = Math.max(1, Math.ceil(rows.length / ps));
    const page = Math.min(Math.max(1, state.page || 1), pages);
    state.page = page;
    const slice = rows.slice((page-1)*ps, page*ps);
    const th = cols.map((c,i) => `<th class="${c.cls||''} ${c.sort?'sortable':''}" ${c.sort?`data-sort="${i}"`:''} ${c.w?`style="width:${c.w}"`:''}>
        ${U.esc(c.h)}${state.sort && state.sort.i === i ? (state.sort.d === 1 ? ' ▲' : ' ▼') : ''}</th>`).join('');
    const body = slice.map(r => `<tr class="${rowCls?rowCls(r):''}">${cols.map(c => `<td class="${c.cls||''}">${c.render(r)}</td>`).join('')}</tr>`).join('');
    container.innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>
      <div class="pager"><span>عرض ${(page-1)*ps+1}–${Math.min(page*ps, rows.length)} من ${rows.length}</span><span class="sp"></span>
        <button class="btn btn-sm" data-pg="${page-1}" ${page<=1?'disabled':''}>السابق</button>
        <span>صفحة ${page} من ${pages}</span>
        <button class="btn btn-sm" data-pg="${page+1}" ${page>=pages?'disabled':''}>التالي</button></div>`;
    container.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => { state.page = Number(b.dataset.pg); onPage ? onPage() : UI.table(container, { cols, rows, state, empty, onSort, onPage, rowCls }); });
    container.querySelectorAll('[data-sort]').forEach(t => t.onclick = () => {
      const i = Number(t.dataset.sort);
      state.sort = (state.sort && state.sort.i === i) ? { i, d:-state.sort.d } : { i, d:1 };
      state.page = 1; onSort && onSort(cols[i].sort, state.sort.d);
    });
  },
  /* ------------------------------- Forms ------------------------------- */
  field(name, label, input, hint){
    return `<div class="field" data-field="${name}"><label for="f_${name}">${U.esc(label)}</label>${input}
      ${hint?`<span class="hint">${U.esc(hint)}</span>`:''}<span class="err"></span></div>`;
  },
  input(name, val='', opts={}){
    const a = Object.entries(opts.attrs||{}).map(([k,v])=>`${k}="${U.esc(v)}"`).join(' ');
    return `<input class="inp" id="f_${name}" name="${name}" type="${opts.type||'text'}" value="${U.esc(val)}" ${opts.placeholder?`placeholder="${U.esc(opts.placeholder)}"`:''} ${a}>`;
  },
  select(name, val, options, opts={}){
    const o = options.map(x => `<option value="${U.esc(x.v)}" ${String(x.v)===String(val)?'selected':''}>${U.esc(x.t)}</option>`).join('');
    return `<select class="inp" id="f_${name}" name="${name}" ${opts.attrs||''}>${o}</select>`;
  },
  textarea(name, val=''){ return `<textarea class="inp" id="f_${name}" name="${name}">${U.esc(val)}</textarea>`; },
  read(scope){
    const out = {};
    scope.querySelectorAll('[name]').forEach(el => {
      if (el.type === 'checkbox') out[el.name] = el.checked;
      else out[el.name] = el.value;
    });
    return out;
  },
  showErrors(scope, errors){
    scope.querySelectorAll('.field .err').forEach(e => e.textContent = '');
    scope.querySelectorAll('.inp').forEach(e => e.removeAttribute('aria-invalid'));
    let first = null;
    Object.entries(errors||{}).forEach(([k,msg]) => {
      const f = scope.querySelector(`[data-field="${k}"]`);
      if (f){ f.querySelector('.err').textContent = msg; const i = f.querySelector('.inp'); if(i){ i.setAttribute('aria-invalid','true'); first = first||i; } }
      else UI.toast(msg,'err');
    });
    if (first) first.focus();
  },
  /* ------------------------------- Charts ------------------------------ */
  barChart(items, opts={}){        /* items: [{label, values:[..]}] */
    const H = opts.height||210, W = 700, pad = { t:14, r:8, b:26, l:56 };
    const series = opts.series || [{ name:'', color:'var(--rose-600)' }];
    const data = [...items].reverse();                     /* الأحدث إلى اليمين ← ترتيب عربي */
    const max = Math.max(1, ...data.flatMap(d => d.values));
    const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
    const gw = iw / Math.max(1, data.length), bw = Math.min(34, gw / (series.length + .8));
    const ticks = 4, grid = Array.from({length:ticks+1}, (_,i) => {
      const y = pad.t + ih - (ih*i/ticks), v = max*i/ticks;
      return `<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="var(--line-2)"/>
              <text x="${W-pad.r+2}" y="${y+4}" text-anchor="start">${Money.short(v)}</text>`; }).join('');
    const bars = data.map((d,i) => {
      const gx = pad.l + i*gw;
      return d.values.map((v,si) => {
        const h = Math.max(0, (v/max) * ih), x = gx + gw/2 - (series.length*bw)/2 + si*bw;
        return `<rect x="${x}" y="${pad.t+ih-h}" width="${bw-3}" height="${h}" rx="3" fill="${series[si].color}">
                  <title>${U.esc(d.label)} — ${Money.fmt(v)}</title></rect>`;
      }).join('') + `<text x="${gx+gw/2}" y="${H-8}" text-anchor="middle">${U.esc(d.label)}</text>`;
    }).join('');
    const legend = series.filter(s=>s.name).map(s => `<span><i style="background:${s.color}"></i>${U.esc(s.name)}</span>`).join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">${grid}${bars}</svg>
            ${legend?`<div class="legend">${legend}</div>`:''}`;
  },
  /* opts.baseline:'auto' يقيس المحور على مدى القيم نفسها بدل تثبيته عند الصفر.
     المال يبدأ من الصفر دائماً، أما وزن بين 58 و63 فيظهر خطاً مسطّحاً بلا معنى
     لو بدأ المحور من الصفر — والرسم كلّه إنما وُضع لإظهار هذا الفرق.
     opts.fmt يستبدل تنسيق العملة بوحدة القياس. */
  lineChart(items, opts={}){
    const H = opts.height||200, W = 700, pad = { t:14, r:10, b:26, l:56 };
    const data = [...items].reverse();
    const vals = data.map(d=>d.value);
    const fmt = opts.fmt || Money.fmt;
    const short = opts.fmt ? opts.fmt : Money.short;
    let max = Math.max(1, ...vals), min = Math.min(0, ...vals);
    if (opts.baseline === 'auto' && vals.length){
      const lo = Math.min(...vals), hi = Math.max(...vals);
      const padding = (hi - lo) * 0.18 || Math.max(1, hi * 0.05);
      min = lo - padding; max = hi + padding;
    }
    const iw = W-pad.l-pad.r, ih = H-pad.t-pad.b;
    const X = i => pad.l + (data.length<2 ? iw/2 : iw*i/(data.length-1));
    const Y = v => pad.t + ih - ((v-min)/((max-min)||1))*ih;
    const pts = data.map((d,i)=>`${X(i)},${Y(d.value)}`).join(' ');
    const grid = Array.from({length:5}, (_,i) => { const y = pad.t + ih - ih*i/4, v = min + (max-min)*i/4;
      return `<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="var(--line-2)"/><text x="${W-pad.r+2}" y="${y+4}">${short(U.round2(v))}</text>`; }).join('');
    const dots = data.map((d,i)=>`<circle cx="${X(i)}" cy="${Y(d.value)}" r="3.4" fill="var(--rose-600)"><title>${U.esc(d.label)} — ${fmt(d.value)}</title></circle>`).join('');
    const labels = data.map((d,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${U.esc(d.label)}</text>`).join('');
    const zero = (min<0) ? `<line x1="${pad.l}" y1="${Y(0)}" x2="${W-pad.r}" y2="${Y(0)}" stroke="var(--muted)" stroke-dasharray="3 3"/>` : '';
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">${grid}${zero}
      <polyline points="${pts}" fill="none" stroke="var(--rose-600)" stroke-width="2.4" stroke-linejoin="round"/>${dots}${labels}</svg>`;
  },
  donut(items, opts={}){          /* items: [{label, value, color}] */
    const total = U.sum(items, x=>x.value);
    const S = 168, R = 66, C = S/2, sw = 24;
    if (!total) return UI.empty('لا توجد بيانات', 'لم تُسجّل مبالغ في هذه الفترة');
    let acc = 0;
    const circ = 2*Math.PI*R;
    const arcs = items.map(it => {
      const frac = it.value/total, dash = `${circ*frac} ${circ*(1-frac)}`, off = circ*(1-acc);
      acc += frac;
      return `<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="${it.color}" stroke-width="${sw}"
        stroke-dasharray="${dash}" stroke-dashoffset="${off}" transform="rotate(-90 ${C} ${C})"><title>${U.esc(it.label)} — ${Money.fmt(it.value)}</title></circle>`;
    }).join('');
    const legend = items.map(it => `<span><i style="background:${it.color}"></i>${U.esc(it.label)} — <span class="num">${U.pct(it.value,total)}%</span></span>`).join('');
    return `<div class="row" style="gap:22px;align-items:center">
      <svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" role="img">${arcs}
        <text x="${C}" y="${C-2}" text-anchor="middle" style="font-size:13px;fill:var(--muted)">الإجمالي</text>
        <text x="${C}" y="${C+18}" text-anchor="middle" style="font-size:15px;font-weight:700;fill:var(--ink)">${Money.short(total)}</text></svg>
      <div class="legend" style="flex-direction:column;gap:8px">${legend}</div></div>`;
  },
  PALETTE:['#C43E6B','#432C4C','#157F63','#B98A2E','#3A63A8','#DB5C86','#7A6E82','#B4353F','#2E8B8B','#8E5FA8'],
  /* ------------------------------ Export ------------------------------- */
  download(blob, filename){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1200);
  },
  /* نافذة طباعة مستقلة: A4، ترويسة متكررة للجداول، وصفوف لا تنقطع في منتصفها */
  printSection(title, html, opts={}){
    const w = window.open('', '_blank');
    if (!w){ UI.toast('المتصفح منع فتح نافذة الطباعة — اسمحي بالنوافذ المنبثقة','warn', 6000); return null; }
    const css = document.querySelector('style').textContent;
    const head = opts.plain ? '' : `<div class="print-banner">
        <strong>${U.esc(Settings.get('gymName'))} — ${U.esc(title)}</strong>
        <span>${U.esc(D.fmt(D.today()))}</span></div>`;
    w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${U.esc(title)}</title>
      <style>${css}
        @page { size:${opts.landscape ? 'A4 landscape' : 'A4'}; margin:14mm 12mm; }
        body{background:#fff;margin:0;padding:0}
        .print-wrap{padding:0}
        .print-banner{display:flex;justify-content:space-between;align-items:baseline;
          border-bottom:2px solid var(--plum-900);padding-bottom:8px;margin-bottom:14px;font-size:15px}
        table{page-break-inside:auto} thead{display:table-header-group} tfoot{display:table-footer-group}
        tr{page-break-inside:avoid;break-inside:avoid}
        .rep-sec{page-break-inside:auto} .rep-h,h3,h4{page-break-after:avoid}
        .card{box-shadow:none}
      </style></head><body><div class="print-wrap">${head}${html}</div>
      <script>window.onload=function(){setTimeout(function(){window.print();},350);}<\/script></body></html>`);
    w.document.close();
    return w;
  },
};


/* ===== src/app/ui/05-brand.js ======================================================== */
/* ============================== الهوية البصرية ===========================
   الشعار واللافتة يُخزَّنان في جدول الوسائط، ولا تُحفظ في الإعدادات إلا
   معرّفاتهما. الفائدة ليست تنظيمية فقط: هكذا يدخلان النسخة الاحتياطية
   والاستعادة والترقية تلقائياً، بلا آلية تخزين ثانية تُصان على حدة.

   كل شيء هنا يعمل بلا شعار: الطباعة لا تنكسر لأن صورة غير موجودة. */
const Brand = {
  get(){ return Object.assign({ logoMediaId:null, bannerMediaId:null, subtitle:'', phone:'', address:'', instagram:'', footer:'', accent:'' },
                              Settings.get('branding') || {}); },
  name(){ return Settings.get('gymName') || APP.name; },
  media(kind){
    const id = this.get()[kind === 'banner' ? 'bannerMediaId' : 'logoMediaId'];
    return id ? Repos.media.get(id) : null;
  },
  has(kind){ return !!this.media(kind); },
  dataUrl(kind){ const m = this.media(kind); return m ? m.dataUrl : null; },

  /* الشعار للشاشة أو للطباعة. بلا شعار: العلامة المرسومة المدمجة — لا مربع مكسور. */
  logoHtml(size=40, forPrint=false){
    const url = this.dataUrl('logo');
    if (url) return `<img class="brand-logo" src="${U.esc(url)}" alt="${U.esc(this.name())}"
      style="width:${size}px;height:${size}px;object-fit:contain;display:block">`;
    return `<svg class="brand-mark" width="${size}" height="${size}" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="19" fill="${forPrint ? '#432C4C' : '#C43E6B'}"/>
      <rect x="8" y="18" width="24" height="4" rx="2" fill="#fff"/>
      <rect x="6" y="14" width="5" height="12" rx="2.5" fill="#FDF4F7"/>
      <rect x="29" y="14" width="5" height="12" rx="2.5" fill="#FDF4F7"/></svg>`;
  },
  /* اللافتة العريضة: تُقصّ ولا تُمطّ، ولا تظهر أصلاً إن لم تُرفع */
  bannerHtml(){
    const url = this.dataUrl('banner');
    if (!url) return '';
    return `<div class="brand-banner" role="img" aria-label="لافتة ${U.esc(this.name())}"
      style="background-image:url('${U.esc(url)}')"></div>`;
  },
  contactLine(){
    const b = this.get();
    return [b.phone, b.address, b.instagram ? '@' + String(b.instagram).replace(/^@/, '') : ''].filter(x => U.norm(x)).join(' — ');
  },
  /* ترويسة موحّدة لكل مستند مطبوع */
  printHeader(title, sub){
    const b = this.get();
    return `<div class="doc-head">
      <div class="doc-head-brand">${this.logoHtml(54, true)}
        <div><strong>${U.esc(this.name())}</strong>
          ${b.subtitle ? `<span>${U.esc(b.subtitle)}</span>` : ''}
          ${this.contactLine() ? `<span>${U.esc(this.contactLine())}</span>` : ''}</div></div>
      <div class="doc-head-meta"><strong>${U.esc(title)}</strong>
        ${sub ? `<span>${U.esc(sub)}</span>` : ''}
        <span class="num">${U.esc(D.fmt(D.today()))}</span></div></div>`;
  },
  async setMedia(kind, file){
    const key = kind === 'banner' ? 'bannerMediaId' : 'logoMediaId';
    const prev = this.get()[key];
    const saved = await Svc.media.saveFile(file);
    try { await Settings.set({ branding:Object.assign({}, this.get(), { [key]:saved.id }) }); }
    catch(e){ await Svc.media.remove(saved.id).catch(() => {}); throw e; }
    if (prev && prev !== saved.id) await Svc.media.removeIfUnused(prev);
    this.applyToShell();
    await Audit.log('settings','branding',`تحديث ${kind === 'banner' ? 'لافتة' : 'شعار'} النادي`);
    return saved;
  },
  async clearMedia(kind){
    const key = kind === 'banner' ? 'bannerMediaId' : 'logoMediaId';
    const prev = this.get()[key];
    if (!prev) return null;
    await Settings.set({ branding:Object.assign({}, this.get(), { [key]:null }) });
    await Svc.media.removeIfUnused(prev);
    this.applyToShell();
    await Audit.log('settings','branding',`إزالة ${kind === 'banner' ? 'لافتة' : 'شعار'} النادي`);
    return true;
  },
  /* تطبيق الهوية على هيكل الصفحة: الشعار في الشريط الجانبي والوصف تحته */
  applyToShell(){
    const mark = document.querySelector('.brand-mark, .brand-logo');
    if (mark){
      const holder = document.createElement('div');
      holder.innerHTML = this.logoHtml(38);
      const el = holder.firstElementChild;
      if (el){ el.classList.add(this.has('logo') ? 'brand-logo' : 'brand-mark'); mark.replaceWith(el); }
    }
    const nameEl = document.getElementById('brandName');
    if (nameEl) nameEl.textContent = this.name();
    const subEl = nameEl && nameEl.nextElementSibling;
    if (subEl) subEl.textContent = this.get().subtitle || 'نظام إدارة النادي';
    document.title = `${this.name()} — نظام الإدارة`;
  },
  async saveDetails(d){
    const b = Object.assign({}, this.get(), {
      subtitle:U.norm(d.subtitle), phone:U.norm(d.phone), address:U.norm(d.address),
      instagram:U.norm(d.instagram).replace(/^@/, ''), footer:U.norm(d.footer) });
    await Settings.set({ branding:b });
    await Audit.log('settings','branding','تحديث بيانات الهوية البصرية');
    return b;
  }
};


/* ===== src/app/ui/10-exporter.js ===================================================== */
/* ============================================================================
   Exporter — تصدير حقيقي بلا مكتبات خارجية
   ZIP (بلا ضغط) → XLSX و DOCX، إضافة إلى CSV وطباعة منسّقة.
   قاعدة: «تصدير بيانات» شيء و«تقرير» شيء آخر — لكل منهما مسار مستقل.
   ============================================================================ */
const Exporter = (() => {
  /* ------------------------------ CRC32 + ZIP ------------------------------ */
  const CRC = (() => { const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++){ let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[i] = c >>> 0; }
    return buf => { let c = 0xFFFFFFFF; for (let i = 0; i < buf.length; i++) c = t[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  })();
  const enc = new TextEncoder();
  function zip(files){                       /* files: [{name, text}] */
    const chunks = [], central = [];
    let offset = 0;
    const u16 = n => [n & 255, (n>>8) & 255];
    const u32 = n => [n & 255, (n>>8) & 255, (n>>16) & 255, (n>>24) & 255];
    files.forEach(f => {
      const nameB = enc.encode(f.name), data = enc.encode(f.text), crc = CRC(data);
      const local = [...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0),
        ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nameB.length), ...u16(0)];
      chunks.push(new Uint8Array(local), nameB, data);
      central.push({ crc, size:data.length, nameB, offset });
      offset += local.length + nameB.length + data.length;
    });
    const dirStart = offset; let dirSize = 0;
    central.forEach(c => {
      const h = [...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0),
        ...u32(c.crc), ...u32(c.size), ...u32(c.size), ...u16(c.nameB.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
        ...u32(0), ...u32(c.offset)];
      chunks.push(new Uint8Array(h), c.nameB);
      dirSize += h.length + c.nameB.length;
    });
    chunks.push(new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length),
      ...u32(dirSize), ...u32(dirStart), ...u16(0)]));
    return new Blob(chunks, { type:'application/octet-stream' });
  }
  const xesc = s => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');

  /* --------------------------------- XLSX ---------------------------------
     الأعمدة: {h, key, type:'text'|'number'|'date', w}
     التواريخ تُكتب نصاً بصيغة dd/mm/yyyy مع عرض عمود كافٍ — هذا يمنع ظهور ####
     الذي يحدث حين يحوّل Excel القيمة إلى تاريخ رقمي في عمود ضيّق. */
  function sheetXml(cols, rows, title){
    const colsXml = `<cols>${cols.map((c,i) => `<col min="${i+1}" max="${i+1}" width="${c.w || Math.max(12, String(c.h).length + 6)}" customWidth="1"/>`).join('')}</cols>`;
    const cell = (v, type, ref, styleNum) => {
      if (type === 'number'){ const n = Number(v); return `<c r="${ref}" s="${styleNum}"><v>${isFinite(n) ? n : 0}</v></c>`; }
      return `<c r="${ref}" t="inlineStr" s="${styleNum}"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;
    };
    const colRef = i => { let s = '', n = i + 1; while (n > 0){ const m = (n-1) % 26; s = String.fromCharCode(65+m) + s; n = Math.floor((n-1)/26); } return s; };
    const head = `<row r="1">${cols.map((c,i) => cell(c.h, 'text', colRef(i)+'1', 1)).join('')}</row>`;
    const body = rows.map((r, ri) => `<row r="${ri+2}">${cols.map((c,i) =>
      cell(r[c.key], c.type || 'text', colRef(i)+(ri+2), c.type === 'number' ? 2 : 0)).join('')}</row>`).join('');
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetPr><tabColor rgb="FFC43E6B"/></sheetPr>
<sheetViews><sheetView rightToLeft="1" workbookViewId="0" tabSelected="1"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
${colsXml}<sheetData>${head}${body}</sheetData>
<autoFilter ref="A1:${colRef(cols.length-1)}${rows.length+1}"/></worksheet>`;
  }
  function xlsx(filename, sheets){           /* sheets: [{name, cols, rows}] */
    /* الحدّ موجود لأن ملفاً بعشرات الأوراق يصير غير مقروء، لكن القصّ الصامت
       كان يُسقط أوراقاً دون أن يعلم أحد. الآن يُحذَّر بصوت مسموع. */
    const MAX_SHEETS = 20;
    const sh = sheets.slice(0, MAX_SHEETS);
    if (sheets.length > MAX_SHEETS){
      Log.warn(`تجاوز عدد أوراق الملف الحدّ (${sheets.length}) — صُدّرت أول ${MAX_SHEETS}`);
      if (typeof UI !== 'undefined' && UI.toast)
        UI.toast(`الملف يحتمل ${MAX_SHEETS} ورقة — لم تُصدَّر ${sheets.length - MAX_SHEETS} ورقة`, 'warn', 7000);
    }
    /* أسماء الأوراق في Excel: فريدة، بلا محارف ممنوعة، وبحدّ 31 محرفاً */
    const seen = new Set();
    sh.forEach((x, i) => {
      let n = String(x.name || `ورقة${i + 1}`).replace(/[\\\/\?\*\[\]:]/g, ' ').slice(0, 28).trim() || `ورقة${i + 1}`;
      let base = n, k = 2;
      while (seen.has(n)) n = `${base} ${k++}`;
      seen.add(n); x.name = n;
    });
    const files = [
      { name:'[Content_Types].xml', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
${sh.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
      { name:'_rels/.rels', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
      { name:'xl/workbook.xml', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${sh.map((s,i)=>`<sheet name="${xesc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>` },
      { name:'xl/_rels/workbook.xml.rels', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${sh.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}
<Relationship Id="rId${sh.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
      { name:'xl/styles.xml', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0"/></numFmts>
<fonts count="2"><font><sz val="11"/><name val="Arial"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Arial"/></font></fonts>
<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>
<fill><patternFill patternType="solid"><fgColor rgb="FF432C4C"/><bgColor indexed="64"/></patternFill></fill></fills>
<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>
<border><left style="thin"><color rgb="FFE7DEE6"/></left><right style="thin"><color rgb="FFE7DEE6"/></right><top style="thin"><color rgb="FFE7DEE6"/></top><bottom style="thin"><color rgb="FFE7DEE6"/></bottom><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="3">
<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"><alignment horizontal="right" readingOrder="2"/></xf>
<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"><alignment horizontal="center" readingOrder="2"/></xf>
<xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1"><alignment horizontal="left"/></xf>
</cellXfs></styleSheet>` }
    ];
    sh.forEach((s, i) => files.push({ name:`xl/worksheets/sheet${i+1}.xml`, text:sheetXml(s.cols, s.rows, s.name) }));
    const blob = new Blob([zip(files)], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    UI.download(blob, filename);
    return blob;
  }

  /* --------------------------------- DOCX ---------------------------------
     تقرير Word حقيقي: عنوان، ترويسة، جداول بحدود، إجماليات، اتجاه RTL. */
  const W_NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
  function p(text, { size=22, bold=false, color='241826', align='right', space=80, shade=null } = {}){
    return `<w:p><w:pPr><w:bidi/><w:jc w:val="${align}"/><w:spacing w:after="${space}"/>${shade?`<w:shd w:val="clear" w:fill="${shade}"/>`:''}
<w:rPr><w:rtl/>${bold?'<w:b/>':''}<w:sz w:val="${size}"/><w:color w:val="${color}"/></w:rPr></w:pPr>
<w:r><w:rPr><w:rtl/>${bold?'<w:b/>':''}<w:sz w:val="${size}"/><w:color w:val="${color}"/></w:rPr><w:t xml:space="preserve">${xesc(text)}</w:t></w:r></w:p>`;
  }
  function tcell(text, { bold=false, fill=null, w=1500, color='241826' } = {}){
    return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${fill?`<w:shd w:val="clear" w:fill="${fill}"/>`:''}<w:vAlign w:val="center"/></w:tcPr>
${p(text, { size:20, bold, color, align:'right', space:0 })}</w:tc>`;
  }
  function table(headers, rows, totals){
    const w = Math.floor(9000 / Math.max(1, headers.length));
    const head = `<w:tr><w:trPr><w:tblHeader/></w:trPr>${headers.map(h => tcell(h, { bold:true, fill:'432C4C', color:'FFFFFF', w })).join('')}</w:tr>`;
    const body = rows.map((r, i) => `<w:tr>${r.map(c => tcell(c, { w, fill: i % 2 ? 'FBF7FA' : null })).join('')}</w:tr>`).join('');
    const foot = totals ? `<w:tr>${totals.map(c => tcell(c, { bold:true, fill:'F7DCE6', w })).join('')}</w:tr>` : '';
    return `<w:tbl><w:tblPr><w:bidiVisual/><w:tblW w:w="9000" w:type="dxa"/>
<w:tblBorders><w:top w:val="single" w:sz="4" w:color="D9CEDA"/><w:left w:val="single" w:sz="4" w:color="D9CEDA"/>
<w:bottom w:val="single" w:sz="4" w:color="D9CEDA"/><w:right w:val="single" w:sz="4" w:color="D9CEDA"/>
<w:insideH w:val="single" w:sz="4" w:color="E7DEE6"/><w:insideV w:val="single" w:sz="4" w:color="E7DEE6"/></w:tblBorders></w:tblPr>
${head}${body}${foot}</w:tbl>${p('', { space:120 })}`;
  }
  /* blocks: [{type:'h1'|'h2'|'p'|'kv'|'table', ...}] */
  function docx(filename, { title, subtitle, blocks }){
    const body = [
      p(title, { size:34, bold:true, color:'432C4C', space:40 }),
      subtitle ? p(subtitle, { size:20, color:'7A6E82', space:200 }) : '',
      ...blocks.map(b => {
        if (b.type === 'h1') return p(b.text, { size:28, bold:true, color:'A8305A', space:120 });
        if (b.type === 'h2') return p(b.text, { size:24, bold:true, color:'432C4C', space:100 });
        if (b.type === 'p')  return p(b.text, { size:22 });
        if (b.type === 'kv') return table(['البند','القيمة'], b.rows);
        if (b.type === 'table') return (b.title ? p(b.title, { size:24, bold:true, color:'432C4C', space:100 }) : '') + table(b.headers, b.rows, b.totals);
        return '';
      })
    ].join('');
    const footer = p(`${Settings.get('gymName')} — تقرير مُصدَّر من نظام الإدارة بتاريخ ${D.fmt(D.today())}`, { size:16, color:'7A6E82', align:'center' });
    const files = [
      { name:'[Content_Types].xml', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>` },
      { name:'_rels/.rels', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>` },
      { name:'word/document.xml', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document ${W_NS}><w:body>${body}${footer}
<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/>
<w:bidi/></w:sectPr></w:body></w:document>` }
    ];
    const blob = new Blob([zip(files)], { type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    UI.download(blob, filename);
    return blob;
  }

  /* ---------------------------------- CSV ---------------------------------
     BOM لعربية سليمة + تواريخ dd/mm/yyyy نصية + أرقام بلا فواصل حتى تبقى أرقاماً. */
  function csv(filename, cols, rows){
    const q = v => `"${String(v == null ? '' : v).replace(/"/g,'""')}"`;
    const line = arr => arr.join(',');
    const body = [line(cols.map(c => q(c.h))), ...rows.map(r => line(cols.map(c => {
      const v = r[c.key];
      return c.type === 'number' ? (isFinite(Number(v)) ? Number(v) : 0) : q(v);
    })))].join('\r\n');
    UI.download(new Blob(['\uFEFF' + body], { type:'text/csv;charset=utf-8' }), filename);
    return body;
  }

  /* ---------------------- بناء صفوف التصدير من البيانات ------------------- */
  const SUB_COLS = [
    { h:'كود المشتركة', key:'code', w:14 },
    { h:'اسم المشتركة', key:'member', w:26 },
    { h:'المدة', key:'durationLabel', w:14 },
    { h:'قيمة المدة', key:'durationValue', type:'number', w:11 },
    { h:'وحدة المدة', key:'durationUnitAr', w:11 },
    { h:'عدد الأيام', key:'days', type:'number', w:11 },
    { h:'من', key:'from', w:13 },
    { h:'إلى', key:'to', w:13 },
    { h:'السعر', key:'price', type:'number', w:13 },
    { h:'الخصم', key:'discount', type:'number', w:13 },
    { h:'المستحق', key:'final', type:'number', w:15 },
    { h:'المقبوض', key:'paid', type:'number', w:14 },
    { h:'المتبقي', key:'due', type:'number', w:14 },
    { h:'حالة السداد', key:'payState', w:14 },
    { h:'طريقة الدفع', key:'method', w:13 },
    { h:'حالة الاشتراك', key:'state', w:14 },
    { h:'العرض المطبّق', key:'offer', w:18 },
    { h:'ملاحظات', key:'notes', w:24 }
  ];
  function subRows(list){
    const today = D.today();
    const payIdx = Svc.payments.indexBy('subscription');
    return list.map(({ s, member }) => {
      const info = Svc.subs.durationInfo(s);
      const pay = Calc.payStatus(s.finalPrice, payIdx[s.id] || 0);
      const offer = s.offerId ? Repos.offers.get(s.offerId) : null;
      const state = s.archived ? 'مؤرشف'
        : D.cmp(s.startDate, today) > 0 ? 'يبدأ لاحقاً'
        : D.cmp(s.endDate, today) >= 0 ? 'فعّال' : 'منتهٍ';
      return {
        code: member ? member.code : '—', member: member ? member.name : 'مشتركة محذوفة',
        durationLabel: info.label, durationValue: info.value, durationUnitAr: DUR.unitAr(info.unit),
        days: info.days, from: D.fmt(s.startDate), to: D.fmt(s.endDate),
        price: s.price, discount: s.discount || 0, final: s.finalPrice,
        paid: pay.paid, due: pay.due, payState: pay.ar,
        method: s.paymentMethod || '', state, offer: offer ? offer.name : (s.discountReason || ''), notes: s.notes || ''
      };
    });
  }
  /* أعمدة تصدير المبيعات والمخزون — نفس قاعدة الاشتراكات:
     التواريخ نصّ بعرض عمود كافٍ، والأرقام أرقام حقيقية لتصحّ جمعياتها في Excel. */
