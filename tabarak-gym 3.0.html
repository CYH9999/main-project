/* ------------------------ ملف المشتركة: القياسات ----------------------
   القرار المعماري: لا حقل اسمه «الوزن الحالي». القياس حدثٌ له تاريخ، والقيمة
   الحالية هي آخر حدث. لولا ذلك لضاع كل تقدّم أحرزته المشتركة عند أول تحديث. */
Svc.measure = {
  types(){ return Settings.get('measurementTypes') || []; },
  typeOf(key){ return this.types().find(t => t.key === key) || { key, label:key, unit:'' }; },
  ofMember(memberId, type){
    return U.sortBy(Repos.measurements.list().filter(m => m.memberId === memberId && (!type || m.type === type)), m => m.date, -1);
  },
  /* آخر قيمة لكل نوع — ما يظهر في رأس الملف */
  latest(memberId){
    const out = {};
    for (const m of U.sortBy(Repos.measurements.list().filter(x => x.memberId === memberId), x => x.date))
      out[m.type] = m;                       /* الأحدث يكتب فوق الأقدم */
    return out;
  },
  validate(d){
    const r = V();
    if (!d.memberId) vErr(r, 'memberId', 'اختاري المشتركة');
    if (!D.isISO(d.date)) vErr(r, 'date', 'التاريخ غير صحيح');
    if (D.cmp(d.date, D.today()) > 0) vErr(r, 'date', 'لا يمكن تسجيل قياس بتاريخ مستقبلي');
    const n = Money.clean(d.value);
    if (!(isFinite(n) && n > 0)) vErr(r, 'value', 'القيمة يجب أن تكون أكبر من صفر');
    else if (n > 1000) vErr(r, 'value', 'القيمة أكبر من المعقول — تأكدي من الوحدة');
    return r;
  },
  async add(d){
    const val = this.validate(d);
    if (!val.ok) throw new AppError('بيانات القياس غير صحيحة', 'VALIDATION', val.errors);
    const t = this.typeOf(d.type);
    const rec = await Repos.measurements.create({
      memberId:d.memberId, date:d.date, type:d.type, value:U.round2(Money.clean(d.value)),
      unit:d.unit || t.unit || '', notes:U.norm(d.notes), recordedBy:d.recordedBy || Auth.session.actorName, isDemo:!!d.isDemo });
    return rec;
  },
  /* الاستقبال تقيس عدة أشياء في جلسة واحدة: تُحفظ كسجلات مستقلة بتاريخ واحد،
     والعملية كلٌّ لا يتجزّأ حتى لا تبقى نصف قياسات لو فشل الحفظ في المنتصف. */
  async addBatch(memberId, date, values, notes){
    const entries = Object.entries(values || {}).filter(([, v]) => v !== '' && v != null);
    if (!entries.length) throw new AppError('لم تُدخَل أي قيمة', 'VALIDATION', { value:'أدخلي قيمة واحدة على الأقل' });
    const errors = {};
    for (const [type, value] of entries){
      const v = this.validate({ memberId, date, type, value });
      if (!v.ok) Object.entries(v.errors).forEach(([, msg]) => { errors['m_' + type] = `${this.typeOf(type).label}: ${msg}`; });
    }
    if (Object.keys(errors).length) throw new AppError('بيانات القياس غير صحيحة', 'VALIDATION', errors);
    const done = [];
    try {
      for (const [type, value] of entries) done.push(await this.add({ memberId, date, type, value, notes }));
    } catch(e){
      for (const r of done){ try { await Repos.measurements.hardDelete(r.id); } catch(_){} }
      throw e;
    }
    const m = Repos.members.get(memberId);
    await Audit.log('measurement', 'create', `تسجيل ${done.length} قياساً لـ${m ? m.name : ''} بتاريخ ${D.fmt(date)}`, memberId);
    return done;
  },
  async remove(id){
    const rec = Repos.measurements.get(id);
    if (!rec) throw new AppError('القياس غير موجود', 'NOT_FOUND');
    await Repos.measurements.hardDelete(id);
    await Audit.log('measurement', 'delete', `حذف قياس ${this.typeOf(rec.type).label}`, id);
    return rec;
  },
  /* التقدّم بين أول قياس وآخره — وصف وقائعي بلا أي ادّعاء طبّي */
  progress(memberId, type){
    const list = U.sortBy(this.ofMember(memberId, type), m => m.date);
    if (list.length < 2) return null;
    const first = list[0], last = list[list.length - 1];
    const delta = U.round2(last.value - first.value);
    const t = this.typeOf(type);
    return { type, label:t.label, unit:last.unit || t.unit, first, last, count:list.length,
             delta, pct:first.value ? U.round2(delta / first.value * 100) : 0,
             days:D.diffDays(first.date, last.date),
             /* «تحسّن» هنا يعني: تحرّك في الاتجاه الذي عرّفه النادي لهذا القياس */
             improved: delta === 0 ? null : (t.lowerIsBetter ? delta < 0 : delta > 0) };
  },
  /* سلسلة جاهزة للرسم */
  series(memberId, type){
    return U.sortBy(this.ofMember(memberId, type), m => m.date)
      .map(m => ({ label:D.fmt(m.date).slice(0, 5), value:m.value, date:m.date }));
  },
  /* مؤشّر كتلة الجسم: حساب وصفي من الطول والوزن، بلا تشخيص ولا نصيحة */
  bmi(memberId){
    const l = this.latest(memberId);
    const w = l.weight && l.weight.value, h = l.height && l.height.value;
    if (!w || !h) return null;
    const m = h > 3 ? h / 100 : h;                       /* يتحمّل الطول بالسنتيمتر أو بالمتر */
    return { value:U.round2(w / (m * m)), weight:w, height:h, at:l.weight.date };
  }
};

/* ------------------------- ملف المشتركة: الأهداف ---------------------- */
Svc.goals = {
  types(){ return Settings.get('goalTypes') || []; },
  typeOf(key){ return this.types().find(t => t.key === key) || { key, label:key, unit:'' }; },
  ofMember(memberId, inclDone=true){
    const l = U.sortBy(Repos.goals.list().filter(g => g.memberId === memberId), g => g.targetDate || '9999');
    return inclDone ? l : l.filter(g => g.status === 'open');
  },
  validate(d){
    const r = V();
    if (!d.memberId) vErr(r, 'memberId', 'اختاري المشتركة');
    if (!U.norm(d.title)) vErr(r, 'title', 'اكتبي وصف الهدف');
    if (d.targetDate && !D.isISO(d.targetDate)) vErr(r, 'targetDate', 'التاريخ غير صحيح');
    if (d.targetValue !== '' && d.targetValue != null && !isFinite(Money.clean(d.targetValue)))
      vErr(r, 'targetValue', 'القيمة المستهدفة غير صحيحة');
    return r;
  },
  async save(id, d){
    const val = this.validate(d);
    if (!val.ok) throw new AppError('بيانات الهدف غير صحيحة', 'VALIDATION', val.errors);
    const payload = { memberId:d.memberId, type:d.type || 'custom', title:U.norm(d.title),
      targetValue: d.targetValue === '' || d.targetValue == null ? null : U.round2(Money.clean(d.targetValue)),
      unit:U.norm(d.unit) || this.typeOf(d.type).unit || '', startDate:d.startDate || D.today(),
      targetDate:d.targetDate || '', notes:U.norm(d.notes), coachId:d.coachId || null,
      status:d.status || 'open', achievedAt:d.achievedAt || null };
    const rec = id ? await Repos.goals.update(id, payload) : await Repos.goals.create(Object.assign(payload, { isDemo:!!d.isDemo }));
    const m = Repos.members.get(rec.memberId);
    await Audit.log('goal', id ? 'update' : 'create', `${id ? 'تعديل' : 'إضافة'} هدف «${rec.title}» لـ${m ? m.name : ''}`, rec.id);
    return rec;
  },
  async setStatus(id, status){
    const g = Repos.goals.get(id);
    if (!g) throw new AppError('الهدف غير موجود', 'NOT_FOUND');
    const rec = await Repos.goals.update(id, { status, achievedAt: status === 'achieved' ? D.today() : null });
    await Audit.log('goal', status, `هدف «${g.title}»: ${status === 'achieved' ? 'تحقّق' : status === 'dropped' ? 'أُلغي' : 'أُعيد فتحه'}`, id);
    return rec;
  },
  async remove(id){
    const g = Repos.goals.get(id);
    if (!g) throw new AppError('الهدف غير موجود', 'NOT_FOUND');
    await Repos.goals.hardDelete(id);
    await Audit.log('goal', 'delete', `حذف هدف «${g.title}»`, id);
    return g;
  },
  /* التقدّم يُقرأ من الوقائع: قياسٌ مسجّل أو حضورٌ مسجّل — لا إدخال يدوي للنسبة */
  progress(goal){
    if (!goal.targetValue) return null;
    if (goal.type === 'attendance'){
      const from = D.addDays(D.today(), -30);
      const visits = Svc.attendance.ofMember(goal.memberId).filter(a => D.cmp(a.date, from) >= 0).length;
      return { current:visits, target:goal.targetValue, pct:Math.min(100, U.pct(visits, goal.targetValue)),
               source:'زيارات آخر 30 يوماً', reached:visits >= goal.targetValue };
    }
    const latest = Svc.measure.latest(goal.memberId)[goal.type];
    if (!latest) return null;
    const startRec = U.sortBy(Svc.measure.ofMember(goal.memberId, goal.type), m => m.date)[0];
    const start = startRec ? startRec.value : latest.value;
    const span = goal.targetValue - start;
    const done = latest.value - start;
    const pct = span === 0 ? 100 : Math.max(0, Math.min(100, U.round2(done / span * 100)));
    const lower = Svc.measure.typeOf(goal.type).lowerIsBetter;
    return { current:latest.value, target:goal.targetValue, start, pct, at:latest.date,
             source:`آخر قياس ${D.fmt(latest.date)}`,
             reached: lower ? latest.value <= goal.targetValue : latest.value >= goal.targetValue };
  }
};

/* ------------------------ ملف المشتركة: المستندات --------------------- */
Svc.docs = {
  types(){ return Settings.get('documentTypes') || []; },
  ofMember(memberId){ return U.sortBy(Repos.memberDocs.list().filter(d => d.memberId === memberId), d => d.createdAt, -1); },
  validate(d){
    const r = V();
    if (!d.memberId) vErr(r, 'memberId', 'اختاري المشتركة');
    if (!U.norm(d.title)) vErr(r, 'title', 'عنوان المستند مطلوب');
    if (!U.norm(d.type)) vErr(r, 'type', 'اختاري نوع المستند');
    if (d.issueDate && !D.isISO(d.issueDate)) vErr(r, 'issueDate', 'تاريخ غير صحيح');
    if (d.expiryDate && !D.isISO(d.expiryDate)) vErr(r, 'expiryDate', 'تاريخ غير صحيح');
    if (d.issueDate && d.expiryDate && D.isISO(d.issueDate) && D.isISO(d.expiryDate) && D.cmp(d.expiryDate, d.issueDate) < 0)
      vErr(r, 'expiryDate', 'تاريخ الانتهاء قبل تاريخ الإصدار');
    return r;
  },
  /* نفس نمط التمارين: المرفق الجديد يُحفظ أولاً، وإن فشل حفظ المستند حُذف المرفق
     حتى لا تتراكم ملفات يتيمة تأكل المساحة المحلية. */
  async save(id, d, mediaOp){
    const val = this.validate(d);
    if (!val.ok) throw new AppError('بيانات المستند غير صحيحة', 'VALIDATION', val.errors);
    const cur = id ? Repos.memberDocs.get(id) : null;
    if (id && !cur) throw new AppError('المستند غير موجود', 'NOT_FOUND');
    const oldMediaId = cur ? cur.mediaId : null;
    let mediaId = oldMediaId || null, newMediaId = null;
    if (mediaOp && mediaOp.file){ newMediaId = (await Svc.media.saveFile(mediaOp.file)).id; mediaId = newMediaId; }
    else if (mediaOp && mediaOp.remove) mediaId = null;
    const payload = { memberId:d.memberId, type:U.norm(d.type), title:U.norm(d.title),
      issueDate:d.issueDate || '', expiryDate:d.expiryDate || '', notes:U.norm(d.notes),
      status:d.status || 'active', mediaId };
    try {
      const rec = id ? await Repos.memberDocs.update(id, payload)
                     : await Repos.memberDocs.create(Object.assign(payload, { isDemo:!!d.isDemo }));
      if (oldMediaId && oldMediaId !== mediaId) await Svc.media.removeIfUnused(oldMediaId, { store:'memberDocs', id:rec.id });
      const m = Repos.members.get(d.memberId);
      await Audit.log('document', id ? 'update' : 'create', `${id ? 'تعديل' : 'إضافة'} مستند «${rec.title}» لـ${m ? m.name : ''}`, rec.id);
      return rec;
    } catch(e){
      if (newMediaId) await Svc.media.remove(newMediaId).catch(() => {});
      throw e;
    }
  },
  async remove(id){
    const doc = Repos.memberDocs.get(id);
    if (!doc) throw new AppError('المستند غير موجود', 'NOT_FOUND');
    await Repos.memberDocs.hardDelete(id);
    let media = { removed:false, reason:'بلا مرفق' };
    if (doc.mediaId) media = await Svc.media.removeIfUnused(doc.mediaId, { store:'memberDocs', id });
    await Audit.log('document', 'delete', `حذف مستند «${doc.title}»`, id);
    return { doc, media };
  },
  /* المستندات التي انتهت أو توشك — تغذّي التنبيهات والمتابعات */
  expiring(days){
    const win = days == null ? (Settings.get('docExpiryWarnDays') || 30) : days;
    const today = D.today(), limit = D.addDays(today, win);
    return Repos.memberDocs.list()
      .filter(d => d.expiryDate && D.isISO(d.expiryDate) && D.cmp(d.expiryDate, limit) <= 0 && d.status !== 'void')
      .map(d => ({ doc:d, member:Repos.members.get(d.memberId), daysLeft:D.diffDays(today, d.expiryDate) }))
      .filter(x => x.member)
      .sort((a, b) => a.daysLeft - b.daysLeft);
  },
  /* هل وقّعت المشتركة إقراراً؟ سؤال يُسأل يومياً في الاستقبال */
  hasSigned(memberId, type){
    return this.ofMember(memberId).some(d => d.type === type && d.status === 'active'
      && (!d.expiryDate || D.cmp(d.expiryDate, D.today()) >= 0));
  }
};


/* ===== src/app/services/130-receipts.js ============================================== */
/* -------------------------------- الوصولات ----------------------------
   الوصل وثيقةٌ على حدثٍ ماليٍّ وقع، وليس حدثاً مالياً بذاته. من هذه الجملة
   تُشتقّ كل قواعد هذا الملف:

     · الوصل يُصدَر عن دفعة موجودة أصلاً — لا يُنشئ دفعة ولا سطر إيراد أبداً.
     · إصدار الوصل مرتين للدفعة نفسها يُرجع الوصل نفسه برقمه نفسه.
     · إعادة الطباعة تزيد عدّاد النسخ فقط، ولا تلمس المال بحال.
     · الوصل يحمل «لقطة» مما طُبع عليه: لو تغيّر اسم المشتركة أو سعر الاشتراك
       لاحقاً بقيت النسخة المطبوعة مطابقة لما سُلّم للمشتركة يوم الدفع.
   ====================================================================== */
Svc.receipts = {
  KIND: { subscription:'وصل اشتراك', sale:'وصل مبيعات' },
  forPayment(paymentId){ return Repos.receipts.list(true).find(r => r.paymentId === paymentId) || null; },
  ofMember(memberId){ return U.sortBy(Repos.receipts.list(true).filter(r => r.memberId === memberId), r => r.issuedAt, -1); },
  forRef(refType, refId){ return U.sortBy(Repos.receipts.list(true).filter(r => r.refType === refType && r.refId === refId), r => r.issuedAt); },
  get(id){ return Repos.receipts.get(id); },

  /* اللقطة: كل ما يظهر على الورقة يُجمَّد هنا وقت الإصدار.
     المعلومات الحسّاسة (الهوية، الملاحظات الصحية) لا تدخلها إطلاقاً. */
  snapshot(payment, doc, member){
    const b = Settings.get('branding') || {};
    const isSale = payment.refType === 'sale';
    const total = isSale ? doc.total : doc.finalPrice;
    const paidBefore = U.round2(Svc.payments.forRef(payment.refType, payment.refId)
      .filter(p => p.id !== payment.id && D.cmp(p.date, payment.date) <= 0).reduce((a, p) => a + (Number(p.amount) || 0), 0));
    return {
      gym:{ name:Settings.get('gymName'), subtitle:b.subtitle || '', phone:b.phone || '',
            address:b.address || '', instagram:b.instagram || '', footer:b.footer || Settings.get('receiptNote') || '' },
      member:member ? { name:member.name, code:member.code, phone:member.phone || '' }
                    : { name:(doc.customerName || 'زبونة عابرة'), code:'', phone:'' },
      doc:{ kind:payment.refType,
            title: isSale ? `فاتورة ${doc.code}` : `اشتراك ${doc.planName || ''}`,
            detail: isSale ? (doc.lines || []).map(l => `${l.name} × ${U.round2(l.qty)}`).join('، ')
                           : `${D.fmt(doc.startDate)} ← ${D.fmt(doc.endDate)}`,
            lines: isSale ? (doc.lines || []).map(l => ({ name:l.name, qty:l.qty, unitPrice:l.unitPrice, total:l.total })) : [],
            price: isSale ? doc.subtotal : doc.price,
            discount: Number(doc.discount) || 0,
            total: U.round2(Number(total) || 0) },
      payment:{ amount:U.round2(Number(payment.amount) || 0), method:payment.method || '', date:payment.date,
                paidBefore, paidAfter:U.round2(paidBefore + (Number(payment.amount) || 0)),
                remaining:U.round2(Math.max(0, (Number(total) || 0) - paidBefore - (Number(payment.amount) || 0))) },
      operator:Auth.session.actorName || '',
      currency:Money.current().code
    };
  },

  /* إصدار وصل لدفعة. عملية قراءة من الناحية المالية: لا تكتب في المال شيئاً. */
  async issue(paymentId, opts){
    const payment = Repos.payments.get(paymentId);
    if (!payment) throw new AppError('الدفعة غير موجودة — لا يُصدَر وصل بلا دفعة','NOT_FOUND');
    const existing = this.forPayment(paymentId);
    if (existing) return existing;                       /* رقم واحد لكل دفعة، مهما تكرّر الطلب */
    const doc = payment.refType === 'sale' ? Repos.sales.get(payment.refId) : Repos.subs.get(payment.refId);
    if (!doc) throw new AppError('المستند المرتبط بالدفعة غير موجود','NOT_FOUND');
    const member = payment.memberId ? Repos.members.get(payment.memberId) : null;
    const no = await Settings.nextCode('receiptSeq', 'و', 5);
    const rec = await Repos.receipts.create({
      no, refType:payment.refType, refId:payment.refId, paymentId, memberId:payment.memberId || null,
      amount:U.round2(Number(payment.amount) || 0), issuedAt:new Date().toISOString(),
      issuedBy:Auth.session.actorName || '', format:(opts && opts.format) || Settings.get('receiptFormat') || 'a4',
      reprints:0, lastPrintedAt:null, voided:false, snapshot:this.snapshot(payment, doc, member), isDemo:!!payment.isDemo
    });
    await Audit.log('receipt','issue',`إصدار وصل ${no} بمبلغ ${Money.fmt(rec.amount)}${member ? ' — ' + member.name : ''}`, rec.id);
    return rec;
  },
  /* الوصل الخاص بدفعة، يُصدَر إن لم يكن موجوداً — هذا ما تستدعيه الشاشات */
  async ensure(paymentId, opts){ return this.forPayment(paymentId) || await this.issue(paymentId, opts); },

  /* إعادة الطباعة: عدّاد ونسخة أخرى من الورق. لا مال، ولا رقم جديد. */
  async markPrinted(id){
    const r = Repos.receipts.get(id);
    if (!r) throw new AppError('الوصل غير موجود','NOT_FOUND');
    const n = (Number(r.reprints) || 0) + (r.lastPrintedAt ? 1 : 0);
    const rec = await Repos.receipts.update(id, { reprints:n, lastPrintedAt:new Date().toISOString() });
    if (r.lastPrintedAt) await Audit.log('receipt','reprint',`إعادة طباعة وصل ${r.no} (النسخة ${n + 1})`, id);
    return rec;
  },
  /* دفعة أُلغيت ⇒ وصلها يُبطَل ويبقى في السجل. المحو يخفي خطأً وقع فعلاً. */
  async void(id, reason){
    const r = Repos.receipts.get(id);
    if (!r) throw new AppError('الوصل غير موجود','NOT_FOUND');
    if (r.voided) return r;
    const rec = await Repos.receipts.update(id, { voided:true, voidedAt:new Date().toISOString(), voidReason:U.norm(reason) || 'أُلغيت الدفعة' });
    await Audit.log('receipt','void',`إبطال وصل ${r.no} — ${rec.voidReason}`, id);
    return rec;
  },
  async voidForPayment(paymentId, reason){
    const r = this.forPayment(paymentId);
    return r ? this.void(r.id, reason) : null;
  },
  summary(from, to){
    const rows = Repos.receipts.list(true).filter(r => {
      const d = String(r.issuedAt).slice(0, 10);
      return (!from || D.cmp(d, from) >= 0) && (!to || D.cmp(d, to) <= 0);
    });
    return { count:rows.length, voided:rows.filter(r => r.voided).length,
             reprints:U.sum(rows, r => Number(r.reprints) || 0), total:U.round2(U.sum(rows.filter(r => !r.voided), r => r.amount)) };
  }
};


/* ===== src/app/services/135-membership.js ============================================ */
/* --------------------- دورة حياة الاشتراك: تجميد وتمديد ---------------
   القاعدة: لا تُعدَّل تواريخ اشتراكٍ بيعَ بالفعل تعديلاً صامتاً. كل تحريك
   للنهاية يُسجَّل حدثاً مؤرَّخاً بسببه ومن نفّذه، والنهاية الفعلية تُشتقّ من
   الأصل زائد الأحداث. الأصل (baseEndDate) لا يتغيّر أبداً.

     النهاية الفعلية = النهاية الأصلية + مجموع أيام التجميد + مجموع أيام التمديد

   فائدة عملية: إلغاء تجميد لا يحتاج تذكّر التاريخ القديم — يُحذف الحدث
   وتُعاد النهاية إلى ما تقوله بقية الأحداث. */
Svc.membership = {
  EVENT: { freeze:'تجميد', extend:'تمديد', cancel:'إلغاء', resume:'استئناف' },
  eventsOf(subId){ return U.sortBy(Repos.subEvents.list().filter(e => e.subId === subId), e => e.createdAt); },
  freezesOf(subId){ return this.eventsOf(subId).filter(e => e.type === 'freeze' && !e.cancelled); },
  /* كل تجميدات مشتركة — تُستعمل لحساب الحالة «مجمّد» اليوم */
  freezesOfMember(memberId){
    const subIds = new Set(Svc.subs.ofMember(memberId, true).map(s => s.id));
    return Repos.subEvents.list().filter(e => e.type === 'freeze' && !e.cancelled && subIds.has(e.subId));
  },
  addedDays(subId){
    return this.eventsOf(subId).filter(e => !e.cancelled)
      .reduce((a, e) => a + (e.type === 'freeze' || e.type === 'extend' ? (Number(e.days) || 0) : 0), 0);
  },
  /* المصدر الوحيد الذي يكتب endDate. يُستدعى بعد كل حدث. */
  async recompute(subId){
    const sub = Repos.subs.get(subId);
    if (!sub) throw new AppError('الاشتراك غير موجود','NOT_FOUND');
    const base = sub.baseEndDate || sub.endDate;
    const end = D.addDays(base, this.addedDays(subId));
    if (sub.baseEndDate === base && sub.endDate === end) return sub;
    return Repos.subs.update(subId, { baseEndDate:base, endDate:end });
  },
  /* هل الاشتراك مجمّد في يوم معيّن؟ */
  frozenOn(subId, date){
    const d = date || D.today();
    return this.freezesOf(subId).find(f => D.cmp(d, f.from) >= 0 && D.cmp(d, f.to) <= 0) || null;
  },
  validateFreeze(sub, d, existing){
    const r = V();
    if (!D.isISO(d.from)) vErr(r, 'from', 'تاريخ بداية التجميد غير صحيح');
    if (!D.isISO(d.to)) vErr(r, 'to', 'تاريخ نهاية التجميد غير صحيح');
    if (D.isISO(d.from) && D.isISO(d.to) && D.cmp(d.to, d.from) < 0) vErr(r, 'to', 'نهاية التجميد قبل بدايته');
    if (D.isISO(d.from) && D.isISO(d.to) && DUR.days(d.from, d.to) > 365) vErr(r, 'to', 'التجميد أطول من سنة');
    /* التجميد يقع داخل مدة الاشتراك: تجميد ما انتهى أصلاً لا معنى له */
    if (sub && D.isISO(d.from) && D.cmp(d.from, sub.startDate) < 0) vErr(r, 'from', 'التجميد يبدأ قبل بداية الاشتراك');
    if (sub && D.isISO(d.from) && D.cmp(d.from, sub.endDate) > 0) vErr(r, 'from', 'الاشتراك منتهٍ في هذا التاريخ — جدّديه بدل تجميده');
    if ((existing || []).some(f => D.cmp(d.from, f.to) <= 0 && D.cmp(d.to, f.from) >= 0))
      vErr(r, 'from', 'هذه الفترة تتداخل مع تجميد مسجَّل');
    if (!U.norm(d.reason)) vErr(r, 'reason', 'اكتبي سبب التجميد');
    return r;
  },
  async freeze(subId, d){
    const sub = Repos.subs.get(subId);
    if (!sub) throw new AppError('الاشتراك غير موجود','NOT_FOUND');
    if (sub.archived) throw new AppError('لا يمكن تجميد اشتراك مؤرشف','ARCHIVED');
    const val = this.validateFreeze(sub, d, this.freezesOf(subId));
    if (!val.ok) throw new AppError('بيانات التجميد غير صحيحة','VALIDATION', val.errors);
    const days = DUR.days(d.from, d.to);
    const ev = await Repos.subEvents.create({ subId, memberId:sub.memberId, type:'freeze', from:d.from, to:d.to,
      days, reason:U.norm(d.reason), createdBy:Auth.session.actorName || '', cancelled:false, isDemo:!!sub.isDemo });
    const rec = await this.recompute(subId);
    const m = Repos.members.get(sub.memberId);
    await Audit.log('subscription','freeze',
      `تجميد اشتراك ${m ? m.name : ''} ${days} يوماً (${D.fmt(d.from)} ← ${D.fmt(d.to)}) — تمتد النهاية إلى ${D.fmt(rec.endDate)}`, subId);
    return { event:ev, sub:rec };
  },
  async extend(subId, d){
    const sub = Repos.subs.get(subId);
    if (!sub) throw new AppError('الاشتراك غير موجود','NOT_FOUND');
    const days = Math.round(Money.clean(d.days));
    const r = V();
    if (!(isFinite(days) && days > 0)) vErr(r, 'days', 'عدد الأيام يجب أن يكون أكبر من صفر');
    else if (days > 365) vErr(r, 'days', 'التمديد أطول من سنة');
    if (!U.norm(d.reason)) vErr(r, 'reason', 'اكتبي سبب التمديد');
    if (!r.ok) throw new AppError('بيانات التمديد غير صحيحة','VALIDATION', r.errors);
    const ev = await Repos.subEvents.create({ subId, memberId:sub.memberId, type:'extend', from:null, to:null,
      days, reason:U.norm(d.reason), createdBy:Auth.session.actorName || '', cancelled:false, isDemo:!!sub.isDemo });
    const rec = await this.recompute(subId);
    const m = Repos.members.get(sub.memberId);
    await Audit.log('subscription','extend',`تمديد اشتراك ${m ? m.name : ''} ${days} يوماً — النهاية ${D.fmt(rec.endDate)}`, subId);
    return { event:ev, sub:rec };
  },
  /* التراجع عن حدث: يُعلَّم ملغى ولا يُحذف، ثم تُعاد النهاية من بقية الأحداث */
  async cancelEvent(eventId, reason){
    const ev = Repos.subEvents.get(eventId);
    if (!ev) throw new AppError('الحدث غير موجود','NOT_FOUND');
    if (ev.cancelled) return ev;
    const rec = await Repos.subEvents.update(eventId, { cancelled:true, cancelledAt:new Date().toISOString(),
      cancelReason:U.norm(reason) });
    const sub = await this.recompute(ev.subId);
    await Audit.log('subscription','unfreeze',
      `إلغاء ${this.EVENT[ev.type] || ev.type} (${ev.days} يوماً) — النهاية تعود إلى ${D.fmt(sub.endDate)}`, ev.subId);
    return rec;
  },
  /* ملخّص جاهز للعرض في ملف المشتركة */
  summary(subId){
    const evs = this.eventsOf(subId).filter(e => !e.cancelled);
    const sub = Repos.subs.get(subId);
    return { events:this.eventsOf(subId), addedDays:this.addedDays(subId),
             frozenDays:U.sum(evs.filter(e => e.type === 'freeze'), e => e.days),
             extendedDays:U.sum(evs.filter(e => e.type === 'extend'), e => e.days),
             baseEnd:sub ? (sub.baseEndDate || sub.endDate) : null,
             effectiveEnd:sub ? sub.endDate : null,
             frozenNow:this.frozenOn(subId) };
  }
};

/* ----------------------- أرصدة الحصص (الكريدت) ------------------------
   الحصص ليست نقوداً. رصيد ثماني حصص ليس «مبلغاً متبقياً» ولا يظهر في المالية
   ولا يُصرف بدلاً عن مال — لذلك له دفتره المستقل.

   ثلاث قواعد ثبتت في المنتجات العالمية وكلٌّ منها خطأ شائع لو خولفت:
     1. شراء باقة جديدة لا يمدّد باقة قديمة ولا يمحوها — الباقات مستقلّة.
     2. الاستهلاك من الباقة الأقرب انتهاءً، لا من الأحدث.
     3. إلغاء الحجز يعيد الحصة إلى الباقة التي خرجت منها بالذات.
   ====================================================================== */
Svc.credits = {
  KIND: { class:'حصة جماعية', pt:'تدريب خاص' },
  ledgerOf(memberId){ return U.sortBy(Repos.credits.list().filter(c => c.memberId === memberId), c => c.date); },
  /* الباقات: منحة واحدة = باقة واحدة، برصيدها وتاريخ انتهائها */
  packs(memberId, kind){
    const rows = Repos.credits.list().filter(c => c.memberId === memberId && (!kind || c.kind === kind));
    const grants = rows.filter(c => c.type === 'grant');
    const today = D.today();
    return grants.map(g => {
      const moves = rows.filter(c => c.grantId === g.id);
      const used = U.sum(moves.filter(c => c.type === 'use'), c => c.qty);
      const back = U.sum(moves.filter(c => c.type === 'refund'), c => c.qty);
      const expired = U.sum(moves.filter(c => c.type === 'expire'), c => c.qty);
      const remaining = U.round2(g.qty - used + back - expired);
      return { grant:g, kind:g.kind, total:g.qty, used:U.round2(used - back), remaining,
               expiresAt:g.expiresAt || '', subId:g.subId || null,
               isExpired: !!(g.expiresAt && D.cmp(g.expiresAt, today) < 0) };
    }).sort((a, b) => {
      /* الأقرب انتهاءً أولاً؛ وما بلا تاريخ انتهاء في الآخر */
      if (!a.expiresAt && !b.expiresAt) return D.cmp(a.grant.date, b.grant.date);
      if (!a.expiresAt) return 1;
      if (!b.expiresAt) return -1;
      return D.cmp(a.expiresAt, b.expiresAt);
    });
  },
  balance(memberId, kind){
    const packs = this.packs(memberId, kind).filter(p => !p.isExpired);
    const all = this.packs(memberId, kind);
    return { remaining:U.round2(U.sum(packs, p => p.remaining)),
             total:U.round2(U.sum(all, p => p.total)),
             used:U.round2(U.sum(all, p => p.used)),
             lost:U.round2(U.sum(all.filter(p => p.isExpired), p => p.remaining)),
             packs, nextExpiry:(packs.find(p => p.remaining > 0 && p.expiresAt) || {}).expiresAt || null };
  },
  async grant(d){
    const qty = Math.round(Money.clean(d.qty));
    const r = V();
    if (!d.memberId) vErr(r, 'memberId', 'اختاري المشتركة');
    if (!(isFinite(qty) && qty > 0)) vErr(r, 'qty', 'عدد الحصص يجب أن يكون أكبر من صفر');
    if (d.expiresAt && !D.isISO(d.expiresAt)) vErr(r, 'expiresAt', 'تاريخ الانتهاء غير صحيح');
    if (!r.ok) throw new AppError('بيانات الحصص غير صحيحة','VALIDATION', r.errors);
    const rec = await Repos.credits.create({ memberId:d.memberId, subId:d.subId || null, kind:d.kind || 'class',
      type:'grant', qty, date:d.date || D.today(), expiresAt:d.expiresAt || '', grantId:null,
      refType:d.refType || null, refId:d.refId || null, notes:U.norm(d.notes), isDemo:!!d.isDemo });
    const m = Repos.members.get(d.memberId);
    await Audit.log('credit','grant',`منح ${qty} ${this.KIND[rec.kind]} لـ${m ? m.name : ''}`, rec.id);
    return rec;
  },
  /* استهلاك حصة واحدة (أو أكثر) من الباقة الأقرب انتهاءً */
  async consume(memberId, kind, d){
    const qty = Math.round(Money.clean((d && d.qty) || 1)) || 1;
    const packs = this.packs(memberId, kind).filter(p => !p.isExpired && p.remaining > 0);
    const available = U.sum(packs, p => p.remaining);
    if (available < qty)
      throw new AppError(`لا يوجد رصيد حصص كافٍ (المتاح ${U.round2(available)} والمطلوب ${qty})`,'NO_CREDITS');
    const used = [];
    let left = qty;
    try {
      for (const p of packs){
        if (left <= 0) break;
        const take = Math.min(left, p.remaining);
        used.push(await Repos.credits.create({ memberId, subId:p.grant.subId || null, kind:p.kind, type:'use',
          qty:take, date:(d && d.date) || D.today(), grantId:p.grant.id,
          refType:(d && d.refType) || null, refId:(d && d.refId) || null, notes:U.norm(d && d.notes), isDemo:!!p.grant.isDemo }));
        left -= take;
      }
    } catch(e){
      for (const u of used){ try { await Repos.credits.hardDelete(u.id); } catch(_){} }
      throw e;
    }
    return used;
  },
  /* الإرجاع يعود إلى الباقة نفسها — وإلا انتقل رصيد من باقة تنتهي غداً إلى
     باقة تنتهي بعد سنة، وهذا ربحٌ للمشتركة على حساب النادي أو العكس. */
  async release(refType, refId, reason){
    const uses = Repos.credits.list().filter(c => c.type === 'use' && c.refType === refType && c.refId === refId);
    const back = [];
    for (const u of uses){
      const already = Repos.credits.list().some(c => c.type === 'refund' && c.refType === refType && c.refId === refId && c.grantId === u.grantId);
      if (already) continue;
      back.push(await Repos.credits.create({ memberId:u.memberId, subId:u.subId, kind:u.kind, type:'refund',
        qty:u.qty, date:D.today(), grantId:u.grantId, refType, refId, notes:U.norm(reason) || 'إلغاء حجز', isDemo:!!u.isDemo }));
    }
    return back;
  },
  /* إسقاط ما انتهت صلاحيته: يُسجَّل حدثاً ظاهراً بدل أن يختفي الرصيد بصمت */
  async expireStale(){
    const today = D.today();
    let n = 0;
    for (const m of Repos.members.list(true)){
      for (const p of this.packs(m.id)){
        if (!p.isExpired || p.remaining <= 0) continue;
        await Repos.credits.create({ memberId:m.id, subId:p.grant.subId, kind:p.kind, type:'expire',
          qty:p.remaining, date:today, grantId:p.grant.id, notes:`انتهت صلاحية الباقة في ${D.fmt(p.expiresAt)}`, isDemo:!!p.grant.isDemo });
        n++;
      }
    }
    if (n) await Audit.log('credit','expire',`إسقاط ${n} باقة حصص منتهية الصلاحية`);
    return n;
  }
};


/* ===== src/app/services/140-crm.js =================================================== */
/* ------------------------------ المهتمّات ------------------------------
   أكبر ما كان ناقصاً: من زارت النادي وسألت ولم تشترك بعد. بلا سجلّ لها
   تُنسى، ومع سجلّ تُتابَع. المهتمّة ليست مشتركة: لا كود ولا اشتراك ولا مال،
   حتى تتحوّل — والتحويل ينقل بياناتها بلا إعادة كتابة حرف واحد. */
Svc.leads = {
  STAGES: [
    { key:'new',       ar:'جديدة',   cls:'chip-none',   open:true  },
    { key:'contacted', ar:'تواصلنا', cls:'chip-susp',   open:true  },
    { key:'trial',     ar:'جرّبت',   cls:'chip-soon',   open:true  },
    { key:'converted', ar:'اشتركت',  cls:'chip-active', open:false },
    { key:'lost',      ar:'لم تشترك', cls:'chip-expired', open:false }
  ],
  stage(key){ return this.STAGES.find(s => s.key === key) || this.STAGES[0]; },
  list(inclClosed=true){
    const l = Repos.leads.list();
    return inclClosed ? l : l.filter(x => this.stage(x.stage).open);
  },
  get(id){ return Repos.leads.get(id); },
  sources(){ return Settings.get('leadSources') || []; },

  async save(id, d){
    const val = Validate.lead(d, Repos.leads.list(true), id);
    if (!val.ok) throw new AppError('بيانات المهتمّة غير صحيحة','VALIDATION', val.errors);
    const cur = id ? Repos.leads.get(id) : null;
    if (id && !cur) throw new AppError('السجل غير موجود','NOT_FOUND');
    const payload = {
      name:U.norm(d.name), phone:U.norm(d.phone), source:U.norm(d.source), interest:U.norm(d.interest),
      preferredCoachId:d.preferredCoachId || null, notes:U.norm(d.notes),
      stage:d.stage || (cur ? cur.stage : 'new'),
      followUpDate:d.followUpDate || '', lostReason:U.norm(d.lostReason),
      custom:Object.assign({}, (cur && cur.custom) || {}, d.custom || {}),
      firstSeen:(cur && cur.firstSeen) || d.firstSeen || D.today()
    };
    if (!id) payload.code = await Settings.nextCode('leadSeq','م',4);
    const rec = id ? await Repos.leads.update(id, payload) : await Repos.leads.create(Object.assign(payload, { isDemo:!!d.isDemo }));
    await Audit.log('lead', id ? 'update' : 'create', `${id ? 'تعديل' : 'تسجيل'} مهتمّة: ${rec.name}`, rec.id);
    /* متابعة تلقائية للمهتمّات الجديدة: أكثر ما يُفقد العميل هو النسيان */
    if (!id && !payload.followUpDate){
      const due = D.addDays(D.today(), Settings.get('followUpDays') || 3);
      await Repos.leads.update(rec.id, { followUpDate:due });
      await Svc.tasks.add({ title:`متابعة ${rec.name}`, dueDate:due, type:'lead',
        refType:'lead', refId:rec.id, notes:U.norm(d.notes), isDemo:!!d.isDemo }).catch(e => Log.warn('تعذّرت جدولة المتابعة', e));
      rec.followUpDate = due;
    }
    return { rec, warnings:val.warnings };
  },
  async setStage(id, stage, extra){
    const lead = Repos.leads.get(id);
    if (!lead) throw new AppError('السجل غير موجود','NOT_FOUND');
    if (!this.STAGES.some(s => s.key === stage)) throw new AppError('مرحلة غير معروفة','VALIDATION');
    if (stage === 'lost' && !U.norm(extra && extra.reason))
      throw new AppError('اكتبي سبب عدم الاشتراك','VALIDATION', { lostReason:'السبب مطلوب — هذه أهم معلومة في السجل' });
    const rec = await Repos.leads.update(id, { stage,
      lostReason: stage === 'lost' ? U.norm(extra.reason) : lead.lostReason,
      closedAt: this.stage(stage).open ? null : new Date().toISOString() });
    await Audit.log('lead','stage',`${lead.name}: ${this.stage(stage).ar}${stage === 'lost' ? ' — ' + rec.lostReason : ''}`, id);
    /* المهتمّة التي أُغلق ملفّها لا تحتاج متابعة معلّقة */
    if (!this.stage(stage).open) await Svc.tasks.closeFor('lead', id, 'أُغلق ملف المهتمّة');
    return rec;
  },
  /* التحويل إلى مشتركة: البيانات تُنقل كما هي، ويُربط السجلان في الاتجاهين. */
  async convert(id, extra){
    const lead = Repos.leads.get(id);
    if (!lead) throw new AppError('السجل غير موجود','NOT_FOUND');
    if (lead.convertedMemberId && Repos.members.get(lead.convertedMemberId))
      throw new AppError('هذه المهتمّة محوّلة إلى مشتركة بالفعل','ALREADY');
    const { rec:member, warnings } = await Svc.members.create(Object.assign({
      name:lead.name, phone:lead.phone, source:lead.source, notes:lead.notes,
      preferredCoachId:lead.preferredCoachId || null, custom:lead.custom || {},
      leadId:lead.id, isDemo:!!lead.isDemo
    }, extra || {}));
    try {
      await Repos.leads.update(id, { stage:'converted', convertedMemberId:member.id,
        convertedAt:new Date().toISOString(), closedAt:new Date().toISOString() });
    } catch(e){
      /* لا نترك مشتركة بلا أثر في سجل المهتمّات: نتراجع بدل ازدواج السجلات */
      await Repos.members.hardDelete(member.id).catch(() => {});
      throw new AppError('تعذّر إكمال التحويل — لم تُسجَّل المشتركة','CONVERT_FAILED', e);
    }
    await Svc.tasks.closeFor('lead', id, 'تحوّلت إلى مشتركة');
    await Audit.log('lead','convert',`تحويل ${lead.name} إلى مشتركة ${member.code}`, member.id);
    return { member, lead:Repos.leads.get(id), warnings };
  },
  async remove(id){
    const lead = Repos.leads.get(id);
    if (!lead) throw new AppError('السجل غير موجود','NOT_FOUND');
    await Repos.leads.archive(id, true);
    await Svc.tasks.closeFor('lead', id, 'حُذف سجل المهتمّة');
    await Audit.log('lead','archive',`أرشفة مهتمّة: ${lead.name}`, id);
    return lead;
  },
  dueFollowUps(){
    const today = D.today();
    return this.list(false).filter(l => l.followUpDate && D.cmp(l.followUpDate, today) <= 0)
      .sort((a, b) => D.cmp(a.followUpDate, b.followUpDate));
  },
  /* أرقام التحويل: تقاس ولا تُقدَّر */
  funnel(from, to){
    const rows = Calc.inRange(Repos.leads.list().map(l => Object.assign({ date:l.firstSeen }, l)), from, to);
    const by = k => rows.filter(l => l.stage === k).length;
    const converted = by('converted'), lost = by('lost');
    const closed = converted + lost;
    return { total:rows.length, new:by('new'), contacted:by('contacted'), trial:by('trial'),
             converted, lost, open:rows.length - closed,
             conversionRate: closed ? U.pct(converted, closed) : 0,
             bySource:Object.entries(U.groupBy(rows, l => l.source || 'غير محدّد'))
               .map(([k, v]) => ({ source:k, total:v.length, converted:v.filter(x => x.stage === 'converted').length }))
               .sort((a, b) => b.total - a.total),
             lostReasons:Object.entries(U.groupBy(rows.filter(l => l.stage === 'lost'), l => l.lostReason || 'غير محدّد'))
               .map(([k, v]) => ({ reason:k, count:v.length })).sort((a, b) => b.count - a.count) };
  }
};

/* ------------------------------ المتابعات ------------------------------
   تذكيرات تشغيلية بلا رسائل ولا إنترنت: اتصلي بفلانة، ذكّري بتجديد، حصّلي
   متبقّياً. المتابعة تشير إلى سجلّ حقيقي فتفتحه بنقرة بدل البحث عنه. */
Svc.tasks = {
  TYPES: { lead:'متابعة مهتمّة', renewal:'تجديد اشتراك', payment:'تحصيل مبلغ',
           inactive:'مشتركة منقطعة', document:'مستند ينتهي', birthday:'عيد ميلاد', general:'مهمة' },
  open(){ return U.sortBy(Repos.tasks.list().filter(t => t.status === 'open'), t => t.dueDate); },
  due(onDate){
    const d = onDate || D.today();
    return this.open().filter(t => D.cmp(t.dueDate, d) <= 0);
  },
  forRef(refType, refId){ return Repos.tasks.list().filter(t => t.refType === refType && t.refId === refId); },
  ofMember(memberId){ return U.sortBy(Repos.tasks.list().filter(t => t.memberId === memberId), t => t.dueDate, -1); },
  async add(d){
    const val = Validate.task(d);
    if (!val.ok) throw new AppError('بيانات المتابعة غير صحيحة','VALIDATION', val.errors);
    /* لا تتراكم متابعتان متطابقتان على السجل نفسه */
    const dupe = this.forRef(d.refType, d.refId).find(t => t.status === 'open' && t.type === (d.type || 'general'));
    if (dupe && d.refId) return dupe;
    const rec = await Repos.tasks.create({
      title:U.norm(d.title), type:d.type || 'general', dueDate:d.dueDate,
      refType:d.refType || null, refId:d.refId || null,
      memberId:d.memberId || (d.refType === 'member' ? d.refId : null),
      assignedTo:d.assignedTo || null, priority:d.priority || 'normal',
      notes:U.norm(d.notes), status:'open', doneAt:null, isDemo:!!d.isDemo });
    return rec;
  },
  async complete(id, note){
    const t = Repos.tasks.get(id);
    if (!t) throw new AppError('المتابعة غير موجودة','NOT_FOUND');
    const rec = await Repos.tasks.update(id, { status:'done', doneAt:new Date().toISOString(),
      notes:U.norm(note) ? `${t.notes ? t.notes + ' — ' : ''}${U.norm(note)}` : t.notes });
    await Audit.log('task','done',`إنجاز متابعة: ${t.title}`, id);
    return rec;
  },
  async snooze(id, days){
    const t = Repos.tasks.get(id);
    if (!t) throw new AppError('المتابعة غير موجودة','NOT_FOUND');
    const n = Math.max(1, Math.round(Number(days) || 1));
    return Repos.tasks.update(id, { dueDate:D.addDays(D.cmp(t.dueDate, D.today()) < 0 ? D.today() : t.dueDate, n) });
  },
  async closeFor(refType, refId, reason){
    let n = 0;
    for (const t of this.forRef(refType, refId).filter(x => x.status === 'open')){
      await Repos.tasks.update(t.id, { status:'cancelled', doneAt:new Date().toISOString(), notes:U.norm(reason) });
      n++;
    }
    return n;
  },
  async remove(id){
    const t = Repos.tasks.get(id);
    if (!t) throw new AppError('المتابعة غير موجودة','NOT_FOUND');
    await Repos.tasks.hardDelete(id);
    return t;
  },
  /* اقتراح متابعات من الوقائع: لا تُنشأ إلا بطلب صريح من المستخدمة، فالتذكير
     الذي يولد وحده بالمئات يُهمَل بالمئات. */
  suggest(){
    const out = [], today = D.today(), s = Settings.get();
    const hasOpen = (rt, ri) => this.forRef(rt, ri).some(t => t.status === 'open');
    Svc.members.rows().forEach(r => {
      if (r.m.archived) return;
      if (r.st.status === STATUS.EXPIRING && !hasOpen('member', r.m.id))
        out.push({ type:'renewal', title:`تجديد اشتراك ${r.m.name}`, dueDate:r.st.endDate || today,
                   refType:'member', refId:r.m.id, memberId:r.m.id, reason:`ينتهي خلال ${r.st.daysLeft} يوم` });
    });
    Svc.payments.openDues().forEach(d => {
      if (!d.member || hasOpen('member', d.member.id)) return;
      const age = Svc.payments.ageText(d.date);
      if (age.days >= 14) out.push({ type:'payment', title:`تحصيل ${Money.fmt(d.st.due)} من ${d.member.name}`,
        dueDate:today, refType:'member', refId:d.member.id, memberId:d.member.id, reason:age.text });
    });
    Svc.attendance.inactive(s.inactiveDays).forEach(x => {
      if (hasOpen('member', x.member.id)) return;
      out.push({ type:'inactive', title:`تواصلي مع ${x.member.name} — لم تحضر منذ ${x.days} يوماً`,
        dueDate:today, refType:'member', refId:x.member.id, memberId:x.member.id, reason:'مشتركة فعّالة ومنقطعة' });
    });
    Svc.docs.expiring().forEach(x => {
      if (hasOpen('doc', x.doc.id)) return;
      out.push({ type:'document', title:`تجديد «${x.doc.title}» لـ${x.member.name}`, dueDate:x.doc.expiryDate,
        refType:'doc', refId:x.doc.id, memberId:x.member.id, reason:x.daysLeft < 0 ? 'منتهٍ' : `بعد ${x.daysLeft} يوماً` });
    });
    Svc.leads.dueFollowUps().forEach(l => {
      if (hasOpen('lead', l.id)) return;
      out.push({ type:'lead', title:`متابعة ${l.name}`, dueDate:l.followUpDate, refType:'lead', refId:l.id,
                 reason:Svc.leads.stage(l.stage).ar });
    });
    Svc.members.birthdays().forEach(b => {
      if (hasOpen('birthday', b.m.id)) return;
      out.push({ type:'birthday', title:`عيد ميلاد ${b.m.name}`, dueDate:b.date, refType:'birthday', refId:b.m.id,
                 memberId:b.m.id, reason:b.inDays === 0 ? 'اليوم' : `بعد ${b.inDays} يوم` });
    });
    return U.sortBy(out, x => x.dueDate);
  },
  async createSuggested(list){
    let n = 0;
    for (const t of list || []){ try { await this.add(t); n++; } catch(e){ Log.warn('تعذّر إنشاء متابعة', e); } }
    if (n) await Audit.log('task','create',`إنشاء ${n} متابعة من الاقتراحات`);
    return n;
  }
};


/* ===== src/app/services/145-classes.js =============================================== */
/* ------------------------ الحصص المجدولة والحجز ------------------------
   الفرق الجوهري عن الإصدار السابق: كان «التدريب» قالباً متكرّراً (أيام + وقت)
   وقائمة ملتحقات ثابتة. الآن القالب يبقى كما هو، وتُولَّد منه مواعيد مؤرَّخة
   يحدث عليها ما يحدث فعلاً: حجز، انتظار، حضور، غياب، إلغاء.

   بلا موعد مؤرَّخ لا يمكن قول «كم حضرت يوم الثلاثاء» ولا «كم مقعداً بقي غداً». */
Svc.classes = {
  STATUS: { scheduled:'مجدولة', done:'انتهت', cancelled:'ملغاة' },
  BOOKING: {
    booked:   { ar:'محجوز',        cls:'chip-active' },
    waitlist: { ar:'قائمة انتظار', cls:'chip-soon'   },
    attended: { ar:'حضرت',         cls:'chip-active' },
    no_show:  { ar:'لم تحضر',      cls:'chip-expired'},
    cancelled:{ ar:'ألغت',         cls:'chip-none'   }
  },
  templates(){ return Repos.trainings.list(); },
  get(id){ return Repos.sessions.get(id); },
  ofDay(date){ return U.sortBy(Repos.sessions.list().filter(s => s.date === date), s => s.startTime); },
  between(from, to){
    return U.sortBy(Repos.sessions.list().filter(s => D.cmp(s.date, from) >= 0 && D.cmp(s.date, to) <= 0),
                    s => s.date + ' ' + s.startTime);
  },
  upcoming(days=7){ return this.between(D.today(), D.addDays(D.today(), days)); },

  validate(d){
    const r = V();
    if (!U.norm(d.title)) vErr(r,'title','اسم الحصة مطلوب');
    if (!D.isISO(d.date)) vErr(r,'date','التاريخ غير صحيح');
    if (!/^\d{2}:\d{2}$/.test(d.startTime || '')) vErr(r,'startTime','وقت البداية غير صحيح');
    if (d.endTime && !/^\d{2}:\d{2}$/.test(d.endTime)) vErr(r,'endTime','وقت النهاية غير صحيح');
    if (d.startTime && d.endTime && d.endTime <= d.startTime) vErr(r,'endTime','النهاية قبل البداية');
    const cap = Number(d.capacity);
    if (d.capacity !== '' && d.capacity != null && (!isFinite(cap) || cap < 0)) vErr(r,'capacity','السعة غير صحيحة');
    return r;
  },
  async save(id, d){
    const val = this.validate(d);
    if (!val.ok) throw new AppError('بيانات الحصة غير صحيحة','VALIDATION', val.errors);
    const cur = id ? Repos.sessions.get(id) : null;
    if (id && !cur) throw new AppError('الحصة غير موجودة','NOT_FOUND');
    const cap = Math.max(0, Math.round(Number(d.capacity) || 0));
    /* تقليل السعة تحت عدد المحجوزات فعلاً = طرد مشتركة حجزت. يُمنع صراحةً. */
    if (cur && cap > 0){
      const booked = this.bookingsOf(id).filter(b => b.status === 'booked').length;
      if (cap < booked) throw new AppError(`محجوز فيها ${booked} مقعداً — لا يمكن تقليل السعة إلى ${cap}`,'CAPACITY');
    }
    const payload = { trainingId:d.trainingId || null, title:U.norm(d.title), type:U.norm(d.type),
      date:d.date, startTime:d.startTime, endTime:d.endTime || '', coachId:d.coachId || null,
      room:U.norm(d.room), capacity:cap, status:d.status || 'scheduled',
      creditCost:Math.max(0, Math.round(Number(d.creditCost) || 0)), notes:U.norm(d.notes) };
    const rec = id ? await Repos.sessions.update(id, payload)
                   : await Repos.sessions.create(Object.assign(payload, { isDemo:!!d.isDemo }));
    await Audit.log('class', id ? 'update' : 'create', `${id ? 'تعديل' : 'جدولة'} حصة «${rec.title}» ${D.fmt(rec.date)} ${rec.startTime}`, rec.id);
    return rec;
  },
  /* توليد مواعيد من قالب متكرّر — لا يكرّر موعداً موجوداً أصلاً */
  async generateFrom(trainingId, from, to){
    const t = Repos.trainings.get(trainingId);
    if (!t) throw new AppError('القالب غير موجود','NOT_FOUND');
    if (D.cmp(to, from) < 0) throw new AppError('نطاق التواريخ غير صحيح','VALIDATION');
    if (D.diffDays(from, to) > 366) throw new AppError('النطاق أطول من سنة','VALIDATION');
    const days = t.days || [];
    const existing = new Set(Repos.sessions.list(true)
      .filter(s => s.trainingId === trainingId).map(s => `${s.date} ${s.startTime}`));
    const made = [];
    for (let d = from; D.cmp(d, to) <= 0; d = D.addDays(d, 1)){
      if (!days.includes(D.dayName(d))) continue;
      if (existing.has(`${d} ${t.time}`)) continue;
      made.push(await Repos.sessions.create({ trainingId, title:t.title, type:t.type || '', date:d,
        startTime:t.time, endTime:'', coachId:t.coachId || null, room:t.room || '',
        capacity:Math.max(0, Number(t.capacity) || 0), status:'scheduled', creditCost:0, notes:'', isDemo:!!t.isDemo }));
    }
    if (made.length) await Audit.log('class','generate',`توليد ${made.length} موعداً من قالب «${t.title}»`, trainingId);
    return made;
  },
  async cancel(id, reason){
    const s = Repos.sessions.get(id);
    if (!s) throw new AppError('الحصة غير موجودة','NOT_FOUND');
    if (s.status === 'cancelled') return s;
    /* إلغاء الحصة يعيد كل حصة كريدت استُهلكت عليها — النادي هو من ألغى */
    for (const b of this.bookingsOf(id).filter(b => b.status === 'booked' || b.status === 'waitlist')){
      await Repos.bookings.update(b.id, { status:'cancelled', cancelReason:'أُلغيت الحصة' });
      await Svc.credits.release('booking', b.id, 'أُلغيت الحصة');
    }
    const rec = await Repos.sessions.update(id, { status:'cancelled', cancelReason:U.norm(reason) });
    await Audit.log('class','cancel',`إلغاء حصة «${s.title}» ${D.fmt(s.date)}${U.norm(reason) ? ' — ' + U.norm(reason) : ''}`, id);
    return rec;
  },
  async remove(id){
    const s = Repos.sessions.get(id);
    if (!s) throw new AppError('الحصة غير موجودة','NOT_FOUND');
    if (this.bookingsOf(id).some(b => b.status === 'attended'))
      throw new AppError('سُجّل حضور على هذه الحصة — ألغيها بدل حذفها حتى لا يضيع سجل الحضور','LINKED');
    for (const b of this.bookingsOf(id)){ await Svc.credits.release('booking', b.id, 'حُذفت الحصة'); await Repos.bookings.hardDelete(b.id); }
    await Repos.sessions.hardDelete(id);
    await Audit.log('class','delete',`حذف حصة «${s.title}» ${D.fmt(s.date)}`, id);
    return s;
  },

  /* ------------------------------- الحجز ------------------------------- */
  bookingsOf(sessionId){ return U.sortBy(Repos.bookings.list().filter(b => b.sessionId === sessionId), b => b.createdAt); },
  bookingsOfMember(memberId){ return U.sortBy(Repos.bookings.list().filter(b => b.memberId === memberId), b => b.createdAt, -1); },
  seats(sessionId){
    const s = Repos.sessions.get(sessionId);
    const rows = this.bookingsOf(sessionId);
    const booked = rows.filter(b => b.status === 'booked' || b.status === 'attended').length;
    const cap = Math.max(0, Number(s && s.capacity) || 0);
    return { capacity:cap, booked, waitlist:rows.filter(b => b.status === 'waitlist').length,
             left: cap > 0 ? Math.max(0, cap - booked) : null, full: cap > 0 && booked >= cap };
  },
  /* الحجز: مقعد إن وُجد، وإلا قائمة انتظار بترتيب صريح. */
  async book(sessionId, memberId, opts){
    const s = Repos.sessions.get(sessionId);
    const m = Repos.members.get(memberId);
    if (!s) throw new AppError('الحصة غير موجودة','NOT_FOUND');
    if (!m) throw new AppError('المشتركة غير موجودة','NOT_FOUND');
    if (s.status === 'cancelled') throw new AppError('الحصة ملغاة','CANCELLED');
    const mine = this.bookingsOf(sessionId).find(b => b.memberId === memberId && b.status !== 'cancelled');
    if (mine) throw new AppError(`${m.name} محجوزة في هذه الحصة أصلاً`,'DUPLICATE');
    const seats = this.seats(sessionId);
    const waitlisted = seats.full;
    const warnings = [];
    const st = Svc.members.status(memberId);
    if (st.status !== STATUS.ACTIVE && st.status !== STATUS.EXPIRING)
      warnings.push(`تنبيه: اشتراك ${m.name} ${st.status.ar}`);
    /* الكريدت يُخصم عند أخذ مقعد فعلي فقط — لا يُخصم على قائمة انتظار */
    let credits = [];
    if (!waitlisted && Number(s.creditCost) > 0){
      credits = await Svc.credits.consume(memberId, opts && opts.kind ? opts.kind : 'class',
        { qty:s.creditCost, refType:'booking', refId:'pending', notes:`حصة ${s.title}` });
    }
    let rec;
    try {
      rec = await Repos.bookings.create({ sessionId, memberId, status: waitlisted ? 'waitlist' : 'booked',
        position: waitlisted ? seats.waitlist + 1 : 0, creditCost: waitlisted ? 0 : (Number(s.creditCost) || 0),
        notes:U.norm(opts && opts.notes), cancelReason:'', isDemo:!!s.isDemo });
    } catch(e){
      for (const c of credits){ try { await Repos.credits.hardDelete(c.id); } catch(_){} }
      throw e;
    }
    /* ربط الخصم بالحجز بعد معرفة معرّفه */
    for (const c of credits) await Repos.credits.update(c.id, { refId:rec.id });
    if (waitlisted) warnings.push(`الحصة مكتملة — ${m.name} في قائمة الانتظار بالمركز ${rec.position}`);
    await Audit.log('class', waitlisted ? 'waitlist' : 'book', `${waitlisted ? 'انتظار' : 'حجز'} ${m.name} — «${s.title}» ${D.fmt(s.date)}`, rec.id);
    return { rec, warnings, waitlisted };
  },
  /* الإلغاء يحرّر مقعداً، ويرقّي أول من في الانتظار فوراً */
  async cancelBooking(bookingId, reason){
    const b = Repos.bookings.get(bookingId);
    if (!b) throw new AppError('الحجز غير موجود','NOT_FOUND');
    if (b.status === 'cancelled') return { booking:b, promoted:null };
    const wasBooked = b.status === 'booked';
    await Repos.bookings.update(bookingId, { status:'cancelled', cancelReason:U.norm(reason) });
    await Svc.credits.release('booking', bookingId, U.norm(reason) || 'إلغاء حجز');
    let promoted = null;
    if (wasBooked) promoted = await this.promoteNext(b.sessionId);
    const m = Repos.members.get(b.memberId);
    await Audit.log('class','unbook',`إلغاء حجز ${m ? m.name : ''}${promoted ? ' — تُرقّى من قائمة الانتظار' : ''}`, bookingId);
    return { booking:Repos.bookings.get(bookingId), promoted };
  },
  /* الترقية من قائمة الانتظار: الأول في الطابور، ويُخصم كريدته عندئذٍ.
     تعذّر الخصم لا يُسقط المقعد بصمت — يبقى في الانتظار وتُنشأ متابعة. */
  async promoteNext(sessionId){
    const s = Repos.sessions.get(sessionId);
    if (!s || s.status === 'cancelled') return null;
    if (!this.seats(sessionId).left) return null;
    const next = U.sortBy(this.bookingsOf(sessionId).filter(b => b.status === 'waitlist'), b => Number(b.position) || 0)[0];
    if (!next) return null;
    if (Number(s.creditCost) > 0){
      try {
        const c = await Svc.credits.consume(next.memberId, 'class', { qty:s.creditCost, refType:'booking', refId:next.id });
        if (!c.length) return null;
      } catch(e){
        const m = Repos.members.get(next.memberId);
        await Svc.tasks.add({ title:`رصيد ${m ? m.name : ''} لا يكفي لحصة «${s.title}»`, dueDate:s.date,
          type:'general', refType:'booking', refId:next.id, memberId:next.memberId,
          notes:'شغر مقعد لكن الرصيد لا يسمح بالترقية' }).catch(() => {});
        return null;
      }
    }
    const rec = await Repos.bookings.update(next.id, { status:'booked', position:0, promotedAt:new Date().toISOString() });
    const m = Repos.members.get(next.memberId);
    await Svc.tasks.add({ title:`بلّغي ${m ? m.name : ''}: شغر مقعد في «${s.title}» ${D.fmt(s.date)}`,
      dueDate:D.today(), type:'general', refType:'booking', refId:next.id, memberId:next.memberId }).catch(() => {});
    return rec;
  },
  /* تعليم الحضور من شاشة الحصة: يسجّل حضوراً حقيقياً في سجل الحضور أيضاً */
  async mark(bookingId, status){
    const b = Repos.bookings.get(bookingId);
    if (!b) throw new AppError('الحجز غير موجود','NOT_FOUND');
    if (!['attended','no_show','booked'].includes(status)) throw new AppError('حالة غير معروفة','VALIDATION');
    const s = Repos.sessions.get(b.sessionId);
    const rec = await Repos.bookings.update(bookingId, { status });
    if (status === 'attended' && s && !Svc.attendance.hasForSession(b.memberId, s.id)){
      try {
        await Repos.attendance.create({ memberId:b.memberId, date:s.date, time:s.startTime,
          trainingId:s.trainingId || null, sessionId:s.id, method:'class', status:'in', checkOut:null,
          notes:`حصة ${s.title}`, isDemo:!!s.isDemo });
      } catch(e){ Log.warn('تعذّر تسجيل الحضور من الحصة', e); }
    }
    /* الغياب بلا إشعار لا يعيد الحصة — هذه سياسة النادي المعتادة، وتُوثَّق هنا */
    return rec;
  },
  /* أرقام الحصص لمدربة أو لفترة */
  stats(from, to, coachId){
    const rows = this.between(from, to).filter(s => !coachId || s.coachId === coachId);
    const ids = new Set(rows.map(s => s.id));
    const books = Repos.bookings.list().filter(b => ids.has(b.sessionId));
    return { sessions:rows.length, cancelled:rows.filter(s => s.status === 'cancelled').length,
             booked:books.filter(b => b.status === 'booked').length,
             attended:books.filter(b => b.status === 'attended').length,
             noShow:books.filter(b => b.status === 'no_show').length,
             waitlist:books.filter(b => b.status === 'waitlist').length,
             fillRate:(() => { const cap = U.sum(rows.filter(s => s.status !== 'cancelled'), s => Number(s.capacity) || 0);
               return cap ? U.pct(books.filter(b => b.status === 'booked' || b.status === 'attended').length, cap) : 0; })() };
  }
};

/* --------------------------- إقفال الصندوق اليومي ---------------------
   هذه ليست شاشة أرباح. الربح يقارن الإيراد بالمصروف عبر فترة؛ وهذه تقارن
   النقد الذي ينبغي أن يكون في الدرج بالنقد الموجود فيه فعلاً الليلة.

     المتوقّع = الافتتاحي + المقبوض نقداً − المصروف نقداً
     الفرق    = المعدود − المتوقّع

   لذلك تُستثنى التحويلات والبطاقات: لم تدخل الدرج أصلاً. ولذلك أيضاً لا
   يُحتسب رأس المال هنا إلا إن سُجّل نقداً في يومه. */
Svc.cashbook = {
  CASH_METHODS: ['نقد'],
  isCash(method){ return !method || this.CASH_METHODS.includes(U.norm(method)); },
  get(date){ return Repos.cashDays.list(true).find(c => c.date === date) || null; },
  recent(n=30){ return U.sortBy(Repos.cashDays.list(true), c => c.date, -1).slice(0, n); },

  /* حركة اليوم النقدية محسوبة من المصدر، لا من أرقام تُكتب يدوياً */
  movement(date){
    const paymentsIn = Repos.payments.list().filter(p => p.date === date && this.isCash(p.method));
    const otherIn = Repos.revenues.list().filter(r => r.date === date && !r.paymentId && this.isCash(r.method));
    const out = Repos.expenses.list().filter(e => e.date === date);
    const capIn = Repos.capital.list().filter(c => c.date === date && c.type === 'injection');
    const capOut = Repos.capital.list().filter(c => c.date === date && c.type === 'withdrawal');
    const cashIn = U.round2(U.sum(paymentsIn, p => p.amount) + U.sum(otherIn, r => r.amount) + U.sum(capIn, c => c.amount));
    const cashOut = U.round2(U.sum(out, e => e.amount) + U.sum(capOut, c => c.amount));
    /* غير النقدي يُعرض ليُطمأنّ إليه، ولا يدخل حساب الدرج */
    const nonCash = U.round2(U.sum(Repos.payments.list().filter(p => p.date === date && !this.isCash(p.method)), p => p.amount));
    return { date, cashIn, cashOut, nonCash,
             counts:{ payments:paymentsIn.length, otherRevenue:otherIn.length, expenses:out.length,
                      capitalIn:capIn.length, capitalOut:capOut.length, nonCash:Repos.payments.list().filter(p => p.date === date && !this.isCash(p.method)).length },
             rows:{ paymentsIn, otherIn, out, capIn, capOut } };
  },
  /* الافتتاحي: ما تبقّى معدوداً أمس، وإلا الرقم الذي ضبطه النادي */
  openingFor(date){
    const prev = U.sortBy(Repos.cashDays.list(true).filter(c => D.cmp(c.date, date) < 0 && c.closedAt), c => c.date, -1)[0];
    return prev ? U.round2(Number(prev.countedCash) || 0) : U.round2(Number(Settings.get('cashOpeningFloat')) || 0);
  },
  expected(date){
    const saved = this.get(date);
    const opening = saved && saved.openingCash != null ? Number(saved.openingCash) : this.openingFor(date);
    const mv = this.movement(date);
    return { opening:U.round2(opening), cashIn:mv.cashIn, cashOut:mv.cashOut, nonCash:mv.nonCash,
             expected:U.round2(opening + mv.cashIn - mv.cashOut), movement:mv };
  },
  preview(date){
    const e = this.expected(date);
    const saved = this.get(date);
    const counted = saved && saved.countedCash != null ? Number(saved.countedCash) : null;
    return Object.assign(e, { counted, saved,
      difference: counted == null ? null : U.round2(counted - e.expected),
      closed: !!(saved && saved.closedAt) });
  },
  validate(d){
    const r = V();
    if (!D.isISO(d.date)) vErr(r,'date','التاريخ غير صحيح');
    else if (D.cmp(d.date, D.today()) > 0) vErr(r,'date','لا يُقفَل يوم لم يأتِ بعد');
    if (!Validate.nonNeg(d.countedCash)) vErr(r,'countedCash','المبلغ المعدود غير صحيح');
    if (d.openingCash !== '' && d.openingCash != null && !Validate.nonNeg(d.openingCash))
      vErr(r,'openingCash','الرصيد الافتتاحي غير صحيح');
    return r;
  },
  /* الإقفال يثبّت الأرقام كما كانت لحظة العدّ. فرقٌ بلا تفسير يُمنع: السطر
     الفارغ في دفتر الصندوق هو ما يُخفي السرقة والخطأ معاً. */
  async close(d){
    const val = this.validate(d);
    if (!val.ok) throw new AppError('بيانات الإقفال غير صحيحة','VALIDATION', val.errors);
    const existing = this.get(d.date);
    if (existing && existing.closedAt && !d.reopen)
      throw new AppError('هذا اليوم مُقفل — افتحيه أولاً إن أردت تعديله','CLOSED');
    const opening = d.openingCash === '' || d.openingCash == null ? this.openingFor(d.date) : Money.clean(d.openingCash);
    const mv = this.movement(d.date);
    const expected = U.round2(opening + mv.cashIn - mv.cashOut);
    const counted = U.round2(Money.clean(d.countedCash));
    const difference = U.round2(counted - expected);
    if (Math.abs(difference) > 0.009 && !U.norm(d.notes))
      throw new AppError(`الفرق ${Money.fmt(difference)} — اكتبي سبب الفرق قبل الإقفال`,'VALIDATION',
                         { notes:'وضّحي سبب الفرق بين المعدود والمتوقّع' });
    const payload = { date:d.date, openingCash:U.round2(opening), cashIn:mv.cashIn, cashOut:mv.cashOut,
      nonCash:mv.nonCash, expectedCash:expected, countedCash:counted, difference,
      notes:U.norm(d.notes), closedBy:Auth.session.actorName || '', closedAt:new Date().toISOString() };
    const rec = existing ? await Repos.cashDays.update(existing.id, payload)
                         : await Repos.cashDays.create(Object.assign(payload, { isDemo:!!d.isDemo }));
    await Audit.log('cash','close',
      `إقفال صندوق ${D.fmt(d.date)}: متوقّع ${Money.fmt(expected)}، معدود ${Money.fmt(counted)}، الفرق ${Money.fmt(difference)}`, rec.id);
    return rec;
  },
  async reopen(date, reason){
    const rec = this.get(date);
    if (!rec || !rec.closedAt) throw new AppError('هذا اليوم غير مُقفل','NOT_FOUND');
    const out = await Repos.cashDays.update(rec.id, { closedAt:null, reopenedAt:new Date().toISOString(),
      reopenReason:U.norm(reason), reopenedBy:Auth.session.actorName || '' });
    await Audit.log('cash','reopen',`إعادة فتح صندوق ${D.fmt(date)}${U.norm(reason) ? ' — ' + U.norm(reason) : ''}`, rec.id);
    return out;
  },
  /* أيام مضت بلا إقفال — ثغرة تشغيلية تستحق التنبيه */
  missing(days=14){
    const out = [];
    for (let i = 1; i <= days; i++){
      const d = D.addDays(D.today(), -i);
      const rec = this.get(d);
      if (rec && rec.closedAt) continue;
      const mv = this.movement(d);
      if (mv.cashIn > 0 || mv.cashOut > 0) out.push({ date:d, cashIn:mv.cashIn, cashOut:mv.cashOut });
    }
    return out;
  },
  summary(from, to){
    const rows = Repos.cashDays.list(true).filter(c => c.closedAt
      && (!from || D.cmp(c.date, from) >= 0) && (!to || D.cmp(c.date, to) <= 0));
    return { days:rows.length, shortages:rows.filter(c => c.difference < -0.009).length,
             overages:rows.filter(c => c.difference > 0.009).length,
             net:U.round2(U.sum(rows, c => c.difference)), rows:U.sortBy(rows, c => c.date, -1) };
  }
};

/* -------------------------------- الموردون ---------------------------- */
Svc.suppliers = {
  list(inclArchived=false){ return Repos.suppliers.list(inclArchived); },
  get(id){ return Repos.suppliers.get(id); },
  validate(d, all, id){
    const r = V();
    if (!U.norm(d.name)) vErr(r,'name','اسم المورّد مطلوب');
    if (d.phone && !/^[0-9+\-\s]{7,20}$/.test(String(d.phone).trim())) vErr(r,'phone','رقم الهاتف غير صحيح');
    const dupe = (all||[]).find(x => x.id !== id && U.normAr(x.name) === U.normAr(d.name));
    if (dupe) vErr(r,'name','يوجد مورّد بنفس الاسم');
    return r;
  },
  async save(id, d){
    const val = this.validate(d, Repos.suppliers.list(true), id);
    if (!val.ok) throw new AppError('بيانات المورّد غير صحيحة','VALIDATION', val.errors);
    const payload = { name:U.norm(d.name), phone:U.norm(d.phone), contact:U.norm(d.contact),
      address:U.norm(d.address), notes:U.norm(d.notes) };
    const rec = id ? await Repos.suppliers.update(id, payload)
                   : await Repos.suppliers.create(Object.assign(payload, { isDemo:!!d.isDemo }));
    await Audit.log('supplier', id ? 'update' : 'create', `${id ? 'تعديل' : 'إضافة'} مورّد: ${rec.name}`, rec.id);
    return rec;
  },
  async archive(id, on=true){
    const s = Repos.suppliers.get(id);
    const rec = await Repos.suppliers.archive(id, on);
    await Audit.log('supplier', on ? 'archive' : 'restore', `${on ? 'أرشفة' : 'استرجاع'} مورّد: ${s ? s.name : id}`, id);
    return rec;
  },
  /* تاريخ الشراء من مورّد: يُقرأ من حركات المخزون، بلا جدول موازٍ يشرد */
  purchases(supplierId){
    const s = Repos.suppliers.get(supplierId);
    if (!s) return [];
    const byName = U.normAr(s.name);
    return U.sortBy(Repos.stockMoves.list().filter(m => {
      if (m.type !== 'purchase') return false;
      if (m.supplierId) return m.supplierId === supplierId;
      const p = Repos.products.get(m.productId);
      return p && U.normAr(p.supplier) === byName;        /* توافق مع ما سُجّل قبل وجود جدول الموردين */
    }), m => m.date, -1).map(m => ({ move:m, product:Repos.products.get(m.productId),
      total:U.round2(Math.abs(Number(m.qty) || 0) * (Number(m.unitCost) || 0)) }));
  },
  stats(supplierId){
    const rows = this.purchases(supplierId);
    return { count:rows.length, total:U.round2(U.sum(rows, r => r.total)),
             last:rows.length ? rows[0].move.date : null,
             products:new Set(rows.map(r => r.move.productId)).size };
  }
};
