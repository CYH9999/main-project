/* ===== src/app/domain/00-calc.js ===================================================== */
/* ============================ Calculators ================================
   دوال صرفة: نفس المدخلات ⇒ نفس المخرجات. لا تلمس الواجهة ولا قاعدة البيانات. */
const STATUS = {
  ACTIVE:      { key:'ACTIVE',        ar:'فعّال',           cls:'chip-active'  },
  EXPIRING:    { key:'EXPIRING_SOON', ar:'قارب الانتهاء',   cls:'chip-soon'    },
  EXPIRED:     { key:'EXPIRED',       ar:'منتهٍ',           cls:'chip-expired' },
  SCHEDULED:   { key:'SCHEDULED',     ar:'يبدأ لاحقاً',      cls:'chip-susp'    },
  SUSPENDED:   { key:'SUSPENDED',     ar:'موقوف',           cls:'chip-susp'    },
  FROZEN:      { key:'FROZEN',        ar:'مجمّد',            cls:'chip-frozen'  },
  NEVER:       { key:'NEVER',         ar:'بلا اشتراك',      cls:'chip-none'    }
};
const Calc = {
  /* حالة المشتركة تُحسب دائماً من التواريخ — لا تُخزَّن أبداً */
  /* freezes اختيارية: الاستدعاءات القديمة بأربع وسائط تعمل كما كانت تماماً،
     ومن يمرّر فترات التجميد يحصل على الحالة «مجمّد» في يومها. */
  memberStatus(subs, today, soonDays, suspended, freezes){
    const list = (subs||[]).filter(s => !s.archived);
    if (suspended) return { status:STATUS.SUSPENDED, current:null, daysLeft:null, endDate:null };
    if (!list.length) return { status:STATUS.NEVER, current:null, daysLeft:null, endDate:null };
    const active = U.sortBy(list.filter(s => D.cmp(s.startDate, today) <= 0 && D.cmp(s.endDate, today) >= 0), s=>s.endDate, -1)[0];
    if (active){
      const frozen = (freezes||[]).find(f => f.subId === active.id && !f.cancelled
        && D.cmp(today, f.from) >= 0 && D.cmp(today, f.to) <= 0);
      if (frozen)
        return { status:STATUS.FROZEN, current:active, daysLeft:D.diffDays(today, active.endDate),
                 endDate:active.endDate, freeze:frozen };
      const left = D.diffDays(today, active.endDate);
      return { status: left <= (soonDays||7) ? STATUS.EXPIRING : STATUS.ACTIVE, current:active, daysLeft:left, endDate:active.endDate };
    }
    const future = U.sortBy(list.filter(s => D.cmp(s.startDate, today) > 0), s=>s.startDate)[0];
    if (future) return { status:STATUS.SCHEDULED, current:future, daysLeft:D.diffDays(today, future.startDate), endDate:future.endDate };
    const last = U.sortBy(list, s=>s.endDate, -1)[0];
    return { status:STATUS.EXPIRED, current:null, daysLeft:D.diffDays(today, last.endDate), endDate:last.endDate };
  },
  /* عدد الاشتراكات المتتالية في النهاية (الفجوة المسموحة بالأيام)
     ملاحظة: التجديد المبكّر يُنتج فجوة سالبة (تداخل) وهو استمرار وليس انقطاعاً. */
  consecutiveRun(subs, gapDays){
    const list = U.sortBy((subs||[]).filter(s=>!s.archived), s=>s.startDate);
    if (!list.length) return 0;
    let run = 1;
    for (let i = list.length-1; i > 0; i--){
      const gap = D.diffDays(list[i-1].endDate, list[i].startDate);
      if (gap <= (gapDays==null?15:gapDays) + 1) run++; else break;
    }
    return run;
  },
  memberStats(subs){
    const list = (subs||[]).filter(s=>!s.archived);
    const sorted = U.sortBy(list, s=>s.startDate);
    return {
      count: list.length,
      totalPaid: U.sum(list, s=>s.finalPrice),
      firstStart: sorted.length ? sorted[0].startDate : null,
      lastEnd: sorted.length ? U.sortBy(list, s=>s.endDate, -1)[0].endDate : null,
      lastStart: sorted.length ? sorted[sorted.length-1].startDate : null
    };
  },
  /* ------------------------------ المالية ------------------------------ */
  inRange(rows, from, to){ return rows.filter(r => !r.archived && (!from || D.cmp(r.date, from) >= 0) && (!to || D.cmp(r.date, to) <= 0)); },
  revenue(revenues, from, to){ return U.sum(this.inRange(revenues, from, to), r=>r.amount); },
  expenses(expenses, from, to){ return U.sum(this.inRange(expenses, from, to), r=>r.amount); },
  netProfit(revenues, expenses, from, to){ return U.round2(this.revenue(revenues, from, to) - this.expenses(expenses, from, to)); },
  capitalIn(capital, from, to){ return U.sum(this.inRange(capital, from, to).filter(c=>c.type==='injection'), c=>c.amount); },
  withdrawals(capital, from, to){ return U.sum(this.inRange(capital, from, to).filter(c=>c.type==='withdrawal'), c=>c.amount); },
  /* رأس المال المتبقي = ما ضُخّ − ما سُحب (لا علاقة له بالإيرادات) */
  capitalBalance(capital){ return U.round2(this.capitalIn(capital) - this.withdrawals(capital)); },
  /* السيولة = رأس المال المضخوخ + الإيرادات − المصروفات − السحوبات */
  cash(revenues, expenses, capital){
    return U.round2(this.capitalIn(capital) + this.revenue(revenues) - this.expenses(expenses) - this.withdrawals(capital));
  },
  partnerShare(netProfit, percent){ return U.round2((Number(netProfit)||0) * (Number(percent)||0) / 100); },
  bySource(revenues, from, to){
    const g = U.groupBy(this.inRange(revenues, from, to), r=>r.source||'other');
    return Object.keys(g).map(k => ({ key:k, total:U.sum(g[k], r=>r.amount), count:g[k].length }));
  },
  byCategory(expenses, from, to){
    const g = U.groupBy(this.inRange(expenses, from, to), r=>r.categoryId||'none');
    return Object.keys(g).map(k => ({ key:k, total:U.sum(g[k], r=>r.amount), count:g[k].length }));
  },
  monthlySeries(revenues, expenses, months){
    return months.map(k => {
      const from = D.startOfMonth(k), to = D.endOfMonth(k);
      const rev = this.revenue(revenues, from, to), exp = this.expenses(expenses, from, to);
      return { month:k, revenue:rev, expense:exp, net:U.round2(rev-exp) };
    });
  },
  /* ------------------------------ الرواتب ------------------------------ */
  payrollNet(rec){
    const add = U.sum(rec.additions||[], x=>x.amount);
    const ded = U.sum(rec.deductions||[], x=>x.amount);
    const adv = U.sum(rec.advances||[], x=>x.amount);
    return { additions:add, deductions:ded, advances:adv, net:U.round2((Number(rec.baseSalary)||0) + add - ded - adv) };
  },
  /* ---------------------------- المقبوضات ----------------------------
     قاعدة مالية واحدة: «المستحق» من المستند، و«المقبوض» من سجل الدفعات فقط.
     لا يُعتبر أي مبلغ مقبوضاً لمجرد أنه مكتوب في الاشتراك أو الفاتورة. */
  paidOf(payments){ return U.round2(U.sum((payments||[]).filter(x=>!x.archived), x=>x.amount)); },
  /* الحالة المالية لأي مستند (اشتراك أو فاتورة بيع) */
  payStatus(total, paid){
    const t = U.round2(Number(total)||0), p = U.round2(Number(paid)||0);
    const due = U.round2(t - p);
    if (t <= 0)  return { total:t, paid:p, due:0,   key:'FREE',    ar:'مجاني',      cls:'chip-none'   };
    if (due <= 0) return { total:t, paid:p, due:0,  key:'PAID',    ar:'مدفوع',      cls:'chip-active' };
    if (p > 0)   return { total:t, paid:p, due,     key:'PARTIAL', ar:'مدفوع جزئياً', cls:'chip-soon'   };
    return         { total:t, paid:p, due,          key:'UNPAID',  ar:'غير مدفوع',   cls:'chip-expired' };
  },
  /* مجموع ما لم يُقبض بعد عبر مجموعة مستندات — مصدر واحد لرقم «الذمم» */
  receivables(docs, paidByRef){
    let due = 0, count = 0;
    (docs||[]).filter(d=>!d.archived).forEach(d => {
      const st = this.payStatus(d.finalPrice != null ? d.finalPrice : d.total, paidByRef[d.id] || 0);
      if (st.due > 0){ due += st.due; count++; }
    });
    return { due:U.round2(due), count };
  },
  /* ---------------------------- المخزون ------------------------------
     الرصيد لا يُخزَّن في حقل — يُجمع من الحركات. حقل الرصيد يَشرد مع الوقت،
     ومجموع الحركات يبقى صحيحاً دائماً وقابلاً للتدقيق حركةً حركة. */
  onHand(moves){ return U.round2(U.sum((moves||[]).filter(m=>!m.archived), m=>m.qty)); },
  stockValue(onHand, cost){ return U.round2((Number(onHand)||0) * (Number(cost)||0)); },
  /* ---------------------------- فاتورة بيع ---------------------------- */
  saleLineTotal(line){
    const qty = Number(line.qty)||0, up = Number(line.unitPrice)||0, dsc = Number(line.discount)||0;
    return U.round2(Math.max(0, qty*up - dsc));
  },
  saleTotals(lines, invoiceDiscount){
    const subtotal = U.round2(U.sum(lines||[], l => this.saleLineTotal(l)));
    const disc = Math.min(subtotal, Math.max(0, Number(invoiceDiscount)||0));
    return { subtotal, discount:U.round2(disc), total:U.round2(subtotal - disc),
             items:U.round2(U.sum(lines||[], l=>Number(l.qty)||0)) };
  },
  /* ربح البيع = المبيعات − تكلفة ما بيع (من تكلفة الصنف وقت البيع) */
  saleProfit(sales, costByProduct, from, to){
    let revenue = 0, cost = 0;
    this.inRange(sales, from, to).forEach(sl => {
      revenue += Number(sl.total)||0;
      (sl.lines||[]).forEach(l => { cost += (Number(l.qty)||0) * (Number(l.unitCost != null ? l.unitCost : (costByProduct[l.productId]||0))||0); });
    });
    return { revenue:U.round2(revenue), cost:U.round2(cost), profit:U.round2(revenue-cost) };
  },
  memberLTV(subs){ return U.sum((subs||[]).filter(s=>!s.archived), s=>s.finalPrice); }
};


/* ===== src/app/domain/10-validate.js ================================================= */
/* ============================== Validators ===============================
   كل Validator يرجع { ok, errors:{field:msg}, warnings:[] } */
function V(){ return { ok:true, errors:{}, warnings:[] }; }
function vErr(r, f, m){ r.ok = false; r.errors[f] = m; return r; }
const Validate = {
  positive(v){ const n = Money.clean(v); return isFinite(n) && n > 0; },
  nonNeg(v){ const n = Money.clean(v); return isFinite(n) && n >= 0; },
  member(d, allMembers, id){
    const r = V();
    if (!U.norm(d.name)) vErr(r,'name','الاسم مطلوب');
    else if (U.norm(d.name).length < 2) vErr(r,'name','الاسم قصير جداً');
    if (d.phone && !/^[0-9+\-\s]{7,20}$/.test(String(d.phone).trim())) vErr(r,'phone','رقم الهاتف غير صحيح');
    if (d.joinDate && !D.isISO(d.joinDate)) vErr(r,'joinDate','تاريخ غير صحيح');
    const dupe = (allMembers||[]).find(m => m.id !== id && d.phone && U.norm(m.phone) && U.norm(m.phone) === U.norm(d.phone));
    if (dupe) r.warnings.push(`الرقم مسجّل أيضاً باسم ${dupe.name}`);
    const dupeName = (allMembers||[]).find(m => m.id !== id && U.normAr(m.name) === U.normAr(d.name));
    if (dupeName) r.warnings.push('يوجد اسم مطابق مسجّل مسبقاً');
    /* الحقول الاختيارية تُفحص فقط إذا مُلئت — لا يجوز أن يمنع حقل اختياري الحفظ */
    if (U.norm(d.phone2) && !/^[0-9+\-\s]{7,20}$/.test(U.norm(d.phone2))) vErr(r,'phone2','رقم الهاتف الثاني غير صحيح');
    if (U.norm(d.email) && !/^[^@\s]+@[^@\s.]+\.[^@\s]+$/.test(U.norm(d.email))) vErr(r,'email','البريد الإلكتروني غير صحيح');
    if (d.birthDate && !D.isISO(d.birthDate)) vErr(r,'birthDate','تاريخ الميلاد غير صحيح');
    else if (d.birthDate && D.cmp(d.birthDate, D.today()) > 0) vErr(r,'birthDate','تاريخ الميلاد في المستقبل');
    else if (d.birthDate && D.diffDays(d.birthDate, D.today()) > 130*365) vErr(r,'birthDate','تاريخ الميلاد أقدم من المعقول');
    if (d.joinDate && D.isISO(d.joinDate) && D.cmp(d.joinDate, D.today()) > 0) r.warnings.push('تاريخ الانضمام في المستقبل');
    if (d.idExpiry && !D.isISO(d.idExpiry)) vErr(r,'idExpiry','تاريخ انتهاء الوثيقة غير صحيح');
    if (d.emergency && U.norm(d.emergency.phone) && !/^[0-9+\-\s]{7,20}$/.test(U.norm(d.emergency.phone)))
      vErr(r,'emergencyPhone','رقم الطوارئ غير صحيح');
    return r;
  },
  /* المهتمّة قبل أن تصبح مشتركة: الاسم فقط إلزامي — الباقي يُجمع أثناء المتابعة */
  lead(d, allLeads, id){
    const r = V();
    if (!U.norm(d.name)) vErr(r,'name','الاسم مطلوب');
    else if (U.norm(d.name).length < 2) vErr(r,'name','الاسم قصير جداً');
    if (d.phone && !/^[0-9+\-\s]{7,20}$/.test(String(d.phone).trim())) vErr(r,'phone','رقم الهاتف غير صحيح');
    if (d.followUpDate && !D.isISO(d.followUpDate)) vErr(r,'followUpDate','تاريخ المتابعة غير صحيح');
    if (d.stage === 'lost' && !U.norm(d.lostReason)) vErr(r,'lostReason','اكتبي سبب عدم الاشتراك — هذه أهم معلومة في السجل');
    const dupe = (allLeads||[]).find(l => l.id !== id && d.phone && U.norm(l.phone) && U.norm(l.phone) === U.norm(d.phone));
    if (dupe) r.warnings.push(`الرقم مسجّل أيضاً باسم ${dupe.name}`);
    const asMember = Repos.members.list(true).find(m => d.phone && U.norm(m.phone) && U.norm(m.phone) === U.norm(d.phone));
    if (asMember) r.warnings.push(`هذا الرقم لمشتركة مسجّلة بالفعل: ${asMember.name}`);
    return r;
  },
  task(d){
    const r = V();
    if (!U.norm(d.title)) vErr(r,'title','عنوان المتابعة مطلوب');
    if (!D.isISO(d.dueDate)) vErr(r,'dueDate','تاريخ الاستحقاق غير صحيح');
    return r;
  },
  subscription(d, memberSubs){
    const r = V();
    if (!d.memberId) vErr(r,'memberId','اختاري المشتركة');
    if (!D.isISO(d.startDate)) vErr(r,'startDate','تاريخ البداية غير صحيح');
    if (!D.isISO(d.endDate)) vErr(r,'endDate','تاريخ الانتهاء غير صحيح');
    if (D.isISO(d.startDate) && D.isISO(d.endDate) && D.cmp(d.endDate, d.startDate) < 0)
      vErr(r,'endDate','تاريخ الانتهاء قبل تاريخ البداية');
    if (d.price === '' || d.price == null) vErr(r,'price','أدخلي السعر (اكتبي 0 للاشتراك المجاني)');
    else if (!this.nonNeg(d.price)) vErr(r,'price','السعر غير صحيح');
    if (D.isISO(d.startDate) && D.isISO(d.endDate) && DUR.days(d.startDate, d.endDate) > 3650)
      vErr(r,'endDate','المدة أطول من عشر سنوات — تأكدي من التواريخ');
    if (Money.clean(d.discount||0) < 0) vErr(r,'discount','الخصم لا يكون سالباً');
    if (Money.clean(d.discount||0) > Money.clean(d.price||0)) vErr(r,'discount','الخصم أكبر من السعر');
    const overlap = (memberSubs||[]).filter(s => !s.archived && s.id !== d.id &&
      D.cmp(d.startDate, s.endDate) <= 0 && D.cmp(d.endDate, s.startDate) >= 0);
    if (overlap.length) r.warnings.push('هذه الفترة تتداخل مع اشتراك سابق لنفس المشتركة');
    return r;
  },
  money(d, kind){
    const r = V();
    if (!D.isISO(d.date)) vErr(r,'date','التاريخ غير صحيح');
    if (!this.positive(d.amount)) vErr(r,'amount','المبلغ يجب أن يكون أكبر من صفر');
    if (kind === 'expense' && !d.categoryId) vErr(r,'categoryId','اختاري التصنيف');
    if (kind === 'revenue' && !d.source) vErr(r,'source','اختاري مصدر الإيراد');
    if (!U.norm(d.description)) vErr(r,'description','الوصف مطلوب');
    return r;
  },
  staff(d){
    const r = V();
    if (!U.norm(d.name)) vErr(r,'name','الاسم مطلوب');
    if (!U.norm(d.role)) vErr(r,'role','الوظيفة مطلوبة');
    if (!this.nonNeg(d.baseSalary)) vErr(r,'baseSalary','الراتب غير صحيح');
    if (d.hireDate && !D.isISO(d.hireDate)) vErr(r,'hireDate','تاريخ التعيين غير صحيح');
    return r;
  },
  payroll(d){
    const r = V();
    if (!/^\d{4}-\d{2}$/.test(d.period||'')) vErr(r,'period','الشهر غير صحيح');
    if (!this.nonNeg(d.baseSalary)) vErr(r,'baseSalary','الراتب الأساسي غير صحيح');
    const bad = [...(d.additions||[]), ...(d.deductions||[]), ...(d.advances||[])].some(x => !this.positive(x.amount));
    if (bad) vErr(r,'lines','كل بند يجب أن يحمل مبلغاً أكبر من صفر');
    if (Calc.payrollNet(d).net < 0) r.warnings.push('صافي الراتب سالب — راجعي الخصومات والسلف');
    return r;
  },
  partner(d, allPartners, id){
    const r = V();
    if (!U.norm(d.name)) vErr(r,'name','اسم الشريك مطلوب');
    const p = Money.clean(d.sharePercent);
    if (!isFinite(p) || p < 0 || p > 100) vErr(r,'sharePercent','النسبة بين 0 و100');
    const others = U.sum((allPartners||[]).filter(x => x.id !== id && !x.archived), x=>x.sharePercent);
    if (isFinite(p) && U.round2(others + p) > 100) vErr(r,'sharePercent',`مجموع الحصص سيتجاوز 100% (المسجّل حالياً ${U.round2(others)}%)`);
    return r;
  },
  /* الخطة = مدة فقط. لا سعر فيها إطلاقاً حتى لا تفرض سعراً على المشتركة. */
  plan(d){
    const r = V();
    if (!U.norm(d.name)) vErr(r,'name','اسم المدة مطلوب');
    if (!DUR.UNITS.includes(d.durationUnit)) vErr(r,'durationUnit','وحدة المدة غير صحيحة');
    const v = Number(d.durationValue);
    if (!isFinite(v) || v < 1) vErr(r,'durationValue','المدة يجب أن تكون 1 أو أكثر');
    else if (v > 3650) vErr(r,'durationValue','المدة أطول من المسموح');
    return r;
  },
  capital(d){
    const r = V();
    if (!D.isISO(d.date)) vErr(r,'date','التاريخ غير صحيح');
    if (!this.positive(d.amount)) vErr(r,'amount','المبلغ يجب أن يكون أكبر من صفر');
    if (!['injection','withdrawal'].includes(d.type)) vErr(r,'type','نوع الحركة غير صحيح');
    if (!U.norm(d.description)) vErr(r,'description','الوصف مطلوب');
    return r;
  },
  training(d){
    const r = V();
    if (!U.norm(d.title)) vErr(r,'title','اسم الحصة مطلوب');
    if (!/^\d{2}:\d{2}$/.test(d.time||'')) vErr(r,'time','الوقت غير صحيح');
    if (!(d.days||[]).length) vErr(r,'days','اختاري أيام الحصة');
    if (d.capacity && (!isFinite(Number(d.capacity)) || Number(d.capacity) < 0)) vErr(r,'capacity','السعة غير صحيحة');
    return r;
  },
  exercise(d){
    const r = V();
    if (!U.norm(d.name)) vErr(r,'name','اسم التمرين مطلوب');
    ['sets','reps','rest','duration'].forEach(f => { if (d[f] !== '' && d[f] != null && Number(d[f]) < 0) vErr(r,f,'قيمة غير صحيحة'); });
    return r;
  },
  product(d, allProducts, id){
    const r = V();
    if (!U.norm(d.name)) vErr(r,'name','اسم الصنف مطلوب');
    if (!this.nonNeg(d.price)) vErr(r,'price','سعر البيع غير صحيح');
    if (d.cost !== '' && d.cost != null && !this.nonNeg(d.cost)) vErr(r,'cost','سعر التكلفة غير صحيح');
    if (d.minStock !== '' && d.minStock != null && !this.nonNeg(d.minStock)) vErr(r,'minStock','حد التنبيه غير صحيح');
    if (U.norm(d.sku)){
      const dup = (allProducts||[]).find(x => x.id !== id && U.normAr(x.sku) === U.normAr(d.sku));
      if (dup) vErr(r,'sku',`الرمز مستعمل للصنف «${dup.name}»`);
    }
    if (isFinite(Money.clean(d.cost)) && isFinite(Money.clean(d.price)) && Money.clean(d.price) > 0
        && Money.clean(d.cost) > Money.clean(d.price)) r.warnings.push('سعر البيع أقل من التكلفة — ستبيعين بخسارة');
    return r;
  },
  stockMove(d, onHand, product){
    const r = V();
    if (!D.isISO(d.date)) vErr(r,'date','التاريخ غير صحيح');
    const q = Money.clean(d.qty);
    if (!(isFinite(q) && q > 0)) vErr(r,'qty','الكمية يجب أن تكون أكبر من صفر');
    if (!['purchase','adjust_in','sale','consume','adjust_out','return'].includes(d.type)) vErr(r,'type','نوع الحركة غير صحيح');
    const isOut = ['consume','adjust_out','sale'].includes(d.type);
    if (isOut && product && product.stockTracked !== false && isFinite(q) && q > (Number(onHand)||0))
      vErr(r,'qty',`الرصيد الحالي ${U.round2(onHand)} فقط — لا يمكن إخراج ${U.round2(q)}`);
    if (d.type === 'purchase' && d.unitCost !== '' && d.unitCost != null && !this.nonNeg(d.unitCost))
      vErr(r,'unitCost','سعر التكلفة غير صحيح');
    return r;
  },
  sale(d, stockIdx){
    const r = V();
    if (!D.isISO(d.date)) vErr(r,'date','تاريخ الفاتورة غير صحيح');
    const lines = (d.lines||[]).filter(l => l.productId || U.norm(l.name));
    if (!lines.length) vErr(r,'lines','أضيفي بنداً واحداً على الأقل');
    lines.forEach(l => {
      if (!(Number(l.qty) > 0)) vErr(r,'lines','كل بند يحتاج كمية أكبر من صفر');
      else if (!this.nonNeg(l.unitPrice)) vErr(r,'lines','سعر البند غير صحيح');
    });
    /* لا نبيع ما ليس في المخزن: البيع على المكشوف يفسد الجرد والتكلفة معاً */
    if (stockIdx){
      const need = {};
      lines.forEach(l => { if (l.productId) need[l.productId] = (need[l.productId]||0) + (Number(l.qty)||0); });
      Object.keys(need).forEach(pid => {
        const pr = Repos.products.get(pid);
        if (pr && pr.stockTracked !== false && need[pid] > (stockIdx[pid]||0) + 0.001)
          vErr(r,'lines',`«${pr.name}»: الرصيد ${U.round2(stockIdx[pid]||0)} والمطلوب ${U.round2(need[pid])}`);
      });
    }
    const totals = Calc.saleTotals(lines, d.discount);
    if (Money.clean(d.discount||0) < 0) vErr(r,'discount','الخصم لا يكون سالباً');
    else if (Money.clean(d.discount||0) > totals.subtotal) vErr(r,'discount','الخصم أكبر من قيمة الفاتورة');
    const paid = Money.clean(d.paidAmount||0) || 0;
    if (paid < 0) vErr(r,'paidAmount','المقبوض لا يكون سالباً');
    else if (paid > totals.total + 0.001) vErr(r,'paidAmount',`المقبوض أكبر من إجمالي الفاتورة (${Money.fmt(totals.total)})`);
    return r;
  },
  offer(d){
    const r = V();
    if (!U.norm(d.name)) vErr(r,'name','اسم العرض مطلوب');
    if (!['consecutive_subs','total_subs','lapsed_days','total_spend'].includes(d.ruleType)) vErr(r,'ruleType','نوع الشرط غير صحيح');
    if (!this.positive(d.ruleValue)) vErr(r,'ruleValue','قيمة الشرط غير صحيحة');
    if (!['free','percent','fixed'].includes(d.rewardType)) vErr(r,'rewardType','نوع المكافأة غير صحيح');
    if (d.rewardType === 'percent'){ const v = Money.clean(d.rewardValue); if (!(v > 0 && v <= 100)) vErr(r,'rewardValue','النسبة بين 1 و100'); }
    if (d.rewardType === 'fixed' && !this.positive(d.rewardValue)) vErr(r,'rewardValue','المبلغ غير صحيح');
    return r;
  }
};


/* ===== src/app/domain/20-offers.js =================================================== */
/* ============================== Offer engine =============================
   الأهلية تُحسب من سجل الاشتراكات الحقيقي — لا تُمنح يدوياً بلا سبب. */
const RULE_LABEL = {
  consecutive_subs:'اشتراكات متتالية', total_subs:'مجموع الاشتراكات',
  lapsed_days:'انقطاع بالأيام', total_spend:'مجموع ما دفعته'
};
const Offers = {
  rewardText(o){
    if (o.rewardType === 'free') return 'اشتراك مجاني';
    if (o.rewardType === 'percent') return `خصم ${o.rewardValue}%`;
    return `خصم ${Money.fmt(o.rewardValue)}`;
  },
  conditionText(o){
    const v = o.ruleValue;
    if (o.ruleType === 'consecutive_subs') return `${v} اشتراكات متتالية`;
    if (o.ruleType === 'total_subs') return `${v} اشتراكات إجمالاً`;
    if (o.ruleType === 'lapsed_days') return `انقطاع ${v} يوماً أو أكثر`;
    return `دفعت ${Money.fmt(v)} أو أكثر`;
  },
  /* تقييم عرض واحد لمشتركة واحدة */
  evaluate(offer, subs, today, gapDays){
    if (!offer.active) return { eligible:false, reason:'العرض متوقف' };
    const all = U.sortBy((subs||[]).filter(s=>!s.archived), s=>s.startDate);
    const usedCount = all.filter(s => s.offerId === offer.id).length;
    const max = Number(offer.maxPerMember)||0;
    if (max > 0 && usedCount >= max && !offer.autoReset)
      return { eligible:false, reason:`استُخدم ${usedCount} مرة (الحد ${max})` };
    let pool = all;
    if (offer.autoReset){
      let lastIdx = -1;
      all.forEach((s,i) => { if (s.offerId === offer.id) lastIdx = i; });
      pool = all.slice(lastIdx+1);
    }
    const v = Number(offer.ruleValue)||0;
    switch(offer.ruleType){
      case 'consecutive_subs': {
        const run = Calc.consecutiveRun(pool, gapDays);
        return run >= v ? { eligible:true, reason:`${run} اشتراكات متتالية بلا انقطاع` }
                        : { eligible:false, reason:`${run} من ${v} اشتراكات متتالية` };
      }
      case 'total_subs':
        return pool.length >= v ? { eligible:true, reason:`${pool.length} اشتراكات مسجّلة` }
                                : { eligible:false, reason:`${pool.length} من ${v} اشتراكات` };
      case 'lapsed_days': {
        if (!pool.length) return { eligible:false, reason:'لا يوجد اشتراك سابق' };
        const lastEnd = U.sortBy(pool, s=>s.endDate, -1)[0].endDate;
        const gone = D.diffDays(lastEnd, today);
        return gone >= v ? { eligible:true, reason:`منقطعة منذ ${gone} يوماً` }
                         : { eligible:false, reason:`مضى ${Math.max(gone,0)} من ${v} يوماً` };
      }
      case 'total_spend': {
        const paid = U.sum(pool, s=>s.finalPrice);
        return paid >= v ? { eligible:true, reason:`دفعت ${Money.fmt(paid)}` }
                         : { eligible:false, reason:`دفعت ${Money.fmt(paid)} من ${Money.fmt(v)}` };
      }
      default: return { eligible:false, reason:'شرط غير معروف' };
    }
  },
  /* subs اختيارية: تُمرَّر من فهرس جاهز عند تقييم مئات المشتركات دفعة واحدة */
  forMember(memberId, subs){
    const list = subs || Svc.subs.ofMember(memberId);
    const today = D.today(), gap = Settings.get('consecutiveGapDays');
    return Repos.offers.list().map(o => Object.assign({ offer:o }, this.evaluate(o, list, today, gap)));
  },
  eligibleForMember(memberId, subs){ return this.forMember(memberId, subs).filter(x => x.eligible); },
  /* فهرس: معرّف المشتركة ← اشتراكاتها غير المؤرشفة */
  subsIndex(){ return U.groupBy(Repos.subs.list(), s => s.memberId); },
  discountFor(offer, price){
    const p = Number(price)||0;
    if (offer.rewardType === 'free') return p;
    if (offer.rewardType === 'percent') return U.round2(p * (Number(offer.rewardValue)||0) / 100);
    return Math.min(p, Number(offer.rewardValue)||0);
  }
};


/* ===== src/app/domain/30-fields.js =================================================== */
/* ============================ Custom fields ==============================
   النادي يسأل مشتركاته أسئلة لا يعرفها المبرمج: مقاس الملابس، الدوام المفضّل،
   من دلّها علينا. بدل أن نضيف عموداً في الكود كلما سُئل سؤال جديد، تُعرَّف
   الحقول بياناتٍ وتُخزَّن قيمها في كائن واحد داخل السجل (member.custom).

   قاعدة: التعريف قد يُحذف، والقيم المحفوظة لا تُمسّ. حقل مُلغى يختفي من
   الشاشات ويبقى في السجل — لأن ما كتبته المستخدمة ملكها لا ملك التعريف. */
const FIELD_TYPES = {
  text:       { ar:'نص قصير',    input:'text' },
  longtext:   { ar:'نص طويل',    input:'textarea' },
  number:     { ar:'رقم',        input:'number' },
  date:       { ar:'تاريخ',      input:'date' },
  select:     { ar:'قائمة اختيار', input:'select',   hasOptions:true },
  multiselect:{ ar:'اختيار متعدّد', input:'multi',   hasOptions:true },
  checkbox:   { ar:'نعم / لا',   input:'checkbox' }
};
const FIELD_ENTITIES = { member:'المشتركات', staff:'الفريق', lead:'المهتمّات' };

const Fields = {
  TYPES: FIELD_TYPES,
  ENTITIES: FIELD_ENTITIES,
  /* التعريفات الفعّالة لكيان، مرتّبة كما رتّبها النادي */
  for(entity){
    return U.sortBy(Repos.customFields.list().filter(f => f.entity === entity && f.active !== false),
                    f => Number(f.order) || 0);
  },
  all(entity){ return Repos.customFields.list(true).filter(f => !entity || f.entity === entity); },
  get(id){ return Repos.customFields.get(id); },
  byKey(entity, key){ return this.all(entity).find(f => f.key === key) || null; },

  /* مفتاح آلي مشتق من التسمية: ثابت لا يتغيّر مع تغيّر التسمية لاحقاً */
  makeKey(label, existing){
    const base = U.normAr(label).replace(/[^\p{L}\p{N}]+/gu, '_').replace(/^_+|_+$/g, '').slice(0, 30) || 'field';
    let k = base, i = 2;
    while ((existing || []).some(f => f.key === k)) k = `${base}_${i++}`;
    return k;
  },
  validateDef(d, all, id){
    const r = V();
    if (!U.norm(d.label)) vErr(r, 'label', 'اسم الحقل مطلوب');
    if (!FIELD_TYPES[d.type]) vErr(r, 'type', 'نوع الحقل غير معروف');
    if (!FIELD_ENTITIES[d.entity]) vErr(r, 'entity', 'الجهة غير معروفة');
    if (FIELD_TYPES[d.type] && FIELD_TYPES[d.type].hasOptions && !(d.options || []).filter(o => U.norm(o)).length)
      vErr(r, 'options', 'أضيفي خيارًا واحدًا على الأقل');
    const dupe = (all || []).find(f => f.id !== id && f.entity === d.entity && U.normAr(f.label) === U.normAr(d.label));
    if (dupe) vErr(r, 'label', 'يوجد حقل بنفس الاسم لنفس الجهة');
    return r;
  },
  /* تحويل ما كتبته المستخدمة إلى القيمة المخزَّنة — بلا مفاجآت نوعية */
  coerce(def, raw){
    if (raw == null || raw === '') return def.type === 'checkbox' ? false : '';
    switch (def.type){
      case 'number':      { const n = Money.clean(raw); return isFinite(n) ? n : ''; }
      case 'checkbox':    return raw === true || raw === 'true' || raw === 'on' || raw === '1';
      case 'multiselect': return Array.isArray(raw) ? raw.filter(Boolean) : String(raw).split(',').map(x => U.norm(x)).filter(Boolean);
      case 'date':        return D.isISO(raw) ? raw : '';
      default:            return U.norm(raw);
    }
  },
  /* تُرجع { values, errors } — القيم جاهزة للحفظ والأخطاء جاهزة للعرض */
  read(entity, raw){
    const values = {}, errors = {};
    for (const def of this.for(entity)){
      const v = this.coerce(def, raw ? raw['cf_' + def.key] : undefined);
      const empty = v === '' || v === false || (Array.isArray(v) && !v.length);
      if (def.required && empty){ errors['cf_' + def.key] = `${def.label} مطلوب`; continue; }
      if (def.type === 'number' && raw && raw['cf_' + def.key] !== '' && raw['cf_' + def.key] != null && v === ''){
        errors['cf_' + def.key] = `${def.label}: رقم غير صحيح`; continue;
      }
      if (def.type === 'date' && raw && U.norm(raw['cf_' + def.key]) && !v){
        errors['cf_' + def.key] = `${def.label}: تاريخ غير صحيح`; continue;
      }
      if (!empty) values[def.key] = v;
    }
    return { values, errors, ok: !Object.keys(errors).length };
  },
  /* نص العرض لقيمة محفوظة */
  display(def, value){
    if (value == null || value === '') return '—';
    if (def.type === 'checkbox') return value ? 'نعم' : 'لا';
    if (def.type === 'multiselect') return (Array.isArray(value) ? value : [value]).join('، ');
    if (def.type === 'date') return D.fmt(value);
    if (def.type === 'number') return `<span class="num">${U.esc(String(value))}</span>`;
    return U.esc(String(value));
  },
  /* القيم التي علّمها النادي «قابلة للبحث» تُضاف إلى نص البحث العام */
  searchText(entity, record){
    const vals = (record && record.custom) || {};
    return this.for(entity).filter(f => f.searchable)
      .map(f => vals[f.key]).filter(v => v != null && v !== '')
      .map(v => Array.isArray(v) ? v.join(' ') : String(v)).join(' ');
  },
  /* الأعمدة التي اختار النادي إظهارها في الجدول */
  listColumns(entity){ return this.for(entity).filter(f => f.showInList); },

  async save(id, d){
    const all = this.all();
    const payload = {
      entity: d.entity, label: U.norm(d.label), type: d.type,
      options: (d.options || []).map(o => U.norm(o)).filter(Boolean),
      required: !!d.required, searchable: !!d.searchable, showInList: !!d.showInList,
      sensitive: !!d.sensitive, order: Number(d.order) || 0, hint: U.norm(d.hint), active: d.active !== false
    };
    const val = this.validateDef(payload, all, id);
    if (!val.ok) throw new AppError('تعريف الحقل غير صحيح', 'VALIDATION', val.errors);
    let rec;
    if (id){
      const cur = Repos.customFields.get(id);
      if (!cur) throw new AppError('الحقل غير موجود', 'NOT_FOUND');
      /* المفتاح لا يتغيّر أبداً بعد الإنشاء: القيم المحفوظة معلّقة به */
      rec = await Repos.customFields.update(id, Object.assign({}, payload, { key: cur.key, entity: cur.entity }));
    } else {
      rec = await Repos.customFields.create(Object.assign({}, payload, { key: this.makeKey(payload.label, all) }));
    }
    await Audit.log('field', id ? 'update' : 'create', `${id ? 'تعديل' : 'إضافة'} حقل «${rec.label}» لـ${FIELD_ENTITIES[rec.entity]}`, rec.id);
    return rec;
  },
  /* الإلغاء لا يمسّ القيم — نخفي الحقل ونُبقي ما كُتب فيه */
  async setActive(id, on){
    const rec = await Repos.customFields.update(id, { active: !!on });
    await Audit.log('field', on ? 'enable' : 'disable', `${on ? 'تفعيل' : 'إيقاف'} حقل «${rec.label}»`, id);
    return rec;
  },
  /* كم سجلاً يحمل قيمة في هذا الحقل؟ يُعرض قبل الحذف النهائي */
  usage(def){
    const store = def.entity === 'member' ? 'members' : def.entity === 'staff' ? 'staff' : 'leads';
    return DB.all(store).filter(r => r.custom && r.custom[def.key] != null && r.custom[def.key] !== '').length;
  }
};

const Svc = {};


/* ===== src/app/services/10-members.js ================================================ */
/* ------------------------------ مشتركات ------------------------------ */
Svc.members = {
  list(inclArchived=false){ return Repos.members.list(inclArchived); },
  /* الحقول الاختيارية تُبنى في مكان واحد حتى لا يفترق الإنشاء عن التعديل.
     القاعدة: ما لم تُرسله الشاشة لا يُمسّ — فتعديل الهاتف من شاشة سريعة
     لا يمحو جهة الاتصال للطوارئ التي أدخلتها المديرة من شاشة أخرى. */
  buildProfile(d, cur){
    const keep = (key, val) => (val === undefined ? (cur ? cur[key] : undefined) : val);
    const sub = (key, obj) => {
      if (obj === undefined) return cur ? cur[key] : undefined;
      return Object.assign({}, (cur && cur[key]) || {}, obj);
    };
    const out = {
      name:U.norm(d.name), phone:U.norm(d.phone),
      joinDate:d.joinDate || (cur && cur.joinDate) || D.today(),
      birthDate:keep('birthDate', d.birthDate === undefined ? undefined : (d.birthDate || '')),
      notes:keep('notes', d.notes === undefined ? undefined : U.norm(d.notes)),
      suspended: d.suspended === undefined ? (cur ? !!cur.suspended : false) : !!d.suspended,
      /* تواصل */
      phone2:keep('phone2', d.phone2 === undefined ? undefined : U.norm(d.phone2)),
      email:keep('email', d.email === undefined ? undefined : U.norm(d.email)),
      address:keep('address', d.address === undefined ? undefined : U.norm(d.address)),
      city:keep('city', d.city === undefined ? undefined : U.norm(d.city)),
      photoMediaId:keep('photoMediaId', d.photoMediaId),
      /* تسويق وتشغيل */
      source:keep('source', d.source === undefined ? undefined : U.norm(d.source)),
      occupation:keep('occupation', d.occupation === undefined ? undefined : U.norm(d.occupation)),
      preferredCoachId:keep('preferredCoachId', d.preferredCoachId === undefined ? undefined : (d.preferredCoachId || null)),
      leadId:keep('leadId', d.leadId),
      /* هوية اختيارية — لا تُطلب أبداً كشرط للاشتراك */
      idType:keep('idType', d.idType === undefined ? undefined : U.norm(d.idType)),
      idNumber:keep('idNumber', d.idNumber === undefined ? undefined : U.norm(d.idNumber)),
      idExpiry:keep('idExpiry', d.idExpiry === undefined ? undefined : (d.idExpiry || '')),
      idMediaId:keep('idMediaId', d.idMediaId),
      /* جهة اتصال للطوارئ */
      emergency:sub('emergency', d.emergency),
      /* ملاحظات السلامة — حقول وصفية للتدريب الآمن، وليست تشخيصاً طبياً */
      health:sub('health', d.health),
      custom: d.custom === undefined ? (cur ? cur.custom : {}) : Object.assign({}, (cur && cur.custom) || {}, d.custom)
    };
    Object.keys(out).forEach(k => { if (out[k] === undefined) delete out[k]; });
    return out;
  },
  async create(d){
    const val = Validate.member(d, Repos.members.list(true));
    if (!val.ok) throw new AppError('بيانات غير مكتملة','VALIDATION', val.errors);
    const code = d.code || await Settings.nextMemberCode();
    const rec = await Repos.members.create(Object.assign(this.buildProfile(d, null), { code, isDemo:!!d.isDemo }));
    await Audit.log('member','create',`إضافة مشتركة: ${rec.name}`, rec.id);
    return { rec, warnings:val.warnings };
  },
  async update(id, d){
    const cur = Repos.members.get(id);
    if (!cur) throw new AppError('المشتركة غير موجودة','NOT_FOUND');
    const val = Validate.member(d, Repos.members.list(true), id);
    if (!val.ok) throw new AppError('بيانات غير مكتملة','VALIDATION', val.errors);
    const oldPhoto = cur.photoMediaId, oldId = cur.idMediaId;
    const rec = await Repos.members.update(id, this.buildProfile(d, cur));
    /* استبدال صورة يتخلّص من القديمة بعد نجاح الحفظ، لا قبله */
    if (oldPhoto && oldPhoto !== rec.photoMediaId) await Svc.media.removeIfUnused(oldPhoto, { store:'members', id });
    if (oldId && oldId !== rec.idMediaId) await Svc.media.removeIfUnused(oldId, { store:'members', id });
    await Audit.log('member','update',`تعديل مشتركة: ${rec.name}`, id);
    return { rec, warnings:val.warnings };
  },
  /* العمر يُشتق من تاريخ الميلاد ولا يُخزَّن — الرقم المخزَّن يشيخ ولا يُحدَّث */
  age(member){
    if (!member || !D.isISO(member.birthDate)) return null;
    const t = D.today(), [by, bm, bd] = member.birthDate.split('-').map(Number), [ty, tm, td] = t.split('-').map(Number);
    let a = ty - by;
    if (tm < bm || (tm === bm && td < bd)) a--;
    return a >= 0 && a < 130 ? a : null;
  },
  /* أعياد الميلاد ضمن نافذة قريبة — مناسبة تواصل حقيقية لا زينة */
  birthdays(days){
    const win = days == null ? (Settings.get('birthdayWindowDays') || 7) : days;
    const t = D.toDate(D.today());
    return this.list().filter(m => D.isISO(m.birthDate)).map(m => {
      const [, bm, bd] = m.birthDate.split('-').map(Number);
      let next = new Date(t.getFullYear(), bm - 1, bd, 12);
      if (D.diffDays(D.today(), D.fromDate(next)) < 0) next = new Date(t.getFullYear() + 1, bm - 1, bd, 12);
      return { m, date:D.fromDate(next), inDays:D.diffDays(D.today(), D.fromDate(next)), age:this.age(m) };
    }).filter(x => x.inDays <= win).sort((a, b) => a.inDays - b.inDays);
  },
  /* اشتباه تكرار: نفس الرقم، أو اسم مطابع بعد التطبيع العربي.
     لا دمج تلقائي — تُعرض المجموعة وتقرّر المستخدمة. */
  duplicates(){
    const rows = this.list(true);
    const groups = new Map();
    const push = (key, m) => { if (!groups.has(key)) groups.set(key, { key, reason:key.split(':')[0], members:[] }); groups.get(key).members.push(m); };
    rows.forEach(m => {
      const ph = U.normAr(m.phone);
      if (ph && ph.length >= 7) push('هاتف:' + ph, m);
      push('اسم:' + U.normAr(m.name), m);
    });
    return [...groups.values()].filter(g => g.members.length > 1)
      .map(g => ({ reason:g.reason === 'هاتف' ? 'نفس رقم الهاتف' : 'نفس الاسم', members:g.members }))
      /* مجموعة الهاتف أقوى دلالة من مجموعة الاسم، فتُعرض أولاً */
      .sort((a, b) => (a.reason === 'نفس رقم الهاتف' ? -1 : 1) - (b.reason === 'نفس رقم الهاتف' ? -1 : 1));
  },
  async archive(id, on=true){
    const m = Repos.members.get(id);
    const rec = await Repos.members.archive(id, on);
    await Audit.log('member', on?'archive':'restore', `${on?'أرشفة':'استرجاع'} مشتركة: ${m?m.name:id}`, id);
    return rec;
  },
  linkedCount(id){ return Svc.subs.ofMember(id, true).length; },
  status(id){
    const m = Repos.members.get(id);
    return Calc.memberStatus(Svc.subs.ofMember(id), D.today(), Settings.get('expiringSoonDays'),
                             m && m.suspended, Svc.membership.freezesOfMember(id));
  },
  /* صف جاهز للعرض: يجمع الحالة والإحصاءات مرة واحدة (بدون حسابات داخل الجدول) */
  rows(inclArchived=false){
    const today = D.today(), soon = Settings.get('expiringSoonDays');
    const byMember = U.groupBy(Repos.subs.list(true).filter(s=>!s.archived), s=>s.memberId);
    /* التجميدات تُقرأ مرة واحدة لكل الصفوف بدل استعلام لكل مشتركة */
    const freezesBySub = U.groupBy(Repos.subEvents.list().filter(e => e.type === 'freeze' && !e.cancelled), e => e.memberId);
    return this.list(inclArchived).map(m => {
      const subs = byMember[m.id] || [];
      const st = Calc.memberStatus(subs, today, soon, m.suspended, freezesBySub[m.id] || []);
      const stats = Calc.memberStats(subs);
      return { m, st, stats };
    });
  }
};
