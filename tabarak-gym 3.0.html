<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تبارك جيم — نظام الإدارة</title>
<style>

/* ===== src/styles/00-tokens.css ====================================================== */
/* ============================================================
   TABARAK GYM — Design Tokens
   لوحة الألوان: باذنجاني عميق (هوية) + وردي توتي (أساسي)
   + رمادي وردي فاتح للخلفية + ذهبي هادئ للولاء
   ============================================================ */
:root{
  --plum-900:#241826; --plum-800:#31203A; --plum-700:#432C4C;
  --rose-700:#A8305A; --rose-600:#C43E6B; --rose-500:#DB5C86; --rose-100:#F7DCE6; --rose-50:#FDF4F7;
  --gold-600:#B98A2E; --gold-50:#FBF3E1;
  --green-600:#157F63; --green-50:#E6F4EF;
  --red-600:#B4353F; --red-50:#FBECEC;
  --blue-600:#3A63A8; --blue-50:#ECF1FA;
  --ink:#241C28; --ink-2:#4A4051; --muted:#7A6E82;
  --line:#E7DEE6; --line-2:#F0EAEF;
  --page:#F6F2F5; --surface:#FFFFFF; --surface-2:#FAF7F9;
  --focus:#C43E6B;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --shadow-pop:0 10px 30px rgba(36,24,38,.18);
  --shadow-soft:0 1px 2px rgba(36,24,38,.05);
  --sidebar-w:238px;
  --font:"Segoe UI","Noto Kufi Arabic","Noto Sans Arabic",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--page);color:var(--ink);
  font-family:var(--font);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.35}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--rose-700)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block;unicode-bidi:isolate}
.hidden{display:none !important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#D9CEDA;border-radius:8px;border:3px solid var(--page)}
::-webkit-scrollbar-thumb:hover{background:#C3B4C6}

/* ============================ Layout ============================ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--plum-900);
  color:#E8DEEA;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}


/* ===== src/styles/10-layout.css ====================================================== */
.brand-mark{width:38px;height:38px;flex:0 0 38px}
.brand-txt strong{display:block;font-size:15px;color:#fff;letter-spacing:.2px}
.brand-txt span{display:block;font-size:11px;color:#A996AE}
.nav{flex:1;overflow-y:auto;padding:6px 10px 14px}
.nav-group{margin-top:14px;padding:0 10px 6px;font-size:11px;color:#8D7A93;letter-spacing:.3px}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:right;
  background:none;border:0;color:#D9CBDD;padding:9px 12px;border-radius:8px;cursor:pointer;
  font-size:13.5px;position:relative;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--rose-600);color:#fff;font-weight:600}
.nav-item.active::before{content:"";position:absolute;right:-10px;top:8px;bottom:8px;width:3px;background:var(--rose-500);border-radius:3px}
.nav-item svg{flex:0 0 18px;opacity:.9}
.nav-badge{margin-inline-start:auto;background:rgba(255,255,255,.16);border-radius:20px;padding:0 7px;font-size:11px;min-width:20px;text-align:center}
.nav-item.active .nav-badge{background:rgba(0,0,0,.2)}
.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#96849B;display:flex;justify-content:space-between;align-items:center}
.side-foot button{background:none;border:0;color:#C9B6CE;cursor:pointer;font-size:11px;text-decoration:underline}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:12px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:40;
}
.page-title{font-size:18px}
.page-sub{font-size:12px;color:var(--muted);font-weight:400}
.top-spacer{flex:1}
.gsearch{position:relative;width:270px;max-width:34vw}
.gsearch input{width:100%;padding:8px 34px 8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.gsearch svg{position:absolute;right:10px;top:9px;color:var(--muted)}
.gsearch-res{
  position:absolute;top:42px;right:0;left:0;background:#fff;border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow-pop);max-height:340px;overflow:auto;z-index:60
}
.gsearch-res button{display:block;width:100%;text-align:right;background:none;border:0;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line-2)}
.gsearch-res button:hover{background:var(--rose-50)}
.gsearch-res .g-t{font-size:11px;color:var(--muted)}
.content{padding:22px;flex:1}
.view{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ============================ Buttons ============================ */
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;
  padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-2);
  transition:background .13s,border-color .13s;
}
.btn:hover{background:var(--surface-2);border-color:#DCCFD9}


/* ===== src/styles/20-components.css ================================================== */
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--rose-600);border-color:var(--rose-600);color:#fff}
.btn-primary:hover{background:var(--rose-700);border-color:var(--rose-700)}
.btn-dark{background:var(--plum-800);border-color:var(--plum-800);color:#fff}
.btn-dark:hover{background:var(--plum-900)}
.btn-danger{background:#fff;border-color:#E3B9BC;color:var(--red-600)}
.btn-danger:hover{background:var(--red-50)}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn-icon{padding:6px;border-radius:7px}
.btn-ghost{border-color:transparent;background:none}
.btn-ghost:hover{background:var(--line-2);border-color:transparent}

/* ============================ Cards & sections ============================ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.card-head{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px}
.card-head h3{font-size:15px;display:flex;align-items:center;gap:9px}
.card-head h3::before{content:"";width:3px;height:15px;background:var(--rose-500);border-radius:2px}
.card-head .sp{flex:1}
.card-body{padding:18px}
.card-body.tight{padding:0}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.sec-title{font-size:13px;color:var(--muted);margin:2px 0 -4px}

/* KPI — الرقم هو البطل، وتحته شريط رفيع مثل خط المضمار */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 17px 13px}
.kpi .k-l{font-size:12.5px;color:var(--muted)}
.kpi .k-v{font-size:25px;font-weight:700;letter-spacing:-.4px;margin-top:3px}
.kpi .k-bar{height:3px;border-radius:3px;background:var(--rose-500);width:34px;margin-top:9px}
.kpi.pos .k-v{color:var(--green-600)} .kpi.pos .k-bar{background:var(--green-600)}
.kpi.neg .k-v{color:var(--red-600)} .kpi.neg .k-bar{background:var(--red-600)}
.kpi.plum .k-bar{background:var(--plum-700)}
.kpi .k-note{font-size:11.5px;color:var(--muted);margin-top:7px}

/* شريط النبض المالي — العنصر الجريء الوحيد في اللوحة */
.pulse{
  background:linear-gradient(105deg,var(--plum-900),var(--plum-700));color:#fff;
  border-radius:var(--r-lg);padding:20px 22px;display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end
}
.pulse .p-main .p-l{font-size:12.5px;color:#C4B0C9}
.pulse .p-main .p-v{font-size:34px;font-weight:700;letter-spacing:-.8px;margin-top:2px}
.pulse .p-sep{width:1px;align-self:stretch;background:rgba(255,255,255,.14)}
.pulse .p-i{min-width:118px}
.pulse .p-i .p-l{font-size:12px;color:#B7A2BD}
.pulse .p-i .p-v{font-size:18px;font-weight:600;margin-top:2px}
.pulse .p-i .p-v.up{color:#7FD9B9} .pulse .p-i .p-v.down{color:#F2A0A6}

/* ============================ Chips / badges ============================ */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}
.chip-active{background:var(--green-50);color:var(--green-600);border-color:#BFE3D6}
.chip-soon{background:var(--gold-50);color:var(--gold-600);border-color:#EEDCB2}
.chip-expired{background:var(--red-50);color:var(--red-600);border-color:#EEC9CB}
.chip-none{background:#F1EDF1;color:var(--muted);border-color:#E2D9E2}
.chip-susp{background:var(--blue-50);color:var(--blue-600);border-color:#C9D8EF}
.chip-frozen{background:#EAF4F8;color:#2A6C86;border-color:#C5E0EA}
.chip-gold{background:var(--gold-50);color:var(--gold-600);border-color:#EEDCB2}
.chip-rose{background:var(--rose-50);color:var(--rose-700);border-color:var(--rose-100)}

/* ============================ Tables ============================ */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{
  text-align:right;font-weight:600;color:var(--muted);font-size:12.5px;
  padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap
}
table.tbl th.sortable{cursor:pointer;user-select:none}
table.tbl th.sortable:hover{color:var(--rose-700)}
table.tbl td{padding:10px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.tbl tbody tr:hover{background:var(--rose-50)}
table.tbl tbody tr.archived-row{opacity:.6}
table.tbl td.ta-l{text-align:left}
.t-actions{display:flex;gap:4px;justify-content:flex-start}
.t-name{font-weight:600}
.t-sub{font-size:11.5px;color:var(--muted)}
.pager{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--muted)}
.pager .sp{flex:1}
.money-pos{color:var(--green-600);font-weight:600}
.money-neg{color:var(--red-600);font-weight:600}

/* ============================ Forms ============================ */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:12.5px;color:var(--ink-2);font-weight:600}
.field .hint{font-size:11.5px;color:var(--muted)}
.inp,select.inp,textarea.inp{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;
}
.inp:focus{border-color:var(--rose-500);outline:none;box-shadow:0 0 0 3px var(--rose-100)}
textarea.inp{min-height:74px;resize:vertical}
.inp[aria-invalid="true"]{border-color:var(--red-600);background:var(--red-50)}
.err{color:var(--red-600);font-size:11.5px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-grid .full{grid-column:1 / -1}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line-2);background:var(--surface-2);border-radius:var(--r-lg) var(--r-lg) 0 0}
.filters .inp{width:auto;min-width:150px;padding:7px 10px}
.filters .search{min-width:230px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.switch input[type=checkbox]{width:16px;height:16px;accent-color:var(--rose-600);flex:0 0 16px}

/* ============================ Modal ============================ */
.overlay{position:fixed;inset:0;background:rgba(36,24,38,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
.modal{background:#fff;border-radius:var(--r-lg);width:min(700px,100%);box-shadow:var(--shadow-pop);animation:pop .16s ease-out}
.modal.wide{width:min(1000px,100%)}
.modal.narrow{width:min(460px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px}


/* ===== src/styles/30-overlays.css ==================================================== */
.modal-head h3{font-size:16px}
.modal-head .sp{flex:1}
.modal-body{padding:20px;max-height:70vh;overflow:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line-2);display:flex;gap:10px;justify-content:flex-start;background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.modal-foot .sp{flex:1}

/* ============================ Toast ============================ */
.toasts{position:fixed;bottom:20px;left:20px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--plum-900);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow-pop);font-size:13.5px;display:flex;gap:10px;align-items:center;max-width:380px;animation:pop .16s}
.toast.ok{background:#126E56} .toast.err{background:#932A34} .toast.warn{background:#8C6716}

/* ============================ Empty / loading ============================ */
.empty{padding:46px 20px;text-align:center;color:var(--muted)}
.empty svg{opacity:.35;margin-bottom:10px}
.empty h4{font-size:15px;color:var(--ink-2);margin-bottom:5px}
.empty p{margin:0 0 14px;font-size:13px}
.skeleton{height:14px;background:linear-gradient(90deg,#EFE8EE,#F8F4F7,#EFE8EE);border-radius:4px;animation:sk 1.2s infinite}
@keyframes sk{0%{opacity:.7}50%{opacity:1}100%{opacity:.7}}

/* ============================ Notifications panel ============================ */
.bell{position:relative}
.bell .cnt{position:absolute;top:-3px;left:-3px;background:var(--rose-600);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.notif-panel{position:fixed;top:60px;left:16px;width:360px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-pop);z-index:80;overflow:hidden}
.notif-panel .n-h{padding:12px 16px;border-bottom:1px solid var(--line-2);font-weight:700;font-size:14px}
.notif-list{max-height:400px;overflow:auto}
.notif{display:flex;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line-2);cursor:pointer}
.notif:hover{background:var(--rose-50)}
.notif .n-ic{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:0 0 8px}
.notif .n-t{font-size:13px;font-weight:600}
.notif .n-d{font-size:12px;color:var(--muted)}

/* ============================ Tabs ============================ */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tab{background:none;border:0;padding:9px 15px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--rose-700);border-bottom-color:var(--rose-600)}

/* ============================ Profile ============================ */
.avatar{width:38px;height:38px;border-radius:50%;background:var(--rose-100);color:var(--rose-700);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:0 0 38px}
.avatar.lg{width:60px;height:60px;font-size:22px;flex:0 0 60px}
.prof-head{display:flex;gap:16px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line-2);margin-bottom:16px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px}
.dl dt{color:var(--muted)} .dl dd{margin:0;font-weight:600}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 20px 16px 0;border-right:2px solid var(--line);margin-right:5px}
.tl li::before{content:"";position:absolute;right:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--rose-500);border:2px solid #fff}
.tl li:last-child{border-right-color:transparent;padding-bottom:0}

/* ============================ Charts ============================ */
.chart{width:100%;overflow:visible}
.chart text{font-family:var(--font);fill:var(--muted);font-size:11px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);padding:0 4px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-inline-end:6px}

/* ============================ POS / Attendance ============================ */


/* ===== src/styles/40-modules.css ===================================================== */
.pos-tbl th{font-size:12px}
.pos-tbl td{padding:6px 8px;vertical-align:middle}
.pos-tbl .inp{padding:6px 8px;min-width:0;width:100%}
.att-res{margin-top:10px;display:flex;flex-direction:column;gap:7px;max-height:330px;overflow:auto}
.att-row{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface)}
.att-row:hover{border-color:var(--rose-500);background:var(--rose-50)}
.due-age{font-size:11px;color:var(--red-600);font-weight:600}
.sub-sum{background:var(--rose-50);border-color:var(--rose-100)}

/* ============================ Media ============================ */
.media-box{border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;background:var(--surface-2)}
.media-prev img,.media-prev video{max-width:100%;max-height:230px;border-radius:8px;display:block;margin:0 auto}
.ex-thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--rose-50)}


/* ============================ Report ============================ */
.report{font-size:13.5px;color:var(--ink)}
.rep-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
  border-bottom:2px solid var(--plum-900);padding-bottom:12px;margin-bottom:20px}
.rep-gym{font-size:19px;font-weight:700;color:var(--plum-900)}
.rep-title{font-size:13.5px;color:var(--muted);margin-top:2px}
.rep-meta{text-align:left;font-size:12.5px;line-height:1.8}
.rep-sec{margin-bottom:26px}
.rep-h{font-size:15px;color:var(--plum-800);border-right:3px solid var(--rose-500);padding-right:9px;margin-bottom:12px}
.rep-lead{margin:0 0 14px;line-height:1.9;background:var(--rose-50);border:1px solid var(--rose-100);
  border-radius:10px;padding:13px 16px}
.rep-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.rep-card{border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:var(--surface-2)}
.rep-card span{display:block;font-size:12px;color:var(--muted)}
.rep-card strong{display:block;font-size:17px;margin-top:3px;font-variant-numeric:tabular-nums}
.rep-card.pos strong{color:var(--green-600)} .rep-card.neg strong{color:var(--red-600)}
.rep-two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:16px 0}
.report h4{font-size:13.5px;margin:16px 0 8px;color:var(--ink-2)}
table.rep-tbl{margin-bottom:6px} table.rep-tbl td,table.rep-tbl th{padding:7px 11px}
table.rep-tbl .num{font-variant-numeric:tabular-nums}
tr.rep-total th{background:var(--rose-50);color:var(--ink);border-top:2px solid var(--rose-100)}
.rep-foot{border-top:1px solid var(--line);padding-top:10px;margin-top:8px;font-size:11.5px;color:var(--muted);text-align:center}
@media (max-width:900px){ .rep-cards{grid-template-columns:repeat(2,1fr)} .rep-two{grid-template-columns:1fr} }

/* ============================ Print ============================ */


/* ===== src/styles/60-v4.css ========================================================== */
/* ==================== الإصدار الرابع — مكوّنات إضافية ====================
   القاعدة نفسها المتّبعة في الأصل: كثافة معلومات عالية، تدرّج واضح، بلا زخرفة.
   لا تدرّجات لونية ولا زجاجيات ولا حركات — هذه واجهة عمل يومي لا عرض تقديمي. */

/* --------- الإفصاح التدريجي: الأساسي ظاهر والتفصيلي يُفتح عند الحاجة -------- */
.sect{border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:12px;background:#fff;overflow:hidden}
.sect>summary{
  list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;
  font-weight:600;font-size:13px;color:var(--ink-2);background:var(--surface-2);
}
.sect>summary::-webkit-details-marker{display:none}
.sect>summary::after{content:'▾';margin-inline-start:auto;color:var(--muted);transition:transform .15s}
.sect[open]>summary::after{transform:rotate(180deg)}
.sect>summary:hover{background:var(--rose-50)}
.sect>summary .tag{font-weight:400;font-size:11.5px;color:var(--muted)}
.sect-body{padding:14px}
.sect-body>.form-grid{margin:0}

/* ------------------------------ ملف المشتركة ------------------------------ */
.prof-wrap{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
.prof-side{position:sticky;top:0}
.prof-card{border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;padding:16px;text-align:center}
.prof-photo{width:88px;height:88px;border-radius:50%;object-fit:cover;margin:0 auto 10px;display:block;border:3px solid var(--rose-100)}
.prof-card h3{font-size:16px;margin-bottom:2px}
.prof-card .code{font-size:12px;color:var(--muted);direction:ltr}
.prof-quick{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.prof-quick .btn{width:100%;justify-content:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px;text-align:start;margin-top:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:16px}
.stat{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;background:#fff}
.stat b{display:block;font-size:17px;line-height:1.25}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.pos b{color:var(--green-600)} .stat.neg b{color:var(--red-600)}

/* ---------------------------- الخط الزمني ---------------------------- */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:'';position:absolute;inset-inline-start:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.timeline li{position:relative;padding:0 26px 14px 0;font-size:13px}
.timeline li::before{
  content:'';position:absolute;inset-inline-start:2px;top:5px;width:12px;height:12px;border-radius:50%;
  background:#fff;border:2px solid var(--rose-500);
}
.timeline li.money::before{border-color:var(--green-600)}
.timeline li.warn::before{border-color:var(--gold-600)}
.timeline li.bad::before{border-color:var(--red-600)}
.timeline .when{display:block;font-size:11.5px;color:var(--muted)}

/* ----------------------------- شريط التقدّم ----------------------------- */
.bar{height:7px;border-radius:99px;background:var(--line-2);overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;background:var(--rose-600);border-radius:99px}
.bar.ok>i{background:var(--green-600)}

/* ------------------------- لوحة المهتمّات (CRM) ------------------------- */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:12px;align-items:start;overflow-x:auto}
.pipe-col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);min-height:90px}
.pipe-col>h4{padding:9px 12px;font-size:12.5px;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center}
.pipe-col>h4 b{margin-inline-start:auto;color:var(--muted);font-weight:600}
.pipe-body{padding:8px;display:flex;flex-direction:column;gap:8px}
.lead-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;cursor:pointer;font-size:12.5px}
.lead-card:hover{border-color:var(--rose-500)}
.lead-card b{display:block;font-size:13px}
.lead-card .meta{color:var(--muted);font-size:11.5px;display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.lead-card .over{color:var(--red-600);font-weight:600}

/* --------------------------- الاستقبال السريع --------------------------- */
.desk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.desk button{
  display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 10px;cursor:pointer;
  border:1px solid var(--line);border-radius:var(--r-md);background:#fff;font-weight:600;font-size:13px;color:var(--ink);
}
.desk button:hover{border-color:var(--rose-500);background:var(--rose-50)}
.desk button svg{color:var(--rose-600)}
.desk-find{display:flex;gap:8px;margin-bottom:14px}
.desk-find .inp{font-size:15px;padding:12px 14px}
.hit{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;margin-bottom:7px}
.hit .grow{flex:1;min-width:0}
.hit .t-name{font-weight:600}

/* ------------------------------ الهوية البصرية ------------------------------ */
.brand-banner{height:132px;border-radius:var(--r-lg);background-size:cover;background-position:center;
  border:1px solid var(--line);margin-bottom:16px}
.brand-logo{border-radius:8px}
.media-drop{
  border:1.5px dashed var(--line);border-radius:var(--r-md);padding:16px;text-align:center;background:var(--surface-2);
}
.media-drop img{max-width:100%;max-height:120px;object-fit:contain;display:block;margin:0 auto 10px}
.media-drop.wide img{max-height:90px;width:100%;object-fit:cover;border-radius:var(--r-sm)}

/* ------------------------------ إعدادات مبوّبة ------------------------------ */
.set-wrap{display:grid;grid-template-columns:210px 1fr;gap:16px;align-items:start}
.set-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}
.set-nav button{
  text-align:start;padding:9px 12px;border:1px solid transparent;border-radius:var(--r-sm);background:none;
  cursor:pointer;font-size:13px;color:var(--ink-2);
}
.set-nav button:hover{background:var(--surface-2)}
.set-nav button.active{background:var(--rose-50);border-color:var(--rose-100);color:var(--rose-700);font-weight:600}

/* -------------------------------- متفرّقات -------------------------------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;background:var(--surface-2);
  border:1px solid var(--line);font-size:11.5px;color:var(--ink-2)}
.pill.warn{background:var(--gold-50);border-color:#EBD9A8;color:var(--gold-600)}
.pill.bad{background:var(--red-50);border-color:#F0CFCF;color:var(--red-600)}
.pill.ok{background:var(--green-50);border-color:#BFE0D4;color:var(--green-600)}
.sens{background:var(--gold-50);border:1px solid #EBD9A8;border-radius:var(--r-sm);padding:9px 11px;font-size:12.5px}
.sens b{color:var(--gold-600)}
.mini-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.mini-tbl th{text-align:start;color:var(--muted);font-weight:600;padding:5px 6px;border-bottom:1px solid var(--line)}
.mini-tbl td{padding:6px;border-bottom:1px solid var(--line-2)}
.mini-tbl tr:last-child td{border-bottom:none}
.seat-bar{display:flex;gap:2px;flex-wrap:wrap;margin-top:5px}
.seat-bar i{width:11px;height:11px;border-radius:2px;background:var(--line);display:block}
.seat-bar i.on{background:var(--rose-600)}
.seat-bar i.wait{background:var(--gold-600)}

@media (max-width:980px){
  .prof-wrap,.set-wrap{grid-template-columns:1fr}
  .prof-side{position:static}
  .pipe{grid-template-columns:repeat(5,minmax(150px,1fr))}
}

.gsearch-res .gs-group{padding:7px 12px 4px;font-size:11px;color:var(--muted);background:var(--surface-2);
  border-bottom:1px solid var(--line-2);position:sticky;top:0}

   قاعدة الحكم: ورقة مقروءة بالأبيض والأسود على طابعة رخيصة. لا ألوان تحمل

  border:1px solid #666;padding:6px 8px;text-align:start;font-weight:700}

/* شريط ضيّق للطابعة الحرارية: 80mm عرضاً، عمود واحد، بلا جداول عريضة */

<script>

/* ===== src/app/core/00-header.js ===================================================== */
/* ============================================================================
   تبارك جيم — نظام إدارة نادٍ نسائي (محلي بالكامل، بدون إنترنت)
   ----------------------------------------------------------------------------
   طبقات النظام (كل طبقة لا تعرف إلا الطبقة التي تحتها):
     Core      : أدوات عامة، تواريخ، عملة، أخطاء، سجل أحداث
     Data      : IDBAdapter (IndexedDB)  |  MemAdapter (احتياطي)
     Repos     : ذاكرة داخلية + كتابة فورية للقرص (Write-through)
     Services  : منطق العمل (مشتركات، اشتراكات، مالية، رواتب، عروض…)
     Calc      : حسابات صرفة قابلة للاختبار بدون واجهة
     UI        : مكوّنات + شاشات (لا تحسب شيئاً بنفسها)
   ملاحظة صيانة: أي حساب مالي يُكتب في Calc أو Services فقط، ممنوع داخل UI.
   ============================================================================ */
'use strict';
const APP = { name:'تبارك جيم', version:'3.0.0', schema:4, db:'tabarak_gym' };


/* ===== src/app/core/10-utils.js ====================================================== */
/* ============================== Core / Utils ============================== */
const U = (() => {
  let seq = 0;
  const uid = (p='id') => `${p}_${Date.now().toString(36)}${(seq=(seq+1)%1296).toString(36).padStart(2,'0')}${Math.random().toString(36).slice(2,6)}`;
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const debounce = (fn, ms=250) => { let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; };
  const sum = (arr, f=x=>x) => arr.reduce((a,b)=>a+(Number(f(b))||0),0);
  const clone = o => (typeof structuredClone==='function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
  const groupBy = (arr, f) => arr.reduce((m,x)=>{ const k=f(x); (m[k]=m[k]||[]).push(x); return m; },{});
  const sortBy = (arr, f, dir=1) => [...arr].sort((a,b)=>{ const x=f(a), y=f(b);
    if (x==null && y==null) return 0; if (x==null) return 1; if (y==null) return -1;
    return (typeof x==='number'&&typeof y==='number') ? (x-y)*dir : String(x).localeCompare(String(y),'ar')*dir; });
  const norm = s => String(s==null?'':s).trim().replace(/\s+/g,' ');
  /* تطبيع البحث العربي: إزالة التشكيل وتوحيد الألف/الياء/التاء المربوطة */
  const normAr = s => norm(s).toLowerCase()
      .replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآا]/g,'ا').replace(/[ىي]/g,'ي').replace(/ة/g,'ه')
      .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  const round2 = n => Math.round((Number(n)||0)*100)/100;
  const pct = (part, whole) => whole>0 ? round2(part/whole*100) : 0;
  return { uid, esc, debounce, sum, clone, groupBy, sortBy, norm, normAr, round2, pct };
})();


/* ===== src/app/core/20-dates.js ====================================================== */
/* ================================ Dates ==================================
   القاعدة: كل تاريخ يُخزَّن نصاً "YYYY-MM-DD" (بدون وقت وبدون منطقة زمنية)
   حتى لا تتغيّر النتائج باختلاف جهاز أو توقيت صيفي. */
const D = (() => {
  const pad = n => String(n).padStart(2,'0');
  const isISO = s => typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(toDate(s));
  function toDate(iso){ if(!iso) return new Date(NaN);
    const [y,m,d] = String(iso).split('-').map(Number);
    if(!y||!m||!d||m<1||m>12||d<1||d>31) return new Date(NaN);
    const dt = new Date(y, m-1, d, 12, 0, 0, 0);
    return (dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===d) ? dt : new Date(NaN);
  }
  const fromDate = dt => `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
  const today = () => fromDate(new Date());
  const daysInMonth = (y,m) => new Date(y, m, 0).getDate();          // m = 1..12
  function addDays(iso, n){ const d = toDate(iso); d.setDate(d.getDate()+Number(n||0)); return fromDate(d); }
  /* إضافة أشهر مع تثبيت آخر يوم في الشهر: 31/01 + شهر = 28/02 (أو 29 في الكبيسة) */
  function addMonths(iso, n){
    const d = toDate(iso); if (isNaN(d)) return iso;
    const y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
    const tm = m + Number(n||0), ty = y + Math.floor(tm/12), tmm = ((tm%12)+12)%12;
    return `${ty}-${pad(tmm+1)}-${pad(Math.min(day, daysInMonth(ty, tmm+1)))}`;
  }
  const diffDays = (a,b) => Math.round((toDate(b) - toDate(a)) / 86400000);   // b - a
  const cmp = (a,b) => a===b ? 0 : (a<b ? -1 : 1);                            // نصوص ISO تقارن مباشرة
  const monthKey = iso => String(iso).slice(0,7);
  const startOfMonth = key => `${key}-01`;
  const endOfMonth = key => { const [y,m]=key.split('-').map(Number); return `${key}-${pad(daysInMonth(y,m))}`; };
  const AR_M = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
  const AR_D = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const monthName = key => { const [y,m]=key.split('-').map(Number); return `${AR_M[m-1]} ${y}`; };
  const monthShort = key => { const [y,m]=key.split('-').map(Number); return `${AR_M[m-1].split(' ').pop()} ${String(y).slice(2)}`; };
  const dayName = iso => AR_D[toDate(iso).getDay()];
  const fmt = iso => isISO(iso) ? iso.split('-').reverse().join('/') : '—';
  function monthsBack(n, from){ const base = monthKey(from||today()); const out=[];
    let [y,m] = base.split('-').map(Number);
    for(let i=0;i<n;i++){ out.unshift(`${y}-${pad(m)}`); m--; if(m===0){m=12;y--;} } return out; }
  function relative(iso){ const n = diffDays(today(), iso);
    if (n===0) return 'اليوم'; if (n===1) return 'غداً'; if (n===-1) return 'أمس';
    return n>0 ? `بعد ${n} يوم` : `قبل ${Math.abs(n)} يوم`; }
  return { isISO, toDate, fromDate, today, addDays, addMonths, diffDays, cmp, monthKey, startOfMonth,
           endOfMonth, monthName, monthShort, dayName, fmt, monthsBack, relative, daysInMonth, AR_M, AR_D };
})();

/* ================================ Money ================================== */
const Money = (() => {
  const CUR = { IQD:{code:'IQD', label:'د.ع', dec:0, step:250}, USD:{code:'USD', label:'$', dec:2, step:1} };
  let cur = CUR.IQD;
  const setCurrency = code => { cur = CUR[code] || CUR.IQD; };
  const current = () => cur;
  const clean = v => { const n = Number(String(v==null?'':v).replace(/[,\s٬]/g,'')); return isFinite(n) ? n : NaN; };
  function fmt(v, withLabel=true){
    const n = Number(v)||0, neg = n<0, a = Math.abs(n);
    const s = a.toLocaleString('en-US',{minimumFractionDigits:cur.dec, maximumFractionDigits:cur.dec});
    return `${neg?'−':''}${s}${withLabel?' '+cur.label:''}`;
  }
  const short = v => { const n=Math.abs(Number(v)||0), sg=(Number(v)||0)<0?'−':'';
    if(n>=1e9) return sg+(n/1e9).toFixed(1)+'B'; if(n>=1e6) return sg+(n/1e6).toFixed(1)+'M';
    if(n>=1e3) return sg+(n/1e3).toFixed(n>=1e4?0:1)+'K'; return sg+Math.round(n); };
  return { CUR, setCurrency, current, clean, fmt, short };
})();

/* ============================== المدد ====================================
   الخطة = مدة فقط (قيمة + وحدة). السعر يُدخَل يدوياً مع كل اشتراك ولا تفرضه الخطة. */
const DUR = {
  UNITS:['day','week','month'],
  unitAr(unit){ return unit==='week' ? 'أسبوع' : unit==='month' ? 'شهر' : 'يوم'; },
  /* نص عربي سليم: يوم / يومان / 5 أيام / 15 يوماً */
  label(value, unit){
    const v = Math.max(1, Math.round(Number(value)||1));
    const one = { day:'يوم', week:'أسبوع', month:'شهر' }[unit] || 'يوم';
    const two = { day:'يومان', week:'أسبوعان', month:'شهران' }[unit] || 'يومان';
    const few = { day:'أيام', week:'أسابيع', month:'أشهر' }[unit] || 'أيام';
    const many = { day:'يوماً', week:'أسبوعاً', month:'شهراً' }[unit] || 'يوماً';
    if (v === 1) return one;
    if (v === 2) return two;
    if (v <= 10) return `${v} ${few}`;
    return `${v} ${many}`;
  },
  /* النهاية شاملة: اشتراك شهر يبدأ 01/03 ينتهي 31/03 */
  end(startDate, value, unit){
    const v = Math.max(1, Math.round(Number(value)||1));
    if (!D.isISO(startDate)) return startDate;
    if (unit === 'month') return D.addDays(D.addMonths(startDate, v), -1);
    if (unit === 'week')  return D.addDays(startDate, v*7 - 1);
    return D.addDays(startDate, v - 1);
  },
  days(startDate, endDate){ return D.isISO(startDate) && D.isISO(endDate) ? D.diffDays(startDate, endDate) + 1 : 0; },
  valid(value, unit){ const v = Number(value); return DUR.UNITS.includes(unit) && isFinite(v) && v >= 1 && v <= 3650; }
};

const SCHEMA = {

  suppliers:         { key:'id' }    /* موردو المخزون */

const STORE_NAMES = Object.keys(SCHEMA);

class IDBAdapter {
  constructor(name, version){ this.name=name; this.version=version; this.db=null; this.kind='indexeddb'; }
  open(){
    return new Promise((res, rej) => {
      if (typeof indexedDB === 'undefined') return rej(new AppError('IndexedDB غير متاح','NO_IDB'));
      const rq = indexedDB.open(this.name, this.version);
      rq.onupgradeneeded = () => { const db = rq.result;
        STORE_NAMES.forEach(s => { if(!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: SCHEMA[s].key }); }); };
      rq.onsuccess = () => { this.db = rq.result;
        this.db.onversionchange = () => { try{ this.db.close(); }catch(e){} };
        res(this); };
      rq.onerror = () => rej(new AppError('تعذّر فتح قاعدة البيانات المحلية','IDB_OPEN', rq.error));
      rq.onblocked = () => Log.warn('IndexedDB blocked — نافذة أخرى تستعمل النظام');
    });
  }
  _tx(store, mode){ return this.db.transaction(store, mode).objectStore(store); }
  getAll(store){ return new Promise((res, rej) => { const r = this._tx(store,'readonly').getAll();
    r.onsuccess = () => res(r.result||[]); r.onerror = () => rej(new AppError('فشل قراءة '+store,'IDB_READ', r.error)); }); }
  put(store, obj){ return new Promise((res, rej) => { const r = this._tx(store,'readwrite').put(obj);
    r.onsuccess = () => res(obj); r.onerror = () => rej(new AppError('فشل حفظ سجل في '+store,'IDB_WRITE', r.error)); }); }
  putMany(store, arr){ return new Promise((res, rej) => { if(!arr.length) return res(0);
    const tx = this.db.transaction(store,'readwrite'), os = tx.objectStore(store);
    arr.forEach(o => os.put(o));
    tx.oncomplete = () => res(arr.length); tx.onerror = () => rej(new AppError('فشل حفظ دفعة في '+store,'IDB_WRITE', tx.error)); }); }
  remove(store, id){ return new Promise((res, rej) => { const r = this._tx(store,'readwrite').delete(id);
    r.onsuccess = () => res(true); r.onerror = () => rej(new AppError('فشل حذف سجل','IDB_DEL', r.error)); }); }
  clearStore(store){ return new Promise((res, rej) => { const r = this._tx(store,'readwrite').clear();
    r.onsuccess = () => res(true); r.onerror = () => rej(new AppError('فشل تفريغ '+store,'IDB_CLR', r.error)); }); }
}
/* احتياطي أول: localStorage — أبطأ وأصغر لكنه يحفظ البيانات فعلاً عند منع IndexedDB */
class LSAdapter {
  constructor(ns){ this.ns = ns; this.kind = 'localstorage'; }
  _k(s){ return `${this.ns}:${s}`; }
  open(){
    try { localStorage.setItem(this.ns+':probe','1'); localStorage.removeItem(this.ns+':probe'); }
    catch(e){ return Promise.reject(new AppError('التخزين المحلي ممنوع','NO_LS', e)); }
    return Promise.resolve(this);
  }
  _read(s){ try { return JSON.parse(localStorage.getItem(this._k(s)) || '[]'); } catch(e){ return []; } }
  _write(s, arr){
    try { localStorage.setItem(this._k(s), JSON.stringify(arr)); }
    catch(e){ throw new AppError('امتلأت مساحة التخزين المحلي — صدّري نسخة احتياطية وقلّلي الوسائط','LS_FULL', e); }
  }
  getAll(s){ return Promise.resolve(this._read(s)); }
  put(s, o){ const k = SCHEMA[s].key, a = this._read(s), i = a.findIndex(x => x[k] === o[k]);
    if (i >= 0) a[i] = o; else a.push(o); this._write(s, a); return Promise.resolve(o); }
  putMany(s, arr){ const k = SCHEMA[s].key, m = new Map(this._read(s).map(x => [x[k], x]));
    arr.forEach(o => m.set(o[k], o)); this._write(s, [...m.values()]); return Promise.resolve(arr.length); }
  remove(s, id){ const k = SCHEMA[s].key; this._write(s, this._read(s).filter(x => x[k] !== id)); return Promise.resolve(true); }
  clearStore(s){ this._write(s, []); return Promise.resolve(true); }
}
/* احتياطي: إذا مُنع IndexedDB (وضع خاص) يعمل النظام في الذاكرة مع تحذير واضح */
class MemAdapter {
  constructor(){ this.m = {}; STORE_NAMES.forEach(s => this.m[s] = new Map()); this.kind='memory'; }
  open(){ return Promise.resolve(this); }
  getAll(s){ return Promise.resolve([...this.m[s].values()]); }
  put(s,o){ this.m[s].set(o[SCHEMA[s].key], o); return Promise.resolve(o); }
  putMany(s,a){ a.forEach(o=>this.m[s].set(o[SCHEMA[s].key], o)); return Promise.resolve(a.length); }
  remove(s,id){ this.m[s].delete(id); return Promise.resolve(true); }
  clearStore(s){ this.m[s].clear(); return Promise.resolve(true); }
}


/* ===== src/app/data/10-repositories.js =============================================== */
/* ============================== Repositories ==============================
   ذاكرة داخلية (Map) للقراءة السريعة + كتابة فورية للقرص.
   قفل أمان: ممنوع أي كتابة قبل اكتمال التحميل، حتى لا تُمسح بيانات حقيقية. */
const DB = {
  adapter:null, loaded:false, cache:{}, dirtyFail:0,
  async init(adapter){
    this.adapter = adapter;
    STORE_NAMES.forEach(s => this.cache[s] = new Map());
    for (const s of STORE_NAMES){
      const rows = await this.adapter.getAll(s);
      rows.forEach(r => this.cache[s].set(r[SCHEMA[s].key], r));
    }
    this.loaded = true;
    Log.info('تم تحميل البيانات', Object.fromEntries(STORE_NAMES.map(s=>[s,this.cache[s].size])));
  },
  all(store){ return [...this.cache[store].values()]; },
  get(store, id){ return this.cache[store].get(id) || null; },
  count(store){ return this.cache[store].size; },
  /* قاعدة حرجة: الذاكرة لا تسبق القرص. إذا فشلت الكتابة تُرجَع الذاكرة كما كانت،
     حتى لا تُظهر الشاشة رقماً غير محفوظ فعلاً. */
  async put(store, obj){
    if (!this.loaded) throw new AppError('لم يكتمل تحميل البيانات بعد','NOT_LOADED');
    const key = obj[SCHEMA[store].key], prev = this.cache[store].get(key), existed = this.cache[store].has(key);
    this.cache[store].set(key, obj);
    try { await this.adapter.put(store, obj); }
    catch(e){
      if (existed) this.cache[store].set(key, prev); else this.cache[store].delete(key);
      this.dirtyFail++;
      throw new AppError('تعذّر حفظ البيانات على القرص — لم يُطبَّق التغيير','WRITE_FAILED', e);
    }
    return obj;
  },
  async putMany(store, arr){
    if (!this.loaded) throw new AppError('لم يكتمل تحميل البيانات بعد','NOT_LOADED');
    const prev = arr.map(o => [o[SCHEMA[store].key], this.cache[store].get(o[SCHEMA[store].key])]);
    arr.forEach(o => this.cache[store].set(o[SCHEMA[store].key], o));
    try { await this.adapter.putMany(store, arr); }
    catch(e){
      prev.forEach(([k,v]) => { if (v === undefined) this.cache[store].delete(k); else this.cache[store].set(k,v); });
      throw new AppError('تعذّر حفظ دفعة البيانات — لم يُطبَّق التغيير','WRITE_FAILED', e);
    }
    return arr.length;
  },
  async remove(store, id){
    if (!this.loaded) throw new AppError('لم يكتمل تحميل البيانات بعد','NOT_LOADED');
    const prev = this.cache[store].get(id);
    this.cache[store].delete(id);
    try { await this.adapter.remove(store, id); }
    catch(e){ if (prev !== undefined) this.cache[store].set(id, prev); throw new AppError('تعذّر الحذف من القرص','DELETE_FAILED', e); }
    return true;
  },
  async clearAll(){ for (const s of STORE_NAMES){ this.cache[s].clear(); await this.adapter.clearStore(s); } }
};

/* Repo: طبقة رقيقة فوق DB تضيف الطوابع الزمنية والأرشفة والفهرسة */
function Repo(store, prefix){
  return {
    store,
    list(includeArchived=false){ const a = DB.all(store); return includeArchived ? a : a.filter(x=>!x.archived); },
    get: id => DB.get(store, id),
    async create(obj){
      const now = new Date().toISOString();
      const rec = Object.assign({ id: U.uid(prefix), createdAt: now, updatedAt: now, archived:false }, obj);
      await DB.put(store, rec); return rec;
    },
    async update(id, patch){
      const cur = DB.get(store, id);
      if (!cur) throw new AppError('السجل غير موجود','NOT_FOUND', { store, id });
      const rec = Object.assign({}, cur, patch, { id, updatedAt:new Date().toISOString() });
      await DB.put(store, rec); return rec;
    },
    async archive(id, on=true){ return this.update(id, { archived:!!on, archivedAt: on ? new Date().toISOString() : null }); },
    async hardDelete(id){ return DB.remove(store, id); },
    count(includeArchived=false){ return this.list(includeArchived).length; }
  };
}

  lostReasons:['السعر','المسافة','الوقت','اشتركت في نادٍ آخر','لم تردّ','أخرى'],
  /* التشغيل */
  inactiveDays:21,                          /* بعدها تُعدّ المشتركة منقطعة */
  attendanceAllowCheckout:true,
  followUpDays:3,                           /* المتابعة الافتراضية للمهتمّات */
  docExpiryWarnDays:30,
  birthdayWindowDays:7,
  cashOpeningFloat:0,
  /* الخصوصية: إخفاء المعلومات الحسّاسة عن الجداول العامة افتراضياً */
  hideSensitiveInLists:true
};
const Settings = {
  data: U.clone(DEFAULT_SETTINGS),
  async load(){
    const rec = DB.get('meta','settings');
    this.data = Object.assign(U.clone(DEFAULT_SETTINGS), rec ? rec.v : {});
    Money.setCurrency(this.data.currency);
    return this.data;
  },
  get(k){ return k ? this.data[k] : this.data; },
  async set(patch){
    this.data = Object.assign({}, this.data, patch);
    Money.setCurrency(this.data.currency);
    await DB.put('meta', { k:'settings', v:this.data });
    return this.data;
  },
  async nextMemberCode(){
    const n = (Number(this.data.memberSeq)||0) + 1;
    await this.set({ memberSeq:n });
    return 'ت' + String(n).padStart(4,'0');
  },
  /* عدّاد مرقّم عام: الرقم يُحجز بالكتابة على القرص قبل استعماله، فلا يتكرّر
     رقم وصل على ورقتين مطبوعتين حتى لو فشلت العملية التي طلبته. */
  async nextCode(seqKey, prefix, width=5){
    const n = (Number(this.data[seqKey])||0) + 1;
    await this.set({ [seqKey]:n });
    return prefix + String(n).padStart(width,'0');
  },
  /* قراءة قيمة متداخلة من الإعدادات بأمان: branding.logoMediaId مثلاً */
  path(dotted, fallback=null){
    const v = String(dotted).split('.').reduce((o,k) => (o == null ? o : o[k]), this.data);
    return v === undefined || v === null ? fallback : v;
  }
};

/* ========================== Roles & Permissions ===========================
   المرحلة الحالية: البنية جاهزة والميزة مؤجّلة عمداً.
   النظام يعمل بمستخدمة واحدة كاملة الصلاحية (authEnabled=false) فيسمح بكل شيء،
   لكن كل نقاط التحقق موجودة ومسمّاة من الآن. تفعيل الصلاحيات لاحقاً = شاشة دخول
   وضبط authEnabled، بلا إعادة كتابة للخدمات ولا للشاشات.
   قاعدة التسمية: "<الوحدة>.<الفعل>" — view / create / edit / delete / money.
   ========================================================================== */
const PERMISSIONS = {

  members:    { label:'المشتركات',   actions:['view','create','edit','delete'] },

  classes:    { label:'الحصص',       actions:['view','create','edit','delete'] },

  subs:       { label:'الاشتراكات',  actions:['view','create','edit','delete','money'] },
  offers:     { label:'العروض والولاء', actions:['view','create','edit','delete'] },
  pos:        { label:'المبيعات',    actions:['view','create','delete','money'] },
  inventory:  { label:'المخزون',     actions:['view','create','edit','delete'] },

  staff:      { label:'الفريق',      actions:['view','create','edit','delete'] },

  reports:    { label:'التقارير',    actions:['view','export'] },
  settings:   { label:'الإعدادات',   actions:['view','edit','danger'] }
};
const PERM_KEYS = Object.keys(PERMISSIONS).flatMap(m => PERMISSIONS[m].actions.map(a => `${m}.${a}`));
/* أدوار جاهزة تعكس الواقع التشغيلي للنادي — تُحفظ في جدول roles عند أول تشغيل */
const ROLE_PRESETS = [
  { key:'owner', name:'المالكة', system:true, description:'صلاحية كاملة بلا استثناء', perms:['*'] },
  { key:'manager', name:'المديرة', system:true, description:'كل شيء عدا إعادة التهيئة والعمليات الخطرة',
    perms:PERM_KEYS.filter(k => k !== 'settings.danger') },
  { key:'reception', name:'الاستقبال', system:true, description:'المشتركات والاشتراكات والحضور والبيع — بلا رواتب ولا تقارير مالية',
    perms:['dashboard.view','desk.view','members.view','members.create','members.edit','subs.view','subs.create','subs.money',
           'crm.view','crm.create','crm.edit','tasks.view','tasks.create','tasks.edit',
           'classes.view','classes.create','classes.edit','cash.view','cash.create',
           'offers.view','pos.view','pos.create','pos.money','inventory.view','attendance.view','attendance.create',
           'trainings.view','exercises.view','reports.view'] },
  { key:'trainer', name:'المدربة', system:true, description:'التدريبات والتمارين والحضور فقط',
    perms:['dashboard.view','members.view','attendance.view','attendance.create','trainings.view','trainings.edit',
           'classes.view','classes.edit','tasks.view','exercises.view','exercises.create','exercises.edit'] }
];
const Auth = {
  /* الجلسة الحالية: تُملأ لاحقاً من شاشة دخول. اليوم = المالكة دائماً. */
  session: { actorId:null, actorName:'المالكة', roleKey:'owner' },
  enabled(){ return !!Settings.get('authEnabled'); },
  role(){
    const stored = Repos.roles.list(true).find(r => r.key === this.session.roleKey);
    return stored || ROLE_PRESETS.find(r => r.key === this.session.roleKey) || ROLE_PRESETS[0];
  },
  /* القاعدة الذهبية: ما دامت الصلاحيات معطّلة، كل شيء مسموح — فلا تتغيّر أي شاشة اليوم. */
  can(key){
    if (!this.enabled()) return true;
    const perms = this.role().perms || [];
    if (perms.includes('*')) return true;
    return perms.includes(key);
  },
  canAny(module){ return !!PERMISSIONS[module] && this.can(`${module}.view`); },
  /* نقطة التحقق الوحيدة التي تُستدعى من طبقة الأفعال */
  require(key){
    if (this.can(key)) return true;
    throw new AppError('لا تملكين صلاحية هذه العملية','FORBIDDEN', { key });
  },
  async ensureRoles(){
    if (Repos.roles.list(true).length) return 0;
    for (const r of ROLE_PRESETS) await Repos.roles.create(r);
    return ROLE_PRESETS.length;
  }
};
