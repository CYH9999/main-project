/* ----------------------------- اشتراكات ------------------------------ */
Svc.subs = {
  ofMember(memberId, inclArchived=false){
    return U.sortBy(Repos.subs.list(inclArchived).filter(s => s.memberId === memberId), s=>s.startDate);
  },
  /* المصدر الوحيد لحساب النهاية: قيمة + وحدة (من خطة محفوظة أو مدة مخصصة) */
  computeEnd(startDate, planOrDuration, custom){
    const d = this.durationOf(planOrDuration, custom);
    return DUR.end(startDate, d.value, d.unit);
  },
  /* يقبل: خطة (v2)، خطة قديمة (months/days)، أو {value,unit} */
  durationOf(planOrDuration, custom){
    if (typeof custom === 'number' && custom > 0) return { value:Math.round(custom), unit:'day' };   /* توافق: رقم = أيام */
    if (custom && DUR.valid(custom.value, custom.unit)) return { value:Number(custom.value), unit:custom.unit };
    const p = planOrDuration;
    if (p){
      if (DUR.valid(p.durationValue, p.durationUnit)) return { value:Number(p.durationValue), unit:p.durationUnit };
      if (Number(p.months) > 0) return { value:Number(p.months), unit:'month' };
      if (Number(p.days) > 0) return { value:Number(p.days), unit:'day' };
      if (DUR.valid(p.value, p.unit)) return { value:Number(p.value), unit:p.unit };
    }
    return { value:1, unit:'month' };
  },
  /* وصف المدة لأي اشتراك — يعمل مع السجلات القديمة أيضاً (يشتقها من التواريخ) */
  durationInfo(sub){
    if (DUR.valid(sub.durationValue, sub.durationUnit))
      return { value:sub.durationValue, unit:sub.durationUnit,
               label:sub.durationLabel || DUR.label(sub.durationValue, sub.durationUnit),
               days:DUR.days(sub.startDate, sub.endDate) };
    const days = DUR.days(sub.startDate, sub.endDate);
    return { value:days, unit:'day', label:sub.planName || DUR.label(days,'day'), days };
  },
  async create(d){
    const plan = d.planId ? Repos.plans.get(d.planId) : null;
    const dur = this.durationOf(plan, d.customDuration);
    const price = Money.clean(d.price);
    const discount = Money.clean(d.discount||0) || 0;
    const finalPrice = U.round2(Math.max(0, price - discount));
    const endDate = D.isISO(d.endDate) ? d.endDate : DUR.end(d.startDate, dur.value, dur.unit);
    const payload = {
      memberId:d.memberId, planId:d.planId||null,
      planName: plan ? plan.name : (d.planName || DUR.label(dur.value, dur.unit)),
      durationValue:dur.value, durationUnit:dur.unit, durationLabel:DUR.label(dur.value, dur.unit),
      startDate:d.startDate, endDate,
      /* النهاية كما بيعت. التجميد والتمديد يحرّكان endDate ولا يمسّان هذه أبداً. */
      baseEndDate:endDate,
      price, discount, discountReason:U.norm(d.discountReason),
      finalPrice, offerId:d.offerId||null, paymentMethod:d.paymentMethod||'نقد', notes:U.norm(d.notes),
      /* مزايا الاشتراك: حصص جماعية وتدريب خاص مشمولة بالسعر */
      sessionCredits:Math.max(0, Math.round(Money.clean(d.sessionCredits)||0)),
      ptCredits:Math.max(0, Math.round(Money.clean(d.ptCredits)||0)),
      benefits:U.norm(d.benefits),
      isDemo:!!d.isDemo
    };
    /* يُتحقق من السعر كما أدخلته المستخدمة (فارغ ≠ صفر) قبل أي تحويل رقمي */
    const raw = (d.price === '' || d.price == null) ? '' : price;
    const val = Validate.subscription(Object.assign({}, payload, { price:raw }), this.ofMember(d.memberId));
    if (!val.ok) throw new AppError('بيانات الاشتراك غير صحيحة','VALIDATION', val.errors);
    const rec = await Repos.subs.create(payload);
    const member = Repos.members.get(d.memberId);
    /* الدفعة المبدئية: الافتراضي «دفعت كامل المبلغ»، ويمكن قبض جزء أو لا شيء.
       الإيراد لا يُسجَّل إلا بقدر ما قُبض فعلاً — هذا ما يمنع تضخيم الإيرادات. */
    let paidAmount = (d.paidAmount === '' || d.paidAmount == null)
      ? finalPrice
      : Math.max(0, Math.min(finalPrice, Money.clean(d.paidAmount) || 0));
    if (!Settings.get('autoRevenueFromSubs')) paidAmount = 0;
    if (paidAmount > 0){
      try {
        await Svc.payments.add({ refType:'subscription', refId:rec.id, memberId:d.memberId,
          /* اشتراك يبدأ لاحقاً ودُفع اليوم: النقد دخل الدرج اليوم لا يوم البدء.
             تأريخ القبض بالمستقبل يضخّم إيراد شهر لم يأتِ ويُخفي نقد اليوم. */
          date:d.paymentDate || (D.cmp(d.startDate, D.today()) > 0 ? D.today() : d.startDate),
          amount:paidAmount, method:payload.paymentMethod,
          description:`اشتراك ${payload.planName} — ${member?member.name:''}`, notes:'', isDemo:!!d.isDemo });
      } catch(e){
        /* فشل القبض لا يترك اشتراكاً نصف مسجَّل */
        await Repos.subs.hardDelete(rec.id).catch(()=>{});
        throw e;
      }
    }
    /* الحصص المشمولة تُمنح بعد نجاح القبض: باقة بلا اشتراك مدفوع بلا معنى.
       فشل منحها لا يُلغي الاشتراك — يُسجَّل تحذيراً ليُعالَج يدوياً. */
    for (const [kind, qty] of [['class', payload.sessionCredits], ['pt', payload.ptCredits]]){
      if (!qty) continue;
      try {
        await Svc.credits.grant({ memberId:d.memberId, subId:rec.id, kind, qty, date:payload.startDate,
          expiresAt:endDate, refType:'subscription', refId:rec.id,
          notes:`مشمولة باشتراك ${payload.planName}`, isDemo:!!d.isDemo });
      } catch(e){
        Log.warn('تعذّر منح الحصص المشمولة', e);
        val.warnings.push(`تعذّر تسجيل ${qty} ${Svc.credits.KIND[kind]} — أضيفيها يدوياً من ملف المشتركة`);
      }
    }
    if (d.offerId) await Audit.log('offer','redeem',`تفعيل عرض على اشتراك ${member?member.name:''}`, d.offerId);
    await Audit.log('subscription','create',`اشتراك ${payload.planName} لـ ${member?member.name:''} بمبلغ ${Money.fmt(finalPrice)}`, rec.id);
    return { rec, warnings:val.warnings };
  },
  async update(id, d){
    const cur = Repos.subs.get(id);
    if (!cur) throw new AppError('الاشتراك غير موجود','NOT_FOUND');
    const plan = d.planId ? Repos.plans.get(d.planId) : null;
    const dur = this.durationOf(plan, d.customDuration) ;
    const price = Money.clean(d.price), discount = Money.clean(d.discount||0)||0;
    const finalPrice = U.round2(Math.max(0, price - discount));
    const endDate = D.isISO(d.endDate) ? d.endDate : DUR.end(d.startDate, dur.value, dur.unit);
    const payload = Object.assign({}, cur, {
      planId:d.planId||null, planName: plan ? plan.name : (d.planName || DUR.label(dur.value, dur.unit)),
      durationValue:dur.value, durationUnit:dur.unit, durationLabel:DUR.label(dur.value, dur.unit),
      startDate:d.startDate, endDate,
      price, discount, discountReason:U.norm(d.discountReason), finalPrice,
      paymentMethod:d.paymentMethod||cur.paymentMethod, notes:U.norm(d.notes)
    });
    const rawU = (d.price === '' || d.price == null) ? '' : price;
    const val = Validate.subscription(Object.assign({}, payload, { price:rawU }), this.ofMember(cur.memberId));
    if (!val.ok) throw new AppError('بيانات الاشتراك غير صحيحة','VALIDATION', val.errors);
    /* تعديل السعر يغيّر «المستحق» فقط. الدفعات المقبوضة سابقاً حقيقة تاريخية
       لا تُعاد كتابتها، وإلا تغيّرت إيرادات شهر مقفل بأثر رجعي. */
    const paid = Svc.payments.paidFor('subscription', id);
    if (paid > finalPrice + 0.001)
      val.warnings.push(`المقبوض (${Money.fmt(paid)}) أكبر من السعر الجديد (${Money.fmt(finalPrice)}) — ألغي دفعة زائدة من سجل الدفعات`);
    const rec = await Repos.subs.update(id, payload);
    const after = Calc.payStatus(finalPrice, paid);
    if (after.due > 0) val.warnings.push(`المتبقي على هذا الاشتراك الآن ${Money.fmt(after.due)}`);
    await Audit.log('subscription','update',`تعديل اشتراك بمبلغ ${Money.fmt(finalPrice)} (مقبوض ${Money.fmt(paid)})`, id);
    return { rec, warnings:val.warnings };
  },
  /* الأرشفة تسحب الإيراد المرتبط أيضاً حتى لا تبقى أرقام مالية معلّقة */
  async archive(id, on=true){
    const s = Repos.subs.get(id);
    const rec = await Repos.subs.archive(id, on);
    await Svc.payments.setArchived('subscription', id, on);
    /* توافق مع سجلات ما قبل v3 التي كانت تحمل revenueId مباشرة */
    if (s && s.revenueId && Repos.revenues.get(s.revenueId)) await Repos.revenues.archive(s.revenueId, on);
    await Audit.log('subscription', on?'archive':'restore', `${on?'أرشفة':'استرجاع'} اشتراك ${s?s.planName:''}`, id);
    return rec;
  },
  withMember(inclArchived=false){
    return Repos.subs.list(inclArchived).map(s => ({ s, member:Repos.members.get(s.memberId) }));
  },
  /* الحالة المالية لاشتراك واحد — تُقرأ من الدفعات لا من حقل في الاشتراك */
  balance(sub){ return Calc.payStatus(sub.finalPrice, Svc.payments.paidFor('subscription', sub.id)); }
};


/* ===== src/app/services/30-payments.js =============================================== */
/* ----------------------------- المقبوضات ------------------------------
   الدفعة هي الحدث المالي الحقيقي: كل دفعة تُنشئ سطر إيراد واحداً ولا شيء غيرها.
   المستند (اشتراك/فاتورة) يقول «كم المستحق»، والدفعات تقول «كم قُبض فعلاً».
   تعديل سعر المستند لا يغيّر دفعة سابقة — المقبوض حقيقة تاريخية لا تُعاد كتابتها. */
Svc.payments = {
  REF_LABEL: { subscription:'اشتراك', sale:'فاتورة بيع' },
  forRef(refType, refId, inclArchived=false){
    return U.sortBy(Repos.payments.list(inclArchived).filter(x => x.refType === refType && x.refId === refId), x=>x.date);
  },
  paidFor(refType, refId){ return Calc.paidOf(this.forRef(refType, refId)); },
  /* فهرس {refId: المقبوض} لحساب مئات المستندات بمرور واحد */
  indexBy(refType){
    const out = {};
    Repos.payments.list().forEach(x => { if (x.refType === refType) out[x.refId] = U.round2((out[x.refId]||0) + (Number(x.amount)||0)); });
    return out;
  },
  ofMember(memberId, inclArchived=false){
    return U.sortBy(Repos.payments.list(inclArchived).filter(x => x.memberId === memberId), x=>x.date, -1);
  },
  /* لا تُقبل دفعة أكبر من المتبقي: هذا يمنع تضخيم الإيراد بالخطأ */
  validate(d, doc, alreadyPaid){
    const r = V();
    if (!D.isISO(d.date)) vErr(r,'date','تاريخ الدفعة غير صحيح');
    else if (D.cmp(d.date, D.today()) > 0) vErr(r,'date','لا يُقبض مبلغ بتاريخ لم يأتِ بعد');
    const amt = Money.clean(d.amount);
    if (!(isFinite(amt) && amt > 0)) vErr(r,'amount','المبلغ يجب أن يكون أكبر من صفر');
    else if (doc){
      const total = doc.finalPrice != null ? doc.finalPrice : doc.total;
      const due = U.round2((Number(total)||0) - (Number(alreadyPaid)||0));
      if (amt > due + 0.001) vErr(r,'amount',`المتبقي ${Money.fmt(due)} فقط — لا يمكن قبض أكثر منه`);
    }
    return r;
  },
  async add(d){
    const doc = d.refType === 'subscription' ? Repos.subs.get(d.refId) : Repos.sales.get(d.refId);
    if (!doc) throw new AppError('المستند المرتبط بالدفعة غير موجود','NOT_FOUND');
    const already = this.paidFor(d.refType, d.refId);
    const val = this.validate(d, doc, already);
    if (!val.ok) throw new AppError('بيانات الدفعة غير صحيحة','VALIDATION', val.errors);
    const amount = Money.clean(d.amount);
    const memberId = d.memberId || doc.memberId || null;
    const member = memberId ? Repos.members.get(memberId) : null;
    const rec = await Repos.payments.create({
      refType:d.refType, refId:d.refId, memberId, date:d.date, amount,
      method:d.method || 'نقد', notes:U.norm(d.notes), revenueId:null, isDemo:!!d.isDemo
    });
    /* سطر الإيراد يولد من الدفعة — ولا يولد من أي مكان آخر */
    try {
      const rev = await Repos.revenues.create({
        date:d.date, amount, source:d.refType === 'sale' ? 'product' : 'subscription',
        refId:d.refId, paymentId:rec.id,
        description: d.description || `${this.REF_LABEL[d.refType]}${member?' — '+member.name:''}`,
        method:rec.method, notes:'', isDemo:!!d.isDemo
      });
      await Repos.payments.update(rec.id, { revenueId:rev.id });
      rec.revenueId = rev.id;
    } catch(e){
      /* لا نترك دفعة بلا إيراد: نتراجع عنها بدل تسجيل قبض لا يظهر في المالية */
      await Repos.payments.hardDelete(rec.id).catch(()=>{});
      throw new AppError('تعذّر ترحيل الدفعة إلى الإيرادات — لم تُسجَّل الدفعة','PAYMENT_FAILED', e);
    }
    await Audit.log('payment','create',`قبض ${Money.fmt(amount)} على ${this.REF_LABEL[d.refType]}${member?' — '+member.name:''}`, rec.id);
    return rec;
  },
  /* حذف دفعة = حذف سطر الإيراد المقابل. لا تبقى نقود في التقارير بلا سند. */
  async remove(id){
    const pmt = Repos.payments.get(id);
    if (!pmt) throw new AppError('الدفعة غير موجودة','NOT_FOUND');
    if (pmt.revenueId && Repos.revenues.get(pmt.revenueId)) await DB.remove('revenues', pmt.revenueId);
    await Repos.payments.hardDelete(id);
    /* الوصل المطبوع بيد المشتركة لا يُمحى من السجل — يُبطَل ويبقى شاهداً */
    await Svc.receipts.voidForPayment(id, 'أُلغيت الدفعة').catch(e => Log.warn('تعذّر إبطال الوصل', e));
    await Audit.log('payment','delete',`إلغاء دفعة ${Money.fmt(pmt.amount)}`, id);
    return pmt;
  },
  /* أرشفة/استرجاع مستند تسحب دفعاته وإيراداته معه حتى لا تبقى أرقام معلّقة */
  async setArchived(refType, refId, on){
    for (const pm of this.forRef(refType, refId, true)){
      await Repos.payments.archive(pm.id, on);
      if (pm.revenueId && Repos.revenues.get(pm.revenueId)) await Repos.revenues.archive(pm.revenueId, on);
    }
  },
  /* كل الذمم المفتوحة، مرتّبة بالأقدم أولاً */
  openDues(){
    const subIdx = this.indexBy('subscription'), saleIdx = this.indexBy('sale');
    const out = [];
    Repos.subs.list().forEach(sb => {
      const st = Calc.payStatus(sb.finalPrice, subIdx[sb.id] || 0);
      if (st.due > 0) out.push({ kind:'subscription', doc:sb, member:Repos.members.get(sb.memberId), date:sb.startDate, st });
    });
    Repos.sales.list().forEach(sl => {
      const st = Calc.payStatus(sl.total, saleIdx[sl.id] || 0);
      if (st.due > 0) out.push({ kind:'sale', doc:sl, member:sl.memberId?Repos.members.get(sl.memberId):null, date:sl.date, st });
    });
    return U.sortBy(out, x=>x.date);
  },
  totalDue(){ const o = this.openDues(); return { due:U.round2(U.sum(o, x=>x.st.due)), count:o.length }; },
  /* عمر الدين بلغة مفهومة. المستند الذي لم يبدأ بعد ليس «متأخراً بسالب يوم». */
  ageText(date){
    const n = D.diffDays(date, D.today());
    if (n < 0) return { days:0, text:`يبدأ بعد ${Math.abs(n)} يوماً`, late:false, future:true };
    if (n === 0) return { days:0, text:'اليوم', late:false, future:false };
    return { days:n, text: n > 30 ? `متأخر ${n} يوماً` : `${n} يوماً`, late:n > 30, future:false };
  }
};


/* ===== src/app/services/40-inventory.js ============================================== */
/* ------------------------------ المخزون ------------------------------
   الرصيد = مجموع الحركات. لا يوجد عدّاد محفوظ يمكن أن يشرد عن الحقيقة. */
Svc.inventory = {
  MOVE_LABEL: { purchase:'شراء', adjust_in:'تسوية إضافة', sale:'بيع', consume:'استهلاك', adjust_out:'تسوية خصم', return:'مرتجع' },
  IN_TYPES: ['purchase','adjust_in','return'],
  products(inclArchived=false){ return Repos.products.list(inclArchived); },
  movesOf(productId, inclArchived=false){
    return U.sortBy(Repos.stockMoves.list(inclArchived).filter(m => m.productId === productId), m=>m.date, -1);
  },
  onHand(productId){ return Calc.onHand(Repos.stockMoves.list().filter(m => m.productId === productId)); },
  /* فهرس أرصدة كل الأصناف بمرور واحد على الحركات */
  onHandIndex(){
    const out = {};
    Repos.stockMoves.list().forEach(m => { out[m.productId] = U.round2((out[m.productId]||0) + (Number(m.qty)||0)); });
    return out;
  },
  costIndex(){ const o = {}; Repos.products.list(true).forEach(p => o[p.id] = Number(p.cost)||0); return o; },
  /* صفوف جاهزة للعرض: صنف + رصيد + قيمة + حالة التنبيه */
  rows(inclArchived=false){
    const idx = this.onHandIndex();
    return this.products(inclArchived).map(p => {
      const qty = idx[p.id] || 0;
      const min = Number(p.minStock)||0;
      const low = p.stockTracked !== false && min > 0 && qty <= min;
      return { p, qty, value:Calc.stockValue(qty, p.cost), low, out: p.stockTracked !== false && qty <= 0 };
    });
  },
  lowStock(){ return this.rows().filter(r => r.low || r.out); },
  totalValue(){ return U.round2(U.sum(this.rows(), r=>r.value)); },
  async saveProduct(id, d){
    const val = Validate.product(d, Repos.products.list(true), id);
    if (!val.ok) throw new AppError('بيانات الصنف غير صحيحة','VALIDATION', val.errors);
    const payload = { name:U.norm(d.name), sku:U.norm(d.sku), category:U.norm(d.category), unit:U.norm(d.unit)||'قطعة',
      price:Money.clean(d.price)||0, cost:Money.clean(d.cost)||0,
      stockTracked: d.stockTracked === undefined ? true : !!d.stockTracked,
      minStock:Money.clean(d.minStock)||0, supplier:U.norm(d.supplier), notes:U.norm(d.notes),
      active: d.active === undefined ? true : !!d.active };
    const rec = id ? await Repos.products.update(id, payload) : await Repos.products.create(Object.assign(payload, { isDemo:!!d.isDemo }));
    /* رصيد افتتاحي عند الإنشاء فقط — بعدها كل تغيير يمرّ بحركة مرئية */
    if (!id && Money.clean(d.openingQty) > 0)
      await this.addMove({ productId:rec.id, date:d.openingDate || D.today(), type:'purchase',
        qty:Money.clean(d.openingQty), unitCost:rec.cost, notes:'رصيد افتتاحي', skipExpense:true, isDemo:!!d.isDemo });
    await Audit.log('product', id?'update':'create', `${id?'تعديل':'إضافة'} صنف: ${rec.name}`, rec.id);
    return { rec, warnings:val.warnings };
  },
  async archiveProduct(id, on=true){
    const pr = Repos.products.get(id);
    const rec = await Repos.products.archive(id, on);
    await Audit.log('product', on?'archive':'restore', `${on?'أرشفة':'استرجاع'} صنف: ${pr?pr.name:id}`, id);
    return rec;
  },
  /* الحركة تُسجَّل بإشارة: الداخل موجب والخارج سالب — فيصير الرصيد مجرد جمع */
  async addMove(d){
    const product = Repos.products.get(d.productId);
    if (!product) throw new AppError('الصنف غير موجود','NOT_FOUND');
    const val = Validate.stockMove(d, this.onHand(d.productId), product);
    if (!val.ok) throw new AppError('بيانات الحركة غير صحيحة','VALIDATION', val.errors);
    const qty = Money.clean(d.qty);
    const signed = this.IN_TYPES.includes(d.type) ? qty : -qty;
    const unitCost = d.unitCost !== '' && d.unitCost != null ? Money.clean(d.unitCost) : Number(product.cost)||0;
    const rec = await Repos.stockMoves.create({ productId:d.productId, date:d.date || D.today(), type:d.type,
      qty:signed, unitCost, refType:d.refType||null, refId:d.refId||null, notes:U.norm(d.notes), expenseId:null, isDemo:!!d.isDemo });
    /* الشراء مصروف حقيقي — يُرحَّل مرة واحدة فقط ومن هنا حصراً */
    if (d.type === 'purchase' && !d.skipExpense && unitCost > 0){
      const cat = Repos.expCats.list().find(c => c.system === 'purchases') || Repos.expCats.list().find(c => U.normAr(c.name) === U.normAr('مشتريات'));
      const exp = await Repos.expenses.create({ date:rec.date, amount:U.round2(qty*unitCost), categoryId:cat?cat.id:null,
        description:`شراء ${product.name} × ${U.round2(qty)}`, payee:U.norm(d.supplier || product.supplier), notes:'',
        refType:'stock', refId:rec.id, isDemo:!!d.isDemo });
      await Repos.stockMoves.update(rec.id, { expenseId:exp.id });
      rec.expenseId = exp.id;
    }
    /* متوسط التكلفة المرجّح: يمنع تقلّب الربح مع كل شراء بسعر مختلف */
    if (this.IN_TYPES.includes(d.type) && unitCost > 0 && d.type !== 'return'){
      const before = U.round2(this.onHand(d.productId) - qty);
      const oldCost = Number(product.cost)||0;
      const newCost = before > 0 ? U.round2((before*oldCost + qty*unitCost) / (before + qty)) : U.round2(unitCost);
      if (newCost !== oldCost) await Repos.products.update(d.productId, { cost:newCost });
    }
    await Audit.log('stock','move',`${this.MOVE_LABEL[d.type]} ${U.round2(qty)} ${product.unit||''} — ${product.name}`, rec.id);
    return rec;
  },
  /* حذف حركة يسحب معه مصروف الشراء المرتبط بها */
  async removeMove(id){
    const mv = Repos.stockMoves.get(id);
    if (!mv) throw new AppError('الحركة غير موجودة','NOT_FOUND');
    if (mv.refType === 'sale') throw new AppError('هذه الحركة ناتجة عن فاتورة بيع — ألغي الفاتورة بدلاً منها','LINKED');
    if (mv.expenseId && Repos.expenses.get(mv.expenseId)) await DB.remove('expenses', mv.expenseId);
    await Repos.stockMoves.hardDelete(id);
    await Audit.log('stock','delete',`حذف حركة مخزون`, id);
    return mv;
  }
};


/* ===== src/app/services/50-sales.js ================================================== */
/* ------------------------------ المبيعات -----------------------------
   الفاتورة مستند مثل الاشتراك تماماً: تقول «كم المستحق»، والدفعات تقول «كم قُبض».
   البيع يخصم من المخزن بحركة مرئية، والإلغاء يعيدها — لا خصم خفي. */
Svc.sales = {
  async nextCode(){
    const n = (Number(Settings.get('saleSeq'))||0) + 1;
    await Settings.set({ saleSeq:n });
    return 'ف' + String(n).padStart(5,'0');
  },
  withMember(inclArchived=false){
    return Repos.sales.list(inclArchived).map(sl => ({ sl, member: sl.memberId ? Repos.members.get(sl.memberId) : null }));
  },
  balance(sale){ return Calc.payStatus(sale.total, Svc.payments.paidFor('sale', sale.id)); },
  async create(d){
    const stockIdx = Svc.inventory.onHandIndex();
    const lines = (d.lines||[]).filter(l => l.productId || U.norm(l.name)).map(l => {
      const pr = l.productId ? Repos.products.get(l.productId) : null;
      return { productId:l.productId||null, name:U.norm(l.name) || (pr?pr.name:''), qty:Number(l.qty)||0,
               unitPrice:Money.clean(l.unitPrice)||0, discount:Money.clean(l.discount)||0,
               unitCost: pr ? (Number(pr.cost)||0) : 0, total:Calc.saleLineTotal(l) };
    });
    const val = Validate.sale(Object.assign({}, d, { lines }), stockIdx);
    if (!val.ok) throw new AppError('بيانات الفاتورة غير صحيحة','VALIDATION', val.errors);
    const totals = Calc.saleTotals(lines, d.discount);
    const code = await this.nextCode();
    const rec = await Repos.sales.create({ code, date:d.date || D.today(), memberId:d.memberId||null,
      customerName:U.norm(d.customerName), lines, subtotal:totals.subtotal, discount:totals.discount,
      total:totals.total, items:totals.items, notes:U.norm(d.notes), isDemo:!!d.isDemo });
    /* من هنا فصاعداً أي فشل يجب أن يتراجع كلياً: لا فاتورة بنصف مخزون */
    const done = [];
    try {
      for (const l of lines){
        if (!l.productId) continue;
        const mv = await Svc.inventory.addMove({ productId:l.productId, date:rec.date, type:'sale', qty:l.qty,
          unitCost:l.unitCost, refType:'sale', refId:rec.id, notes:`فاتورة ${code}`, skipExpense:true, isDemo:!!d.isDemo });
        done.push(mv.id);
      }
      const paid = (d.paidAmount === '' || d.paidAmount == null) ? totals.total
                 : Math.max(0, Math.min(totals.total, Money.clean(d.paidAmount)||0));
      if (paid > 0){
        const mem = d.memberId ? Repos.members.get(d.memberId) : null;
        await Svc.payments.add({ refType:'sale', refId:rec.id, memberId:d.memberId||null, date:rec.date,
          amount:paid, method:d.paymentMethod||'نقد',
          description:`فاتورة ${code}${mem?' — '+mem.name:(U.norm(d.customerName)?' — '+U.norm(d.customerName):'')}`,
          notes:'', isDemo:!!d.isDemo });
      }
    } catch(e){
      for (const id of done){ try { await Repos.stockMoves.hardDelete(id); } catch(_){} }
      try { await Repos.sales.hardDelete(rec.id); } catch(_){}
      throw e;
    }
    await Audit.log('sale','create',`فاتورة ${code} بمبلغ ${Money.fmt(totals.total)} (${totals.items} قطعة)`, rec.id);
    return { rec, warnings:val.warnings };
  },
  /* الإلغاء يعيد المخزون ويسحب المقبوض — الفاتورة تبقى للسجل مؤرشفة */
  async archive(id, on=true){
    const sl = Repos.sales.get(id);
    if (!sl) throw new AppError('الفاتورة غير موجودة','NOT_FOUND');
    if (on){
      for (const mv of Repos.stockMoves.list(true).filter(m => m.refType === 'sale' && m.refId === id && !m.archived)){
        await Repos.stockMoves.archive(mv.id, true);
      }
    } else {
      const stockIdx = Svc.inventory.onHandIndex();
      /* لا نستعيد فاتورة لو صار المخزون لا يحتملها */
      for (const l of (sl.lines||[])){
        const pr = l.productId ? Repos.products.get(l.productId) : null;
        if (pr && pr.stockTracked !== false && (stockIdx[l.productId]||0) < l.qty)
          throw new AppError(`لا يمكن استرجاع الفاتورة: رصيد «${pr.name}» ${U.round2(stockIdx[l.productId]||0)} والمطلوب ${U.round2(l.qty)}`,'STOCK');
      }
      for (const mv of Repos.stockMoves.list(true).filter(m => m.refType === 'sale' && m.refId === id && m.archived)){
        await Repos.stockMoves.archive(mv.id, false);
      }
    }
    const rec = await Repos.sales.archive(id, on);
    await Svc.payments.setArchived('sale', id, on);
    await Audit.log('sale', on?'archive':'restore', `${on?'إلغاء':'استرجاع'} فاتورة ${sl.code} بمبلغ ${Money.fmt(sl.total)}`, id);
    return rec;
  },
  summary(from, to){
    const list = Calc.inRange(Repos.sales.list(), from, to);
    const prof = Calc.saleProfit(Repos.sales.list(), Svc.inventory.costIndex(), from, to);
    const idx = Svc.payments.indexBy('sale');
    const rec = Calc.receivables(list, idx);
    return { count:list.length, items:U.round2(U.sum(list, s=>s.items)), revenue:prof.revenue,
             cost:prof.cost, profit:prof.profit, due:rec.due, dueCount:rec.count };
  },
  topProducts(from, to, n=5){
    const agg = {};
    Calc.inRange(Repos.sales.list(), from, to).forEach(sl => (sl.lines||[]).forEach(l => {
      const k = l.productId || l.name;
      if (!agg[k]) agg[k] = { key:k, name:l.name, qty:0, total:0 };
      agg[k].qty += Number(l.qty)||0; agg[k].total += Number(l.total)||0;
    }));
    return U.sortBy(Object.values(agg), x=>x.total, -1).slice(0, n);
  }
};


/* ===== src/app/services/60-finance.js ================================================ */
/* ------------------------------ المالية ------------------------------ */
Svc.finance = {
  async addRevenue(d){
    const val = Validate.money(d,'revenue');
    if (!val.ok) throw new AppError('بيانات الإيراد غير صحيحة','VALIDATION', val.errors);
    const rec = await Repos.revenues.create({ date:d.date, amount:Money.clean(d.amount), source:d.source,
      description:U.norm(d.description), method:d.method||'نقد', notes:U.norm(d.notes), refId:d.refId||null, isDemo:!!d.isDemo });
    await Audit.log('revenue','create',`إيراد ${Money.fmt(rec.amount)} — ${rec.description}`, rec.id);
    return rec;
  },
  async updateRevenue(id, d){
    const val = Validate.money(d,'revenue');
    if (!val.ok) throw new AppError('بيانات الإيراد غير صحيحة','VALIDATION', val.errors);
    const cur = Repos.revenues.get(id);
    if (cur && cur.paymentId) throw new AppError('هذا الإيراد ناتج عن دفعة — عدّليها من سجل دفعات المستند','LINKED');
    if (cur && cur.source === 'subscription' && cur.refId) throw new AppError('هذا الإيراد مرتبط باشتراك — عدّليه من صفحة الاشتراكات','LINKED');
    const rec = await Repos.revenues.update(id, { date:d.date, amount:Money.clean(d.amount), source:d.source,
      description:U.norm(d.description), method:d.method, notes:U.norm(d.notes) });
    await Audit.log('revenue','update',`تعديل إيراد ${Money.fmt(rec.amount)}`, id);
    return rec;
  },
  async archiveRevenue(id, on=true){
    const r = Repos.revenues.get(id);
    const rec = await Repos.revenues.archive(id, on);
    await Audit.log('revenue', on?'archive':'restore', `${on?'أرشفة':'استرجاع'} إيراد ${r?Money.fmt(r.amount):''}`, id);
    return rec;
  },
  async addExpense(d){
    const val = Validate.money(d,'expense');
    if (!val.ok) throw new AppError('بيانات المصروف غير صحيحة','VALIDATION', val.errors);
    const rec = await Repos.expenses.create({ date:d.date, amount:Money.clean(d.amount), categoryId:d.categoryId,
      description:U.norm(d.description), payee:U.norm(d.payee), notes:U.norm(d.notes),
      refType:d.refType||null, refId:d.refId||null, isDemo:!!d.isDemo });
    await Audit.log('expense','create',`مصروف ${Money.fmt(rec.amount)} — ${rec.description}`, rec.id);
    return rec;
  },
  async updateExpense(id, d){
    const cur = Repos.expenses.get(id);
    if (cur && cur.refType === 'payroll') throw new AppError('هذا المصروف مرتبط براتب — عدّليه من صفحة الرواتب','LINKED');
    if (cur && cur.refType === 'stock') throw new AppError('هذا المصروف ناتج عن حركة شراء — عدّليها من صفحة المخزون','LINKED');
    const val = Validate.money(d,'expense');
    if (!val.ok) throw new AppError('بيانات المصروف غير صحيحة','VALIDATION', val.errors);
    const rec = await Repos.expenses.update(id, { date:d.date, amount:Money.clean(d.amount), categoryId:d.categoryId,
      description:U.norm(d.description), payee:U.norm(d.payee), notes:U.norm(d.notes) });
    await Audit.log('expense','update',`تعديل مصروف ${Money.fmt(rec.amount)}`, id);
    return rec;
  },
  async archiveExpense(id, on=true){
    const e = Repos.expenses.get(id);
    if (e && e.refType === 'payroll' && on) throw new AppError('لا يمكن أرشفة مصروف راتب مباشرة — ألغي الدفع من صفحة الرواتب','LINKED');
    if (e && e.refType === 'stock' && on) throw new AppError('لا يمكن أرشفة مصروف شراء مباشرة — احذفي حركة الشراء من صفحة المخزون','LINKED');
    const rec = await Repos.expenses.archive(id, on);
    await Audit.log('expense', on?'archive':'restore', `${on?'أرشفة':'استرجاع'} مصروف ${e?Money.fmt(e.amount):''}`, id);
    return rec;
  },
  async addCapital(d){
    const val = Validate.capital(d);
    if (!val.ok) throw new AppError('بيانات الحركة غير صحيحة','VALIDATION', val.errors);
    if (d.type === 'withdrawal'){
      const cash = Calc.cash(Repos.revenues.list(), Repos.expenses.list(), Repos.capital.list());
      if (Money.clean(d.amount) > cash) val.warnings.push(`السحب أكبر من السيولة المتاحة (${Money.fmt(cash)})`);
    }
    const rec = await Repos.capital.create({ date:d.date, amount:Money.clean(d.amount), type:d.type,
      partnerId:d.partnerId||null, description:U.norm(d.description), notes:U.norm(d.notes), isDemo:!!d.isDemo });
    await Audit.log('capital','create',`${d.type==='injection'?'ضخ رأس مال':'سحب'} ${Money.fmt(rec.amount)}`, rec.id);
    return { rec, warnings:val.warnings };
  },
  async archiveCapital(id, on=true){
    const c = Repos.capital.get(id);
    const rec = await Repos.capital.archive(id, on);
    await Audit.log('capital', on?'archive':'restore', `${on?'أرشفة':'استرجاع'} حركة ${c?Money.fmt(c.amount):''}`, id);
    return rec;
  },
  async savePartner(id, d){
    const val = Validate.partner(d, Repos.partners.list(true), id);
    if (!val.ok) throw new AppError('بيانات الشريك غير صحيحة','VALIDATION', val.errors);
    const payload = { name:U.norm(d.name), sharePercent:U.round2(Money.clean(d.sharePercent)), notes:U.norm(d.notes) };
    const rec = id ? await Repos.partners.update(id, payload) : await Repos.partners.create(payload);
    await Audit.log('partner', id?'update':'create', `${id?'تعديل':'إضافة'} شريك: ${rec.name} (${rec.sharePercent}%)`, rec.id);
    return rec;
  },
  summary(from, to){
    const rev = Repos.revenues.list(), exp = Repos.expenses.list(), cap = Repos.capital.list();
    const revenue = Calc.revenue(rev, from, to), expense = Calc.expenses(exp, from, to);
    return {
      revenue, expense, net:U.round2(revenue-expense),
      capitalIn:Calc.capitalIn(cap, from, to), withdrawals:Calc.withdrawals(cap, from, to),
      capitalBalance:Calc.capitalBalance(cap), cash:Calc.cash(rev, exp, cap)
    };
  }
};


/* ===== src/app/services/70-payroll.js ================================================ */
/* ------------------------------ الرواتب ------------------------------ */
Svc.payroll = {
  ofPeriod(period){ return Repos.payrolls.list().filter(p => p.period === period); },
  ofStaff(staffId){ return U.sortBy(Repos.payrolls.list().filter(p => p.staffId === staffId), p=>p.period, -1); },
  async generate(period){
    const existing = this.ofPeriod(period);
    const created = [];
    for (const s of Repos.staff.list().filter(x => x.status !== 'left')){
      if (existing.some(p => p.staffId === s.id)) continue;
      const rec = await Repos.payrolls.create({ staffId:s.id, period, baseSalary:Number(s.baseSalary)||0,
        additions:[], deductions:[], advances:[], net:Number(s.baseSalary)||0, status:'draft', paidDate:null, expenseId:null, notes:'' });
      created.push(rec);
    }
    if (created.length) await Audit.log('payroll','generate',`إنشاء ${created.length} كشف راتب لشهر ${D.monthName(period)}`);
    return created;
  },
  async save(id, d){
    const val = Validate.payroll(d);
    if (!val.ok) throw new AppError('بيانات الراتب غير صحيحة','VALIDATION', val.errors);
    const cur = Repos.payrolls.get(id);
    if (cur && cur.status === 'paid') throw new AppError('الراتب مدفوع — ألغي الدفع أولاً للتعديل','LOCKED');
    const totals = Calc.payrollNet(d);
    const rec = await Repos.payrolls.update(id, { baseSalary:Money.clean(d.baseSalary), additions:d.additions||[],
      deductions:d.deductions||[], advances:d.advances||[], net:totals.net, notes:U.norm(d.notes) });
    await Audit.log('payroll','update',`تعديل راتب ${D.monthName(rec.period)} — صافي ${Money.fmt(rec.net)}`, id);
    return { rec, warnings:val.warnings };
  },
  /* الدفع ينشئ مصروفاً مرتبطاً — الرواتب تدخل المصروفات مرة واحدة فقط */
  async pay(id, date){
    const p = Repos.payrolls.get(id);
    if (!p) throw new AppError('كشف الراتب غير موجود','NOT_FOUND');
    if (p.status === 'paid') return p;
    if (p.net <= 0) throw new AppError('لا يمكن دفع صافي صفر أو أقل','INVALID');
    const st = Repos.staff.get(p.staffId);
    const cat = Repos.expCats.list().find(c => c.system === 'salaries') || Repos.expCats.list()[0];
    const exp = await Repos.expenses.create({ date:date || D.today(), amount:p.net, categoryId:cat?cat.id:null,
      description:`راتب ${st?st.name:''} — ${D.monthName(p.period)}`, payee:st?st.name:'', notes:'',
      refType:'payroll', refId:id });
    const rec = await Repos.payrolls.update(id, { status:'paid', paidDate:date||D.today(), expenseId:exp.id });
    await Audit.log('payroll','pay',`دفع راتب ${st?st.name:''} ${D.monthName(p.period)} بمبلغ ${Money.fmt(p.net)}`, id);
    return rec;
  },
  async unpay(id){
    const p = Repos.payrolls.get(id);
    if (!p || p.status !== 'paid') return p;
    if (p.expenseId && Repos.expenses.get(p.expenseId)){
      const ex = Repos.expenses.get(p.expenseId);
      await DB.remove('expenses', p.expenseId);
      await Audit.log('expense','delete',`حذف مصروف راتب مرتبط بمبلغ ${Money.fmt(ex.amount)}`, p.expenseId);
    }
    const rec = await Repos.payrolls.update(id, { status:'draft', paidDate:null, expenseId:null });
    await Audit.log('payroll','unpay',`إلغاء دفع راتب ${D.monthName(p.period)}`, id);
    return rec;
  }
};


/* ===== src/app/services/80-media.js ================================================== */
/* ------------------------------ الوسائط ------------------------------
   دورة الحياة: الوسائط ملك للكيان الذي يشير إليها. لا تُحذف إلا بعد التأكد
   أن أحداً لا يستعملها، ولا يجوز أن يُفسد فشلُ حذفها حذفَ الكيان نفسه.

   الإصدار الرابع أضاف مراجع كثيرة للوسائط (صورة المشتركة، مرفق هويتها،
   مستنداتها، صورة الموظفة، شعار النادي ولافتته). لذلك صار «من يستعمل هذه
   الوسائط؟» سؤالاً مركزياً يُجاب من جدول واحد: لو بقي الجواب «التمارين فقط»
   لحذف فحصُ السلامة شعارَ النادي باعتباره وسائط يتيمة. */
Svc.media = {
  MAX: 30 * 1024 * 1024,
  /* كل حقل في النظام يشير إلى وسائط. إضافة ميزة جديدة تحمل صورة = سطر هنا. */
  REFS: [
    { store:'exercises',  field:'mediaId',       label:'تمرين' },
    { store:'members',    field:'photoMediaId',  label:'صورة مشتركة' },
    { store:'members',    field:'idMediaId',     label:'مرفق هوية مشتركة' },
    { store:'memberDocs', field:'mediaId',       label:'مستند' },
    { store:'staff',      field:'photoMediaId',  label:'صورة موظفة' },
    { store:'staff',      field:'idMediaId',     label:'مرفق هوية موظفة' }
  ],
  async saveFile(file){
    if (!file || !isFinite(file.size)) throw new AppError('ملف غير صالح','BAD_FILE');
    if (file.size > this.MAX) throw new AppError('حجم الملف أكبر من 30 ميغابايت','TOO_BIG');
    const dataUrl = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => rej(new AppError('تعذّرت قراءة الملف','READ'));
      fr.readAsDataURL(file);
    });
    const kind = (file.type||'').startsWith('video') ? 'video' : 'image';
    return Repos.media.create({ name:file.name, type:file.type, size:file.size, kind, dataUrl, isDemo:!!file.isDemo });
  },
  get(id){ return Repos.media.get(id); },
  /* الهوية البصرية تعيش في الإعدادات لا في جدول، فتُفحص على حدة */
  usedByBranding(mediaId){
    const b = Settings.get('branding') || {};
    const out = [];
    if (b.logoMediaId === mediaId) out.push({ store:'settings', id:'branding.logo', label:'شعار النادي' });
    if (b.bannerMediaId === mediaId) out.push({ store:'settings', id:'branding.banner', label:'لافتة النادي' });
    return out;
  },
  /* من يستعمل هذه الوسائط الآن؟ except: {store,id} كيان نستثنيه أثناء الاستبدال */
  usedBy(mediaId, except){
    const ex = typeof except === 'string' ? { store:'exercises', id:except } : (except || {});
    const out = [];
    for (const ref of this.REFS){
      DB.all(ref.store).forEach(row => {
        if (row[ref.field] !== mediaId) return;
        if (ref.store === ex.store && row.id === ex.id) return;
        out.push({ store:ref.store, id:row.id, label:ref.label });
      });
    }
    return out.concat(this.usedByBranding(mediaId));
  },
  async remove(id){ if (id && Repos.media.get(id)) await DB.remove('media', id); },
  /* الحذف الآمن: لا يحذف إن كانت مستعملة، ولا يرمي خطأً يُفشل عملية أكبر */
  async removeIfUnused(id, except){
    if (!id || !Repos.media.get(id)) return { removed:false, reason:'غير موجودة' };
    const users = this.usedBy(id, except);
    if (users.length) return { removed:false, reason:`مستعملة في ${users.length} موضع آخر (${users[0].label})` };
    try { await DB.remove('media', id); return { removed:true }; }
    catch(e){ Log.warn('تعذّر حذف الوسائط — ستبقى يتيمة وتُنظَّف لاحقاً', e); return { removed:false, reason:e.message }; }
  },
  /* مجموع ما تشغله الوسائط — يظهر في الإعدادات لأن المساحة المحلية محدودة */
  usage(){
    const rows = Repos.media.list(true);
    return { count:rows.length, bytes:U.sum(rows, m => Number(m.size)||0),
             orphans:rows.filter(m => !this.usedBy(m.id).length).length };
  }
};


/* ===== src/app/services/90-exercises.js ============================================== */
/* ------------------------------ التمارين ------------------------------ */
Svc.exercises = {
  list(){ return Repos.exercises.list(true); },
  async save(id, payload, mediaOp){
    /* mediaOp: {file} لإرفاق/استبدال · {remove:true} للإزالة · null لإبقاء الحالي */
    const cur = id ? Repos.exercises.get(id) : null;
    if (id && !cur) throw new AppError('التمرين غير موجود','NOT_FOUND');
    const oldMediaId = cur ? cur.mediaId : null;
    let mediaId = oldMediaId || null;
    let newMediaId = null;
    if (mediaOp && mediaOp.file){ newMediaId = (await Svc.media.saveFile(mediaOp.file)).id; mediaId = newMediaId; }
    else if (mediaOp && mediaOp.remove) mediaId = null;
    try {
      const rec = id ? await Repos.exercises.update(id, Object.assign({}, payload, { mediaId }))
                     : await Repos.exercises.create(Object.assign({}, payload, { mediaId }));
      /* الكيان حُفظ بنجاح ⇒ الآن فقط نتخلص من الوسائط القديمة */
      if (oldMediaId && oldMediaId !== mediaId) await Svc.media.removeIfUnused(oldMediaId, rec.id);
      await Audit.log('exercise', id?'update':'create', `${id?'تعديل':'إضافة'} تمرين: ${rec.name}`, rec.id);
      return rec;
    } catch(e){
      /* فشل حفظ التمرين ⇒ لا نترك وسائط جديدة يتيمة */
      if (newMediaId) await Svc.media.remove(newMediaId).catch(()=>{});
      throw e;
    }
  },
  /* الحذف: الكيان أولاً (هو مصدر الحقيقة)، ثم تنظيف الوسائط.
     فشل تنظيف الوسائط لا يُلغي الحذف ولا يُظهر نجاحاً كاذباً للحذف نفسه. */
  async remove(id){
    const ex = Repos.exercises.get(id);
    if (!ex) throw new AppError('التمرين غير موجود أصلاً','NOT_FOUND');
    await Repos.exercises.hardDelete(id);                 // يرمي خطأً إن فشل القرص
    let media = { removed:false, reason:'بلا وسائط' };
    if (ex.mediaId) media = await Svc.media.removeIfUnused(ex.mediaId, id);
    await Audit.log('exercise','delete',`حذف تمرين: ${ex.name}${ex.mediaId?(media.removed?' مع وسائطه':' (بقيت وسائطه: '+media.reason+')'):''}`, id);
    return { exercise:ex, media };
  }
};


/* ===== src/app/services/100-trainings.js ============================================= */
/* ---------------------------- التدريبات ------------------------------
   الالتحاق علاقة صريحة بين الحصة والمشتركة: تُحترم فيها السعة ولا تُكرَّر. */
Svc.trainings = {
  enrolled(trainingId){
    const t = Repos.trainings.get(trainingId);
    return ((t && t.memberIds) || []).map(id => Repos.members.get(id)).filter(Boolean);
  },
  countOf(trainingId){ return this.enrolled(trainingId).length; },
  /* الحصص التي التحقت بها مشتركة معيّنة */
  ofMember(memberId){ return Repos.trainings.list().filter(t => (t.memberIds||[]).includes(memberId)); },
  seatsLeft(trainingId){
    const t = Repos.trainings.get(trainingId);
    const cap = Number(t && t.capacity) || 0;
    return cap > 0 ? Math.max(0, cap - this.countOf(trainingId)) : null;
  },
  async enroll(trainingId, memberId){
    const t = Repos.trainings.get(trainingId), m = Repos.members.get(memberId);
    if (!t) throw new AppError('الحصة غير موجودة','NOT_FOUND');
    if (!m) throw new AppError('المشتركة غير موجودة','NOT_FOUND');
    const ids = t.memberIds || [];
    if (ids.includes(memberId)) throw new AppError(`${m.name} ملتحقة بهذه الحصة أصلاً`,'DUPLICATE');
    const cap = Number(t.capacity) || 0;
    if (cap > 0 && ids.length >= cap) throw new AppError(`الحصة مكتملة (${cap} مقعداً)`,'FULL');
    const warnings = [];
    const st = Svc.members.status(memberId);
    if (st.status !== STATUS.ACTIVE && st.status !== STATUS.EXPIRING)
      warnings.push(`تنبيه: اشتراك ${m.name} ${st.status.ar}`);
    const rec = await Repos.trainings.update(trainingId, { memberIds:[...ids, memberId] });
    await Audit.log('training','enroll',`التحاق ${m.name} بحصة ${t.title}`, trainingId);
    return { rec, warnings };
  },
  async unenroll(trainingId, memberId){
    const t = Repos.trainings.get(trainingId), m = Repos.members.get(memberId);
    if (!t) throw new AppError('الحصة غير موجودة','NOT_FOUND');
    const rec = await Repos.trainings.update(trainingId, { memberIds:(t.memberIds||[]).filter(x => x !== memberId) });
    await Audit.log('training','unenroll',`إلغاء التحاق ${m?m.name:''} من حصة ${t.title}`, trainingId);
    return rec;
  }
};


/* ===== src/app/services/110-attendance.js ============================================ */
/* ------------------------------ الحضور -------------------------------
   سجل الحضور حقيقة يومية: مشتركة واحدة، يوم واحد، حصة واحدة، مرة واحدة. */
Svc.attendance = {
  ofDay(date, trainingId){
    return Repos.attendance.list().filter(a => a.date === date && (!trainingId || a.trainingId === trainingId));
  },
  ofMember(memberId, limit){
    const l = U.sortBy(Repos.attendance.list().filter(a => a.memberId === memberId), a=>a.date, -1);
    return limit ? l.slice(0, limit) : l;
  },
  has(memberId, date, trainingId){
    return Repos.attendance.list().some(a => a.memberId === memberId && a.date === date
      && (a.trainingId||null) === (trainingId||null));
  },
  /* الحصة المؤرَّخة معرّفها غير معرّف القالب، فلها فحصها الخاص. مشتركة قد
     تحضر حصّتين في يوم واحد، لكن لا تُسجَّل مرتين على الحصة نفسها. */
  hasForSession(memberId, sessionId){
    return Repos.attendance.list().some(a => a.memberId === memberId && a.sessionId === sessionId);
  },
  METHODS: { staff:'تسجيل الاستقبال', code:'كود المشتركة', qr:'رمز QR', class:'من الحصة', kiosk:'جهاز الحضور' },
  async checkIn(d){
    const member = Repos.members.get(d.memberId);
    if (!member) throw new AppError('المشتركة غير موجودة','NOT_FOUND');
    const date = d.date || D.today();
    if (!D.isISO(date)) throw new AppError('تاريخ غير صحيح','VALIDATION', { date:'تاريخ غير صحيح' });
    if (D.cmp(date, D.today()) > 0) throw new AppError('لا يمكن تسجيل حضور في تاريخ مستقبلي','VALIDATION', { date:'تاريخ مستقبلي' });
    if (this.has(d.memberId, date, d.trainingId))
      throw new AppError(`${member.name} مسجّلة حضوراً في هذا اليوم أصلاً`,'DUPLICATE');
    const warnings = [];
    const st = Svc.members.status(d.memberId);
    if (st.status !== STATUS.ACTIVE && st.status !== STATUS.EXPIRING){
      if (!Settings.get('attendanceAllowExpired'))
        throw new AppError(`اشتراك ${member.name} ${st.status.ar} — لا يمكن تسجيل الحضور`,'NO_ACTIVE_SUB');
      warnings.push(`تنبيه: اشتراك ${member.name} ${st.status.ar}`);
    } else if (st.status === STATUS.EXPIRING){
      warnings.push(`اشتراك ${member.name} ينتهي خلال ${st.daysLeft} يوم — ذكّريها بالتجديد`);
    }
    const rec = await Repos.attendance.create({ memberId:d.memberId, date,
      time:d.time || new Date().toTimeString().slice(0,5), trainingId:d.trainingId||null,
      sessionId:d.sessionId||null,
      /* طريقة التسجيل تُحفظ من الآن: بلا جهاز اليوم، ومع جهاز غداً بلا هجرة بيانات */
      method:d.method || 'staff', status:'in', checkOut:null,
      notes:U.norm(d.notes), isDemo:!!d.isDemo });
    await Audit.log('attendance','checkin',`حضور ${member.name} — ${D.fmt(date)}`, rec.id);
    return { rec, warnings };
  },
  async remove(id){
    const a = Repos.attendance.get(id);
    if (!a) throw new AppError('السجل غير موجود','NOT_FOUND');
    await Repos.attendance.hardDelete(id);
    const m = Repos.members.get(a.memberId);
    await Audit.log('attendance','delete',`حذف حضور ${m?m.name:''} — ${D.fmt(a.date)}`, id);
    return a;
  },
  /* الخروج اختياري: النادي الذي لا يسجّله يبقى سجلّه صحيحاً بلا وقت خروج */
  async checkOut(id, time){
    const a = Repos.attendance.get(id);
    if (!a) throw new AppError('سجل الحضور غير موجود','NOT_FOUND');
    if (a.checkOut) throw new AppError('سُجّل خروجها مسبقاً','DUPLICATE');
    const t = time || new Date().toTimeString().slice(0,5);
    if (!/^\d{2}:\d{2}$/.test(t)) throw new AppError('وقت غير صحيح','VALIDATION', { time:'وقت غير صحيح' });
    if (a.time && t < a.time) throw new AppError('وقت الخروج قبل وقت الدخول','VALIDATION', { time:'الخروج قبل الدخول' });
    const rec = await Repos.attendance.update(id, { checkOut:t, status:'out' });
    return rec;
  },
  /* من في النادي الآن — سؤال الاستقبال الأول */
  insideNow(){
    return this.ofDay(D.today()).filter(a => !a.checkOut)
      .map(a => ({ a, member:Repos.members.get(a.memberId) })).filter(x => x.member);
  },
  /* مدة الزيارة بالدقائق، لمن سُجّل خروجها فقط */
  minutesOf(a){
    if (!a || !a.time || !a.checkOut) return null;
    const [h1,m1] = a.time.split(':').map(Number), [h2,m2] = a.checkOut.split(':').map(Number);
    const n = (h2*60+m2) - (h1*60+m1);
    return n > 0 ? n : null;
  },
  /* إحصاءات المواظبة: تُستعمل في ملف المشتركة وفي التقارير */
  stats(memberId, days=30){
    const from = D.addDays(D.today(), -days);
    const all = this.ofMember(memberId);
    const recent = all.filter(a => D.cmp(a.date, from) >= 0);
    return { total:all.length, recent:recent.length, days,
             last: all.length ? all[0].date : null,
             rate: U.pct(recent.length, days) };
  },
  /* أكثر المشتركات مواظبة خلال فترة */
  top(from, to, n=5){
    const g = U.groupBy(Calc.inRange(Repos.attendance.list(), from, to), a=>a.memberId);
    return U.sortBy(Object.keys(g).map(id => ({ member:Repos.members.get(id), count:g[id].length })), x=>x.count, -1)
      .filter(x => x.member).slice(0, n);
  },
  /* المواظبة المتّصلة: أسابيع متتالية زارت فيها المشتركة مرة على الأقل.
     الأسبوع وحدةٌ أصدق من اليوم — لا أحد يتمرّن سبعة أيام بلا انقطاع. */
  streak(memberId){
    const dates = this.ofMember(memberId).map(a => a.date);
    if (!dates.length) return { weeks:0, lastVisit:null };
    const weekOf = iso => { const d = D.toDate(iso); return D.fromDate(D.toDate(D.addDays(iso, -d.getDay()))); };
    const weeks = new Set(dates.map(weekOf));
    let cursor = weekOf(D.today()), run = 0;
    /* الأسبوع الجاري لم يكتمل بعد: غيابه لا يكسر السلسلة، فنبدأ من السابق */
    if (!weeks.has(cursor)) cursor = D.addDays(cursor, -7);
    while (weeks.has(cursor)){ run++; cursor = D.addDays(cursor, -7); }
    return { weeks:run, lastVisit:dates[0] };
  },
  /* صورة المواظبة الكاملة لملف المشتركة */
  profile(memberId){
    const all = this.ofMember(memberId);
    const today = D.today();
    const since = d => (all.filter(a => D.cmp(a.date, D.addDays(today, -d)) >= 0).length);
    const first = all.length ? all[all.length-1].date : null;
    const spanWeeks = first ? Math.max(1, D.diffDays(first, today) / 7) : 1;
    const durations = all.map(a => this.minutesOf(a)).filter(n => n != null);
    return {
      total:all.length, last:all.length ? all[0].date : null,
      last7:since(7), last30:since(30), last90:since(90),
      perWeek:U.round2(all.length / spanWeeks),
      streak:this.streak(memberId).weeks,
      avgMinutes:durations.length ? Math.round(U.sum(durations) / durations.length) : null,
      /* أيام الأسبوع المفضّلة — تفيد جدولة الحصص */
      byWeekday:D.AR_D.map((name, i) => ({ name, count:all.filter(a => D.toDate(a.date).getDay() === i).length })),
      gapDays:all.length ? D.diffDays(all[0].date, today) : null
    };
  },
  /* المشتركات الفعّالات اللواتي انقطعن: أهم قائمة للاحتفاظ بالعميلات */
  inactive(days){
    const limit = days == null ? (Settings.get('inactiveDays') || 21) : days;
    const today = D.today();
    const lastBy = {};
    Repos.attendance.list().forEach(a => { if (!lastBy[a.memberId] || a.date > lastBy[a.memberId]) lastBy[a.memberId] = a.date; });
    return Svc.members.rows().filter(r => r.st.status === STATUS.ACTIVE || r.st.status === STATUS.EXPIRING)
      .map(r => ({ member:r.m, st:r.st, last:lastBy[r.m.id] || null,
                   days: lastBy[r.m.id] ? D.diffDays(lastBy[r.m.id], today) : (r.st.current ? D.diffDays(r.st.current.startDate, today) : null) }))
      .filter(x => x.days != null && x.days >= limit)
      .sort((a, b) => b.days - a.days);
  },
  /* المواظبات: تستحقّ التقدير، وهو سبب تجاري وجيه لتتبّعهنّ */
  mostRegular(from, to, n=5){ return this.top(from, to, n); },
  daySeries(days=14){
    const out = [];
    for (let i = days-1; i >= 0; i--){
      const d = D.addDays(D.today(), -i);
      out.push({ label:D.fmt(d).slice(0,5), value:this.ofDay(d).length, date:d });
    }
    return out;
  }
};

/* ---------------------------- التنبيهات ------------------------------ */
Svc.notify = {
  build(){
    const out = [], today = D.today(), s = Settings.get();
    const rows = Svc.members.rows();
    const urgent = rows.filter(r => r.st.status === STATUS.EXPIRING && r.st.daysLeft <= s.urgentDays);
    const soon = rows.filter(r => r.st.status === STATUS.EXPIRING && r.st.daysLeft > s.urgentDays);
    const justExpired = rows.filter(r => r.st.status === STATUS.EXPIRED && r.st.daysLeft >= -14);
    if (urgent.length) out.push({ level:'red', title:`${urgent.length} اشتراك ينتهي خلال ${s.urgentDays} أيام`,
      desc: urgent.slice(0,3).map(r=>r.m.name).join('، ') + (urgent.length>3?' وأخريات':''), go:'members', filter:'EXPIRING_SOON' });
    if (soon.length) out.push({ level:'gold', title:`${soon.length} اشتراك ينتهي خلال ${s.expiringSoonDays} أيام`,
      desc:'تواصلي معهنّ للتجديد', go:'members', filter:'EXPIRING_SOON' });
    if (justExpired.length) out.push({ level:'red', title:`${justExpired.length} اشتراك انتهى مؤخراً`,
      desc:'مرشّحات لعرض العودة', go:'members', filter:'EXPIRED' });
    const idx = Offers.subsIndex();
    const eligible = rows.filter(r => !r.m.archived && Offers.eligibleForMember(r.m.id, idx[r.m.id] || []).length);
    if (eligible.length) out.push({ level:'rose', title:`${eligible.length} مشتركة مؤهّلة لعرض`,
      desc: eligible.slice(0,3).map(r=>r.m.name).join('، '), go:'offers' });
    const lastMonth = D.monthsBack(2)[0];
    const unpaid = Svc.payroll.ofPeriod(lastMonth).filter(p => p.status !== 'paid');
    if (unpaid.length) out.push({ level:'gold', title:`${unpaid.length} راتب غير مدفوع لشهر ${D.monthName(lastMonth)}`, desc:'راجعي كشوف الرواتب', go:'payroll' });
    /* مصروف غير معتاد: أكبر من مضاعف الوسيط خلال آخر 90 يوماً */
    const recent = Calc.inRange(Repos.expenses.list(), D.addDays(today,-90), today).filter(e=>e.refType!=='payroll');
    if (recent.length >= 5){
      const sorted = recent.map(e=>e.amount).sort((a,b)=>a-b);
      const med = sorted[Math.floor(sorted.length/2)] || 0;
      const odd = recent.filter(e => e.amount > med * (s.unusualExpenseFactor||3) && D.diffDays(e.date, today) <= 30);
      if (odd.length) out.push({ level:'gold', title:`${odd.length} مصروف أعلى من المعتاد`,
        desc: odd.slice(0,2).map(e=>`${e.description} (${Money.fmt(e.amount)})`).join('، '), go:'finance' });
    }
    const due = Svc.payments.totalDue();
    if (due.count) out.push({ level:'red', title:`${Money.fmt(due.due)} غير محصّلة`,
      desc:`${due.count} اشتراك/فاتورة بحاجة إلى تحصيل`, go:'finance', tab:'dues' });
    const low = Settings.get('lowStockAlerts') ? Svc.inventory.lowStock() : [];
    if (low.length) out.push({ level:'gold', title:`${low.length} صنف تحت حد التنبيه`,
      desc: low.slice(0,3).map(r=>r.p.name).join('، '), go:'inventory' });
    const noPhone = rows.filter(r => !r.m.phone).length;
    if (noPhone) out.push({ level:'grey', title:`${noPhone} مشتركة بلا رقم هاتف`, desc:'أكملي البيانات للتواصل', go:'members' });
    const lb = s.lastBackupAt ? D.diffDays(String(s.lastBackupAt).slice(0,10), today) : null;
    if (lb === null || lb >= s.backupReminderDays)
      out.push({ level:'red', title: lb===null ? 'لا توجد نسخة احتياطية' : `آخر نسخة احتياطية قبل ${lb} يوماً`,
        desc:'صدّري نسخة الآن للحفاظ على البيانات', go:'settings' });
    return out;
  }
};
