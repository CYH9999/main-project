      day.innerHTML = UI.empty('لا حصص في هذا اليوم','جدوليها يدوياً أو ولّديها من القوالب المتكرّرة',
        '<button class="btn btn-primary" id="cAdd2">جدولة حصة</button>');
      const b = day.querySelector('#cAdd2'); if (b) b.onclick = () => Forms.classSession(null, { date });
    } else {
      day.innerHTML = sessions.map(s => {

        const coach = s.coachId ? Repos.staff.get(s.coachId) : null;
        const books = Svc.classes.bookingsOf(s.id).filter(b => b.status !== 'cancelled');
        const dots = seat.capacity
          ? `<div class="seat-bar">${Array.from({ length:seat.capacity }, (_, i) => `<i class="${i < seat.booked ? 'on' : ''}"></i>`).join('')}
             ${Array.from({ length:seat.waitlist }, () => '<i class="wait"></i>').join('')}</div>` : '';
        return `<div class="card" style="margin-bottom:12px"><div class="card-head">
            <h3>${U.esc(s.title)}${s.status === 'cancelled' ? ' <span class="pill bad">ملغاة</span>' : ''}</h3>
            <span class="t-sub num">${U.esc(s.startTime)}${s.endTime ? ' — ' + U.esc(s.endTime) : ''}</span>

                  <td><span class="chip ${info.cls}"><span class="dot"></span>${info.ar}</span></td>

                      <button class="btn btn-sm" data-mark="${b.id}:no_show">لم تحضر</button>` : ''}
                    ${b.status !== 'attended' ? `<button class="btn btn-sm btn-icon btn-danger" data-unbook="${b.id}" title="إلغاء الحجز">${svg(ICON.trash, 14)}</button>` : ''}
                  </div></td></tr>`; }).join('')}
              </tbody></table>` : '<div class="t-sub" style="margin-top:8px">لا حجوزات بعد.</div>'}
            <div class="row" style="gap:6px;margin-top:12px">
              ${s.status !== 'cancelled' ? `<button class="btn btn-sm btn-primary" data-book="${s.id}">حجز مشتركة</button>` : ''}
              <button class="btn btn-sm" data-edit="${s.id}">تعديل</button>
              ${s.status !== 'cancelled' ? `<button class="btn btn-sm btn-danger" data-cancel="${s.id}">إلغاء الحصة</button>` : ''}
            </div>
          </div></div>`;
      }).join('');
    }

    const on = (sel, fn) => root.querySelectorAll(sel).forEach(b => b.onclick = () => fn(b));
    root.querySelector('#cPrev').onclick = () => go('classes', { date:D.addDays(date, -1) });
    root.querySelector('#cNext').onclick = () => go('classes', { date:D.addDays(date, 1) });
    root.querySelector('#cToday').onclick = () => go('classes', { date:D.today() });
    root.querySelector('#cAdd').onclick = () => Forms.classSession(null, { date });
    root.querySelector('#cGen').onclick = () => Screens.generateSessions(date);
    on('[data-open]', b => { const s = Repos.sessions.get(b.dataset.open); if (s) go('classes', { date:s.date }); });
    on('[data-edit]', b => Forms.classSession(b.dataset.edit));
    on('[data-mem]', b => Screens.memberProfile(b.dataset.mem));
    on('[data-book]', b => Screens.bookMember(b.dataset.book));
    on('[data-mark]', async b => {
      const [id, st] = b.dataset.mark.split(':');
      await guard(null, () => Svc.classes.mark(id, st), st === 'attended' ? 'سُجّل الحضور' : 'سُجّل الغياب');
      renderRoute();
    });
    on('[data-unbook]', async b => {
      if (!await UI.confirm({ title:'إلغاء حجز', message:'يُعاد رصيد الحصة إن كان قد خُصم، ويُرقّى أول من في قائمة الانتظار.' })) return;
      const res = await guard(null, () => Svc.classes.cancelBooking(b.dataset.unbook, 'إلغاء من الشاشة'));
      if (res && res.promoted) UI.toast('شغر مقعد ورُقّيت أول من في الانتظار', 'ok', 5000);
      else if (res) UI.toast('أُلغي الحجز');
      renderRoute();
    });
    on('[data-cancel]', async b => {
      const s = Repos.sessions.get(b.dataset.cancel);
      if (!await UI.confirm({ title:'إلغاء الحصة', danger:true, confirmText:'إلغاء الحصة',
        message:`ستُلغى «${U.esc(s.title)}» وتُعاد أرصدة الحصص لكل من حجزت — النادي هو من ألغى.` })) return;
      await guard(null, () => Svc.classes.cancel(b.dataset.cancel, 'إلغاء من الشاشة'), 'أُلغيت الحصة');
      renderRoute();
    });
  }
};

/* حجز مشتركة على حصة */
Screens.bookMember = function(sessionId){
  const s = Repos.sessions.get(sessionId);
  if (!s) return UI.toast('الحصة غير موجودة','err');
  const seat = Svc.classes.seats(sessionId);
  const booked = new Set(Svc.classes.bookingsOf(sessionId).filter(b => b.status !== 'cancelled').map(b => b.memberId));
  const rows = Svc.members.rows().filter(r => !booked.has(r.m.id));
  const h = UI.modal({
    title:`حجز في «${s.title}» — ${D.fmt(s.date)}`, size:'wide',
    body:`${seat.full ? `<div class="sens" style="margin-bottom:12px">المقاعد مكتملة (${seat.capacity}).
        من تُحجز الآن تدخل قائمة الانتظار بالمركز ${seat.waitlist + 1}، ولا يُخصم منها رصيد حتى يشغر مقعد.</div>` : ''}
      ${s.creditCost ? `<div class="t-sub" style="margin-bottom:10px">تخصم هذه الحصة ${s.creditCost} من رصيد الحصص.</div>` : ''}
      <input class="inp" id="bkQ" placeholder="ابحثي عن المشتركة…" style="margin-bottom:10px">
      <div id="bkList" style="max-height:340px;overflow:auto"></div>`,
    onMount(ov){
      const list = ov.querySelector('#bkList');
      const draw = q => {
        const s2 = U.normAr(q || '');
        const out = rows.filter(r => !s2 || [r.m.name, r.m.phone, r.m.code].map(U.normAr).join(' ').includes(s2)).slice(0, 30);
        list.innerHTML = out.length ? out.map(r => {
          const cr = Svc.credits.balance(r.m.id, 'class');
          return `<div class="hit"><span class="grow"><span class="t-name">${U.esc(r.m.name)}</span>
            <div class="t-sub">${U.esc(r.m.code)} — ${r.st.status.ar}${s.creditCost ? ` — الرصيد ${cr.remaining}` : ''}</div></span>
            <button class="btn btn-sm btn-primary" data-bk="${r.m.id}">${seat.full ? 'قائمة انتظار' : 'حجز'}</button></div>`;
        }).join('') : '<div class="t-sub">لا نتائج.</div>';
        list.querySelectorAll('[data-bk]').forEach(b => b.onclick = async () => {
          const res = await guard(null, () => Svc.classes.book(sessionId, b.dataset.bk));
          if (!res) return;
          (res.warnings || []).forEach(w => UI.toast(w, 'warn', 5000));
          if (!res.waitlisted) UI.toast('تمّ الحجز');
          h.close(); renderRoute();
        });
      };
      draw('');
      ov.querySelector('#bkQ').oninput = U.debounce(e => draw(e.target.value), 180);
    }
  });
};

/* توليد مواعيد من القوالب المتكرّرة */
Screens.generateSessions = function(fromDate){
  const templates = Repos.trainings.list();
  if (!templates.length) return UI.toast('لا قوالب حصص — أنشئي قالباً من شاشة جدول التدريبات','warn', 6000);
  const h = UI.modal({
    title:'توليد مواعيد من القوالب', size:'wide',
    body:`<div class="t-sub" style="margin-bottom:12px">القالب يقول «يوغا كل أحد وثلاثاء الساعة 6». التوليد يحوّله إلى مواعيد
        بتواريخ حقيقية يُحجز عليها ويُسجَّل حضورها. لا يُكرَّر موعد موجود أصلاً.</div>
      <div class="form-grid">
        ${UI.field('from','من', UI.input('from', fromDate || D.today(), { type:'date' }))}
        ${UI.field('to','إلى', UI.input('to', D.addDays(fromDate || D.today(), 27), { type:'date' }))}
      </div>
      <table class="mini-tbl"><thead><tr><th style="width:34px"><input type="checkbox" id="gAll" checked></th>
        <th>القالب</th><th>الأيام</th><th>الوقت</th><th>السعة</th></tr></thead><tbody>
        ${templates.map(t => `<tr><td><input type="checkbox" class="gt" data-id="${t.id}" checked></td>
          <td>${U.esc(t.title)}</td><td>${U.esc((t.days || []).join('، '))}</td>
          <td class="num">${U.esc(t.time || '')}</td><td class="num">${t.capacity || '—'}</td></tr>`).join('')}
      </tbody></table>`,
    footer:`<button class="btn btn-primary" id="gGo">توليد</button><button class="btn" data-close>إلغاء</button><div class="sp"></div>`,
    onMount(ov){
      ov.querySelector('#gAll').onchange = e => ov.querySelectorAll('.gt').forEach(c => c.checked = e.target.checked);
      ov.querySelector('#gGo').onclick = async () => {
        const d = UI.read(ov);
        const ids = [...ov.querySelectorAll('.gt')].filter(c => c.checked).map(c => c.dataset.id);
        if (!ids.length) return UI.toast('اختاري قالباً واحداً على الأقل','warn');
        let n = 0;
        for (const id of ids){
          const made = await guard(null, () => Svc.classes.generateFrom(id, d.from, d.to));
          if (made) n += made.length;
        }
        UI.toast(n ? `وُلّد ${n} موعداً` : 'لا مواعيد جديدة — كلها موجودة أصلاً', n ? 'ok' : 'warn');
        h.close(); renderRoute();
      };
    }
  });
};

Views.exercises = {
  title:'مكتبة التمارين',
  sub(){ return `${Repos.exercises.list().length} تمرين`; },
  render(root){
    const f = State.f.exercises;
    const cats = [...new Set(Repos.exercises.list().map(e=>e.category).filter(Boolean))];
    const levels = ['مبتدئة','متوسطة','متقدمة'];
    root.innerHTML = `<div class="card">
      <div class="filters">
        <input class="inp search" id="xQ" placeholder="بحث بالاسم أو العضلة" value="${U.esc(f.q)}">
        ${UI.select('xCat', f.cat, [{v:'',t:'كل التصنيفات'}, ...cats.map(c=>({v:c,t:c}))])}
        ${UI.select('xLevel', f.level, [{v:'',t:'كل المستويات'}, ...levels.map(l=>({v:l,t:l}))])}
        <div style="flex:1"></div>
        <button class="btn btn-sm btn-primary" id="xAdd">${svg(ICON.plus,15,2.4)} تمرين جديد</button>
      </div><div class="card-body" id="xGrid"></div></div>`;
    const draw = () => {
      let rows = Repos.exercises.list();
      const q = U.normAr(f.q);
      if (q) rows = rows.filter(e => U.normAr(e.name).includes(q) || U.normAr(e.muscles).includes(q));
      if (f.cat) rows = rows.filter(e => e.category === f.cat);
      if (f.level) rows = rows.filter(e => e.level === f.level);
      const g = $('xGrid');
      if (!rows.length){ g.innerHTML = UI.empty('لا توجد تمارين مطابقة','أضيفي تمريناً مع صورة أو فيديو من جهازك'); return; }
      g.innerHTML = `<div class="grid g-3">${rows.map(e => {
        const med = e.mediaId ? Repos.media.get(e.mediaId) : null;
        return `<div class="card" style="border-radius:10px"><div class="card-body" style="padding:13px">
          <div class="row" style="gap:11px;flex-wrap:nowrap;align-items:flex-start">
            ${med && med.kind==='image' ? `<img class="ex-thumb" src="${med.dataUrl}" alt="">`
              : `<div class="ex-thumb" style="display:flex;align-items:center;justify-content:center;color:var(--rose-600)">${svg(med?ICON.eye:ICON.dumbbell,20)}</div>`}
            <div style="flex:1;min-width:0">
              <div class="t-name">${U.esc(e.name)}</div>
              <div class="t-sub">${U.esc(e.category||'بلا تصنيف')}${e.level?` — ${U.esc(e.level)}`:''}</div>
              <div class="t-sub">${U.esc(e.muscles||'')}</div>
            </div></div>
          <div class="row" style="gap:6px;margin-top:10px">
            ${e.sets?`<span class="chip chip-none">${e.sets} مجموعة</span>`:''}
            ${e.reps?`<span class="chip chip-none">${e.reps} تكرار</span>`:''}
            ${e.duration?`<span class="chip chip-none">${e.duration} ثانية</span>`:''}
            ${e.rest?`<span class="chip chip-none">راحة ${e.rest}ث</span>`:''}
            ${med?`<span class="chip chip-rose">${med.kind==='video'?'فيديو':'صورة'}</span>`:''}
          </div>
          <div class="row" style="margin-top:11px;gap:6px">
            <button class="btn btn-sm" data-open="${e.id}">${svg(ICON.eye,15)} عرض</button>
            <button class="btn btn-sm btn-icon" data-edit="${e.id}">${svg(ICON.edit,15)}</button>
            <button class="btn btn-sm btn-icon btn-danger" data-del="${e.id}">${svg(ICON.trash,15)}</button>
          </div></div></div>`; }).join('')}</div>`;
      g.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => Forms.exercise(b.dataset.edit));
      g.querySelectorAll('[data-open]').forEach(b => b.onclick = () => Screens.exercise(b.dataset.open));
      g.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
        const id = b.dataset.del, e = Repos.exercises.get(id);
        if (!e) { UI.toast('التمرين غير موجود','err'); return renderRoute(); }
        const shared = e.mediaId ? Svc.media.usedBy(e.mediaId, id).length : 0;
        const ok = await UI.confirm({ title:'حذف التمرين', danger:true, confirmText:'حذف نهائي',
          message:`سيُحذف «${U.esc(e.name)}» نهائياً.` +
            (e.mediaId ? (shared ? ` الوسائط مستعملة في ${shared} تمرين آخر فستبقى محفوظة.` : ' وستُحذف وسائطه معه.') : '') });
        if (!ok) return;
        b.disabled = true;                                   // منع النقر المزدوج أثناء العملية
        try {
          const res = await Svc.exercises.remove(id);
          UI.toast(res.media.removed ? 'تم حذف التمرين ووسائطه' : 'تم حذف التمرين');
        } catch(err){
          Log.error('فشل حذف التمرين', err);
          UI.toast('لم يُحذف التمرين: ' + (err.message || 'خطأ غير متوقع'), 'err', 6000);
        } finally { renderRoute(); }
      });
    };
    draw();
    $('xQ').oninput = U.debounce(e => { f.q = e.target.value; draw(); }, 200);
    $('f_xCat').onchange = e => { f.cat = e.target.value; draw(); };
    $('f_xLevel').onchange = e => { f.level = e.target.value; draw(); };
    $('xAdd').onclick = () => Forms.exercise();
  }
};

    const PAY_COLS = [ { h:'الموظفة', key:'name', w:24 }, { h:'الوظيفة', key:'role', w:18 },
      { h:'الراتب الأساسي', key:'base', type:'number', w:16 }, { h:'الإضافات', key:'add', type:'number', w:13 },
      { h:'الخصومات', key:'ded', type:'number', w:13 }, { h:'السلف', key:'adv', type:'number', w:13 },
      { h:'صافي الراتب', key:'net', type:'number', w:15 }, { h:'الحالة', key:'state', w:14 }, { h:'تاريخ الدفع', key:'paid', w:14 } ];
    const payExport = () => rows.map(x => { const t = Calc.payrollNet(x.p);
      return { name:x.s.name, role:x.s.role, base:x.p.baseSalary, add:t.additions, ded:t.deductions, adv:t.advances,
        net:x.p.net, state:x.p.status==='paid'?'مدفوع':'غير مدفوع', paid:x.p.paidDate?D.fmt(x.p.paidDate):'—' }; });
    $('pCsv').onclick = () => Exporter.csv(`الرواتب-${period}.csv`, PAY_COLS, payExport());
    $('pXls').onclick = () => Exporter.xlsx(`الرواتب-${period}.xlsx`, [{ name:D.monthName(period), cols:PAY_COLS, rows:payExport() }]);
    $('pPrint').onclick = () => UI.printSection(`كشف رواتب ${D.monthName(period)}`,
      `<table class="tbl"><thead><tr><th>الموظفة</th><th>الوظيفة</th><th>الأساسي</th><th>إضافات</th><th>خصومات</th><th>سلف</th><th>الصافي</th><th>التوقيع</th></tr></thead>
       <tbody>${rows.map(x=>`<tr><td>${U.esc(x.s.name)}</td><td>${U.esc(x.s.role)}</td><td>${Money.fmt(x.p.baseSalary)}</td>
        <td>${Money.fmt(U.sum(x.p.additions||[],a=>a.amount))}</td><td>${Money.fmt(U.sum(x.p.deductions||[],a=>a.amount))}</td>
        <td>${Money.fmt(U.sum(x.p.advances||[],a=>a.amount))}</td><td><strong>${Money.fmt(x.p.net)}</strong></td><td style="width:120px"></td></tr>`).join('')}
        <tr><th colspan="6">المجموع</th><th>${Money.fmt(tot.net)}</th><th></th></tr></tbody></table>`);
  }
};

      </div></div>

        ${rows.length ? `<table class="mini-tbl"><thead><tr><th>التاريخ</th><th>افتتاحي</th><th>داخل</th><th>خارج</th><th>متوقّع</th><th>معدود</th><th>الفرق</th><th>ملاحظات</th><th></th></tr></thead><tbody>
          ${rows.map(c => `<tr><td class="num">${D.fmt(c.date)}</td><td class="num">${Money.fmt(c.openingCash)}</td>
            <td class="num">${Money.fmt(c.cashIn)}</td><td class="num">${Money.fmt(c.cashOut)}</td>
            <td class="num">${Money.fmt(c.expectedCash)}</td><td class="num">${Money.fmt(c.countedCash)}</td>

            <td class="t-sub">${U.esc(c.notes || '')}</td>

  },
  /* ------------------------------ المستحقات -----------------------------

  dues(body){

            return `<span class="num">${D.fmt(x.date)}</span>

        { h:'المستحق', sort:x=>x.st.total, render:x=>UI.money(x.st.total) },

            ${x.member?`<button class="btn btn-sm btn-icon" data-prof="${x.member.id}" title="ملف المشتركة">${svg(ICON.eye,15)}</button>`:''}</div>` }

        const [kind, id] = b.dataset.pay.split(':'); Forms.payment(kind, id); });

      const total = U.sum(rows.filter(r=>!r.archived), r=>r.amount);
      const cols = [
        { h:'التاريخ', sort:r=>r.date, render:r=>`<span class="num">${D.fmt(r.date)}</span>` },

        { h:'المبلغ', sort:r=>r.amount, render:r=>`<strong class="money-pos num">${Money.fmt(r.amount)}</strong>` },

      if (q) rows = rows.filter(r => U.normAr(r.description).includes(q) || U.normAr(r.payee).includes(q));
      if (f.cat) rows = rows.filter(r => r.categoryId === f.cat);
      if (f.from) rows = rows.filter(r => D.cmp(r.date, f.from) >= 0);
      if (f.to) rows = rows.filter(r => D.cmp(r.date, f.to) <= 0);
      rows = f.sortFn ? U.sortBy(rows, f.sortFn, f.sortDir) : U.sortBy(rows, r=>r.date, -1);
      const total = U.sum(rows.filter(r=>!r.archived), r=>r.amount);
      const cols = [
        { h:'التاريخ', sort:r=>r.date, render:r=>`<span class="num">${D.fmt(r.date)}</span>` },
        { h:'الوصف', sort:r=>r.description, render:r=>`<div class="t-name">${U.esc(r.description)}</div><div class="t-sub">${U.esc(r.payee||'')}</div>` },
        { h:'التصنيف', sort:r=>catName(r.categoryId), render:r=>`<span class="chip chip-none">${U.esc(catName(r.categoryId))}</span>` },
        { h:'المبلغ', sort:r=>r.amount, render:r=>`<strong class="money-neg num">${Money.fmt(r.amount)}</strong>` },
        { h:'', cls:'ta-l', render:r=>`<div class="t-actions">
            ${r.refType==='payroll' ? '<span class="t-sub">راتب مدفوع</span>' :
              `<button class="btn btn-sm btn-icon" data-edit="${r.id}">${svg(ICON.edit,15)}</button>
               <button class="btn btn-sm btn-icon ${r.archived?'':'btn-danger'}" data-arch="${r.id}">${svg(r.archived?ICON.undo:ICON.trash,15)}</button>`}</div>` }
      ];
      UI.table($('eTable'), { cols, rows, state:f, rowCls:r=>r.archived?'archived-row':'',
        empty:UI.empty('لا توجد مصروفات في هذه الفترة','سجّلي أول مصروف من زر «مصروف جديد»'),
        onSort:(fn,d)=>{ f.sortFn=fn; f.sortDir=d; draw(); }, onPage:draw });
      const pg = $('eTable').querySelector('.pager');
      if (pg) pg.insertAdjacentHTML('afterbegin', `<strong>المجموع: ${Money.fmt(total)}</strong>`);
      $('eTable').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => Forms.expense(b.dataset.edit));
      $('eTable').querySelectorAll('[data-arch]').forEach(b => b.onclick = () => Actions.archiveExpense(b.dataset.arch));
      const byCat = Calc.byCategory(rows.filter(r=>!r.archived));
      $('eChart').innerHTML = UI.donut(byCat.map((x,i)=>({ label:catName(x.key), value:x.total, color:UI.PALETTE[i%UI.PALETTE.length] })));
      f._rows = rows;
    };
    draw();
    $('eQ').oninput = U.debounce(e => { f.q = e.target.value; f.page=1; draw(); }, 220);
    $('f_eCat').onchange = e => { f.cat = e.target.value; f.page=1; draw(); };
    $('f_eFrom').onchange = e => { f.from = e.target.value; f.page=1; draw(); };
    $('f_eTo').onchange = e => { f.to = e.target.value; f.page=1; draw(); };
    $('eAdd').onclick = () => Forms.expense();
    const EXP_COLS = [{h:'التاريخ',key:'d',w:13},{h:'الوصف',key:'t',w:32},{h:'التصنيف',key:'c',w:16},
      {h:'الجهة',key:'p',w:18},{h:'المبلغ',key:'a',type:'number',w:15},{h:'الحالة',key:'st',w:12}];
    $('eCsv').onclick = () => Exporter.csv(`المصروفات-${D.today()}.csv`, EXP_COLS,
      (f._rows||[]).map(r => ({ d:D.fmt(r.date), t:r.description, c:catName(r.categoryId), p:r.payee||'', a:r.amount, st:r.archived?'مؤرشف':'مسجّل' })));
  },
  capital(body){
    const s = Svc.finance.summary();
    const partners = Repos.partners.list();
    const yFrom = `${D.today().slice(0,4)}-01-01`, yTo = `${D.today().slice(0,4)}-12-31`;
    const yearNet = Calc.netProfit(Repos.revenues.list(), Repos.expenses.list(), yFrom, yTo);
    const shareSum = U.sum(partners, p=>p.sharePercent);
    body.innerHTML = `<div class="stack">
      <div class="grid g-4">
        ${kpi('رأس المال المضخوخ', Money.fmt(Calc.capitalIn(Repos.capital.list())), 'مجموع ما دخل من الملّاك', 'plum')}
        ${kpi('السحوبات', Money.fmt(Calc.withdrawals(Repos.capital.list())), 'لا تُحتسب مصروفاً تشغيلياً', 'neg')}
        ${kpi('رأس المال المتبقي', Money.fmt(s.capitalBalance), 'المضخوخ − المسحوب')}
        ${kpi('السيولة المتاحة', Money.fmt(s.cash), 'رأس المال + الإيرادات − المصروفات − السحوبات', s.cash>=0?'pos':'neg')}
      </div>
      <div class="card"><div class="card-body" style="background:var(--rose-50);border-radius:var(--r-lg)">
        <strong>كيف تُقرأ الأرقام:</strong> رأس المال منفصل تماماً عن الإيرادات التشغيلية.
        صافي الربح = الإيرادات − المصروفات (والرواتب المدفوعة مصروف). السحوبات تنقص السيولة ورأس المال ولا تنقص الربح.
      </div></div>
      <div class="grid g-2">
        <div class="card"><div class="card-head"><h3>حركات رأس المال</h3><div class="sp"></div>
          <button class="btn btn-sm btn-primary" id="cAdd">${svg(ICON.plus,15,2.4)} حركة جديدة</button></div>
          <div id="cTable"></div></div>
        <div class="card"><div class="card-head"><h3>الشركاء وتوزيع الأرباح</h3><div class="sp"></div>
          <button class="btn btn-sm btn-primary" id="prAdd">${svg(ICON.plus,15,2.4)} شريك</button></div>
          <div class="card-body tight" id="prTable"></div>
          <div class="card-body" style="border-top:1px solid var(--line-2)">
            <div class="row"><span>صافي ربح ${D.today().slice(0,4)}:</span><strong>${Money.fmt(yearNet)}</strong>
            <div style="flex:1"></div><span class="chip ${shareSum===100?'chip-active':'chip-soon'}">مجموع الحصص ${U.round2(shareSum)}%</span></div>
          </div></div>
      </div></div>`;

    const cRows = U.sortBy(Repos.capital.list(true), c=>c.date, -1);
    UI.table($('cTable'), { state:State.f.capital, rows:cRows, rowCls:c=>c.archived?'archived-row':'',
      cols:[
        { h:'التاريخ', sort:c=>c.date, render:c=>`<span class="num">${D.fmt(c.date)}</span>` },
        { h:'الوصف', render:c=>`<div class="t-name">${U.esc(c.description)}</div><div class="t-sub">${U.esc(c.partnerId?(Repos.partners.get(c.partnerId)||{}).name||'':'')}</div>` },
        { h:'النوع', render:c=>c.type==='injection' ? '<span class="chip chip-active"><span class="dot"></span>ضخ</span>' : '<span class="chip chip-expired"><span class="dot"></span>سحب</span>' },
        { h:'المبلغ', sort:c=>c.amount, render:c=>`<strong class="num ${c.type==='injection'?'money-pos':'money-neg'}">${Money.fmt(c.amount)}</strong>` },
        { h:'', cls:'ta-l', render:c=>`<button class="btn btn-sm btn-icon ${c.archived?'':'btn-danger'}" data-arch="${c.id}">${svg(c.archived?ICON.undo:ICON.trash,15)}</button>` }
      ], empty:UI.empty('لا حركات رأس مال','سجّلي رأس المال الابتدائي ليُحسب رصيد السيولة بدقة'),
      onPage:()=>Views.finance.capital(body) });
    $('cTable').querySelectorAll('[data-arch]').forEach(b => b.onclick = async () => {
      const c = Repos.capital.get(b.dataset.arch);
      if (!c.archived && !await UI.confirm({ title:'أرشفة حركة رأس مال', message:`سيتأثر رصيد السيولة بمبلغ ${Money.fmt(c.amount)}.`, danger:true, confirmText:'أرشفة' })) return;
      await Svc.finance.archiveCapital(c.id, !c.archived); UI.toast('تم التحديث'); renderRoute();
    });
    $('cAdd').onclick = () => Forms.capital();

    UI.table($('prTable'), { state:{page:1,pageSize:20}, rows:partners,
      cols:[
        { h:'الشريك', render:p=>`<div class="t-name">${U.esc(p.name)}</div><div class="t-sub">${U.esc(p.notes||'')}</div>` },
        { h:'الحصة', render:p=>`<span class="num">${p.sharePercent}%</span>` },
        { h:'نصيب أرباح السنة', render:p=>UI.money(Calc.partnerShare(yearNet, p.sharePercent), true) },
        { h:'مسحوباته', render:p=>UI.money(U.sum(Repos.capital.list().filter(c=>c.partnerId===p.id&&c.type==='withdrawal'), c=>c.amount)) },
        { h:'', cls:'ta-l', render:p=>`<div class="t-actions">
            <button class="btn btn-sm btn-icon" data-edit="${p.id}">${svg(ICON.edit,15)}</button>
            <button class="btn btn-sm btn-icon btn-danger" data-del="${p.id}">${svg(ICON.trash,15)}</button></div>` }
      ], empty:UI.empty('لا يوجد شركاء','أضيفي الشركاء ونسبهم ليوزّع النظام الأرباح تلقائياً') });
    $('prTable').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => Forms.partner(b.dataset.edit));
    $('prTable').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      const p = Repos.partners.get(b.dataset.del);
      if (!await UI.confirm({ title:'أرشفة شريك', message:`سيُخفى «${U.esc(p.name)}» مع الاحتفاظ بحركاته المالية.`, danger:true, confirmText:'أرشفة' })) return;
      await Repos.partners.archive(p.id, true); UI.toast('تمت الأرشفة'); renderRoute();
    });
    $('prAdd').onclick = () => Forms.partner();
  }
};

Views.pos = {
  title:'المبيعات',
  sub(){ const s = Svc.sales.summary(); return `${s.count} فاتورة — ${Money.fmt(s.revenue)}`; },
  render(root){
    const f = State.f.sales;
    const { from, to } = periodOf(D.monthKey(D.today()));
    const s = Svc.sales.summary(from, to);
    const top = Svc.sales.topProducts(from, to, 5);
    root.innerHTML = `<div class="stack">
      <div class="grid g-4">
        ${kpi('مبيعات الشهر', Money.fmt(s.revenue), `${s.count} فاتورة`, 'pos')}
        ${kpi('ربح المبيعات', Money.fmt(s.profit), `تكلفة ${Money.fmt(s.cost)}`, s.profit>=0?'pos':'neg')}
        ${kpi('قطع مباعة', s.items, 'خلال الشهر', 'plum')}
        ${kpi('غير محصّل', Money.fmt(s.due), s.dueCount?`${s.dueCount} فاتورة`:'كل الفواتير محصّلة', s.due>0?'neg':'pos')}
      </div>
      <div class="card">
        <div class="filters">
          <input class="inp search" id="slQ" placeholder="بحث برقم الفاتورة أو اسم الزبونة" value="${U.esc(f.q)}">
          ${UI.select('slPay', f.pay, [{v:'',t:'كل الحالات'},{v:'PAID',t:'مدفوعة'},{v:'PARTIAL',t:'مدفوعة جزئياً'},{v:'UNPAID',t:'غير مدفوعة'}])}
          <label class="switch">من ${UI.input('slFrom', f.from, {type:'date'})}</label>
          <label class="switch">إلى ${UI.input('slTo', f.to, {type:'date'})}</label>
          <label class="switch"><input type="checkbox" id="slArch" ${f.archived?'checked':''}> الملغاة</label>
          <div style="flex:1"></div>
          <button class="btn btn-sm" id="slXls">${svg(ICON.down,15)} Excel</button>
          <button class="btn btn-sm btn-primary" id="slAdd">${svg(ICON.plus,15,2.4)} بيع جديد</button>
        </div><div id="slTable"></div></div>
      ${top.length ? `<div class="card"><div class="card-head"><h3>الأكثر مبيعاً — ${U.esc(D.monthName(D.monthKey(D.today())))}</h3></div>
        <div class="card-body tight"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>الصنف</th><th>الكمية</th><th>المبيعات</th></tr></thead>
        <tbody>${top.map(t=>`<tr><td>${U.esc(t.name)}</td><td class="num">${U.round2(t.qty)}</td><td>${UI.money(t.total)}</td></tr>`).join('')}</tbody></table></div></div></div>` : ''}
    </div>`;

    const draw = () => {
      const idx = Svc.payments.indexBy('sale');
      let rows = Svc.sales.withMember(f.archived).map(({ sl, member }) => ({ sl, member, st:Calc.payStatus(sl.total, idx[sl.id]||0) }));
      const q = U.normAr(f.q);
      if (q) rows = rows.filter(r => U.normAr(r.sl.code).includes(q)
        || (r.member && U.normAr(r.member.name).includes(q)) || U.normAr(r.sl.customerName).includes(q));
      if (f.pay) rows = rows.filter(r => r.st.key === f.pay);
      if (f.from) rows = rows.filter(r => D.cmp(r.sl.date, f.from) >= 0);
      if (f.to) rows = rows.filter(r => D.cmp(r.sl.date, f.to) <= 0);
      rows = f.sortFn ? U.sortBy(rows, f.sortFn, f.sortDir) : U.sortBy(rows, r=>r.sl.date, -1);
      const cols = [
        { h:'الفاتورة', sort:r=>r.sl.code, render:r=>`<div class="t-name num">${U.esc(r.sl.code)}</div><div class="t-sub num">${D.fmt(r.sl.date)}</div>` },
        { h:'الزبونة', sort:r=>r.member?r.member.name:r.sl.customerName, render:r=> r.member
            ? `<div class="t-name">${U.esc(r.member.name)}</div><div class="t-sub">${U.esc(r.member.code)}</div>`
            : `<div class="t-name">${U.esc(r.sl.customerName||'زبونة عابرة')}</div>` },
        { h:'البنود', sort:r=>r.sl.items, render:r=>`<div class="num">${U.round2(r.sl.items)}</div>
            <div class="t-sub">${U.esc((r.sl.lines||[]).slice(0,2).map(l=>l.name).join('، '))}${(r.sl.lines||[]).length>2?'…':''}</div>` },
        { h:'الإجمالي', sort:r=>r.sl.total, render:r=>`<strong>${Money.fmt(r.sl.total)}</strong>${r.sl.discount?`<div class="t-sub">خصم ${Money.fmt(r.sl.discount)}</div>`:''}` },
        { h:'المقبوض', sort:r=>r.st.paid, render:r=>UI.money(r.st.paid) },
        { h:'المتبقي', sort:r=>r.st.due, render:r=>r.st.due>0?`<strong class="money-neg num">${Money.fmt(r.st.due)}</strong>`:'<span class="t-sub">—</span>' },
        { h:'الحالة', render:r=> r.sl.archived ? '<span class="chip chip-none"><span class="dot"></span>ملغاة</span>' : UI.chip(r.st) },
        { h:'', cls:'ta-l', render:r=>`<div class="t-actions">
            <button class="btn btn-sm btn-icon" data-view="${r.sl.id}" title="عرض">${svg(ICON.eye,15)}</button>
            ${!r.sl.archived && r.st.due>0?`<button class="btn btn-sm" data-pay="${r.sl.id}">قبض</button>`:''}
            <button class="btn btn-sm btn-icon ${r.sl.archived?'':'btn-danger'}" data-arch="${r.sl.id}" title="${r.sl.archived?'استرجاع':'إلغاء'}">${svg(r.sl.archived?ICON.undo:ICON.trash,15)}</button></div>` }
      ];
      UI.table($('slTable'), { cols, rows, state:f, rowCls:r=>r.sl.archived?'archived-row':'',
        empty:UI.empty('لا فواتير مطابقة','سجّلي أول عملية بيع من زر «بيع جديد»'),
        onSort:(fn,d)=>{ f.sortFn=fn; f.sortDir=d; draw(); }, onPage:draw });
      const t = $('slTable');
      t.querySelectorAll('[data-view]').forEach(b => b.onclick = () => Screens.sale(b.dataset.view));
      t.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => Forms.payment('sale', b.dataset.pay));
      t.querySelectorAll('[data-arch]').forEach(b => b.onclick = () => Actions.archiveSale(b.dataset.arch));
      f._rows = rows;
    };
    draw();
    $('slQ').oninput = U.debounce(e => { f.q = e.target.value; f.page=1; draw(); }, 220);
    $('f_slPay').onchange = e => { f.pay = e.target.value; f.page=1; draw(); };
    $('f_slFrom').onchange = e => { f.from = e.target.value; f.page=1; draw(); };
    $('f_slTo').onchange = e => { f.to = e.target.value; f.page=1; draw(); };
    $('slArch').onchange = e => { f.archived = e.target.checked; f.page=1; draw(); };
    $('slAdd').onclick = () => Forms.sale();
    $('slXls').onclick = () => Exporter.xlsx(`المبيعات-${D.today()}.xlsx`,
      [{ name:'المبيعات', cols:Exporter.SALE_COLS, rows:Exporter.saleRows(f._rows||[]) }]);
  }
};

/* --------------------------------- المخزون --------------------------------- */
Views.inventory = {
  title:'المخزون',
  sub(){ const r = Svc.inventory.rows(); return `${r.length} صنف — قيمة ${Money.fmt(Svc.inventory.totalValue())}`; },

    const f = State.f.inventory;
    const all = Svc.inventory.rows(f.archived);
    const low = all.filter(r => r.low || r.out);
    const cats = [...new Set(all.map(r => r.p.category).filter(Boolean))];
    root.innerHTML = `<div class="stack">
      <div class="grid g-4">
        ${kpi('أصناف مسجّلة', all.length, `${all.filter(r=>r.p.active!==false).length} صنف فعّال`, 'plum')}
        ${kpi('قيمة المخزون', Money.fmt(U.sum(all, r=>r.value)), 'بسعر التكلفة', 'pos')}

        ${kpi('نفد من المخزن', all.filter(r=>r.out).length, '', all.filter(r=>r.out).length?'neg':'')}

          <td><span class="num">${U.round2(r.qty)}</span> <span class="t-sub">${U.esc(r.p.unit||'')}</span></td>
          <td>${r.out?'<span class="chip chip-expired"><span class="dot"></span>نفد</span>':`<span class="chip chip-soon"><span class="dot"></span>حد التنبيه ${U.round2(r.p.minStock)}</span>`}</td>
          <td class="ta-l"><button class="btn btn-sm btn-primary" data-buy="${r.p.id}">تسجيل شراء</button></td></tr>`).join('')}
        </tbody></table></div></div></div>` : ''}
      <div class="card">
        <div class="filters">
          <input class="inp search" id="invQ" placeholder="بحث بالاسم أو الرمز" value="${U.esc(f.q)}">
          ${UI.select('invCat', f.cat, [{v:'',t:'كل التصنيفات'}, ...cats.map(c=>({v:c,t:c}))])}
          ${UI.select('invState', f.state, [{v:'',t:'كل الأصناف'},{v:'low',t:'تحت حد التنبيه'},{v:'out',t:'نفد'},{v:'in',t:'متوفّر'}])}
          <label class="switch"><input type="checkbox" id="invArch" ${f.archived?'checked':''}> المؤرشفة</label>
          <div style="flex:1"></div>
          <button class="btn btn-sm" id="invXls">${svg(ICON.down,15)} Excel</button>
          <button class="btn btn-sm" id="invMove">${svg(ICON.plus,15,2.4)} حركة مخزون</button>
          <button class="btn btn-sm btn-primary" id="invAdd">${svg(ICON.plus,15,2.4)} صنف جديد</button>
        </div><div id="invTable"></div></div></div>`;

    const draw = () => {
      let rows = Svc.inventory.rows(f.archived);

      rows = f.sortFn ? U.sortBy(rows, f.sortFn, f.sortDir) : U.sortBy(rows, r=>r.p.name);
      const cols = [
        { h:'الصنف', sort:r=>r.p.name, render:r=>`<div class="t-name">${U.esc(r.p.name)}</div>

        { h:'الرصيد', sort:r=>r.qty, render:r=>`<strong class="num ${r.out?'money-neg':r.low?'':''}">${U.round2(r.qty)}</strong>
            <span class="t-sub">${U.esc(r.p.unit||'')}</span>${r.p.stockTracked===false?'<div class="t-sub">بلا متابعة</div>':''}` },
        { h:'التكلفة', sort:r=>r.p.cost, render:r=>UI.money(r.p.cost) },
        { h:'سعر البيع', sort:r=>r.p.price, render:r=>`<strong>${Money.fmt(r.p.price)}</strong>` },
        { h:'هامش الربح', sort:r=>r.p.price-r.p.cost, render:r=>{ const m = U.round2(r.p.price-r.p.cost);

              <div class="t-sub">${r.p.price>0?U.pct(m, r.p.price)+'%':''}</div>`; } },
        { h:'قيمة الرصيد', sort:r=>r.value, render:r=>UI.money(r.value) },
        { h:'الحالة', render:r=> r.p.archived ? '<span class="chip chip-none"><span class="dot"></span>مؤرشف</span>'
            : r.out ? '<span class="chip chip-expired"><span class="dot"></span>نفد</span>'
            : r.low ? '<span class="chip chip-soon"><span class="dot"></span>منخفض</span>'
            : '<span class="chip chip-active"><span class="dot"></span>متوفّر</span>' },
        { h:'', cls:'ta-l', render:r=>`<div class="t-actions">
            <button class="btn btn-sm btn-icon" data-hist="${r.p.id}" title="سجل الحركة">${svg(ICON.eye,15)}</button>
            <button class="btn btn-sm" data-buy="${r.p.id}">شراء</button>

            <button class="btn btn-sm btn-icon ${r.p.archived?'':'btn-danger'}" data-arch="${r.p.id}" title="${r.p.archived?'استرجاع':'أرشفة'}">${svg(r.p.archived?ICON.undo:ICON.trash,15)}</button></div>` }
      ];
      UI.table($('invTable'), { cols, rows, state:f, rowCls:r=>r.p.archived?'archived-row':'',
        empty:UI.empty('لا أصناف مطابقة','أضيفي أول صنف لتتبّع مخزون المكمّلات والملابس والمشروبات'),
        onSort:(fn,d)=>{ f.sortFn=fn; f.sortDir=d; draw(); }, onPage:draw });
      const t = $('invTable');
      t.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => Forms.product(b.dataset.edit));
      t.querySelectorAll('[data-hist]').forEach(b => b.onclick = () => Screens.stockHistory(b.dataset.hist));
      t.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => Forms.stockMove(b.dataset.buy, 'purchase'));
      t.querySelectorAll('[data-arch]').forEach(b => b.onclick = () => Actions.archiveProduct(b.dataset.arch));
      f._rows = rows;
    };
    draw();
    root.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => Forms.stockMove(b.dataset.buy, 'purchase'));
    $('invQ').oninput = U.debounce(e => { f.q = e.target.value; f.page=1; draw(); }, 220);
    $('f_invCat').onchange = e => { f.cat = e.target.value; f.page=1; draw(); };
    $('f_invState').onchange = e => { f.state = e.target.value; f.page=1; draw(); };
    $('invArch').onchange = e => { f.archived = e.target.checked; f.page=1; renderRoute(); };
    $('invAdd').onclick = () => Forms.product();
    $('invMove').onclick = () => Forms.stockMove();
    $('invXls').onclick = () => Exporter.xlsx(`المخزون-${D.today()}.xlsx`,
      [{ name:'المخزون', cols:Exporter.PROD_COLS, rows:Exporter.prodRows(f._rows||[]) }]);
  }
};

        { h:'المشتركة', sort:r=>r.m?r.m.name:'', render:r=>r.m

    $('f_attTraining').onchange = e => { f.trainingId = e.target.value; search(); };
    $('attPrint').onclick = () => UI.printSection(`سجل الحضور — ${D.fmt(f.date)}`,
      `<table class="tbl"><thead><tr><th>الوقت</th><th>المشتركة</th><th>الكود</th><th>الحصة</th></tr></thead><tbody>

  }

/* ===== src/app/views/80-reports-engine.js ============================================ */
const Reports = {
  /* يبني نموذج التقرير كبيانات صرفة، ثم تُعرض أو تُطبع أو تُصدَّر بنفس الأرقام */
  build(key){
    const { from, to } = periodOf(key);
    const rev = Repos.revenues.list(), exp = Repos.expenses.list(), cap = Repos.capital.list();
    const fin = Svc.finance.summary(from, to);
    const prevKey = D.monthsBack(2, D.endOfMonth(key))[0];
    const prev = Svc.finance.summary(D.startOfMonth(prevKey), D.endOfMonth(prevKey));
    const rows = Svc.members.rows();
    const subsAll = Repos.subs.list();
    const subsMonth = subsAll.filter(x => D.cmp(x.startDate, from) >= 0 && D.cmp(x.startDate, to) <= 0);
    const newMembers = rows.filter(r => D.cmp(r.m.joinDate, from) >= 0 && D.cmp(r.m.joinDate, to) <= 0);
    const renewed = subsMonth.filter(x => Svc.subs.ofMember(x.memberId).some(y => D.cmp(y.startDate, x.startDate) < 0));
    const byDuration = U.groupBy(subsMonth.map(x => Svc.subs.durationInfo(x)), d => d.label);
    const topDuration = U.sortBy(Object.keys(byDuration).map(k => ({ label:k, n:byDuration[k].length })), x => x.n, -1)[0];
    const pay = Svc.payroll.ofPeriod(key).map(p => ({ p, s:Repos.staff.get(p.staffId) })).filter(x => x.s);
    const payTot = pay.reduce((a, x) => { const t = Calc.payrollNet(x.p);
      return { base:a.base+x.p.baseSalary, add:a.add+t.additions, ded:a.ded+t.deductions, adv:a.adv+t.advances, net:a.net+x.p.net,
               paid:a.paid + (x.p.status==='paid'?x.p.net:0) }; }, { base:0, add:0, ded:0, adv:0, net:0, paid:0 });
    return {
      key, from, to, title:D.monthName(key), gym:Settings.get('gymName'), generatedAt:D.today(),
      fin, prev,
      deltaRevenue: prev.revenue ? U.pct(fin.revenue - prev.revenue, prev.revenue) : null,
      bySource: Calc.bySource(rev, from, to), byCategory: Calc.byCategory(exp, from, to),
      partners: Repos.partners.list(),
      members: {
        total: rows.length,
        active: rows.filter(r => r.st.status === STATUS.ACTIVE).length,
        expiring: rows.filter(r => r.st.status === STATUS.EXPIRING).length,
        expired: rows.filter(r => r.st.status === STATUS.EXPIRED).length,
        neu: newMembers.length, renewed: renewed.length,
        loyal: rows.filter(r => r.stats.count >= 3).length,
        subsCount: subsMonth.length,
        subsRevenue: U.sum(subsMonth, x => x.finalPrice),
        avgTicket: subsMonth.length ? U.round2(U.sum(subsMonth, x => x.finalPrice) / subsMonth.length) : 0,
        topDuration: topDuration ? `${topDuration.label} (${topDuration.n})` : '—',
        durations: U.sortBy(Object.keys(byDuration).map(k => ({ label:k, n:byDuration[k].length,
          total:U.sum(subsMonth.filter(x => Svc.subs.durationInfo(x).label === k), x => x.finalPrice) })), x => x.n, -1)
      },
      staff: { count: Repos.staff.list().filter(x => x.status !== 'left').length, rows:pay, tot:payTot },
      expensesList: U.sortBy(Calc.inRange(exp, from, to), x => x.date, -1),
      revenuesList: U.sortBy(Calc.inRange(rev, from, to), x => x.date, -1),
      /* المستحقات تُقاس اليوم لا بنهاية الشهر: الدين قائم حتى يُسدَّد */
      dues: (() => {
        const open = Svc.payments.openDues();
        const aged = open.filter(x => Svc.payments.ageText(x.date).days > 30);
        return { total:U.round2(U.sum(open, x=>x.st.due)), count:open.length,
                 subs:U.round2(U.sum(open.filter(x=>x.kind==='subscription'), x=>x.st.due)),
                 sales:U.round2(U.sum(open.filter(x=>x.kind==='sale'), x=>x.st.due)),
                 agedTotal:U.round2(U.sum(aged, x=>x.st.due)), agedCount:aged.length,
                 list:open.slice(0, 40) };
      })(),
      sales: (() => {
        const sum = Svc.sales.summary(from, to);
        return Object.assign({}, sum, { top:Svc.sales.topProducts(from, to, 8),
          list:U.sortBy(Calc.inRange(Repos.sales.list(), from, to), x=>x.date, -1) });
      })(),
      stock: (() => {
        const rows = Svc.inventory.rows();
        return { count:rows.length, value:U.round2(U.sum(rows, r=>r.value)),
                 low:rows.filter(r => r.low && !r.out), out:rows.filter(r => r.out), rows };
      })(),
      attendance: (() => {
        const list = Calc.inRange(Repos.attendance.list(), from, to);
        const days = Math.max(1, D.diffDays(from, D.cmp(to, D.today()) > 0 ? D.today() : to) + 1);
        const uniq = new Set(list.map(a => a.memberId)).size;
        return { total:list.length, days, avg:Math.round(list.length/days), unique:uniq,
                 top:Svc.attendance.top(from, to, 8),
                 inactive:Svc.attendance.inactive(),
                 byWeekday:D.AR_D.map((name, i) => ({ name, n:list.filter(a => D.toDate(a.date).getDay() === i).length })) };
      })(),
      /* ---------------------- عائلات تقارير الإصدار الرابع ---------------------- */
      crm: Svc.leads.funnel(from, to),
      classes: (() => {
        const st = Svc.classes.stats(from, to);
        const sessions = Svc.classes.between(from, to);
        const ids = new Set(sessions.map(x => x.id));
        const books = Repos.bookings.list().filter(b => ids.has(b.sessionId));
        const byCoach = U.groupBy(sessions, x => x.coachId || 'none');
        return Object.assign(st, {
          byCoach:Object.keys(byCoach).map(cid => {
            const ses = byCoach[cid];
            const sIds = new Set(ses.map(x => x.id));
            const bk = books.filter(b => sIds.has(b.sessionId));
            const st2 = Repos.staff.get(cid);
            return { name:st2 ? st2.name : 'بلا مدربة', sessions:ses.length,
                     attended:bk.filter(b => b.status === 'attended').length,
                     booked:bk.filter(b => b.status === 'booked' || b.status === 'attended').length,
                     noShow:bk.filter(b => b.status === 'no_show').length };
          }).sort((a, b) => b.sessions - a.sessions),
          byClass:Object.entries(U.groupBy(sessions, x => x.title)).map(([title, ses]) => {
            const sIds = new Set(ses.map(x => x.id));
            const bk = books.filter(b => sIds.has(b.sessionId));
            return { title, sessions:ses.length, attended:bk.filter(b => b.status === 'attended').length,
                     capacity:U.sum(ses, x => Number(x.capacity) || 0) };
          }).sort((a, b) => b.sessions - a.sessions)
        });
      })(),
      retention: (() => {
        /* من كانت فعّالة في أول الفترة، هل ما زالت فعّالة في آخرها؟ */
        const byMember = U.groupBy(Repos.subs.list(), sb => sb.memberId);
        const activeAt = day => Object.keys(byMember).filter(id =>
          byMember[id].some(sb => D.cmp(sb.startDate, day) <= 0 && D.cmp(sb.endDate, day) >= 0));
        const start = activeAt(from), end = new Set(activeAt(to));
        const kept = start.filter(id => end.has(id));
        return { base:start.length, kept:kept.length, lost:start.length - kept.length,
                 pct:start.length ? U.pct(kept.length, start.length) : null,
                 inactiveNow:Svc.attendance.inactive().length,
                 frozen:Repos.subEvents.list().filter(e => e.type === 'freeze' && !e.cancelled
                   && D.cmp(e.from, to) <= 0 && D.cmp(e.to, from) >= 0).length };
      })(),
      credits: (() => {
        const rows = Repos.credits.list();
        const inRange = rows.filter(c => D.cmp(c.date, from) >= 0 && D.cmp(c.date, to) <= 0);
        const granted = U.sum(inRange.filter(c => c.type === 'grant'), c => c.qty);
        const used = U.sum(inRange.filter(c => c.type === 'use'), c => c.qty);
        const expired = U.sum(inRange.filter(c => c.type === 'expire'), c => c.qty);
        let outstanding = 0;
        Repos.members.list().forEach(m => { outstanding += Svc.credits.balance(m.id).remaining; });
        return { granted, used, expired, outstanding:U.round2(outstanding) };
      })(),
      cash: Svc.cashbook.summary(from, to),
      receipts: Svc.receipts.summary(from, to)
    };
  },
  /* ملخص تنفيذي بلغة بشرية — يُبنى من الأرقام نفسها */
  summaryText(r){
    const parts = [];
    parts.push(`حقق النادي في ${r.title} إيرادات ${Money.fmt(r.fin.revenue)} مقابل مصروفات ${Money.fmt(r.fin.expense)}، ` +
      `أي ${r.fin.net >= 0 ? 'ربحاً صافياً' : 'خسارة صافية'} بمقدار ${Money.fmt(Math.abs(r.fin.net))}.`);
    if (r.deltaRevenue != null)
      parts.push(`الإيرادات ${r.deltaRevenue >= 0 ? 'أعلى' : 'أقل'} بنسبة ${Math.abs(r.deltaRevenue)}% عن الشهر السابق.`);
    parts.push(`سُجّل ${r.members.subsCount} اشتراكاً بمعدل ${Money.fmt(r.members.avgTicket)} للاشتراك الواحد، ` +
      `منها ${r.members.renewed} تجديداً و${r.members.neu} مشتركة جديدة.`);
    parts.push(`عدد الفعّالات اليوم ${r.members.active} من ${r.members.total}، و${r.members.expiring} اشتراكاً يقترب من الانتهاء.`);
    if (r.sales.count) parts.push(`باع المتجر ${r.sales.count} فاتورة بقيمة ${Money.fmt(r.sales.revenue)} ` +
      `بربح إجمالي ${Money.fmt(r.sales.profit)} بعد تكلفة البضاعة المباعة (${Money.fmt(r.sales.cost)}).`);
    if (r.attendance.total) parts.push(`بلغ الحضور ${r.attendance.total} زيارة من ${r.attendance.unique} مشتركة، ` +
      `بمعدل ${r.attendance.avg} زيارة يومياً.`);
    if (r.staff.tot.net) parts.push(`صافي رواتب الشهر ${Money.fmt(r.staff.tot.net)} دُفع منها ${Money.fmt(r.staff.tot.paid)}.`);
    if (r.dues.total) parts.push(`المستحقات غير المحصّلة حتى تاريخه ${Money.fmt(r.dues.total)} على ${r.dues.count} مستند` +
      `${r.dues.agedCount ? `، منها ${Money.fmt(r.dues.agedTotal)} متأخرة أكثر من ثلاثين يوماً` : ''}.`);
    return parts.join(' ');
  },
  /* HTML موحّد للعرض والطباعة */
  html(r, forPrint){
    const kv = (label, value, note) => `<tr><td>${U.esc(label)}</td><td class="ta-l"><strong>${U.esc(value)}</strong></td>${note!==undefined?`<td class="t-sub">${U.esc(note)}</td>`:''}</tr>`;
    const money = v => Money.fmt(v);
    const sec = (title, inner) => `<section class="rep-sec"><h3 class="rep-h">${U.esc(title)}</h3>${inner}</section>`;
    return `
    <div class="report">
      <header class="rep-head">
        <div><div class="rep-gym">${U.esc(r.gym)}</div><div class="rep-title">التقرير الإداري الشهري</div></div>

        { type:'p', text:`تُحسب المستحقات حتى ${D.fmt(r.generatedAt)}، لا بنهاية الشهر.` },
        { type:'kv', rows:[
          ['إجمالي المستحقات', Money.fmt(r.dues.total)], ['على الاشتراكات', Money.fmt(r.dues.subs)],
          ['على فواتير البيع', Money.fmt(r.dues.sales)], ['عدد المستندات', String(r.dues.count)],
          ['متأخرة أكثر من 30 يوماً', Money.fmt(r.dues.agedTotal)] ] },
        ...(r.dues.list.length ? [{ type:'table', title:'تفاصيل المستحقات', headers:['المشتركة','الهاتف','المستند','التاريخ','المتبقي'],
          rows:r.dues.list.map(x => [x.member?x.member.name:(x.doc.customerName||'زبونة عابرة'),
            x.member?(x.member.phone||'—'):'—',
            x.kind==='sale'?('فاتورة '+x.doc.code):('اشتراك '+(x.doc.planName||'')),
            D.fmt(x.date), Money.fmt(x.st.due)]),
          totals:['المجموع','','','', Money.fmt(r.dues.total)] }] : []),
        { type:'h1', text:'تقرير المتجر والمخزون' },
        { type:'kv', rows:[
          ['مبيعات الفترة', Money.fmt(r.sales.revenue)], ['تكلفة البضاعة المباعة', Money.fmt(r.sales.cost)],
          ['ربح المتجر', Money.fmt(r.sales.profit)], ['عدد الفواتير', String(r.sales.count)],
          ['القطع المباعة', String(r.sales.items)], ['قيمة المخزون الحالي', Money.fmt(r.stock.value)],
          ['أصناف تحت حد التنبيه', String(r.stock.low.length + r.stock.out.length)] ] },
        ...(r.sales.top.length ? [{ type:'table', title:'الأكثر مبيعاً', headers:['الصنف','الكمية','المبيعات'],
          rows:r.sales.top.map(t => [t.name, String(U.round2(t.qty)), Money.fmt(t.total)]) }] : []),
        { type:'h1', text:'تقرير الحضور' },
        { type:'kv', rows:[
          ['إجمالي الزيارات', String(r.attendance.total)], ['مشتركات حضرن', String(r.attendance.unique)],
          ['المعدل اليومي', String(r.attendance.avg)] ] },
        ...(r.attendance.top.length ? [{ type:'table', title:'الأكثر مواظبة', headers:['المشتركة','الكود','الزيارات'],
          rows:r.attendance.top.map(t => [t.member.name, t.member.code, String(t.count)]) }] : []),
        { type:'h1', text:'تقرير الرواتب' },
        { type:'table', headers:['الموظفة','الوظيفة','الأساسي','إضافات','خصومات','سلف','الصافي','الحالة'],
          rows:r.staff.rows.map(x => { const t = Calc.payrollNet(x.p);
            return [x.s.name, x.s.role, Money.fmt(x.p.baseSalary), Money.fmt(t.additions), Money.fmt(t.deductions),
                    Money.fmt(t.advances), Money.fmt(x.p.net), x.p.status==='paid'?'مدفوع':'غير مدفوع']; }),
          totals:['المجموع','', Money.fmt(r.staff.tot.base), Money.fmt(r.staff.tot.add), Money.fmt(r.staff.tot.ded),
                  Money.fmt(r.staff.tot.adv), Money.fmt(r.staff.tot.net), Money.fmt(r.staff.tot.paid) + ' مدفوع'] }
      ]
    });
  },
  excel(r){
    Exporter.xlsx(`تقرير-${r.key}.xlsx`, [
      { name:'الملخص المالي', cols:[{h:'البند', key:'k', w:30},{h:'القيمة', key:'v', type:'number', w:18}],
        rows:[ {k:'الإيرادات', v:r.fin.revenue}, {k:'المصروفات', v:r.fin.expense}, {k:'صافي الربح', v:r.fin.net},
               {k:'رأس المال المضخوخ', v:r.fin.capitalIn}, {k:'السحوبات', v:r.fin.withdrawals},
               {k:'رأس المال المتبقي', v:r.fin.capitalBalance}, {k:'السيولة', v:r.fin.cash},
               {k:'إجمالي المشتركات', v:r.members.total}, {k:'الفعّالات', v:r.members.active},
               {k:'اشتراكات الشهر', v:r.members.subsCount}, {k:'إيرادات الاشتراكات', v:r.members.subsRevenue},
               {k:'صافي الرواتب', v:r.staff.tot.net},
               {k:'مبيعات المتجر', v:r.sales.revenue}, {k:'ربح المتجر', v:r.sales.profit},
               {k:'قيمة المخزون', v:r.stock.value}, {k:'المستحقات غير المحصّلة', v:r.dues.total},
               {k:'زيارات الحضور', v:r.attendance.total},
               {k:'مهتمّات جديدات', v:r.crm.total}, {k:'اشتركن منهنّ', v:r.crm.converted},
               {k:'نسبة التحويل %', v:r.crm.conversionRate},
               {k:'حصص مجدولة', v:r.classes.sessions}, {k:'حضور الحصص', v:r.classes.attended},
               {k:'نسبة إشغال المقاعد %', v:r.classes.fillRate},
               {k:'نسبة الاحتفاظ %', v:r.retention.pct == null ? 0 : r.retention.pct},
               {k:'رصيد حصص قائم', v:r.credits.outstanding},
               {k:'أيام أُقفل صندوقها', v:r.cash.days}, {k:'صافي فروق الصندوق', v:r.cash.net} ] },
      { name:'المستحقات', cols:Exporter.DUE_COLS, rows:Exporter.dueRows(r.dues.list) },
      { name:'المبيعات', cols:Exporter.SALE_COLS,
        rows:Exporter.saleRows(r.sales.list.map(sl => ({ sl, member: sl.memberId ? Repos.members.get(sl.memberId) : null,
          st: Svc.sales.balance(sl) }))) },
      { name:'المخزون', cols:Exporter.PROD_COLS, rows:Exporter.prodRows(r.stock.rows) },
      { name:'الحضور', cols:Exporter.ATT_COLS,
        rows:Exporter.attRows(Calc.inRange(Repos.attendance.list(), r.from, r.to)) },
      { name:'الإيرادات', cols:[{h:'التاريخ', key:'d', w:13},{h:'الوصف', key:'t', w:32},{h:'المصدر', key:'s', w:14},
          {h:'الطريقة', key:'m', w:12},{h:'المبلغ', key:'a', type:'number', w:15}],
        rows:r.revenuesList.map(x => ({ d:D.fmt(x.date), t:x.description, s:sourceName(x.source), m:x.method||'', a:x.amount })) },
      { name:'المصروفات', cols:[{h:'التاريخ', key:'d', w:13},{h:'الوصف', key:'t', w:32},{h:'التصنيف', key:'c', w:16},
          {h:'الجهة', key:'p', w:18},{h:'المبلغ', key:'a', type:'number', w:15}],
        rows:r.expensesList.map(x => ({ d:D.fmt(x.date), t:x.description, c:catName(x.categoryId), p:x.payee||'', a:x.amount })) },
      { name:'الرواتب', cols:[{h:'الموظفة', key:'n', w:24},{h:'الوظيفة', key:'r', w:18},{h:'الأساسي', key:'b', type:'number', w:15},
          {h:'إضافات', key:'ad', type:'number', w:12},{h:'خصومات', key:'de', type:'number', w:12},
          {h:'سلف', key:'av', type:'number', w:12},{h:'الصافي', key:'net', type:'number', w:15},{h:'الحالة', key:'st', w:13}],
        rows:r.staff.rows.map(x => { const t = Calc.payrollNet(x.p);
          return { n:x.s.name, r:x.s.role, b:x.p.baseSalary, ad:t.additions, de:t.deductions, av:t.advances,
                   net:x.p.net, st:x.p.status==='paid'?'مدفوع':'غير مدفوع' }; }) },
      { name:'المهتمّات', cols:[{h:'الكود', key:'c', w:12},{h:'الاسم', key:'n', w:26},{h:'الهاتف', key:'p', w:16},
          {h:'المصدر', key:'s', w:16},{h:'المرحلة', key:'st', w:14},{h:'أول زيارة', key:'f', w:13},
          {h:'سبب عدم الاشتراك', key:'l', w:24}],
        rows:Repos.leads.list().filter(l => D.cmp(l.firstSeen, r.from) >= 0 && D.cmp(l.firstSeen, r.to) <= 0)
          .map(l => ({ c:l.code || '', n:l.name, p:l.phone || '', s:l.source || '',
                       st:Svc.leads.stage(l.stage).ar, f:D.fmt(l.firstSeen), l:l.lostReason || '' })) },
      { name:'الحصص', cols:[{h:'التاريخ', key:'d', w:13},{h:'الحصة', key:'t', w:24},{h:'الوقت', key:'tm', w:10},
          {h:'المدربة', key:'c', w:20},{h:'السعة', key:'cap', type:'number', w:10},
          {h:'محجوز', key:'b', type:'number', w:10},{h:'حضرن', key:'a', type:'number', w:10},
          {h:'انتظار', key:'w', type:'number', w:10},{h:'الحالة', key:'st', w:12}],
        rows:Svc.classes.between(r.from, r.to).map(cs => { const seat = Svc.classes.seats(cs.id);
          const bk = Svc.classes.bookingsOf(cs.id); const co = cs.coachId ? Repos.staff.get(cs.coachId) : null;
          return { d:D.fmt(cs.date), t:cs.title, tm:cs.startTime, c:co ? co.name : '',
                   cap:Number(cs.capacity) || 0, b:seat.booked, a:bk.filter(x => x.status === 'attended').length,
                   w:seat.waitlist, st:Svc.classes.STATUS[cs.status] || cs.status }; }) },
      { name:'إقفال الصندوق', cols:[{h:'التاريخ', key:'d', w:13},{h:'افتتاحي', key:'o', type:'number', w:14},
          {h:'داخل نقداً', key:'i', type:'number', w:14},{h:'خارج نقداً', key:'x', type:'number', w:14},
          {h:'المتوقّع', key:'e', type:'number', w:14},{h:'المعدود', key:'c', type:'number', w:14},
          {h:'الفرق', key:'df', type:'number', w:14},{h:'ملاحظات', key:'n', w:28}],
        rows:r.cash.rows.map(c => ({ d:D.fmt(c.date), o:c.openingCash, i:c.cashIn, x:c.cashOut,
          e:c.expectedCash, c:c.countedCash, df:c.difference, n:c.notes || '' })) },
      { name:'الوصولات', cols:[{h:'الرقم', key:'no', w:12},{h:'التاريخ', key:'d', w:13},{h:'المشتركة', key:'m', w:26},
          {h:'المبلغ', key:'a', type:'number', w:15},{h:'النسخ', key:'r', type:'number', w:10},{h:'الحالة', key:'st', w:12}],
        rows:Repos.receipts.list(true).filter(x => { const d = String(x.issuedAt).slice(0, 10);
            return D.cmp(d, r.from) >= 0 && D.cmp(d, r.to) <= 0; })
          .map(x => ({ no:x.no, d:D.fmt(String(x.issuedAt).slice(0, 10)),
            m:(x.snapshot && x.snapshot.member && x.snapshot.member.name) || '', a:x.amount,
            r:Number(x.reprints) || 0, st:x.voided ? 'مُبطَل' : 'ساري' })) }
    ]);
  }
};

/* ================================ الإعدادات ==============================
   صفحة واحدة عملاقة تُربك. الإعدادات مقسّمة إلى أقسام يُفتح كلٌّ منها وحده،
   ولا يُحفظ قسم إلا بزرّه — فلا يخشى أحد أن يضغط «حفظ» فيغيّر شيئاً لم يره. */
Views.settings = {
  title:'الإعدادات',
  sub:'الهوية والقواعد والنسخ الاحتياطي وسلامة البيانات',
  render(root, params){
    const SECTIONS = [
      ['general','عام'], ['brand','الهوية البصرية'], ['membership','المشتركات والاشتراكات'],
      ['fields','الحقول المخصّصة'], ['money','المالية والوصولات'], ['ops','التشغيل'],
      ['backup','النسخ الاحتياطي'], ['data','البيانات وسلامتها'], ['roles','الصلاحيات والخصوصية'],
      ['audit','سجل الأحداث'], ['danger','منطقة الخطر']
    ];
    const active = SECTIONS.some(s => s[0] === params.sec) ? params.sec : 'general';

    root.innerHTML = `<div class="set-wrap">
      <nav class="set-nav">${SECTIONS.map(([k, t]) =>
        `<button class="${k === active ? 'active' : ''}" data-sec="${k}">${U.esc(t)}</button>`).join('')}</nav>
      <div id="setBody"></div></div>`;
    root.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => go('settings', { sec:b.dataset.sec }));

    const box = root.querySelector('#setBody');
    const s = Settings.get();
    const save = async (patch, msg) => {
      await Settings.set(patch);
      await Audit.log('system','settings', msg || 'تحديث الإعدادات');
      UI.toast('تم الحفظ'); renderRoute();
    };
    const on = (sel, fn) => box.querySelectorAll(sel).forEach(b => b.onclick = () => fn(b));

    /* ------------------------------- عام ------------------------------- */
    const secGeneral = () => {
      box.innerHTML = `<div class="card"><div class="card-head"><h3>معلومات النادي</h3></div><div class="card-body">
        <div class="form-grid" id="gForm">
          ${UI.field('gymName','اسم النادي', UI.input('gymName', s.gymName))}
          ${UI.field('currency','العملة', UI.select('currency', s.currency,
            [{ v:'IQD', t:'دينار عراقي (د.ع)' }, { v:'USD', t:'دولار أمريكي ($)' }]))}
        </div>
        <button class="btn btn-primary" id="gSave">حفظ</button>
        <div class="t-sub" style="margin-top:12px">الإصدار ${U.esc(APP.version)} — مخطط البيانات ${APP.schema} —

      </div></div>`;
      box.querySelector('#gSave').onclick = async () => {
        const d = UI.read(box.querySelector('#gForm'));
        await save({ gymName:U.norm(d.gymName) || 'تبارك جيم', currency:d.currency }, 'تحديث معلومات النادي');
        Brand.applyToShell();
      };
    };

    /* -------------------------- الهوية البصرية -------------------------- */
    const secBrand = () => {
      const b = Brand.get();
      const logo = Brand.media('logo'), banner = Brand.media('banner');
      box.innerHTML = `
        <div class="card"><div class="card-head"><h3>الشعار واللافتة</h3></div><div class="card-body">
          <p class="t-sub" style="margin-top:0">الصور تُحفظ داخل قاعدة البيانات مثل أي وسائط أخرى، فتدخل النسخة
            الاحتياطية وتعود مع الاستعادة. تظهر في الشريط الجانبي وفي كل وصل وتقرير مطبوع.</p>
          <div class="grid g-2">
            <div>
              <h4 style="font-size:13px;margin-bottom:8px">الشعار</h4>
              <div class="media-drop">
                ${logo ? `<img src="${U.esc(logo.dataUrl)}" alt="">` : '<div class="t-sub" style="margin-bottom:10px">لا شعار — تُستعمل العلامة المرسومة المدمجة</div>'}
                <input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" id="bLogo">
                ${logo ? '<button class="btn btn-sm btn-danger" style="margin-top:8px" id="bLogoDel">إزالة الشعار</button>' : ''}
              </div>
              <div class="t-sub" style="margin-top:6px">يُفضَّل مربّع الشكل وبخلفية شفافة.</div>
            </div>
            <div>
              <h4 style="font-size:13px;margin-bottom:8px">اللافتة العريضة</h4>
              <div class="media-drop wide">
                ${banner ? `<img src="${U.esc(banner.dataUrl)}" alt="">` : '<div class="t-sub" style="margin-bottom:10px">لا لافتة</div>'}
                <input type="file" accept="image/png,image/jpeg,image/webp" id="bBanner">
                ${banner ? '<button class="btn btn-sm btn-danger" style="margin-top:8px" id="bBannerDel">إزالة اللافتة</button>' : ''}
              </div>
              <div class="t-sub" style="margin-top:6px">صورة عريضة (نحو 4:1). تُقصّ ولا تُمطّ، وتظهر أعلى شاشة الاستقبال.</div>
            </div>

          <div class="form-grid" id="bForm">
            ${UI.field('subtitle','الوصف تحت الاسم', UI.input('subtitle', b.subtitle))}
            ${UI.field('phone','هاتف النادي', UI.input('phone', b.phone))}
            <div class="full">${UI.field('address','العنوان', UI.input('address', b.address))}</div>
            ${UI.field('instagram','حساب انستغرام', UI.input('instagram', b.instagram, { placeholder:'بلا @' }))}

          <button class="btn btn-primary" id="bSave">حفظ</button>
        </div></div>

        <div class="card" style="margin-top:14px"><div class="card-head"><h3>معاينة الترويسة المطبوعة</h3>
          <div class="sp"></div><button class="btn btn-sm" id="bPreview">${svg(ICON.print, 15)} معاينة وصل</button></div>

            operator:Auth.session.actorName } };

async function guard(scope, fn, okMsg){
  try { const r = await fn(); if (okMsg) UI.toast(okMsg); return r; }
  catch(e){
    const isValidation = e instanceof AppError && e.code === 'VALIDATION';
    if (isValidation && scope) UI.showErrors(scope, e.details);
    else UI.toast(e.message || 'حدث خطأ غير متوقع', 'err');
    /* «الاسم مطلوب» ليست عطلاً في البرنامج بل حدثاً طبيعياً من المستخدمة.
       تسجيلها كخطأ يملأ سجل الأخطاء بضجيج فيضيع فيه العطل الحقيقي. */
    if (isValidation) Log.warn(e.message, e.details || null);
    else Log.error(e.message, e.details || e);
    return null;
  }
}

      onMount(ov){

          const off = Repos.offers.get(g('offerId') ? g('offerId').value : '');

          syncTotal();
        };
        const syncTotal = () => {
          const priceRaw = g('price').value;
          const p0 = priceRaw === '' ? null : (Money.clean(priceRaw) || 0);
          const d0 = Money.clean(g('discount').value) || 0;
          const total = p0 == null ? null : Math.max(0, U.round2(p0 - d0));
          ov.querySelector('#finalOut').textContent = total == null ? '—' : Money.fmt(total);
          /* المقبوض والمتبقي يظهران قبل الحفظ — لا مفاجآت بعد تسجيل الاشتراك */
          const pf = g('paidAmount');
          if (pf && total != null){
            const raw = pf.value;
            const paid = raw === '' ? total : Math.max(0, Math.min(total, Money.clean(raw) || 0));
            const due = U.round2(total - paid);
            ov.querySelector('#paidWrap').classList.toggle('hidden', total <= 0);
            ov.querySelector('#dueWrap').classList.toggle('hidden', due <= 0);
            ov.querySelector('#paidOut').textContent = Money.fmt(paid);
            ov.querySelector('#dueOut').textContent = Money.fmt(due);
          }
          const s0 = g('startDate').value, e0 = g('endDate').value;
          const d = duration();
          ov.querySelector('#durOut').textContent = (D.isISO(s0) && D.isISO(e0))
            ? `${DUR.label(d.value, d.unit)} — ${DUR.days(s0, e0)} يوم` : '';

        g('customValue').oninput = syncEnd;
        g('customUnit').onchange = syncEnd;
        g('startDate').onchange = syncEnd;
        g('endDate').onchange = syncTotal;
        g('price').oninput = syncTotal;
        g('discount').oninput = syncTotal;
        if (g('paidAmount')) g('paidAmount').oninput = syncTotal;
        if (g('offerId')) g('offerId').onchange = syncOffer;
        if (sub && (!sub.planId || !Repos.plans.get(sub.planId))) g('planId').value = '__custom';

        if (offerId){ syncOffer(); }

          const d = UI.read(scope);

    const st = Repos.staff.get(p.staffId);
    const lines = (arr, kind) => (arr||[]).map((x,i) => rowHtml(kind, i, x)).join('');
    const rowHtml = (kind, i, x={label:'',amount:''}) => `<div class="row" data-line="${kind}" style="gap:8px;margin-bottom:7px;flex-wrap:nowrap">
      <input class="inp" data-k="label" placeholder="السبب" value="${U.esc(x.label||'')}" style="flex:2">

    const h = UI.modal({ title:`راتب ${st?st.name:''} — ${D.monthName(p.period)}`,
      body:`<div id="payForm">
        <div class="form-grid">${UI.field('baseSalary','الراتب الأساسي', UI.input('baseSalary', p.baseSalary, {type:'number', attrs:{min:0,step:'any'}}))}

          <div><h4 style="font-size:13px;margin-bottom:8px">إضافات ومكافآت</h4><div id="addLines">${lines(p.additions,'additions')}</div>
            <button class="btn btn-sm" data-add="additions">إضافة بند</button></div>
          <div><h4 style="font-size:13px;margin-bottom:8px">خصومات</h4><div id="dedLines">${lines(p.deductions,'deductions')}</div>
            <button class="btn btn-sm" data-add="deductions">إضافة بند</button></div>
          <div><h4 style="font-size:13px;margin-bottom:8px">سلف</h4><div id="advLines">${lines(p.advances,'advances')}</div>

        </div>

          <div class="row"><span>صافي الراتب:</span><strong id="netOut" style="font-size:19px">${Money.fmt(p.net)}</strong></div></div></div>
      </div>`,
      footer:`<button class="btn btn-primary" id="paySave">حفظ الكشف</button><button class="btn" data-close>إلغاء</button><div class="sp"></div>`,
      onMount(ov){
        const boxes = { additions:ov.querySelector('#addLines'), deductions:ov.querySelector('#dedLines'), advances:ov.querySelector('#advLines') };
        const collect = kind => [...boxes[kind].querySelectorAll('[data-line]')].map(r => ({
          label: U.norm(r.querySelector('[data-k=label]').value),
          amount: Money.clean(r.querySelector('[data-k=amount]').value) || 0
        })).filter(x => x.amount > 0 || x.label);
        const recalc = () => {
          const d = { baseSalary:Money.clean(ov.querySelector('[name=baseSalary]').value)||0,
            additions:collect('additions'), deductions:collect('deductions'), advances:collect('advances') };
          const t = Calc.payrollNet(d);
          const out = ov.querySelector('#netOut');
          out.textContent = Money.fmt(t.net);
          out.className = t.net < 0 ? 'money-neg' : '';
          return d;
        };
        const bind = () => {
          ov.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { b.closest('[data-line]').remove(); recalc(); });
          ov.querySelectorAll('[data-k]').forEach(i => i.oninput = recalc);
        };
        ov.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
          boxes[b.dataset.add].insertAdjacentHTML('beforeend', rowHtml(b.dataset.add, 0)); bind(); recalc();
        });
        ov.querySelector('[name=baseSalary]').oninput = recalc;
        bind(); recalc();
        ov.querySelector('#paySave').onclick = async () => {
          const scope = ov.querySelector('#payForm');
          const d = recalc(); d.period = p.period; d.notes = ov.querySelector('[name=notes]').value;
          const res = await guard(scope, () => Svc.payroll.save(p.id, d));
          if (!res) return; (res.warnings||[]).forEach(w=>UI.toast(w,'warn',5000));
          UI.toast('تم حفظ كشف الراتب'); h.close(); renderRoute();
        };
      }

      body:`<div id="mvForm"><div class="form-grid">
        <div class="full">${UI.field('productId','الصنف', UI.select('productId', first, products.map(p=>({v:p.id,t:p.name}))))}</div>

        ${UI.field('date','التاريخ', UI.input('date', D.today(), {type:'date'}))}
        ${UI.field('qty','الكمية', UI.input('qty', 1, {type:'number', attrs:{min:0,step:'any'}}))}
        ${UI.field('unitCost','تكلفة الوحدة', UI.input('unitCost', '', {type:'number', attrs:{min:0,step:'any'}}), 'للشراء فقط — يُحدّث متوسط التكلفة')}
        <div class="full">${UI.field('supplier','المورّد', UI.input('supplier',''))}</div>
        <div class="full">${UI.field('notes','ملاحظات', UI.input('notes',''))}</div>
      </div>
      <div class="card" style="background:var(--rose-50);border-color:var(--rose-100);margin-top:10px"><div class="card-body" style="padding:12px 14px">
        <div class="row"><span>الرصيد بعد الحركة:</span><strong id="mvOut" class="num">—</strong>
        <div style="flex:1"></div><span id="mvCost" class="t-sub"></span></div></div></div>`,
      footer:`<button class="btn btn-primary" id="mvSave">تسجيل الحركة</button>
              <button class="btn" data-close>إلغاء</button><div class="sp"></div>`,
      onMount(ov){
        const scope = ov.querySelector('#mvForm');
        const g = n => scope.querySelector(`[name="${n}"]`);
        const sync = () => {
          const pid = g('productId').value, pr = Repos.products.get(pid);
          const cur = Svc.inventory.onHand(pid);
          const q = Money.clean(g('qty').value) || 0;
          const isIn = Svc.inventory.IN_TYPES.includes(g('type').value);
          const after = U.round2(cur + (isIn ? q : -q));
          const el = ov.querySelector('#mvOut');
          el.textContent = `${U.round2(cur)} ← ${after} ${pr?(pr.unit||''):''}`;
          el.style.color = after < 0 ? 'var(--red-600)' : '';
          const uc = g('unitCost').value === '' ? (pr?pr.cost:0) : Money.clean(g('unitCost').value);
          ov.querySelector('#mvCost').textContent = (g('type').value === 'purchase' && q > 0 && uc > 0)
            ? `مصروف الشراء: ${Money.fmt(U.round2(q*uc))}` : '';
          scope.querySelector('[data-field="unitCost"]').style.opacity = g('type').value === 'purchase' ? '1' : '.5';

      onMount(ov){

        };

/* ============================ نموذج المشتركة =============================
   المبدأ: الاستقبال تسجّل مشتركة جديدة في عشر ثوانٍ. الاسم والهاتف وتاريخ
   الميلاد وتاريخ الانضمام ظاهرة، وكل ما عداها داخل أقسام مطويّة تُفتح عند
   الحاجة. لا حقل إلزامي إلا الاسم — لا هوية ولا وزن ولا معلومات صحية.

   يستبدل هذا الملف Forms.member الأصلي عمداً ويحتفظ بنفس نقطة الاستدعاء،
   فكل زر «مشتركة جديدة» في النظام يفتح هذا النموذج بلا تعديل. */
const MEDIA_ACCEPT = 'image/png,image/jpeg,image/webp';

/* حقل صورة صغير يعيد {file|null, remove:boolean} عند القراءة */
function photoField(name, currentMediaId, label){
  const cur = currentMediaId ? Repos.media.get(currentMediaId) : null;
  return `<div class="field" data-field="${name}"><label>${U.esc(label)}</label>
    <div class="media-drop" data-photo="${name}">
      <img data-prev="${name}" src="${cur ? U.esc(cur.dataUrl) : ''}" alt="" ${cur ? '' : 'style="display:none"'}>
      <input type="file" accept="${MEDIA_ACCEPT}" data-file="${name}" style="max-width:100%">
      ${cur ? `<button type="button" class="btn btn-sm" data-clear="${name}" style="margin-top:8px">إزالة الصورة</button>` : ''}
    </div><span class="err"></span></div>`;
}
function bindPhotoField(ov, name){
  const box = ov.querySelector(`[data-photo="${name}"]`);
  if (!box) return { file:null, remove:false };
  const state = { file:null, remove:false };
  const input = box.querySelector(`[data-file="${name}"]`);
  const prev = box.querySelector(`[data-prev="${name}"]`);
  input.onchange = () => {
    const f = input.files && input.files[0];
    state.file = f || null; state.remove = false;
    if (f){ const fr = new FileReader(); fr.onload = () => { prev.src = fr.result; prev.style.display = 'block'; }; fr.readAsDataURL(f); }
  };
  const clear = box.querySelector(`[data-clear="${name}"]`);
  if (clear) clear.onclick = () => { state.remove = true; state.file = null; input.value = '';
    prev.style.display = 'none'; clear.disabled = true; clear.textContent = 'ستُزال عند الحفظ'; };
  return state;
}
/* حقول النادي المخصّصة: تُبنى من التعريفات لا من الكود */
function customFieldsHtml(entity, values){
  const defs = Fields.for(entity);
  if (!defs.length) return '';
  const v = values || {};
  return defs.map(f => {
    const name = 'cf_' + f.key, cur = v[f.key];
    let input;
    if (f.type === 'longtext') input = UI.textarea(name, cur || '');
    else if (f.type === 'checkbox')
      input = `<label class="switch"><input type="checkbox" id="f_${name}" name="${name}" ${cur ? 'checked' : ''}> نعم</label>`;
    else if (f.type === 'select')
      input = UI.select(name, cur || '', [{ v:'', t:'—' }, ...f.options.map(o => ({ v:o, t:o }))]);
    else if (f.type === 'multiselect')
      input = `<select class="inp" id="f_${name}" name="${name}" multiple size="${Math.min(4, f.options.length)}">
        ${f.options.map(o => `<option value="${U.esc(o)}" ${(cur || []).includes(o) ? 'selected' : ''}>${U.esc(o)}</option>`).join('')}</select>`;
    else input = UI.input(name, cur == null ? '' : cur, { type: f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text' });
    return UI.field(name, f.label + (f.required ? ' *' : ''), input, f.hint);
  }).join('');
}
/* قراءة الاختيار المتعدّد لا تتم عبر UI.read العادية */
function readCustom(scope, entity){
  const raw = UI.read(scope);
  Fields.for(entity).filter(f => f.type === 'multiselect').forEach(f => {
    const el = scope.querySelector(`[name="cf_${f.key}"]`);
    if (el) raw['cf_' + f.key] = [...el.selectedOptions].map(o => o.value);
  });
  return Fields.read(entity, raw);
}

      <details class="sect"><summary>جهة اتصال للطوارئ <span class="tag">اختياري — يُتّصل بها عند الحاجة فقط</span></summary>
        <div class="sect-body"><div class="form-grid">
          ${UI.field('em_name','الاسم', UI.input('em_name', em.name || ''))}
          ${UI.field('em_relation','صلة القرابة', UI.input('em_relation', em.relation || '', { placeholder:'الوالدة، الزوج، الأخت…' }))}
          ${UI.field('emergencyPhone','الهاتف', UI.input('em_phone', em.phone || ''))}
          ${UI.field('em_phone2','هاتف ثانٍ', UI.input('em_phone2', em.phone2 || ''))}
        </div></div></details>

      <details class="sect"><summary>ملاحظات السلامة أثناء التمرين <span class="tag">اختياري — لا تظهر في الجداول ولا الوصولات</span></summary>
        <div class="sect-body">
          <div class="sens" style="margin-bottom:12px"><b>تنبيه:</b> هذه الحقول لتنبيه المدربة إلى ما يلزم الانتباه له أثناء التمرين،
            وليست سجلاً طبياً ولا تشخيصاً. لا تُدوَّن فيها معلومات لا يحتاجها التدريب.</div>
          <div class="form-grid">
            <div class="full">${UI.field('he_notes','إصابات أو قيود حركية', UI.textarea('he_notes', he.notes || ''))}</div>
            ${UI.field('he_allergies','حساسية', UI.input('he_allergies', he.allergies || ''))}
            ${UI.field('he_restrictions','تمارين يجب تجنّبها', UI.input('he_restrictions', he.restrictions || ''))}
            <div class="full field"><label class="switch">
              <input type="checkbox" name="he_consent" ${he.consent ? 'checked' : ''}> وقّعت إقرار المسؤولية</label></div>
          </div>
        </div></details>

      <details class="sect"><summary>وثيقة تعريف <span class="tag">اختياري تماماً — لا يُشترط لأي اشتراك</span></summary>
        <div class="sect-body">
          <div class="sens" style="margin-bottom:12px">لا تُطلب هذه المعلومات كشرط للاشتراك. سجّليها فقط إذا طلبتها المشتركة نفسها
            أو استدعتها حالة خاصة، ولا تظهر في أي قائمة أو وصل.</div>
          <div class="form-grid">
            ${UI.field('idType','نوع الوثيقة', UI.input('idType', val('idType'), { placeholder:'بطاقة موحّدة، جواز…' }))}
            ${UI.field('idNumber','رقم الوثيقة', UI.input('idNumber', val('idNumber')))}
            ${UI.field('idExpiry','تاريخ الانتهاء', UI.input('idExpiry', val('idExpiry'), { type:'date' }))}
          </div>
          ${photoField('idPhoto', m ? m.idMediaId : null, 'صورة الوثيقة')}
        </div></details>

      <details class="sect"><summary>الصورة الشخصية والملاحظات</summary>
        <div class="sect-body">
          ${photoField('photo', m ? m.photoMediaId : null, 'صورة المشتركة')}
          ${UI.field('notes','ملاحظات عامة', UI.textarea('notes', val('notes')))}
          <div class="field"><label class="switch">
            <input type="checkbox" name="suspended" ${m && m.suspended ? 'checked' : ''}> إيقاف مؤقت للعضوية</label></div>
        </div></details>

      ${Fields.for('member').length ? `<details class="sect" open><summary>حقول النادي</summary>
        <div class="sect-body"><div class="form-grid">${customFieldsHtml('member', m ? m.custom : pre.custom)}</div></div></details>` : ''}
    </div>`,
    footer:`<button class="btn btn-primary" id="memSave">${m ? 'حفظ التعديلات' : 'إضافة المشتركة'}</button>
            <button class="btn" data-close>إلغاء</button><div class="sp"></div>
            <span class="t-sub">الاسم وحده مطلوب</span>`,
    onMount(ov){
      const photo = bindPhotoField(ov, 'photo');
      const idPhoto = bindPhotoField(ov, 'idPhoto');
      /* قسم فيه خطأ يُفتح تلقائياً، وإلا بقي الخطأ مخفياً داخل قسم مطويّ */
      const revealErrors = () => ov.querySelectorAll('.sect').forEach(s => {
        if (s.querySelector('.err:not(:empty)')) s.open = true;
      });
      ov.querySelector('#memSave').onclick = async () => {
        const scope = ov.querySelector('#memForm');
        const raw = UI.read(scope);
        const cf = readCustom(scope, 'member');
        if (!cf.ok){ UI.showErrors(scope, cf.errors); revealErrors(); return; }
        const d = {
          name:raw.name, phone:raw.phone, birthDate:raw.birthDate, joinDate:raw.joinDate,
          phone2:raw.phone2, email:raw.email, city:raw.city, address:raw.address,
          occupation:raw.occupation, source:raw.source, preferredCoachId:raw.preferredCoachId || null,
          idType:raw.idType, idNumber:raw.idNumber, idExpiry:raw.idExpiry,
          notes:raw.notes, suspended:raw.suspended,
          emergency:{ name:raw.em_name, relation:raw.em_relation, phone:raw.em_phone, phone2:raw.em_phone2 },
          health:{ notes:raw.he_notes, allergies:raw.he_allergies, restrictions:raw.he_restrictions,
                   consent:!!raw.he_consent, consentDate: raw.he_consent ? (he.consentDate || D.today()) : '' },
          custom:cf.values,
          leadId: pre.leadId || (m ? m.leadId : null)
        };
        const btn = ov.querySelector('#memSave');
        btn.disabled = true;
        try {
          /* الصور تُرفع قبل الحفظ، ويُنظَّف ما رُفع إن فشل الحفظ */
          const uploaded = [];
          try {
            if (photo.file) d.photoMediaId = (uploaded[uploaded.push(await Svc.media.saveFile(photo.file)) - 1]).id;
            else if (photo.remove) d.photoMediaId = null;
            if (idPhoto.file) d.idMediaId = (uploaded[uploaded.push(await Svc.media.saveFile(idPhoto.file)) - 1]).id;
            else if (idPhoto.remove) d.idMediaId = null;
          } catch(e){ UI.toast(e.message || 'تعذّر رفع الصورة','err'); btn.disabled = false; return; }

          const res = await guard(scope, () => m ? Svc.members.update(m.id, d) : Svc.members.create(d));
          if (!res){ for (const u of uploaded) await Svc.media.remove(u.id).catch(() => {}); revealErrors(); btn.disabled = false; return; }
          (res.warnings || []).forEach(w => UI.toast(w, 'warn', 5000));
          UI.toast(m ? 'تم حفظ التعديلات' : 'تمت إضافة المشتركة');
          h.close();
          if (opts && opts.onSaved) return opts.onSaved(res.rec);
          renderRoute();
          if (!m){
            const pick = await UI.choice({ title:'تمت إضافة المشتركة',
              message:`أُضيفت <strong>${U.esc(res.rec.name)}</strong> بالكود ${U.esc(res.rec.code)}. ماذا بعد؟`,
              options:[{ key:'sub', label:'تسجيل اشتراكها', primary:true },
                       { key:'profile', label:'فتح ملفها' }, { key:'later', label:'لاحقاً' }] });
            if (pick === 'sub') Forms.subscription(null, res.rec.id);
            else if (pick === 'profile') Screens.memberProfile(res.rec.id);
          }
        } finally { btn.disabled = false; }
      };
    }
  });
  return h;
};

   نفس أسلوب النماذج الأصلية: نافذة، حقول، زر حفظ يمرّ بـ guard فيعرض أخطاء
