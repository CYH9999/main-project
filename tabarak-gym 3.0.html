function buildNav(){
  const nav = $('nav');
  /* التنقّل يمرّ بنقطة الصلاحيات، وهي تسمح بكل شيء ما دامت الميزة معطّلة.
     مجموعة تفرغ من عناصرها لا يبقى عنوانها معلّقاً. */
  const items = NAV.filter(n => n.g || Auth.can(`${n.k}.view`));
  const visible = items.filter((n, i) => !n.g || (items[i+1] && !items[i+1].g));
  nav.innerHTML = visible.map(n => n.g
    ? `<div class="nav-group">${U.esc(n.g)}</div>`
    : `<button class="nav-item" data-route="${n.k}">${svg(n.i)}<span class="lbl">${U.esc(n.t)}</span><span class="nav-badge hidden" data-badge="${n.k}"></span></button>`).join('');
  nav.querySelectorAll('[data-route]').forEach(b => b.onclick = () => go(b.dataset.route));
}
function navBadges(){
  const rows = Svc.members.rows();
  const idx = Offers.subsIndex();
  const soon = rows.filter(r => r.st.status === STATUS.EXPIRING).length;
  const set = (k, v) => { const e = document.querySelector(`[data-badge="${k}"]`); if(!e) return;
    e.textContent = v; e.classList.toggle('hidden', !v); };
  set('members', soon);
  set('offers', rows.filter(r => !r.m.archived && Offers.eligibleForMember(r.m.id, idx[r.m.id] || []).length).length);
  set('payroll', Svc.payroll.ofPeriod(D.monthsBack(2)[0]).filter(p=>p.status!=='paid').length);
  set('finance', Svc.payments.totalDue().count);
  set('inventory', Settings.get('lowStockAlerts') ? Svc.inventory.lowStock().length : 0);
  set('tasks', Svc.tasks.due().length);
  set('crm', Svc.leads.dueFollowUps().length);
  set('desk', Svc.cashbook.missing(7).length);
}
function go(route, params){
  const q = params ? '?' + new URLSearchParams(params).toString() : '';
  location.hash = `#/${route}${q}`;
}
function currentRoute(){
  const h = (location.hash || '#/dashboard').replace(/^#\//,'');
  const [r, qs] = h.split('?');
  /* شاشة قد تستعير صلاحية وحدة أخرى (ملف المشتركة يتبع صلاحية المشتركات) */
  const ok = Views[r] && Auth.can(`${(Views[r] && Views[r].perm) || r}.view`);
  return { route: ok ? r : 'dashboard', params: Object.fromEntries(new URLSearchParams(qs||'')) };
}
function renderRoute(){
  const { route, params } = currentRoute();
  State.route = route; State.params = params;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.route === route));
  const v = Views[route];
  $('pageTitle').textContent = v.title;
  $('pageSub').textContent = typeof v.sub === 'function' ? v.sub() : (v.sub || '');
  const root = $('viewRoot');
  root.innerHTML = '<div class="view"></div>';
  try { v.render(root.firstChild, params); }
  catch(e){ Log.error('فشل عرض الشاشة', e); root.firstChild.innerHTML = UI.empty('تعذّر عرض هذه الشاشة', e.message||''); }
  navBadges();
  root.scrollIntoView({ block:'start' });
}

              <div class="stat ${funnel.conversionRate >= 50 ? 'pos' : ''}"><b>${funnel.conversionRate}%</b>

              «الاحتفاظ» يقارن من كانت فعّالة قبل ستين يوماً بمن ما زالت فعّالة اليوم.</div>

          ${kpi('حصص تدريب فعّالة', Repos.trainings.list().filter(t=>t.active).length, 'في الجدول الأسبوعي', 'plum')}
          ${kpi('تمارين في المكتبة', Repos.exercises.list().length, '', 'plum')}
        </div>
      </div>`;

    const exWrap = $('dashExpiring');
    if (!expiring.length) exWrap.innerHTML = UI.empty('لا اشتراكات على وشك الانتهاء','كل الاشتراكات الفعّالة ضمن المدة الآمنة');
    else exWrap.innerHTML = `<div class="tbl-wrap"><table class="tbl"><tbody>${expiring.map(r => `
      <tr><td>${UI.avatar(r.m.name)}</td>
        <td><div class="t-name">${U.esc(r.m.name)}</div><div class="t-sub">${U.esc(r.m.phone||'بلا رقم')}</div></td>
        <td>${UI.chip(r.st.status)}</td>
        <td><div class="num">${D.fmt(r.st.endDate)}</div><div class="t-sub">${r.st.daysLeft===0?'ينتهي اليوم':`باقٍ ${r.st.daysLeft} يوم`}</div></td>
        <td class="ta-l"><button class="btn btn-sm btn-primary" data-renew="${r.m.id}">تجديد</button></td></tr>`).join('')}</tbody></table></div>`;
    exWrap.querySelectorAll('[data-renew]').forEach(b => b.onclick = () => Forms.subscription(null, b.dataset.renew));
    $('dashAllExp').onclick = () => { State.f.members.status = 'EXPIRING_SOON'; go('members'); };
    const dd = $('dashDues');
    if (dd) dd.onclick = () => { State.f.financeTab = 'dues'; go('finance'); };
    const ds = $('dashStock');
    if (ds) ds.onclick = () => go('inventory');
    root.querySelectorAll('[data-dpay]').forEach(b => b.onclick = () => {
      const [kind, id] = b.dataset.dpay.split(':'); Forms.payment(kind, id); });
    root.querySelectorAll('[data-dbuy]').forEach(b => b.onclick = () => Forms.stockMove(b.dataset.dbuy, 'purchase'));

    root.querySelectorAll('[data-alert]').forEach(b => b.onclick = () => {
      const [, , route, params] = alerts[Number(b.dataset.alert)];
      if (params && params.status) State.f.members.status = params.status;
      go(route);
    });

    const aud = Audit.recent(14);
    $('dashAudit').innerHTML = aud.length ? `<ul class="tl">${aud.map(a => `<li>
        <div style="font-weight:600">${U.esc(a.summary)}</div>
        <div class="t-sub">${U.esc(D.fmt(a.ts.slice(0,10)))} — ${U.esc(a.ts.slice(11,16))}</div></li>`).join('')}</ul>`
      : UI.empty('لا توجد عمليات بعد','ستظهر هنا كل حركة داخل النظام');
  }
};
function kpi(label, value, note, cls=''){
  return `<div class="kpi ${cls}"><div class="k-l">${U.esc(label)}</div>
    <div class="k-v num">${typeof value==='number'?value.toLocaleString('en-US'):U.esc(value)}</div>
    <div class="k-bar"></div>${note?`<div class="k-note">${U.esc(note)}</div>`:''}</div>`;
}

/* ============================== الاستقبال ================================
   الشاشة التي تُفتح في الصباح وتبقى مفتوحة. مقياس نجاحها واحد: كل عملية
   يومية تتمّ من هنا بنقرة أو نقرتين، بلا تنقّل بين ستّ شاشات.

   البحث في الأعلى لأنه أول ما تفعله الموظفة: تكتب اسماً فتظهر المشتركة
   بحالتها وأزرارها — حضور، تجديد، قبض، ملف. */
Views.desk = {
  title:'الاستقبال',
  sub(){ return `${D.dayName(D.today())} ${D.fmt(D.today())}`; },
  render(root){
    const today = D.today();
    const cash = Svc.cashbook.preview(today);
    const inside = Svc.attendance.insideNow();
    const todaySessions = Svc.classes.ofDay(today);
    const dueTasks = Svc.tasks.due();
    const expiring = Svc.members.rows().filter(r => r.st.status === STATUS.EXPIRING);
    const todayPay = Repos.payments.list().filter(p => p.date === today);

    root.innerHTML = `
      ${Brand.bannerHtml()}
      <div class="desk">
        <button data-a="member">${svg(ICON.users, 22)} مشتركة جديدة</button>
        <button data-a="sub">${svg(ICON.card, 22)} اشتراك / تجديد</button>
        <button data-a="sale">${svg(ICON.coins, 22)} فاتورة بيع</button>
        <button data-a="att">${svg(ICON.check, 22)} تسجيل حضور</button>
        <button data-a="lead">${svg(ICON.gift, 22)} تسجيل مهتمّة</button>
        <button data-a="cash">${svg(ICON.wallet, 22)} إقفال الصندوق</button>
      </div>

      <div class="card" style="margin-bottom:16px"><div class="card-body">
        <div class="desk-find">
          <input class="inp" id="dkQ" placeholder="اكتبي اسم المشتركة أو رقمها أو كودها…" autocomplete="off">
        </div>
        <div id="dkHits"></div>
      </div></div>

      <div class="grid g-3" style="margin-bottom:16px">
        <div class="card"><div class="card-head"><h3>نقد اليوم</h3></div><div class="card-body">
          <div class="stat-row" style="margin:0">
            <div class="stat pos"><b>${Money.fmt(cash.cashIn)}</b><span>مقبوض نقداً (${cash.movement.counts.payments})</span></div>
            <div class="stat neg"><b>${Money.fmt(cash.cashOut)}</b><span>مصروف نقداً</span></div>
            <div class="stat"><b>${Money.fmt(cash.expected)}</b><span>المتوقّع في الدرج</span></div>
          </div>
          ${cash.nonCash ? `<div class="t-sub" style="margin-top:8px">تحويلات وبطاقات اليوم: ${Money.fmt(cash.nonCash)} — خارج الدرج</div>` : ''}
          ${cash.closed ? `<div class="pill ok" style="margin-top:8px">أُقفل الصندوق — الفرق ${Money.fmt(cash.difference)}</div>`
            : `<button class="btn btn-sm btn-primary" style="margin-top:9px" data-a="cash">إقفال الصندوق</button>`}
        </div></div>

        <div class="card"><div class="card-head"><h3>في النادي الآن</h3>
          <div class="sp"></div><span class="pill">${inside.length}</span></div><div class="card-body">
          ${inside.length ? `<table class="mini-tbl"><tbody>
            ${inside.slice(0, 10).map(x => `<tr><td>${U.esc(x.member.name)}</td>
              <td class="num t-sub">منذ ${U.esc(x.a.time || '')}</td>
              <td class="ta-l"><button class="btn btn-sm" data-out="${x.a.id}">خروج</button></td></tr>`).join('')}
            </tbody></table>` : '<div class="t-sub">لم تُسجَّل زيارات اليوم بعد.</div>'}
        </div></div>

        <div class="card"><div class="card-head"><h3>حصص اليوم</h3></div><div class="card-body">
          ${todaySessions.length ? `<table class="mini-tbl"><tbody>
            ${todaySessions.map(s => { const seat = Svc.classes.seats(s.id);
              return `<tr><td><strong>${U.esc(s.title)}</strong><div class="t-sub num">${U.esc(s.startTime)}</div></td>
                <td class="num">${seat.booked}${seat.capacity ? '/' + seat.capacity : ''}${seat.waitlist ? ` <span class="pill warn">${seat.waitlist} انتظار</span>` : ''}</td>
                <td class="ta-l"><button class="btn btn-sm" data-sess="${s.id}">فتح</button></td></tr>`; }).join('')}
            </tbody></table>` : `<div class="t-sub">لا حصص مجدولة اليوم.</div>
              <button class="btn btn-sm" style="margin-top:8px" data-a="class">جدولة حصة</button>`}
        </div></div>
      </div>

      <div class="grid g-2">
        <div class="card"><div class="card-head"><h3>متابعات مستحقّة</h3>
          <div class="sp"></div><button class="btn btn-sm" data-go="tasks">كل المتابعات</button></div><div class="card-body">
          ${dueTasks.length ? `<table class="mini-tbl"><tbody>
            ${dueTasks.slice(0, 8).map(t => `<tr><td>${U.esc(t.title)}
              <div class="t-sub">${U.esc(Svc.tasks.TYPES[t.type] || '')} — ${D.cmp(t.dueDate, today) < 0 ? `<span class="over">متأخرة ${Math.abs(D.diffDays(today, t.dueDate))} يوماً</span>` : 'اليوم'}</div></td>
              <td class="ta-l"><div class="t-actions">
                ${t.memberId ? `<button class="btn btn-sm btn-icon" data-mem="${t.memberId}" title="ملف المشتركة">${svg(ICON.eye, 14)}</button>` : ''}
                <button class="btn btn-sm" data-done="${t.id}">تمّت</button></div></td></tr>`).join('')}
            </tbody></table>` : '<div class="t-sub">لا متابعات مستحقّة اليوم.</div>'}
        </div></div>

        <div class="card"><div class="card-head"><h3>اشتراكات توشك أن تنتهي</h3>
          <div class="sp"></div><span class="pill ${expiring.length ? 'warn' : ''}">${expiring.length}</span></div><div class="card-body">
          ${expiring.length ? `<table class="mini-tbl"><tbody>
            ${expiring.slice(0, 8).map(r => `<tr><td>${U.esc(r.m.name)}
              <div class="t-sub num">${U.esc(r.m.phone || 'بلا رقم')}</div></td>
              <td class="num">${r.st.daysLeft === 0 ? 'ينتهي اليوم' : `${r.st.daysLeft} يوم`}</td>
              <td class="ta-l"><button class="btn btn-sm btn-primary" data-renew="${r.m.id}">تجديد</button></td></tr>`).join('')}
            </tbody></table>` : '<div class="t-sub">لا اشتراكات قاربت على الانتهاء.</div>'}
        </div></div>
      </div>

      ${todayPay.length ? `<div class="card" style="margin-top:16px"><div class="card-head"><h3>مقبوضات اليوم</h3>
        <div class="sp"></div><strong>${Money.fmt(U.sum(todayPay, p => p.amount))}</strong></div><div class="card-body">
        <table class="mini-tbl"><thead><tr><th>الوقت</th><th>المشتركة</th><th>المبلغ</th><th>الطريقة</th><th></th></tr></thead><tbody>
        ${U.sortBy(todayPay, p => p.createdAt, -1).map(p => { const mm = p.memberId ? Repos.members.get(p.memberId) : null;
          const rc = Svc.receipts.forPayment(p.id);
          return `<tr><td class="num">${U.esc(String(p.createdAt).slice(11, 16))}</td>
            <td>${U.esc(mm ? mm.name : 'زبونة عابرة')}</td><td class="num"><strong>${Money.fmt(p.amount)}</strong></td>
            <td>${U.esc(p.method || '')}</td>
            <td class="ta-l"><button class="btn btn-sm" data-rcp="${p.id}">${svg(ICON.print, 13)} ${rc ? 'إعادة طباعة' : 'وصل'}</button></td></tr>`;
        }).join('')}</tbody></table></div></div>` : ''}`;

    /* ------------------------------ الربط ------------------------------ */
    const on = (sel, fn) => root.querySelectorAll(sel).forEach(b => b.onclick = () => fn(b));
    on('[data-a]', b => {
      const a = b.dataset.a;
      if (a === 'member') Forms.member();
      else if (a === 'sub') Forms.subscription();
      else if (a === 'sale') Forms.sale();
      else if (a === 'att') go('attendance');
      else if (a === 'lead') Forms.lead();
      else if (a === 'cash') Forms.cashClose(today);
      else if (a === 'class') Forms.classSession();
    });
    on('[data-go]', b => go(b.dataset.go));
    on('[data-sess]', b => Screens.classSession(b.dataset.sess));
    on('[data-mem]', b => Screens.memberProfile(b.dataset.mem));
    on('[data-renew]', b => Forms.subscription(null, b.dataset.renew));
    on('[data-rcp]', b => Actions.printReceiptForPayment(b.dataset.rcp));
    on('[data-out]', async b => { await guard(null, () => Svc.attendance.checkOut(b.dataset.out), 'سُجّل الخروج'); renderRoute(); });
    on('[data-done]', async b => { await guard(null, () => Svc.tasks.complete(b.dataset.done), 'تمّت المتابعة'); renderRoute(); });

    /* بحث الاستقبال: يعرض المشتركة بحالتها وأزرارها مباشرة */
    const hits = root.querySelector('#dkHits');
    const search = U.debounce(q => {
      const s = U.normAr(q);
      if (!s || s.length < 2){ hits.innerHTML = ''; return; }
      const rows = Svc.members.rows().filter(r =>
        [r.m.name, r.m.phone, r.m.phone2, r.m.code].map(U.normAr).join(' ').includes(s)).slice(0, 6);
      if (!rows.length){
        hits.innerHTML = `<div class="t-sub" style="padding:8px 2px">لا نتائج لـ «${U.esc(q)}».
          <button class="btn btn-sm" id="dkNew">تسجيلها مشتركة جديدة</button></div>`;
        const nb = hits.querySelector('#dkNew');
        if (nb) nb.onclick = () => Forms.member(null, { prefill:{ name:U.norm(q) } });
        return;
      }
      hits.innerHTML = rows.map(r => {
        const due = (() => { const d = Svc.payments.openDues().filter(x => x.member && x.member.id === r.m.id);
          return U.round2(U.sum(d, x => x.st.due)); })();
        const here = inside.some(x => x.member.id === r.m.id);
        return `<div class="hit">${UI.avatar(r.m.name)}
          <span class="grow"><span class="t-name">${U.esc(r.m.name)}</span>
            <div class="t-sub">${U.esc(r.m.code)} — ${U.esc(r.m.phone || 'بلا رقم')}
              ${r.st.endDate ? ` — ينتهي ${D.fmt(r.st.endDate)}` : ''}
              ${due > 0 ? ` — <span class="money-neg">متبقٍّ ${Money.fmt(due)}</span>` : ''}</div></span>
          ${UI.chip(r.st.status)}
          <div class="t-actions">
            ${here ? '<span class="pill ok">في النادي</span>'
                   : `<button class="btn btn-sm btn-primary" data-in="${r.m.id}">حضور</button>`}
            <button class="btn btn-sm" data-rn="${r.m.id}">تجديد</button>
            ${due > 0 ? `<button class="btn btn-sm" data-dues="${r.m.id}">قبض</button>` : ''}
            <button class="btn btn-sm btn-icon" data-open="${r.m.id}" title="الملف">${svg(ICON.eye, 15)}</button>
          </div></div>`;
      }).join('');
      on('[data-in]', b => Actions.quickCheckIn(b.dataset.in));
      on('[data-rn]', b => Forms.subscription(null, b.dataset.rn));
      on('[data-dues]', b => Screens.memberDues(b.dataset.dues));
      on('[data-open]', b => Screens.memberProfile(b.dataset.open));
    }, 200);
    const q = root.querySelector('#dkQ');
    q.oninput = e => search(e.target.value);
    setTimeout(() => q.focus(), 60);
  }
};

/* -------------------------------- Members --------------------------------- */
Views.members = {
  title:'المشتركات',
  sub(){ const r = Svc.members.rows(); return `${r.length} مشتركة — ${r.filter(x=>x.st.status===STATUS.ACTIVE).length} فعّالة`; },
  render(root){
    const f = State.f.members;
    if (State.params.status) f.status = State.params.status;
    root.innerHTML = `<div class="card">
      <div class="filters">
        <input class="inp search" id="mQ" placeholder="بحث بالاسم أو الرقم أو الكود" value="${U.esc(f.q)}">
        ${UI.select('mStatus', f.status, statusOptions())}
        <label class="switch"><input type="checkbox" id="mArch" ${f.archived?'checked':''}> إظهار المؤرشفات</label>
        <div style="flex:1"></div>
        <button class="btn btn-sm" id="mCsv">${svg(ICON.down,15)} CSV</button>
        <button class="btn btn-sm" id="mXls">${svg(ICON.down,15)} Excel</button>
        <button class="btn btn-sm" id="mPrint">${svg(ICON.print,15)} طباعة</button>
        <button class="btn btn-sm btn-primary" id="mAdd">${svg(ICON.plus,15,2.4)} مشتركة جديدة</button>
      </div>
      <div id="mTable"></div></div>`;

    const draw = () => {
      let rows = Svc.members.rows(f.archived);
      const q = U.normAr(f.q);
      if (q) rows = rows.filter(r => U.normAr(r.m.name).includes(q) || U.normAr(r.m.phone).includes(q) || U.normAr(r.m.code).includes(q));
      if (f.status) rows = rows.filter(r => r.st.status.key === f.status);
      if (f.sortFn) rows = U.sortBy(rows, f.sortFn, f.sortDir);
      const cols = [
        { h:'الكود', w:'88px', sort:r=>r.m.code, render:r=>`<span class="num">${U.esc(r.m.code)}</span>` },
        { h:'المشتركة', sort:r=>r.m.name, render:r=>`<div class="row" style="gap:10px;flex-wrap:nowrap">${UI.avatar(r.m.name)}
            <div><div class="t-name">${U.esc(r.m.name)}</div><div class="t-sub">${U.esc(r.m.phone||'بلا رقم')}${r.m.archived?' — مؤرشفة':''}</div></div></div>` },
        { h:'الحالة', sort:r=>r.st.status.ar, render:r=>UI.chip(r.st.status) },
        { h:'نهاية الاشتراك', sort:r=>r.st.endDate||'', render:r=>r.st.endDate
            ? `<div class="num">${D.fmt(r.st.endDate)}</div><div class="t-sub">${r.st.status===STATUS.EXPIRED?`منذ ${Math.abs(r.st.daysLeft)} يوم`:r.st.daysLeft===0?'ينتهي اليوم':`باقٍ ${r.st.daysLeft} يوم`}</div>`
            : '<span class="t-sub">—</span>' },
        { h:'الاشتراكات', sort:r=>r.stats.count, render:r=>`<span class="num">${r.stats.count}</span>` },
        { h:'إجمالي المدفوع', sort:r=>r.stats.totalPaid, render:r=>UI.money(r.stats.totalPaid) },
        { h:'الانضمام', sort:r=>r.m.joinDate, render:r=>`<span class="num">${D.fmt(r.m.joinDate)}</span>` },
        { h:'', cls:'ta-l', render:r=>`<div class="t-actions">
            <button class="btn btn-sm btn-icon" data-view="${r.m.id}" title="الملف">${svg(ICON.eye,15)}</button>
            <button class="btn btn-sm btn-icon" data-edit="${r.m.id}" title="تعديل">${svg(ICON.edit,15)}</button>
            <button class="btn btn-sm btn-primary" data-renew="${r.m.id}">اشتراك</button>
            <button class="btn btn-sm btn-icon ${r.m.archived?'':'btn-danger'}" data-arch="${r.m.id}" title="${r.m.archived?'استرجاع':'أرشفة'}">${svg(r.m.archived?ICON.undo:ICON.trash,15)}</button>
          </div>` }
      ];
      UI.table($('mTable'), { cols, rows, state:f, rowCls:r=>r.m.archived?'archived-row':'',
        empty: UI.empty('لا توجد مشتركات مطابقة', 'جرّبي تغيير البحث أو أضيفي مشتركة جديدة',
          '<button class="btn btn-primary" onclick="Forms.member()">إضافة مشتركة</button>'),
        onSort:(fn,d)=>{ f.sortFn = fn; f.sortDir = d; draw(); }, onPage:draw });
      $('mTable').querySelectorAll('[data-view]').forEach(b => b.onclick = () => Screens.memberProfile(b.dataset.view));
      $('mTable').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => Forms.member(b.dataset.edit));
      $('mTable').querySelectorAll('[data-renew]').forEach(b => b.onclick = () => Forms.subscription(null, b.dataset.renew));
      $('mTable').querySelectorAll('[data-arch]').forEach(b => b.onclick = () => Actions.archiveMember(b.dataset.arch));
      State.f.members._rows = rows;
    };
    draw();
    $('mQ').oninput = U.debounce(e => { f.q = e.target.value; f.page = 1; draw(); }, 220);
    $('f_mStatus').onchange = e => { f.status = e.target.value; f.page = 1; draw(); };
    $('mArch').onchange = e => { f.archived = e.target.checked; f.page = 1; draw(); };
    $('mAdd').onclick = () => Forms.member();
    const MEM_COLS = [
      { h:'الكود', key:'code', w:12 }, { h:'الاسم', key:'name', w:26 }, { h:'الهاتف', key:'phone', w:16 },
      { h:'الحالة', key:'status', w:14 }, { h:'تاريخ الانضمام', key:'join', w:14 },
      { h:'نهاية الاشتراك', key:'end', w:14 }, { h:'الأيام المتبقية', key:'left', type:'number', w:13 },
      { h:'عدد الاشتراكات', key:'count', type:'number', w:13 }, { h:'إجمالي المدفوع', key:'paid', type:'number', w:16 }
    ];
    const memExport = () => (f._rows||[]).map(r => ({ code:r.m.code, name:r.m.name, phone:r.m.phone||'',
      status:r.st.status.ar, join:D.fmt(r.m.joinDate), end:r.st.endDate?D.fmt(r.st.endDate):'—',
      left:r.st.daysLeft==null?0:r.st.daysLeft, count:r.stats.count, paid:r.stats.totalPaid }));
    $('mCsv').onclick = () => Exporter.csv(`المشتركات-${D.today()}.csv`, MEM_COLS, memExport());
    $('mXls').onclick = () => Exporter.xlsx(`المشتركات-${D.today()}.xlsx`, [{ name:'المشتركات', cols:MEM_COLS, rows:memExport() }]);
    $('mPrint').onclick = () => UI.printSection('قائمة المشتركات',  /* جدول عريض ⇒ أفقي */
      `<table class="tbl"><thead><tr><th>الكود</th><th>الاسم</th><th>الهاتف</th><th>الحالة</th><th>نهاية الاشتراك</th><th>الاشتراكات</th><th>المدفوع</th></tr></thead>
       <tbody>${(f._rows||[]).map(r=>`<tr><td>${U.esc(r.m.code)}</td><td>${U.esc(r.m.name)}</td><td>${U.esc(r.m.phone||'')}</td>
        <td>${r.st.status.ar}</td><td>${r.st.endDate?D.fmt(r.st.endDate):'—'}</td><td>${r.stats.count}</td><td>${Money.fmt(r.stats.totalPaid)}</td></tr>`).join('')}</tbody></table>`, { landscape:true });
  }
};


/* ===== src/app/views/12-member-profile.js ============================================ */
/* ========================= ملف المشتركة الكامل ===========================
   صار شاشة مستقلة لا نافذة منبثقة: هذا هو المكان الذي تقضي فيه الموظفة أطول
   وقتها، ويحتاج مساحة ورابطاً يمكن الرجوع إليه.

   الترتيب مقصود: ما تحتاجه الاستقبال في الثانية الأولى (الحالة، المتبقّي،
   آخر زيارة) في العمود الجانبي دائماً، والتفاصيل في تبويبات.
   المعلومات الحسّاسة (الوثيقة، ملاحظات السلامة) لا تظهر إلا داخل تبويبها. */
Views.member = {
  title:'ملف المشتركة',
  perm:'members',
  sub(){ const m = Repos.members.get(State.params.id); return m ? `${m.code} — ${m.phone || 'بلا رقم'}` : ''; },
  render(root, params){
    const m = Repos.members.get(params.id);
    if (!m){ root.innerHTML = UI.empty('المشتركة غير موجودة','ربما حُذفت. ارجعي إلى قائمة المشتركات.',
      '<button class="btn btn-primary" onclick="go(\'members\')">قائمة المشتركات</button>'); return; }

    const st = Svc.members.status(m.id);
    const subs = U.sortBy(Svc.subs.ofMember(m.id, true), s => s.startDate, -1);
    const payIdx = Svc.payments.indexBy('subscription'), saleIdx = Svc.payments.indexBy('sale');
    const liveSubs = subs.filter(x => !x.archived);
    const mySales = Repos.sales.list().filter(x => x.memberId === m.id);
    const owed = U.round2(U.sum(liveSubs, x => x.finalPrice) + U.sum(mySales, x => x.total));
    const paid = U.round2(U.sum(liveSubs, x => payIdx[x.id] || 0) + U.sum(mySales, x => saleIdx[x.id] || 0));
    const balance = Calc.payStatus(owed, paid);
    const att = Svc.attendance.profile(m.id);
    const photo = m.photoMediaId ? Repos.media.get(m.photoMediaId) : null;
    const age = Svc.members.age(m);
    const classCr = Svc.credits.balance(m.id, 'class'), ptCr = Svc.credits.balance(m.id, 'pt');
    const tab = params.tab || 'overview';

    const TABS = [['overview','نظرة عامة'], ['fitness','اللياقة والأهداف'], ['subs','الاشتراكات'],
                  ['attendance','الحضور'], ['money','المالية'], ['docs','المستندات والبيانات'], ['timeline','السجل']];

    root.innerHTML = `<div class="prof-wrap">
      <aside class="prof-side">
        <div class="prof-card">
          ${photo ? `<img class="prof-photo" src="${U.esc(photo.dataUrl)}" alt="">` :
                    `<div style="margin-bottom:10px">${UI.avatar(m.name, true)}</div>`}
          <h3>${U.esc(m.name)}</h3>
          <div class="code">${U.esc(m.code)}${age != null ? ` — ${age} سنة` : ''}</div>
          <div style="margin-top:9px">${UI.chip(st.status)}</div>
          ${m.suspended ? '<div class="pill warn" style="margin-top:6px">العضوية موقوفة</div>' : ''}
          <dl class="kv">
            <dt>الهاتف</dt><dd class="num">${U.esc(m.phone || '—')}</dd>
            <dt>انضمّت</dt><dd class="num">${D.fmt(m.joinDate)}</dd>
            <dt>نهاية الاشتراك</dt><dd class="num">${st.endDate ? D.fmt(st.endDate) : '—'}</dd>
            <dt>آخر زيارة</dt><dd>${att.last ? `<span class="num">${D.fmt(att.last)}</span> <span class="t-sub">(${D.relative(att.last)})</span>` : '—'}</dd>
            <dt>المتبقّي عليها</dt><dd class="${balance.due > 0 ? 'money-neg' : 'money-pos'}">${Money.fmt(balance.due)}</dd>
          </dl>
          <div class="prof-quick">
            <button class="btn btn-primary btn-sm" data-a="renew">تجديد / اشتراك جديد</button>
            <button class="btn btn-sm" data-a="checkin">تسجيل حضور</button>
            ${balance.due > 0 ? '<button class="btn btn-sm" data-a="collect">قبض دفعة</button>' : ''}
            <button class="btn btn-sm" data-a="edit">تعديل البيانات</button>
          </div>
        </div>
      </aside>

      <div>
        <div class="tabs" id="pTabs">
          ${TABS.map(([k, t]) => `<button class="tab ${k === tab ? 'active' : ''}" data-t="${k}">${t}</button>`).join('')}
        </div>
        <div id="pPane" style="margin-top:14px"></div>
      </div></div>`;

    const $p = () => root.querySelector('#pPane');

    /* ------------------------------ نظرة عامة ------------------------------ */
    const paneOverview = () => {
      const run = Calc.consecutiveRun(liveSubs, Settings.get('consecutiveGapDays'));
      const offers = Offers.eligibleForMember(m.id);
      const openTasks = Svc.tasks.ofMember(m.id).filter(t => t.status === 'open');
      const goals = Svc.goals.ofMember(m.id).filter(g => g.status === 'open');
      const docsSoon = Svc.docs.ofMember(m.id).filter(d => d.expiryDate && D.diffDays(D.today(), d.expiryDate) <= 30);
      return `
      ${balance.due > 0 ? `<div class="card" style="border-color:var(--red-600);margin-bottom:14px"><div class="card-body" style="padding:12px 15px">
        <div class="row" style="gap:10px;align-items:center"><span>عليها متبقٍّ <strong class="money-neg">${Money.fmt(balance.due)}</strong> من إجمالي ${Money.fmt(balance.total)}</span>
        <div style="flex:1"></div><button class="btn btn-sm btn-primary" data-a="collect">قبض دفعة</button></div></div></div>` : ''}
      ${st.status === STATUS.FROZEN ? `<div class="card" style="border-color:var(--blue-600);margin-bottom:14px"><div class="card-body" style="padding:12px 15px">
        اشتراكها مجمّد حتى <strong class="num">${D.fmt(st.freeze.to)}</strong> — السبب: ${U.esc(st.freeze.reason || '—')}</div></div>` : ''}
      <div class="stat-row">
        <div class="stat"><b>${liveSubs.length}</b><span>اشتراك — متتالية ${run}</span></div>
        <div class="stat pos"><b>${Money.fmt(balance.paid)}</b><span>إجمالي ما دفعته</span></div>
        <div class="stat"><b>${att.total}</b><span>زيارة — ${att.last30} آخر 30 يوماً</span></div>
        <div class="stat"><b>${att.streak}</b><span>أسابيع مواظبة متّصلة</span></div>
        ${classCr.total ? `<div class="stat"><b>${classCr.remaining}</b><span>حصص متبقّية من ${classCr.total}</span></div>` : ''}
        ${ptCr.total ? `<div class="stat"><b>${ptCr.remaining}</b><span>تدريب خاص متبقٍّ</span></div>` : ''}
      </div>
      <div class="grid g-2">
        <div class="card"><div class="card-head"><h3>ما يحتاج انتباهاً</h3></div><div class="card-body">
          ${(() => {
            const rows = [];
            if (st.status === STATUS.EXPIRING) rows.push(['warn', `اشتراكها ينتهي خلال ${st.daysLeft} يوم — ذكّريها بالتجديد`]);
            if (st.status === STATUS.EXPIRED) rows.push(['bad', `اشتراكها منتهٍ منذ ${Math.abs(st.daysLeft)} يوماً`]);
            if (att.gapDays != null && att.gapDays >= (Settings.get('inactiveDays') || 21) && (st.status === STATUS.ACTIVE || st.status === STATUS.EXPIRING))
              rows.push(['warn', `لم تحضر منذ ${att.gapDays} يوماً رغم أن اشتراكها فعّال`]);
            if (!m.phone) rows.push(['warn','لا يوجد رقم هاتف — لا يمكن التواصل معها']);
            docsSoon.forEach(d => rows.push([D.cmp(d.expiryDate, D.today()) < 0 ? 'bad' : 'warn',
              `المستند «${U.esc(d.title)}» ${D.cmp(d.expiryDate, D.today()) < 0 ? 'منتهٍ' : 'ينتهي ' + D.relative(d.expiryDate)}`]));
            offers.forEach(o => rows.push(['ok', `مؤهّلة لعرض «${U.esc(o.offer.name)}» — ${U.esc(o.reason)}`]));
            openTasks.forEach(t => rows.push(['warn', `متابعة معلّقة: ${U.esc(t.title)} (${D.relative(t.dueDate)})`]));
            if (!rows.length) return '<div class="t-sub">لا شيء عاجل — كل شيء على ما يُرام.</div>';
            return `<ul class="timeline">${rows.map(([cls, txt]) => `<li class="${cls}">${txt}</li>`).join('')}</ul>`;
          })()}
        </div></div>
        <div class="card"><div class="card-head"><h3>الأهداف</h3>
          <div class="sp"></div><button class="btn btn-sm" data-a="goal">هدف جديد</button></div><div class="card-body">
          ${goals.length ? goals.map(g => {
            const p = Svc.goals.progress(g);
            return `<div style="margin-bottom:12px">
              <div class="row"><strong>${U.esc(g.title)}</strong><div style="flex:1"></div>
                ${p ? `<span class="num t-sub">${p.current} / ${p.target} ${U.esc(g.unit || '')}</span>` : ''}</div>
              ${p ? `<div class="bar ${p.reached ? 'ok' : ''}"><i style="width:${Math.max(2, p.pct)}%"></i></div>
                     <span class="t-sub">${U.esc(p.source)}</span>` : '<span class="t-sub">لا قياس مسجّل بعد لقياس التقدّم</span>'}
            </div>`;
          }).join('') : '<div class="t-sub">لا أهداف مسجّلة. الهدف المكتوب يُتابَع، والمنطوق يُنسى.</div>'}
        </div></div>
      </div>`;
    };

    /* ----------------------------- اللياقة ----------------------------- */
    const paneFitness = () => {
      const latest = Svc.measure.latest(m.id);
      const types = Svc.measure.types();
      const bmi = Svc.measure.bmi(m.id);
      const withData = types.filter(t => latest[t.key]);
      const chartType = params.mt || (withData[0] && withData[0].key) || 'weight';
      const series = Svc.measure.series(m.id, chartType);
      const prog = Svc.measure.progress(m.id, chartType);
      return `<div class="card"><div class="card-head"><h3>القياسات</h3><div class="sp"></div>
        <button class="btn btn-sm btn-primary" data-a="measure">تسجيل قياسات</button></div>
        <div class="card-body">
        ${withData.length ? `
          <div class="stat-row">
            ${withData.map(t => {
              const rec = latest[t.key], pr = Svc.measure.progress(m.id, t.key);
              return `<div class="stat ${pr && pr.improved === true ? 'pos' : pr && pr.improved === false ? 'neg' : ''}">
                <b>${U.esc(String(rec.value))} <span style="font-size:12px;font-weight:400">${U.esc(rec.unit || t.unit)}</span></b>
                <span>${U.esc(t.label)} — ${D.fmt(rec.date)}${pr ? ` (${pr.delta > 0 ? '+' : ''}${pr.delta})` : ''}</span></div>`;
            }).join('')}
            ${bmi ? `<div class="stat"><b>${bmi.value}</b><span>مؤشر كتلة الجسم (وصفي)</span></div>` : ''}
          </div>
          <div class="row" style="gap:6px;margin:10px 0">
            ${withData.map(t => `<button class="btn btn-sm ${t.key === chartType ? 'btn-primary' : ''}" data-mt="${t.key}">${U.esc(t.label)}</button>`).join('')}
          </div>
          ${series.length > 1 ? UI.lineChart(series.map(x => ({ label:x.label, value:x.value })),
              { height:200, baseline:'auto',
                fmt:v => `${U.round2(v)} ${Svc.measure.typeOf(chartType).unit || ''}`.trim() })
                              : '<div class="t-sub">قياس واحد فقط لهذا النوع — سجّلي قياساً آخر لتظهر المقارنة.</div>'}
          ${prog ? `<div class="t-sub" style="margin-top:6px">من ${prog.first.value} في ${D.fmt(prog.first.date)}
             إلى ${prog.last.value} في ${D.fmt(prog.last.date)} — الفرق ${prog.delta > 0 ? '+' : ''}${prog.delta} خلال ${prog.days} يوماً.</div>` : ''}
          <h4 style="font-size:13px;margin:18px 0 8px">كل القياسات</h4>
          <table class="mini-tbl"><thead><tr><th>التاريخ</th><th>القياس</th><th>القيمة</th><th>سجّلتها</th><th></th></tr></thead><tbody>
            ${Svc.measure.ofMember(m.id).slice(0, 40).map(x => `<tr>
              <td class="num">${D.fmt(x.date)}</td><td>${U.esc(Svc.measure.typeOf(x.type).label)}</td>
              <td class="num">${U.esc(String(x.value))} ${U.esc(x.unit || '')}</td><td class="t-sub">${U.esc(x.recordedBy || '—')}</td>
              <td class="ta-l"><button class="btn btn-sm btn-icon btn-danger" data-delm="${x.id}" title="حذف">${svg(ICON.trash, 14)}</button></td></tr>`).join('')}
          </tbody></table>`
        : UI.empty('لا قياسات بعد','سجّلي أول قياس ليصبح التقدّم قابلاً للقياس بدل الانطباع',
            '<button class="btn btn-primary" data-a="measure">تسجيل قياسات</button>')}
      </div></div>
      <div class="card" style="margin-top:14px"><div class="card-head"><h3>الأهداف</h3><div class="sp"></div>
        <button class="btn btn-sm" data-a="goal">هدف جديد</button></div><div class="card-body">
        ${(() => { const gs = Svc.goals.ofMember(m.id);
          if (!gs.length) return '<div class="t-sub">لا أهداف مسجّلة.</div>';
          return `<table class="mini-tbl"><thead><tr><th>الهدف</th><th>المستهدف</th><th>التقدّم</th><th>الحالة</th><th></th></tr></thead><tbody>
          ${gs.map(g => { const p = Svc.goals.progress(g);
            return `<tr><td><strong>${U.esc(g.title)}</strong>${g.targetDate ? `<div class="t-sub num">حتى ${D.fmt(g.targetDate)}</div>` : ''}</td>
              <td class="num">${g.targetValue != null ? g.targetValue + ' ' + U.esc(g.unit || '') : '—'}</td>
              <td style="min-width:120px">${p ? `<div class="bar ${p.reached ? 'ok' : ''}"><i style="width:${Math.max(2, p.pct)}%"></i></div>
                  <span class="t-sub num">${p.pct}%</span>` : '<span class="t-sub">—</span>'}</td>
              <td>${g.status === 'achieved' ? '<span class="pill ok">تحقّق</span>' : g.status === 'dropped' ? '<span class="pill">أُلغي</span>' : '<span class="pill">جارٍ</span>'}</td>
              <td class="ta-l"><div class="t-actions">
                ${g.status === 'open' ? `<button class="btn btn-sm" data-goaldone="${g.id}">تحقّق</button>` : `<button class="btn btn-sm" data-goalopen="${g.id}">إعادة فتح</button>`}
                <button class="btn btn-sm btn-icon" data-goaledit="${g.id}">${svg(ICON.edit, 14)}</button>
                <button class="btn btn-sm btn-icon btn-danger" data-goaldel="${g.id}">${svg(ICON.trash, 14)}</button></div></td></tr>`;
          }).join('')}</tbody></table>`; })()}
      </div></div>`;
    };

    /* ---------------------------- الاشتراكات ---------------------------- */
    const paneSubs = () => `<div class="card"><div class="card-head"><h3>سجل الاشتراكات</h3><div class="sp"></div>
      <button class="btn btn-sm btn-primary" data-a="renew">اشتراك جديد</button></div><div class="card-body">
      ${subs.length ? `<table class="mini-tbl"><thead><tr><th>المدة</th><th>من</th><th>إلى</th><th>المستحق</th><th>المقبوض</th><th>الحالة</th><th></th></tr></thead><tbody>
        ${subs.map(s => { const b = Calc.payStatus(s.finalPrice, payIdx[s.id] || 0);
          const ev = Svc.membership.summary(s.id);
          return `<tr${s.archived ? ' class="archived-row"' : ''}>
            <td><strong>${U.esc(Svc.subs.durationInfo(s).label)}</strong>${s.archived ? ' <span class="pill">مؤرشف</span>' : ''}
              ${s.sessionCredits ? `<div class="t-sub">${s.sessionCredits} حصة مشمولة</div>` : ''}</td>
            <td class="num">${D.fmt(s.startDate)}</td>
            <td class="num">${D.fmt(s.endDate)}${ev.addedDays ? `<div class="t-sub">+${ev.addedDays} يوم (${ev.frozenDays ? 'تجميد' : 'تمديد'})</div>` : ''}</td>
            <td class="num">${Money.fmt(s.finalPrice)}${s.discount ? `<div class="t-sub">خصم ${Money.fmt(s.discount)}</div>` : ''}</td>
            <td class="num">${Money.fmt(b.paid)}</td>
            <td>${UI.chip(b)}</td>
            <td class="ta-l"><div class="t-actions">

          ${U.sortBy(evs, x => x.e.createdAt, -1).map(({ e }) => `<tr${e.cancelled ? ' class="archived-row"' : ''}>

      ${(classCr.total || ptCr.total) ? `<div class="card" style="margin-top:14px"><div class="card-head"><h3>أرصدة الحصص</h3>

        <div class="t-sub" style="margin-bottom:10px">الحصص ليست نقوداً ولا تُصرف بدلاً عنها. الاستهلاك يبدأ من الباقة الأقرب انتهاءً.</div>
        <table class="mini-tbl"><thead><tr><th>النوع</th><th>الباقة</th><th>المستهلك</th><th>المتبقّي</th><th>تنتهي</th></tr></thead><tbody>
        ${[...classCr.packs, ...ptCr.packs].map(p => `<tr${p.isExpired ? ' class="archived-row"' : ''}>

          <div class="row"><span class="t-sub">لا أرصدة حصص لهذه المشتركة.</span><div style="flex:1"></div>

    /* ------------------------------ الحضور ------------------------------ */
    const paneAttendance = () => {

      return `<div class="stat-row">

        <div class="card"><div class="card-head"><h3>حجوزات الحصص</h3></div><div class="card-body">

            ${bookings.map(b => { const s = Repos.sessions.get(b.sessionId); const info = Svc.classes.BOOKING[b.status] || { ar:b.status, cls:'chip-none' };
              return `<tr><td>${U.esc(s ? s.title : '—')}</td><td class="num">${s ? D.fmt(s.date) : ''}</td>
                <td><span class="chip ${info.cls}"><span class="dot"></span>${info.ar}</span></td></tr>`; }).join('')}

      <div class="card" style="margin-top:14px"><div class="card-head"><h3>سجل الزيارات</h3><div class="sp"></div>

        ${recent.length ? `<table class="mini-tbl"><thead><tr><th>التاريخ</th><th>اليوم</th><th>الدخول</th><th>الخروج</th><th>المدة</th><th>الطريقة</th></tr></thead><tbody>
          ${recent.map(a => `<tr><td class="num">${D.fmt(a.date)}</td><td>${D.dayName(a.date)}</td>
            <td class="num">${U.esc(a.time || '—')}</td><td class="num">${U.esc(a.checkOut || '—')}</td>
            <td class="num">${Svc.attendance.minutesOf(a) ? Svc.attendance.minutesOf(a) + ' د' : '—'}</td>
            <td class="t-sub">${U.esc(Svc.attendance.METHODS[a.method] || 'تسجيل الاستقبال')}</td></tr>`).join('')}
          </tbody></table>` : UI.empty('لا زيارات مسجّلة','سجّلي أول حضور لهذه المشتركة')}
      </div></div>`;
    };

    /* ------------------------------ المالية ----------------------------- */
    const paneMoney = () => {
      const pmts = Svc.payments.ofMember(m.id);
      const receipts = Svc.receipts.ofMember(m.id);
      return `<div class="stat-row">
        <div class="stat"><b>${Money.fmt(balance.total)}</b><span>إجمالي المستحق</span></div>
        <div class="stat pos"><b>${Money.fmt(balance.paid)}</b><span>إجمالي المقبوض</span></div>
        <div class="stat ${balance.due > 0 ? 'neg' : 'pos'}"><b>${Money.fmt(balance.due)}</b><span>${balance.due > 0 ? 'متبقٍّ عليها' : 'لا مستحقات'}</span></div>
        <div class="stat"><b>${mySales.length}</b><span>فاتورة متجر</span></div>
      </div>
      <div class="card"><div class="card-head"><h3>كشف حساب</h3><div class="sp"></div>
        <button class="btn btn-sm" data-a="statement">${svg(ICON.print, 14)} طباعة الكشف</button></div><div class="card-body">
        ${pmts.length ? `<table class="mini-tbl"><thead><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th><th>الطريقة</th><th>الوصل</th><th></th></tr></thead><tbody>
          ${pmts.map(p => { const rc = Svc.receipts.forPayment(p.id);
            const doc = p.refType === 'sale' ? Repos.sales.get(p.refId) : Repos.subs.get(p.refId);
            return `<tr><td class="num">${D.fmt(p.date)}</td>
              <td>${U.esc(Svc.payments.REF_LABEL[p.refType] || '')}${doc ? ' — ' + U.esc(doc.code || doc.planName || '') : ''}</td>
              <td class="num"><strong>${Money.fmt(p.amount)}</strong></td><td>${U.esc(p.method || '')}</td>
              <td class="num">${rc ? (rc.voided ? `<span class="pill bad">${U.esc(rc.no)} مُبطَل</span>` : U.esc(rc.no)) : '<span class="t-sub">—</span>'}</td>
              <td class="ta-l"><button class="btn btn-sm" data-receipt="${p.id}">${svg(ICON.print, 13)} وصل</button></td></tr>`;
          }).join('')}</tbody></table>` : '<div class="t-sub">لا دفعات مسجّلة.</div>'}
      </div></div>
      ${mySales.length ? `<div class="card" style="margin-top:14px"><div class="card-head"><h3>فواتير المتجر</h3></div><div class="card-body">
        <table class="mini-tbl"><thead><tr><th>الفاتورة</th><th>التاريخ</th><th>الإجمالي</th><th>المتبقّي</th></tr></thead><tbody>
        ${U.sortBy(mySales, x => x.date, -1).map(sl => { const b = Calc.payStatus(sl.total, saleIdx[sl.id] || 0);
          return `<tr><td class="num">${U.esc(sl.code)}</td><td class="num">${D.fmt(sl.date)}</td>
            <td class="num">${Money.fmt(sl.total)}</td><td>${b.due > 0 ? `<span class="money-neg">${Money.fmt(b.due)}</span>` : '—'}</td></tr>`;
        }).join('')}</tbody></table></div></div>` : ''}
      ${receipts.length ? `<div class="card" style="margin-top:14px"><div class="card-head"><h3>الوصولات الصادرة</h3></div><div class="card-body">
        <div class="t-sub" style="margin-bottom:8px">إعادة الطباعة لا تُنشئ دفعة جديدة ولا تُضاف إلى الإيرادات.</div>
        <table class="mini-tbl"><thead><tr><th>الرقم</th><th>التاريخ</th><th>المبلغ</th><th>النسخ</th><th></th></tr></thead><tbody>
        ${receipts.map(r => `<tr${r.voided ? ' class="archived-row"' : ''}>
          <td class="num">${U.esc(r.no)}${r.voided ? ' <span class="pill bad">مُبطَل</span>' : ''}</td>
          <td class="num">${D.fmt(String(r.issuedAt).slice(0, 10))}</td><td class="num">${Money.fmt(r.amount)}</td>
          <td class="num">${r.reprints ? r.reprints + ' إعادة' : 'الأصل'}</td>
          <td class="ta-l"><button class="btn btn-sm" data-reprint="${r.id}">${svg(ICON.print, 13)} طباعة</button></td></tr>`).join('')}
        </tbody></table></div></div>` : ''}`;
    };

    /* ------------------------- المستندات والبيانات ------------------------ */
    const paneDocs = () => {
      const docs = Svc.docs.ofMember(m.id);
      const em = m.emergency || {}, he = m.health || {};
      const cfDefs = Fields.for('member');
      return `<div class="card"><div class="card-head"><h3>المستندات</h3><div class="sp"></div>
        <button class="btn btn-sm btn-primary" data-a="doc">إضافة مستند</button></div><div class="card-body">
        ${docs.length ? `<table class="mini-tbl"><thead><tr><th>المستند</th><th>النوع</th><th>الإصدار</th><th>الانتهاء</th><th>المرفق</th><th></th></tr></thead><tbody>
          ${docs.map(d => { const left = d.expiryDate ? D.diffDays(D.today(), d.expiryDate) : null;
            return `<tr><td><strong>${U.esc(d.title)}</strong></td><td>${U.esc(d.type)}</td>
              <td class="num">${d.issueDate ? D.fmt(d.issueDate) : '—'}</td>
              <td class="num">${d.expiryDate ? `${D.fmt(d.expiryDate)} ${left < 0 ? '<span class="pill bad">منتهٍ</span>' : left <= 30 ? `<span class="pill warn">${left} يوم</span>` : ''}` : '—'}</td>
              <td>${d.mediaId ? `<button class="btn btn-sm" data-docview="${d.id}">عرض</button>` : '<span class="t-sub">—</span>'}</td>
              <td class="ta-l"><div class="t-actions">
                <button class="btn btn-sm btn-icon" data-docedit="${d.id}">${svg(ICON.edit, 14)}</button>
                <button class="btn btn-sm btn-icon btn-danger" data-docdel="${d.id}">${svg(ICON.trash, 14)}</button></div></td></tr>`;
          }).join('')}</tbody></table>`
        : UI.empty('لا مستندات','الاتفاقيات والإقرارات والمرفقات تُحفظ هنا','<button class="btn btn-primary" data-a="doc">إضافة مستند</button>')}
      </div></div>

      <div class="grid g-2" style="margin-top:14px">
        <div class="card"><div class="card-head"><h3>البيانات الشخصية</h3><div class="sp"></div>
          <button class="btn btn-sm" data-a="edit">تعديل</button></div><div class="card-body">
          <dl class="kv" style="margin-top:0">
            <dt>الهاتف</dt><dd class="num">${U.esc(m.phone || '—')}</dd>
            <dt>هاتف ثانٍ</dt><dd class="num">${U.esc(m.phone2 || '—')}</dd>
            <dt>البريد</dt><dd style="direction:ltr;text-align:start">${U.esc(m.email || '—')}</dd>
            <dt>المدينة</dt><dd>${U.esc(m.city || '—')}</dd>
            <dt>العنوان</dt><dd>${U.esc(m.address || '—')}</dd>
            <dt>العمل</dt><dd>${U.esc(m.occupation || '—')}</dd>
            <dt>تاريخ الميلاد</dt><dd class="num">${m.birthDate ? D.fmt(m.birthDate) : '—'}</dd>
            <dt>كيف عرفتنا</dt><dd>${U.esc(m.source || '—')}</dd>
            <dt>المدربة المفضّلة</dt><dd>${U.esc((Repos.staff.get(m.preferredCoachId) || {}).name || '—')}</dd>
          </dl>
          ${cfDefs.length ? `<h4 style="font-size:13px;margin:16px 0 6px">حقول النادي</h4><dl class="kv" style="margin-top:0">
            ${cfDefs.map(f => `<dt>${U.esc(f.label)}</dt><dd>${Fields.display(f, (m.custom || {})[f.key])}</dd>`).join('')}</dl>` : ''}
        </div></div>
        <div>
          <div class="card"><div class="card-head"><h3>جهة الاتصال للطوارئ</h3></div><div class="card-body">
            ${em.name || em.phone ? `<dl class="kv" style="margin-top:0">
              <dt>الاسم</dt><dd>${U.esc(em.name || '—')}</dd>
              <dt>الصلة</dt><dd>${U.esc(em.relation || '—')}</dd>
              <dt>الهاتف</dt><dd class="num">${U.esc(em.phone || '—')}</dd>
              ${em.phone2 ? `<dt>هاتف ثانٍ</dt><dd class="num">${U.esc(em.phone2)}</dd>` : ''}</dl>`
            : '<div class="t-sub">لم تُسجَّل. يُستحسن سؤالها عنها.</div>'}
          </div></div>
          <div class="card" style="margin-top:14px"><div class="card-head"><h3>ملاحظات السلامة</h3></div><div class="card-body">
            ${he.notes || he.allergies || he.restrictions ? `<div class="sens">
              ${he.notes ? `<div><b>إصابات أو قيود:</b> ${U.esc(he.notes)}</div>` : ''}
              ${he.allergies ? `<div><b>حساسية:</b> ${U.esc(he.allergies)}</div>` : ''}
              ${he.restrictions ? `<div><b>يُتجنَّب:</b> ${U.esc(he.restrictions)}</div>` : ''}
              ${he.consent ? '<div class="pill ok" style="margin-top:6px">وقّعت إقرار المسؤولية</div>' : ''}
            </div><div class="t-sub" style="margin-top:8px">هذه ملاحظات تدريب، لا سجل طبي. لا تظهر في الجداول ولا الوصولات.</div>`
            : '<div class="t-sub">لا ملاحظات مسجّلة.</div>'}
          </div></div>
          ${m.idNumber || m.idType ? `<div class="card" style="margin-top:14px"><div class="card-head"><h3>وثيقة التعريف</h3></div><div class="card-body">
            <dl class="kv" style="margin-top:0"><dt>النوع</dt><dd>${U.esc(m.idType || '—')}</dd>
              <dt>الرقم</dt><dd class="num">${U.esc(m.idNumber || '—')}</dd>
              <dt>تنتهي</dt><dd class="num">${m.idExpiry ? D.fmt(m.idExpiry) : '—'}</dd></dl>
            ${m.idMediaId ? `<button class="btn btn-sm" data-idview="1" style="margin-top:8px">عرض المرفق</button>` : ''}
          </div></div>` : ''}
        </div>
      </div>`;
    };

    /* ------------------------------- السجل ------------------------------- */
    const paneTimeline = () => {
      const ev = [];
      const push = (date, cls, text) => { if (date) ev.push({ date:String(date).slice(0, 10), cls, text }); };
      push(m.joinDate, '', `انضمّت إلى النادي — الكود ${U.esc(m.code)}`);
      subs.forEach(s => push(s.startDate, '', `اشتراك ${U.esc(Svc.subs.durationInfo(s).label)} بمبلغ ${Money.fmt(s.finalPrice)}`));
      subs.forEach(s => Svc.membership.eventsOf(s.id).forEach(e =>
        push(String(e.createdAt).slice(0, 10), 'warn',
          `${Svc.membership.EVENT[e.type] || e.type} ${e.days} يوماً${e.cancelled ? ' (أُلغي لاحقاً)' : ''} — ${U.esc(e.reason || '')}`)));
      Svc.payments.ofMember(m.id).forEach(p => push(p.date, 'money', `قبض ${Money.fmt(p.amount)} — ${U.esc(p.method || '')}`));
      Svc.receipts.ofMember(m.id).forEach(r => push(String(r.issuedAt).slice(0, 10), 'money', `إصدار وصل ${U.esc(r.no)}${r.voided ? ' (مُبطَل)' : ''}`));
      Svc.measure.ofMember(m.id).forEach(x => push(x.date, '', `قياس ${U.esc(Svc.measure.typeOf(x.type).label)}: ${x.value} ${U.esc(x.unit || '')}`));
      Svc.docs.ofMember(m.id).forEach(d => push(String(d.createdAt).slice(0, 10), '', `مستند «${U.esc(d.title)}»`));
      Svc.goals.ofMember(m.id).forEach(g => { push(g.startDate, '', `هدف جديد: ${U.esc(g.title)}`);
        if (g.achievedAt) push(g.achievedAt, 'money', `تحقّق الهدف: ${U.esc(g.title)}`); });
      const visits = Svc.attendance.ofMember(m.id);
      /* الزيارات كثيرة: تُلخَّص شهرياً حتى لا تُغرق بقية الأحداث */
      Object.entries(U.groupBy(visits, a => D.monthKey(a.date))).forEach(([k, arr]) =>
        push(D.endOfMonth(k), '', `${arr.length} زيارة في ${D.monthName(k)}`));
      const rows = U.sortBy(ev, x => x.date, -1).slice(0, 120);
      return `<div class="card"><div class="card-head"><h3>كل ما حدث، بالترتيب</h3></div><div class="card-body">
        ${rows.length ? `<ul class="timeline">${rows.map(x => `<li class="${x.cls}">
          <span class="when num">${D.fmt(x.date)} — ${D.dayName(x.date)}</span>${x.text}</li>`).join('')}</ul>`
        : '<div class="t-sub">لا أحداث.</div>'}</div></div>`;
    };

    const PANES = { overview:paneOverview, fitness:paneFitness, subs:paneSubs,
                    attendance:paneAttendance, money:paneMoney, docs:paneDocs, timeline:paneTimeline };

    const draw = () => {
      $p().innerHTML = (PANES[tab] || paneOverview)();
      bind();
    };
    const reload = () => renderRoute();
    const on = (sel, fn) => root.querySelectorAll(sel).forEach(b => b.onclick = () => fn(b));

    function bind(){
      on('[data-a]', b => {
        const a = b.dataset.a;
        if (a === 'renew') Forms.subscription(null, m.id);
        else if (a === 'edit') Forms.member(m.id);
        else if (a === 'checkin') Actions.quickCheckIn(m.id);
        else if (a === 'collect') Screens.memberDues(m.id);
        else if (a === 'measure') Forms.measurement(m.id);
        else if (a === 'goal') Forms.goal(null, m.id);
        else if (a === 'doc') Forms.document(null, m.id);
        else if (a === 'grant') Forms.creditGrant(m.id);
        else if (a === 'statement') Actions.printStatement(m.id);
      });
      on('[data-mt]', b => go('member', { id:m.id, tab:'fitness', mt:b.dataset.mt }));
      on('[data-delm]', async b => {
        if (!await UI.confirm({ title:'حذف قياس', message:'يُحذف هذا القياس نهائياً من سجل التقدّم.', danger:true, confirmText:'حذف' })) return;
        await guard(null, () => Svc.measure.remove(b.dataset.delm), 'حُذف القياس'); reload();
      });
      on('[data-goaldone]', async b => { await guard(null, () => Svc.goals.setStatus(b.dataset.goaldone, 'achieved'), 'مبروك — تحقّق الهدف'); reload(); });
      on('[data-goalopen]', async b => { await guard(null, () => Svc.goals.setStatus(b.dataset.goalopen, 'open'), 'أُعيد فتح الهدف'); reload(); });
      on('[data-goaledit]', b => Forms.goal(b.dataset.goaledit, m.id));
      on('[data-goaldel]', async b => {
        if (!await UI.confirm({ title:'حذف هدف', message:'سيُحذف الهدف وسجلّه.', danger:true, confirmText:'حذف' })) return;
        await guard(null, () => Svc.goals.remove(b.dataset.goaldel), 'حُذف الهدف'); reload();
      });
      on('[data-freeze]', b => Forms.freeze(b.dataset.freeze));
      on('[data-extend]', b => Forms.extendSub(b.dataset.extend));
      on('[data-evcancel]', async b => {
        if (!await UI.confirm({ title:'التراجع عن الحدث', message:'ستعود نهاية الاشتراك إلى ما تقوله بقية الأحداث.' })) return;
        await guard(null, () => Svc.membership.cancelEvent(b.dataset.evcancel, 'تراجع يدوي'), 'تم التراجع'); reload();
      });
      on('[data-pay]', b => Forms.payment('subscription', b.dataset.pay));
      on('[data-receipt]', b => Actions.printReceiptForPayment(b.dataset.receipt));
      on('[data-reprint]', b => Actions.printReceipt(b.dataset.reprint));
      on('[data-docedit]', b => Forms.document(b.dataset.docedit, m.id));
      on('[data-docview]', b => Screens.viewMedia((Repos.memberDocs.get(b.dataset.docview) || {}).mediaId));
      on('[data-idview]', () => Screens.viewMedia(m.idMediaId));
      on('[data-docdel]', async b => {
        if (!await UI.confirm({ title:'حذف مستند', message:'يُحذف المستند ومرفقه إن لم يكن مستعملاً في مكان آخر.', danger:true, confirmText:'حذف' })) return;
        await guard(null, () => Svc.docs.remove(b.dataset.docdel), 'حُذف المستند'); reload();
      });
    }

    root.querySelectorAll('#pTabs .tab').forEach(t => t.onclick = () => go('member', { id:m.id, tab:t.dataset.t }));
    draw();
  }
};


/* ===== src/app/views/20-subscriptions.js ============================================= */
/* ----------------------------- Subscriptions ------------------------------ */
Views.subs = {
  title:'الاشتراكات',
  sub(){ return `${Repos.subs.list().length} اشتراك مسجّل`; },
  render(root){
    const f = State.f.subs;
    root.innerHTML = `<div class="card">
      <div class="filters">
        <input class="inp search" id="sQ" placeholder="بحث باسم المشتركة" value="${U.esc(f.q)}">
        ${UI.select('sPlan', f.plan, planOptions())}
        ${UI.select('sPay', f.pay, [{v:'',t:'كل حالات السداد'},{v:'PAID',t:'مدفوع'},{v:'PARTIAL',t:'مدفوع جزئياً'},{v:'UNPAID',t:'غير مدفوع'},{v:'FREE',t:'مجاني'}])}
        <label class="switch">من ${UI.input('sFrom', f.from, {type:'date'})}</label>
        <label class="switch">إلى ${UI.input('sTo', f.to, {type:'date'})}</label>
        <label class="switch"><input type="checkbox" id="sArch" ${f.archived?'checked':''}> المؤرشفة</label>
        <div style="flex:1"></div>
        <button class="btn btn-sm" id="sCsv">${svg(ICON.down,15)} CSV</button>
        <button class="btn btn-sm" id="sXls">${svg(ICON.down,15)} Excel</button>
        <button class="btn btn-sm btn-primary" id="sAdd">${svg(ICON.plus,15,2.4)} اشتراك جديد</button>
      </div><div id="sTable"></div></div>`;

    const draw = () => {
      const today = D.today();
      const payIdx = Svc.payments.indexBy('subscription');
      let rows = Repos.subs.list(f.archived).map(s => ({ s, m:Repos.members.get(s.memberId),
        pay:Calc.payStatus(s.finalPrice, payIdx[s.id] || 0) }));
      const q = U.normAr(f.q);
      if (q) rows = rows.filter(r => r.m && (U.normAr(r.m.name).includes(q) || U.normAr(r.m.code).includes(q)));
      if (f.plan) rows = rows.filter(r => r.s.planId === f.plan);
      if (f.pay) rows = rows.filter(r => r.pay.key === f.pay);
      if (f.from) rows = rows.filter(r => D.cmp(r.s.startDate, f.from) >= 0);
      if (f.to) rows = rows.filter(r => D.cmp(r.s.startDate, f.to) <= 0);
      rows = f.sortFn ? U.sortBy(rows, f.sortFn, f.sortDir) : U.sortBy(rows, r=>r.s.startDate, -1);
      const live = s => D.cmp(s.startDate, today) <= 0 && D.cmp(s.endDate, today) >= 0;
      const cols = [
        { h:'المشتركة', sort:r=>r.m?r.m.name:'', render:r=>r.m
            ? `<div class="t-name">${U.esc(r.m.name)}</div><div class="t-sub">${U.esc(r.m.code)}</div>`
            : '<span class="t-sub">مشتركة محذوفة</span>' },
        { h:'المدة', sort:r=>Svc.subs.durationInfo(r.s).days, render:r=>{ const i = Svc.subs.durationInfo(r.s);
            return `<div class="t-name">${U.esc(i.label)}</div><div class="t-sub">${i.days} يوم</div>`; } },
        { h:'من', sort:r=>r.s.startDate, render:r=>`<span class="num">${D.fmt(r.s.startDate)}</span>` },
        { h:'إلى', sort:r=>r.s.endDate, render:r=>`<span class="num">${D.fmt(r.s.endDate)}</span>` },
        { h:'الحالة', render:r=>r.s.archived ? '<span class="chip chip-none"><span class="dot"></span>مؤرشف</span>'
            : live(r.s) ? UI.chip(STATUS.ACTIVE) : (D.cmp(r.s.startDate, today) > 0 ? UI.chip(STATUS.SCHEDULED) : UI.chip(STATUS.EXPIRED)) },
        { h:'السعر', sort:r=>r.s.price, render:r=>UI.money(r.s.price) },
        { h:'الخصم', sort:r=>r.s.discount, render:r=>r.s.discount ? `${UI.money(r.s.discount)}${r.s.offerId?' <span class="chip chip-gold">عرض</span>':''}` : '<span class="t-sub">—</span>' },
        { h:'المستحق', sort:r=>r.s.finalPrice, render:r=>`<strong>${Money.fmt(r.s.finalPrice)}</strong>` },
        { h:'المقبوض', sort:r=>r.pay.paid, render:r=>UI.money(r.pay.paid) },
        { h:'المتبقي', sort:r=>r.pay.due, render:r=>r.pay.due>0
            ? `<strong class="money-neg num">${Money.fmt(r.pay.due)}</strong>` : '<span class="t-sub">—</span>' },
        { h:'السداد', render:r=>UI.chip(r.pay) },
        { h:'', cls:'ta-l', render:r=>`<div class="t-actions">
            <button class="btn btn-sm btn-icon" data-pmts="${r.s.id}" title="سجل الدفعات">${svg(ICON.coins,15)}</button>
            ${!r.s.archived && r.pay.due>0?`<button class="btn btn-sm" data-pay="${r.s.id}">قبض</button>`:''}
            <button class="btn btn-sm btn-icon" data-edit="${r.s.id}" title="تعديل">${svg(ICON.edit,15)}</button>
            <button class="btn btn-sm btn-icon ${r.s.archived?'':'btn-danger'}" data-arch="${r.s.id}" title="${r.s.archived?'استرجاع':'أرشفة'}">${svg(r.s.archived?ICON.undo:ICON.trash,15)}</button></div>` }
      ];
      UI.table($('sTable'), { cols, rows, state:f, rowCls:r=>r.s.archived?'archived-row':'',
        empty:UI.empty('لا اشتراكات مطابقة','سجّلي اشتراكاً جديداً من زر «اشتراك جديد»'),
        onSort:(fn,d)=>{ f.sortFn=fn; f.sortDir=d; draw(); }, onPage:draw });
      $('sTable').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => Forms.subscription(b.dataset.edit));
      $('sTable').querySelectorAll('[data-arch]').forEach(b => b.onclick = () => Actions.archiveSub(b.dataset.arch));
      $('sTable').querySelectorAll('[data-pmts]').forEach(b => b.onclick = () => Screens.paymentLedger('subscription', b.dataset.pmts));
      $('sTable').querySelectorAll('[data-pay]').forEach(b => b.onclick = () => Forms.payment('subscription', b.dataset.pay));
      f._rows = rows;
    };
    draw();
    $('sQ').oninput = U.debounce(e => { f.q = e.target.value; f.page=1; draw(); }, 220);
    $('f_sPlan').onchange = e => { f.plan = e.target.value; f.page=1; draw(); };
    $('f_sPay').onchange = e => { f.pay = e.target.value; f.page=1; draw(); };
    $('f_sFrom').onchange = e => { f.from = e.target.value; f.page=1; draw(); };
    $('f_sTo').onchange = e => { f.to = e.target.value; f.page=1; draw(); };
    $('sArch').onchange = e => { f.archived = e.target.checked; f.page=1; draw(); };
    $('sAdd').onclick = () => Forms.subscription();
    const subExport = () => Exporter.subRows((f._rows||[]).map(r => ({ s:r.s, member:r.m })));
    $('sCsv').onclick = () => Exporter.csv(`الاشتراكات-${D.today()}.csv`, Exporter.SUB_COLS, subExport());
    $('sXls').onclick = () => Exporter.xlsx(`الاشتراكات-${D.today()}.xlsx`,
      [{ name:'الاشتراكات', cols:Exporter.SUB_COLS, rows:subExport() }]);
  }
};

/* ===== src/app/views/32-crm.js ======================================================= */
/* ============================== المهتمّات ================================
   لوحة مراحل بسيطة: كل مهتمّة في عمود مرحلتها، وأهم رقم في الشاشة هو نسبة
   التحويل — لأنه يقيس أثر المتابعة لا كثرة الأسماء. */
Views.crm = {
  title:'المهتمّات',
  sub(){ const f = Svc.leads.funnel(); return `${f.open} مفتوحة — نسبة التحويل ${f.conversionRate}%`; },
  render(root){
    const f = State.f.crm || (State.f.crm = { q:'', source:'' });
    const all = Repos.leads.list();
    const funnel = Svc.leads.funnel();
    const today = D.today();

    root.innerHTML = `<div class="stat-row">
        <div class="stat"><b>${funnel.total}</b><span>إجمالي المهتمّات</span></div>
        <div class="stat"><b>${funnel.open}</b><span>ما زالت مفتوحة</span></div>
        <div class="stat pos"><b>${funnel.converted}</b><span>اشتركن</span></div>
        <div class="stat ${funnel.conversionRate >= 50 ? 'pos' : ''}"><b>${funnel.conversionRate}%</b><span>نسبة التحويل من المُغلقات</span></div>
        <div class="stat ${Svc.leads.dueFollowUps().length ? 'neg' : ''}"><b>${Svc.leads.dueFollowUps().length}</b><span>متابعة مستحقّة</span></div>
      </div>
      <div class="card"><div class="filters">
        <input class="inp search" id="cQ" placeholder="بحث بالاسم أو الرقم" value="${U.esc(f.q)}">
        ${UI.select('cSource', f.source, [{ v:'', t:'كل المصادر' },
          ...(Settings.get('leadSources') || []).map(s => ({ v:s, t:s }))])}
        <div style="flex:1"></div>
        <button class="btn btn-sm" id="cXls">${svg(ICON.down, 15)} Excel</button>
        <button class="btn btn-sm btn-primary" id="cAdd">${svg(ICON.plus, 15, 2.4)} تسجيل مهتمّة</button>
      </div><div class="card-body"><div class="pipe" id="cPipe"></div></div></div>
      <div class="grid g-2" style="margin-top:16px">
        <div class="card"><div class="card-head"><h3>من أين تأتي المهتمّات</h3></div><div class="card-body">
          ${funnel.bySource.length ? `<table class="mini-tbl"><thead><tr><th>المصدر</th><th>العدد</th><th>اشتركن</th><th>النسبة</th></tr></thead><tbody>
            ${funnel.bySource.map(s => `<tr><td>${U.esc(s.source)}</td><td class="num">${s.total}</td>
              <td class="num">${s.converted}</td><td class="num">${U.pct(s.converted, s.total)}%</td></tr>`).join('')}
            </tbody></table>` : '<div class="t-sub">لا بيانات بعد.</div>'}
        </div></div>
        <div class="card"><div class="card-head"><h3>لماذا لم يشتركن</h3></div><div class="card-body">
          ${funnel.lostReasons.length ? `<table class="mini-tbl"><tbody>
            ${funnel.lostReasons.map(r => `<tr><td>${U.esc(r.reason)}</td><td class="num ta-l">${r.count}</td></tr>`).join('')}
            </tbody></table><div class="t-sub" style="margin-top:8px">هذه أهم قائمة في الشاشة: تقول ما الذي يمنع الاشتراك فعلاً.</div>`
            : '<div class="t-sub">لم تُسجَّل أسباب بعد.</div>'}
        </div></div>
      </div>`;

    const draw = () => {
      const q = U.normAr(f.q);
      let rows = all;
      if (q) rows = rows.filter(l => [l.name, l.phone, l.code].map(U.normAr).join(' ').includes(q));
      if (f.source) rows = rows.filter(l => l.source === f.source);
      const byStage = U.groupBy(rows, l => l.stage || 'new');
      root.querySelector('#cPipe').innerHTML = Svc.leads.STAGES.map(st => {
        const list = U.sortBy(byStage[st.key] || [], l => l.followUpDate || '9999');
        return `<div class="pipe-col"><h4>${U.esc(st.ar)} <b>${list.length}</b></h4>
          <div class="pipe-body">
            ${list.length ? list.map(l => {
              const over = l.followUpDate && D.cmp(l.followUpDate, today) <= 0 && st.open;
              return `<div class="lead-card" data-lead="${l.id}">
                <b>${U.esc(l.name)}</b>
                <div class="meta"><span class="num">${U.esc(l.phone || 'بلا رقم')}</span>
                  ${l.source ? `<span>${U.esc(l.source)}</span>` : ''}</div>
                ${st.open && l.followUpDate ? `<div class="meta ${over ? 'over' : ''}">متابعة ${D.relative(l.followUpDate)}</div>` : ''}
                ${l.stage === 'lost' && l.lostReason ? `<div class="meta">${U.esc(l.lostReason)}</div>` : ''}
              </div>`; }).join('')
            : '<div class="t-sub" style="padding:4px 2px;font-size:11.5px">لا أحد هنا</div>'}
          </div></div>`;
      }).join('');
      root.querySelectorAll('[data-lead]').forEach(c => c.onclick = () => Screens.lead(c.dataset.lead));
    };
    draw();

    root.querySelector('#cQ').oninput = U.debounce(e => { f.q = e.target.value; draw(); }, 200);
    root.querySelector('#f_cSource').onchange = e => { f.source = e.target.value; draw(); };
    root.querySelector('#cAdd').onclick = () => Forms.lead();
    root.querySelector('#cXls').onclick = () => {
      const cols = [{ h:'الكود', key:'code', w:12 }, { h:'الاسم', key:'name', w:26 }, { h:'الهاتف', key:'phone', w:16 },
        { h:'المصدر', key:'source', w:16 }, { h:'ما يهمّها', key:'interest', w:20 }, { h:'المرحلة', key:'stage', w:14 },
        { h:'أول زيارة', key:'first', w:14 }, { h:'المتابعة', key:'follow', w:14 }, { h:'سبب عدم الاشتراك', key:'lost', w:20 }];
      Exporter.xlsx(`المهتمّات-${D.today()}.xlsx`, [{ name:'المهتمّات', cols, rows:all.map(l => ({
        code:l.code || '', name:l.name, phone:l.phone || '', source:l.source || '', interest:l.interest || '',
        stage:Svc.leads.stage(l.stage).ar, first:D.fmt(l.firstSeen), follow:l.followUpDate ? D.fmt(l.followUpDate) : '',
        lost:l.lostReason || '' })) }]);
    };
  }
};

/* ملف المهتمّة: مراحلها وتحويلها إلى مشتركة */
Screens.lead = function(id){

  const tasks = Svc.tasks.forRef('lead', id);
  const member = l.convertedMemberId ? Repos.members.get(l.convertedMemberId) : null;
  const h = UI.modal({
    title:l.name, size:'wide',
    body:`<div class="row" style="gap:8px;margin-bottom:14px;align-items:center">
        <span class="chip ${Svc.leads.stage(l.stage).cls}"><span class="dot"></span>${Svc.leads.stage(l.stage).ar}</span>
        <span class="pill num">${U.esc(l.code || '')}</span>
        ${l.source ? `<span class="pill">${U.esc(l.source)}</span>` : ''}
        <div style="flex:1"></div>
        ${member ? `<span class="pill ok">اشتركت — ${U.esc(member.code)}</span>` : ''}
      </div>
      <dl class="kv" style="margin-top:0;grid-template-columns:auto 1fr">

        <dt>ما يهمّها</dt><dd>${U.esc(l.interest || '—')}</dd>
        <dt>المدربة المفضّلة</dt><dd>${U.esc((Repos.staff.get(l.preferredCoachId) || {}).name || '—')}</dd>
        <dt>أول زيارة</dt><dd class="num">${D.fmt(l.firstSeen)}</dd>
        <dt>المتابعة القادمة</dt><dd class="num">${l.followUpDate ? `${D.fmt(l.followUpDate)} (${D.relative(l.followUpDate)})` : '—'}</dd>
        ${l.lostReason ? `<dt>سبب عدم الاشتراك</dt><dd>${U.esc(l.lostReason)}</dd>` : ''}
        ${l.notes ? `<dt>ملاحظات</dt><dd>${U.esc(l.notes)}</dd>` : ''}
      </dl>
      ${Fields.for('lead').length ? `<dl class="kv" style="grid-template-columns:auto 1fr">
        ${Fields.for('lead').map(fd => `<dt>${U.esc(fd.label)}</dt><dd>${Fields.display(fd, (l.custom || {})[fd.key])}</dd>`).join('')}</dl>` : ''}

          <td class="num">${D.fmt(t.dueDate)}</td><td>${t.status === 'open' ? '<span class="pill warn">مفتوحة</span>' : '<span class="pill">أُغلقت</span>'}</td></tr>`).join('')}
        </tbody></table>` : ''}
      <h4 style="font-size:13px;margin:16px 0 8px">تحديث المرحلة</h4>
      <div class="row" style="gap:6px;flex-wrap:wrap" id="ldStages">
        ${Svc.leads.STAGES.filter(s => s.key !== 'converted').map(s =>
          `<button class="btn btn-sm ${l.stage === s.key ? 'btn-primary' : ''}" data-stage="${s.key}">${U.esc(s.ar)}</button>`).join('')}
      </div>`,
    footer:`${member ? `<button class="btn btn-primary" data-open-member="${member.id}">فتح ملف المشتركة</button>`
                     : '<button class="btn btn-primary" id="ldConvert">تحويلها إلى مشتركة</button>'}
            <button class="btn" id="ldEdit">تعديل</button>
            <button class="btn btn-danger" id="ldDel">حذف</button>
            <button class="btn" data-close>إغلاق</button><div class="sp"></div>`,
    onMount(ov){
      ov.querySelectorAll('[data-stage]').forEach(b => b.onclick = async () => {
        const stage = b.dataset.stage;
        let reason = '';
        if (stage === 'lost'){
          const picked = await new Promise(res => {
            const reasons = Settings.get('lostReasons') || ['أخرى'];
            const hh = UI.modal({ title:'لماذا لم تشترك؟', size:'narrow',
              body:`<div class="t-sub" style="margin-bottom:10px">هذه أهم معلومة في السجل — منها تُعرف أسباب فقدان العميلات.</div>
                ${UI.field('reason','السبب', UI.select('reason', reasons[0], reasons.map(r => ({ v:r, t:r }))))}
                ${UI.field('extra','تفصيل (اختياري)', UI.input('extra',''))}`,
              footer:'<button class="btn btn-primary" data-ok>حفظ</button><button class="btn" data-close>إلغاء</button><div class="sp"></div>',
              onMount(o2){ o2.querySelector('[data-ok]').onclick = () => {
                const d = UI.read(o2); res(U.norm(d.extra) ? `${d.reason} — ${d.extra}` : d.reason); hh.close(); }; },
              onClose(){ res(null); } });
          });
          if (!picked) return;
          reason = picked;
        }
        const ok = await guard(null, () => Svc.leads.setStage(id, stage, { reason }));
        if (!ok) return;
        UI.toast('حُدّثت المرحلة'); h.close(); renderRoute();
      });
      const conv = ov.querySelector('#ldConvert');
      if (conv) conv.onclick = async () => {
        if (!await UI.confirm({ title:'تحويل إلى مشتركة',
          message:`ستُنشأ مشتركة جديدة ببيانات <strong>${U.esc(l.name)}</strong> بلا إعادة كتابة، ويبقى سجلها هنا مرتبطاً بها.`,
          confirmText:'تحويل' })) return;
        const res = await guard(null, () => Svc.leads.convert(id));
        if (!res) return;
        (res.warnings || []).forEach(w => UI.toast(w, 'warn', 5000));
        UI.toast(`أصبحت مشتركة بالكود ${res.member.code}`);
        h.close();
        const pick = await UI.choice({ title:'تمّ التحويل', message:'هل تسجّلين اشتراكها الآن؟',
          options:[{ key:'sub', label:'تسجيل الاشتراك', primary:true }, { key:'profile', label:'فتح ملفها' }, { key:'later', label:'لاحقاً' }] });
        if (pick === 'sub') Forms.subscription(null, res.member.id);
        else if (pick === 'profile') Screens.memberProfile(res.member.id);
        else renderRoute();
      };
      const om = ov.querySelector('[data-open-member]');
      if (om) om.onclick = () => { h.close(); Screens.memberProfile(om.dataset.openMember); };
      ov.querySelector('#ldEdit').onclick = () => { h.close(); Forms.lead(id); };
      ov.querySelector('#ldDel').onclick = async () => {
        if (!await UI.confirm({ title:'حذف سجل المهتمّة', message:'سيُؤرشف السجل وتُغلق متابعاته.', danger:true, confirmText:'حذف' })) return;
        await guard(null, () => Svc.leads.remove(id), 'حُذف السجل');
        h.close(); renderRoute();
      };
    }
  });
};

/* ============================== المتابعات ================================ */
Views.tasks = {
  title:'المتابعات',
  sub(){ const d = Svc.tasks.due().length, o = Svc.tasks.open().length; return `${o} مفتوحة — ${d} مستحقّة اليوم`; },
  render(root){
    const f = State.f.tasks || (State.f.tasks = { type:'', show:'open' });
    const today = D.today();
    root.innerHTML = `<div class="card"><div class="filters">
        ${UI.select('tShow', f.show, [{ v:'open', t:'المفتوحة' }, { v:'due', t:'المستحقّة الآن' }, { v:'all', t:'الكل' }])}
        ${UI.select('tType', f.type, [{ v:'', t:'كل الأنواع' }, ...Object.entries(Svc.tasks.TYPES).map(([v, t]) => ({ v, t }))])}
        <div style="flex:1"></div>
        <button class="btn btn-sm" id="tSuggest">اقتراح متابعات من الواقع</button>
        <button class="btn btn-sm btn-primary" id="tAdd">${svg(ICON.plus, 15, 2.4)} متابعة جديدة</button>
      </div><div id="tList" class="card-body"></div></div>`;

    const draw = () => {
      let rows = f.show === 'all' ? U.sortBy(Repos.tasks.list(), t => t.dueDate)
               : f.show === 'due' ? Svc.tasks.due() : Svc.tasks.open();
      if (f.type) rows = rows.filter(t => t.type === f.type);
      const box = root.querySelector('#tList');
      if (!rows.length){
        box.innerHTML = UI.empty('لا متابعات','المتابعة المكتوبة تُنجَز، والمنطوقة تُنسى',
          '<button class="btn btn-primary" id="tAdd2">إضافة متابعة</button>');
        const b2 = box.querySelector('#tAdd2'); if (b2) b2.onclick = () => Forms.task();
        return;
      }
      box.innerHTML = `<table class="mini-tbl"><thead><tr><th>المطلوب</th><th>النوع</th><th>الاستحقاق</th><th>يخصّ</th><th></th></tr></thead><tbody>
        ${rows.map(t => { const late = t.status === 'open' && D.cmp(t.dueDate, today) < 0;
          const mm = t.memberId ? Repos.members.get(t.memberId) : null;
          const ld = t.refType === 'lead' ? Repos.leads.get(t.refId) : null;
          return `<tr${t.status !== 'open' ? ' class="archived-row"' : ''}>
            <td><strong>${U.esc(t.title)}</strong>${t.notes ? `<div class="t-sub">${U.esc(t.notes)}</div>` : ''}</td>
            <td>${U.esc(Svc.tasks.TYPES[t.type] || t.type)}</td>
            <td class="num ${late ? 'money-neg' : ''}">${D.fmt(t.dueDate)}
              <div class="t-sub">${late ? `متأخرة ${Math.abs(D.diffDays(today, t.dueDate))} يوماً` : D.relative(t.dueDate)}</div></td>
            <td>${mm ? `<button class="btn btn-sm" data-mem="${mm.id}">${U.esc(mm.name)}</button>`
                     : ld ? `<button class="btn btn-sm" data-lead="${ld.id}">${U.esc(ld.name)}</button>` : '<span class="t-sub">—</span>'}</td>
            <td class="ta-l"><div class="t-actions">
              ${t.status === 'open' ? `<button class="btn btn-sm btn-primary" data-done="${t.id}">تمّت</button>
                 <button class="btn btn-sm" data-snooze="${t.id}">تأجيل</button>` : `<span class="pill">${t.status === 'done' ? 'أُنجزت' : 'أُلغيت'}</span>`}
              <button class="btn btn-sm btn-icon btn-danger" data-del="${t.id}">${svg(ICON.trash, 14)}</button>
            </div></td></tr>`; }).join('')}
        </tbody></table>`;
      const on = (sel, fn) => box.querySelectorAll(sel).forEach(b => b.onclick = () => fn(b));
      on('[data-mem]', b => Screens.memberProfile(b.dataset.mem));
      on('[data-lead]', b => Screens.lead(b.dataset.lead));
      on('[data-done]', async b => { await guard(null, () => Svc.tasks.complete(b.dataset.done), 'تمّت المتابعة'); renderRoute(); });
      on('[data-snooze]', async b => { await guard(null, () => Svc.tasks.snooze(b.dataset.snooze, 3), 'أُجّلت ثلاثة أيام'); renderRoute(); });
      on('[data-del]', async b => {
        if (!await UI.confirm({ title:'حذف متابعة', message:'ستُحذف نهائياً.', danger:true, confirmText:'حذف' })) return;
        await guard(null, () => Svc.tasks.remove(b.dataset.del), 'حُذفت'); renderRoute();
      });
    };
    draw();
    root.querySelector('#f_tShow').onchange = e => { f.show = e.target.value; draw(); };
    root.querySelector('#f_tType').onchange = e => { f.type = e.target.value; draw(); };
    root.querySelector('#tAdd').onclick = () => Forms.task();
    root.querySelector('#tSuggest').onclick = () => Screens.suggestTasks();
  }
};

/* اقتراحات المتابعة: تُعرض ليُختار منها، ولا تُنشأ بالمئات وحدها */
Screens.suggestTasks = function(){
  const list = Svc.tasks.suggest();
  const h = UI.modal({
    title:'متابعات مقترحة من واقع البيانات', size:'wide',
    body: list.length ? `<div class="t-sub" style="margin-bottom:10px">
        اختاري ما تريدين إنشاءه. لا شيء يُنشأ تلقائياً — التذكير الذي يولد بالمئات يُهمَل بالمئات.</div>
      <table class="mini-tbl"><thead><tr><th style="width:34px"><input type="checkbox" id="sgAll" checked></th>
        <th>المطلوب</th><th>النوع</th><th>الاستحقاق</th><th>السبب</th></tr></thead><tbody>
        ${list.map((t, i) => `<tr><td><input type="checkbox" class="sg" data-i="${i}" checked></td>
          <td>${U.esc(t.title)}</td><td>${U.esc(Svc.tasks.TYPES[t.type] || '')}</td>
          <td class="num">${D.fmt(t.dueDate)}</td><td class="t-sub">${U.esc(t.reason || '')}</td></tr>`).join('')}
      </tbody></table>` : UI.empty('لا اقتراحات','لا يوجد ما يستدعي متابعة الآن — وهذا خبر جيّد'),
    footer: list.length ? `<button class="btn btn-primary" id="sgSave">إنشاء المحدَّد</button>
            <button class="btn" data-close>إلغاء</button><div class="sp"></div>` : undefined,
    onMount(ov){
      const all = ov.querySelector('#sgAll');
      if (all) all.onchange = () => ov.querySelectorAll('.sg').forEach(c => c.checked = all.checked);
      const save = ov.querySelector('#sgSave');
      if (save) save.onclick = async () => {
        const picked = [...ov.querySelectorAll('.sg')].filter(c => c.checked).map(c => list[Number(c.dataset.i)]);
        if (!picked.length) return UI.toast('لم تختاري شيئاً','warn');
        const n = await guard(null, () => Svc.tasks.createSuggested(picked));
        UI.toast(`أُنشئت ${n} متابعة`); h.close(); renderRoute();
      };
    }
  });
};

      { h:'الحالة', render:t=>t.archived?'<span class="chip chip-none"><span class="dot"></span>مؤرشفة</span>':(t.active?UI.chip(STATUS.ACTIVE):'<span class="chip chip-none"><span class="dot"></span>متوقفة</span>') },
      { h:'', cls:'ta-l', render:t=>`<div class="t-actions">

/* ============================ الحصص المجدولة =============================
   يوم واحد في الشاشة، لأن هذا ما تحتاجه الموظفة: حصص اليوم ومقاعدها ومن
   حجزت. التنقّل بين الأيام بسهم، والتوليد من القوالب بزرّ واحد. */
Views.classes = {
  title:'الحصص',
  sub(){ const n = Svc.classes.ofDay(D.today()).length; return n ? `${n} حصة اليوم` : 'لا حصص اليوم'; },
  render(root, params){
    const date = D.isISO(params.date) ? params.date : D.today();
    const sessions = Svc.classes.ofDay(date);
    const week = Svc.classes.between(date, D.addDays(date, 6));
    const stats = Svc.classes.stats(D.addDays(date, -29), date);

    root.innerHTML = `<div class="card" style="margin-bottom:16px"><div class="filters">
        <button class="btn btn-sm" id="cPrev">${svg(ICON.undo, 15)} اليوم السابق</button>
        <strong style="min-width:190px;text-align:center">${D.dayName(date)} <span class="num">${D.fmt(date)}</span></strong>
        <button class="btn btn-sm" id="cNext">اليوم التالي</button>
        <button class="btn btn-sm" id="cToday">اليوم</button>
        <div style="flex:1"></div>
        <button class="btn btn-sm" id="cGen">توليد من القوالب</button>
        <button class="btn btn-sm btn-primary" id="cAdd">${svg(ICON.plus, 15, 2.4)} جدولة حصة</button>
      </div><div class="card-body" id="cDay"></div></div>

      <div class="grid g-2">
        <div class="card"><div class="card-head"><h3>الأسبوع القادم</h3></div><div class="card-body">
          ${week.length ? `<table class="mini-tbl"><thead><tr><th>اليوم</th><th>الحصة</th><th>الوقت</th><th>المقاعد</th></tr></thead><tbody>
            ${week.map(s => { const seat = Svc.classes.seats(s.id);
              return `<tr${s.status === 'cancelled' ? ' class="archived-row"' : ''}>
                <td>${D.dayName(s.date)} <span class="t-sub num">${D.fmt(s.date).slice(0, 5)}</span></td>
                <td><button class="btn btn-sm" data-open="${s.id}">${U.esc(s.title)}</button></td>
                <td class="num">${U.esc(s.startTime)}</td>
                <td class="num">${s.status === 'cancelled' ? 'ملغاة' : `${seat.booked}${seat.capacity ? '/' + seat.capacity : ''}`}</td></tr>`;
            }).join('')}</tbody></table>` : '<div class="t-sub">لا حصص مجدولة في الأيام السبعة القادمة.</div>'}
        </div></div>
        <div class="card"><div class="card-head"><h3>آخر 30 يوماً</h3></div><div class="card-body">
          <div class="stat-row" style="margin:0">

            <div class="stat ${stats.noShow ? 'neg' : ''}"><b>${stats.noShow}</b><span>لم تحضرن</span></div>
            <div class="stat"><b>${stats.fillRate}%</b><span>نسبة إشغال المقاعد</span></div>
          </div>
          ${stats.cancelled ? `<div class="t-sub" style="margin-top:8px">${stats.cancelled} حصة أُلغيت.</div>` : ''}
        </div></div>
      </div>`;

    const day = root.querySelector('#cDay');
